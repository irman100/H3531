<?xml version="1.0"?>
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/mnt/usb/games/nes</path>
    <extension>.nes .unf .unif .fds</extension>
    <command>env LD_LIBRARY_PATH=/mnt/usb/H3531/APPS/retroarch/runtime /mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so %ROM_RAW% -v</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>
  <system>
    <name>megadrive</name>
    <fullname>Sega Mega Drive / Genesis</fullname>
    <path>/mnt/usb/games/md</path>
    <extension>.bin .gen .smd .md</extension>
    <command>env LD_LIBRARY_PATH=/mnt/usb/H3531/APPS/retroarch/runtime /mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW% -v</command>
    <platform>megadrive</platform>
    <theme>megadrive</theme>
  </system>
  <system>
    <name>mastersystem</name>
    <fullname>Sega Master System</fullname>
    <path>/mnt/usb/games/sms</path>
    <extension>.sms .bin</extension>
    <command>env LD_LIBRARY_PATH=/mnt/usb/H3531/APPS/retroarch/runtime /mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW% -v</command>
    <platform>mastersystem</platform>
    <theme>mastersystem</theme>
  </system>
  <system>
    <name>gamegear</name>
    <fullname>Sega Game Gear</fullname>
    <path>/mnt/usb/games/gg</path>
    <extension>.gg .bin</extension>
    <command>env LD_LIBRARY_PATH=/mnt/usb/H3531/APPS/retroarch/runtime /mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW% -v</command>
    <platform>gamegear</platform>
    <theme>gamegear</theme>
  </system>
</systemList>
