# H3531 RetroArch Stage 2.1 - statically linked NES/Famicom core
#
# Keeps the physically proven Stage-1 HIFB + evdev + RGUI path unchanged.
# Stage-2.1 fixes content visibility for the statically linked FCEUmm core.
# H3531 AO audio comes later.

video_driver = "h3531"
video_fullscreen = "true"
video_windowed_fullscreen = "false"
video_vsync = "false"
video_threaded = "false"
video_refresh_rate = "60.000000"

input_driver = "h3531evdev"
input_joypad_driver = "null"

# Stage 2.1 still excludes H3531 AO so core/video/input can be isolated first.
audio_driver = "null"
audio_enable = "false"

menu_driver = "rgui"
menu_pause_libretro = "true"
menu_swap_ok_cancel_buttons = "false"
rgui_browser_directory = "/mnt/usb/games/nes"

# IMPORTANT for a static-core build:
# RetroArch defaults "Filter Unknown Extensions" to ON. Until a dynamic core
# file is loaded this can hide .nes even when FCEUmm is linked into the
# frontend. Disable that generic filter and let the built-in core handle the
# selected content. Also keep current-core filtering disabled at startup.
menu_navigation_browser_filter_supported_extensions_enable = "false"
filter_by_current_core = "false"

# Keyboard -> RetroPad mapping for first physical NES test.
# Arrows: D-pad, Enter: A, Backspace: B, Space: Start, Right Shift: Select.
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "enter"
input_player1_b = "backspace"
input_player1_start = "space"
input_player1_select = "rshift"

# F1 opens/closes RetroArch menu. F12 exits cleanly to the H3531 supervisor.
input_exit_emulator = "f12"
input_menu_toggle = "f1"

savefile_directory = "/mnt/usb/H3531/USER/retroarch/saves"
savestate_directory = "/mnt/usb/H3531/USER/retroarch/states"
playlist_directory = "/mnt/usb/H3531/USER/retroarch/playlists"
system_directory = "/mnt/usb/H3531/USER/retroarch/system"

# Static-core build: no dynamic .so core is expected in this stage.
libretro_directory = "/mnt/usb/H3531/APPS/retroarch/cores"
core_info_directory = "/mnt/usb/H3531/APPS/retroarch/info"

config_save_on_exit = "false"
log_verbosity = "true"
