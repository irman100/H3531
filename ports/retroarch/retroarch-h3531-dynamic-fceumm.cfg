# H3531 RetroArch dynamic-core FCEUmm build
#
# Stage 3.5 keeps the physically proven H3531 framebuffer + evdev + RGUI path.
# FCEUmm remains an external dlopen() core under cores/.
# Video scaling policy uses RetroArch's standard core-provided aspect/integer
# scaling settings; the H3531 driver only converts/copies the resulting viewport.
# Audio intentionally remains disabled while video timing is being stabilized.

video_driver = "h3531"
video_fullscreen = "true"
video_windowed_fullscreen = "false"
video_vsync = "false"
video_threaded = "false"
video_refresh_rate = "60.000000"
video_force_aspect = "true"
video_scale_integer = "true"
aspect_ratio_index = "22"
video_smooth = "false"

input_driver = "h3531evdev"
input_joypad_driver = "null"

audio_driver = "null"
audio_enable = "false"

menu_driver = "rgui"
menu_pause_libretro = "true"
menu_swap_ok_cancel_buttons = "false"
rgui_browser_directory = "/mnt/usb/games/nes"

menu_show_load_core = "true"
menu_show_load_content = "true"
menu_navigation_browser_filter_supported_extensions_enable = "false"
filter_by_current_Core = "false"
core_info_cache_enable = "false"

libretro_directory = "/mnt/usb/H3531/APPS/retroarch/cores"
core_info_directory = "/mnt/usb/H3531/APPS/retroarch/info"

input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "enter"
input_player1_b = "backspace"
input_player1_start = "space"
input_player1_select = "rshift"

input_exit_emulator = "f12"
input_menu_toggle = "f1"

savefile_directory = "/mnt/usb/H3531/USER/retroarch/saves"
savestate_directory = "/mnt/usb/H3531/USER/retroarch/states"
playlist_directory = "/mnt/usb/H3531/USER/retroarch/playlists"
system_directory = "/mnt/usb/H3531/USER/retroarch/system"
config_directory = "/mnt/usb/H3531/USER/retroarch/config"
screenshot_directory = "/mnt/usb/H3531/USER/retroarch/screenshots"

config_save_on_exit = "false"
log_verbosity = "true"
