name: H3531 Stage6.8.0D Event Controller Bundle

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-stage680d-event-controller-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y unzip zip file binutils busybox

      - name: Download proven detached-HID desktop
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.8.0A-DetachedHID-PATCH
          path: detached
          github-token: ${{ github.token }}
          run-id: 36022962459

      - name: Download proven full RetroArch Stage3.14 base
        uses: actions/download-artifact@v4
        with:
          name: H3531-RetroArch-MultiCore-Stage3.14-LinuxRaw-Autoconfig
          path: retroarch314
          github-token: ${{ github.token }}
          run-id: 36032081787

      - name: Download proven RetroArch Stage3.15 event-fallback frontend
        uses: actions/download-artifact@v4
        with:
          name: H3531-RetroArch-Stage3.15-InputOnly
          path: retroarch315
          github-token: ${{ github.token }}
          run-id: 36041317644

      - name: Download proven Stayplaytion Stage4.35 event frontend
        uses: actions/download-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.35-EventFallback
          path: frontend435
          github-token: ${{ github.token }}
          run-id: 36041014606

      - name: Assemble Stage6.8.0D overlay
        run: |
          set -eux

          BASEZIP=detached/H3531-Stage6.8.0A-DetachedHID-PATCH.zip
          test -f "$BASEZIP"
          unzip -q "$BASEZIP" -d out

          # Full RetroArch base gives us known-good cores, launcher, cfg and runtime.
          test -f retroarch314/H3531/APPS/retroarch/RETROARCH.BIN
          test -f retroarch314/H3531/APPS/retroarch/RETROARCH.APP
          test -f retroarch314/H3531/APPS/retroarch/retroarch.cfg
          test -f retroarch314/H3531/APPS/retroarch/cores/fceumm_libretro.so
          test -f retroarch314/H3531/APPS/retroarch/cores/picodrive_libretro.so
          cp -a retroarch314/H3531/. out/H3531/

          # Overwrite only frontend/runtime with the proven Stage3.15 event-fallback build.
          test -f retroarch315/H3531/APPS/retroarch/RETROARCH.BIN
          cp retroarch315/H3531/APPS/retroarch/RETROARCH.BIN              out/H3531/APPS/retroarch/RETROARCH.BIN
          if [ -d retroarch315/H3531/APPS/retroarch/runtime ]; then
            cp -a retroarch315/H3531/APPS/retroarch/runtime/.                out/H3531/APPS/retroarch/runtime/
          fi

          # Overwrite Stayplaytion shell with event-fallback controller frontend.
          test -f frontend435/H3531/APPS/gamefront/GAMEFRONT.APP
          cp -a frontend435/H3531/. out/H3531/

          cp ports/stage66d/h3531-native-run out/H3531/APPS/h3531-native-run
          chmod 755 out/H3531/APPS/h3531-native-run

          mkdir -p out/H3531/SYSTEM/docs

          cat >out/H3531/APPS/x11-debian/SYSTEM.VERSION <<'EOF'
          Stayplaytion Stage6.8.0D Event Controller
          Base: proven Stage6.8.0 Firmware POST
          Desktop: detached keyboard/mouse boot + live KDrive hotplug
          Stayplaytion: Stage4.35 event-device controller wizard
          RetroArch: Stage3.15 linuxraw identity with H3531 evdev fallback
          Controller transport: /dev/input/event* when /dev/input/js* is absent
          Autoconfig: standard RetroArch linuxraw .cfg
          Hotplug: inotify + active-fd polling/epoll, no periodic event0..63 gameplay scan
          Safety: no SPI writes, no saveenv, no U-Boot changes
          EOF

          cat >out/H3531/SYSTEM/docs/README_STAGE6_8_0D_EVENT_CONTROLLER.txt <<'EOF'
          Stayplaytion Stage6.8.0D Event Controller

          This build is specifically for the observed Hi3531 kernel where the USB
          gamepad is available through evdev but /dev/input/js* is not created.

          Architecture:
          - The external RetroArch joypad driver identity remains "linuxraw".
          - Standard RetroArch autoconfig files remain authoritative.
          - When /dev/input/js* exists, RetroArch can still use normal linuxraw.
          - When js nodes are absent, the H3531 linuxraw transport discovers
            gamepad-capable /dev/input/event* devices directly.
          - No libudev daemon/database and no kernel joydev device are required.
          - Hotplug uses inotify. Active RetroArch controller descriptors are handled
            by epoll. No periodic event0..63 scan runs in the gameplay loop.

          Stayplaytion:
          - Uses the same capability rules and the same button/axis ordering as
            RetroArch Stage3.15 event fallback.
          - Controller Settings is a Recalbox-style first-time wizard.
          - It captures D-pad, A/B/X/Y, Start, Select, L/R and Menu/Pause.
          - D-pad may be buttons or axes.
          - Axis capture is relative to the idle baseline to ignore offset triggers.
          - The result is saved as a standard RetroArch linuxraw autoconfig profile:
              /mnt/usb/H3531/USER/retroarch/autoconfig/<device>.cfg
          - Stayplaytion then reloads that same profile.
          - RetroArch Settings opens the stock RGUI.
          - Stayplaytion does not write input_* bindings into its launch override.

          First hardware test:
          1. Boot normally with the USB gamepad connected.
          2. Stayplaytion -> Quick Menu -> Controller Settings.
          3. The previous "No dev input JS controller found" message must be gone.
          4. Follow D-pad and A/B/X/Y prompts.
          5. Confirm D-pad navigation in Stayplaytion.
          6. Open RetroArch Settings and confirm the same controller navigates RGUI.
          7. Start a game and test D-pad, A/B/X/Y and Menu/Pause.
          8. Play several minutes and check whether the previous periodic hitch is gone.

          This patch does not change SPI NOR, U-Boot, saveenv or the external-root experiment.
          EOF

      - name: Validate Stage6.8.0D components
        run: |
          set -eux
          X=out/H3531/APPS/x11-debian
          G=out/H3531/APPS/gamefront/GAMEFRONT.APP
          R=out/H3531/APPS/retroarch/RETROARCH.BIN
          C=out/H3531/APPS/retroarch/retroarch.cfg

          file "$X/bin/Xfbdev-shadow-live" | tee /tmp/xfbdev.file
          grep -F 'ELF 32-bit LSB' /tmp/xfbdev.file
          grep -F 'ARM, EABI5' /tmp/xfbdev.file
          strings "$X/bin/Xfbdev-shadow-live" | grep -F 'Stage6.8.0A evdev keyboard detached at X start'

          file "$G" | tee /tmp/gamefront.file
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/gamefront.file
          strings "$G" | grep -F 'Stage4.35 RetroArch event-fallback controller wizard active'
          strings "$G" | grep -F 'linuxraw event-fallback gamepad%d ready'
          strings "$G" | grep -F 'gamepad event node absent; inotify hotplug active'
          strings "$G" | grep -F 'CONTROLLER SETTINGS'
          strings "$G" | grep -F 'RETROARCH SETTINGS'
          strings "$G" | grep -F 'standard RetroArch controller profile saved'
          ! strings "$G" | grep -F 'NO /DEV/INPUT/JS CONTROLLER FOUND'
          ! strings "$G" | grep -F 'ASSIGN HOTKEY'

          file "$R" | tee /tmp/retroarch.file
          grep -F 'ELF 32-bit LSB' /tmp/retroarch.file
          strings "$R" | grep -F '[H3531] standard RetroArch joypad driver: %s'
          strings "$R" | grep -F '[LinuxRaw/H3531] /dev/input/js* absent; enabling event fallback.'
          strings "$R" | grep -F '[LinuxRaw/H3531] Event fallback device name is "%s" path=%s.'
          strings "$R" | grep -F '[LinuxRaw/H3531] evdev maps: %u buttons, %u axes.'

          grep -F 'input_joypad_driver = "linuxraw"' "$C"
          grep -F 'input_autodetect_enable = "true"' "$C"
          grep -F 'joypad_autoconfig_dir = "/mnt/usb/H3531/USER/retroarch/autoconfig"' "$C"
          grep -F 'config_save_on_exit = "true"' "$C"

          test -s out/H3531/APPS/retroarch/cores/fceumm_libretro.so
          test -s out/H3531/APPS/retroarch/cores/picodrive_libretro.so
          test -x out/H3531/APPS/retroarch/RETROARCH.APP

          busybox sh -n "$X/bin/h3531-input-discover"
          busybox sh -n "$X/bin/h3531-lxde-core"
          busybox sh -n out/H3531/APPS/h3531-native-run
          busybox sh -n out/H3531/SYSTEM/MONITOR.APP

      - name: Create verified Stage6.8.0D ZIP
        run: |
          set -eux
          rm -f out/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0D.txt
          (
            cd out
            find H3531 -type f               ! -path 'H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0D.txt'               -print0 | sort -z | xargs -0 sha256sum               > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0D.txt
            sha256sum -c H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0D.txt
          )

          cd out
          zip -qr ../H3531-Stage6.8.0D-EventController-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.8.0D-EventController-PATCH.zip             | tee H3531-Stage6.8.0D-EventController-PATCH.zip.sha256
          unzip -t H3531-Stage6.8.0D-EventController-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.8.0D-EventController-PATCH
          path: |
            H3531-Stage6.8.0D-EventController-PATCH.zip
            H3531-Stage6.8.0D-EventController-PATCH.zip.sha256
          retention-days: 14
