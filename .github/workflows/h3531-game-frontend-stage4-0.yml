name: H3531 Game Frontend Stage4.0

on:
  push:
    branches:
      - feature/h3531-game-frontend-stage4-0
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-0.yml'
      - 'ports/frontend/**'
      - 'ports/retroarch/h3531_fb_gfx.c'
      - 'ports/retroarch/h3531_fb_gfx_fast_aspect.c'
      - 'ports/retroarch/linuxraw_input_h3531.c'
      - 'ports/retroarch/h3531_ao_audio_stage3_8.c'
      - 'ports/retroarch/h3531_ao_audio_stage3_11.c'
      - 'ports/retroarch/h3531-retroarch-dynamic-launcher-autocore.c'
      - 'ports/retroarch/retroarch-h3531-dynamic-multicore-stage3-12.cfg'
      - 'ports/retroarch/fceumm_libretro.info'
      - 'ports/retroarch/picodrive_libretro.info'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user g++

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream sources and frontend libraries
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          cd /tmp/retroarch
          git checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git rev-parse HEAD)" = "48cbdb2e78ea6c92ade103941c4958ea312a5995"

          git clone https://github.com/libretro/libretro-fceumm.git /tmp/fceumm
          cd /tmp/fceumm
          git checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          test "$(git rev-parse HEAD)" = "236ccdfc911e84c60fea6b9d0699c2d440a8de14"

          git clone --recursive https://github.com/libretro/picodrive.git /tmp/picodrive
          cd /tmp/picodrive
          git checkout ab021146b70eef7ec0ac2afe06a94e9b4c16ef74
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "ab021146b70eef7ec0ac2afe06a94e9b4c16ef74"

          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2
          git checkout 8224e427b655b83dae5e2298f1e6919523a78737
          test "$(git rev-parse HEAD)" = "8224e427b655b83dae5e2298f1e6919523a78737"

          git clone https://github.com/nothings/stb.git /tmp/stb
          cd /tmp/stb
          git checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20
          test "$(git rev-parse HEAD)" = "2c980bb59875b0d32144a71867fbdebb2f77cd20"

      - name: Build Cortex-A9 softfp FCEUmm
        working-directory: /tmp/fceumm
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export H3531_CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CFLAGS="$H3531_CFLAGS" CXXFLAGS="$H3531_CFLAGS"
          make -f Makefile.libretro -j2 platform=unix STATIC_LINKING=0 HAVE_HDPACK=0 WANT_32BPP=0
          test -s fceumm_libretro.so

      - name: Build Cortex-A9 softfp PicoDrive
        working-directory: /tmp/picodrive
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS=''
          make -f Makefile.libretro -j2 platform=armv-cortexa9-softfloat
          test -s picodrive_libretro.so
          arm-linux-musleabi-nm -D --defined-only picodrive_libretro.so | grep -E ' retro_(init|run|get_system_info)$'

      - name: Verify Stage4.0 source invariants
        run: |
          set -eux
          grep -F 'es_systems.cfg' ports/frontend/h3531-game-frontend.cpp
          grep -F 'gamelist.xml' ports/frontend/h3531-game-frontend.cpp
          grep -F 'stb_image.h' ports/frontend/h3531-game-frontend.cpp
          grep -F 'tinyxml2.h' ports/frontend/h3531-game-frontend.cpp
          grep -F '%ROM_RAW%' ports/frontend/es_systems.cfg
          grep -F 'fceumm_libretro.so' ports/frontend/es_systems.cfg
          grep -F 'picodrive_libretro.so' ports/frontend/es_systems.cfg
          grep -F 'video_driver_update_viewport' ports/retroarch/h3531_fb_gfx_fast_aspect.c
          grep -F 'Stage3.11 bounded-latency transport active' ports/retroarch/h3531_ao_audio_stage3_11.c

      - name: Build Stage4.0 frontend natively for compile sanity
        run: |
          set -eux
          g++ -std=c++11 -O2 -Wall -Wextra \
            -I/tmp/tinyxml2 -I/tmp/stb \
            ports/frontend/h3531-game-frontend.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -lm -o /tmp/GAMEFRONT.host
          /tmp/GAMEFRONT.host --self-test ports/frontend/es_systems.cfg || test $? -eq 0

      - name: Cross-build static H3531 Game Frontend
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++11 -O2 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp \
            -fomit-frame-pointer -ffunction-sections -fdata-sections -static -fno-pie -no-pie \
            -I/tmp/tinyxml2 -I/tmp/stb \
            ports/frontend/h3531-game-frontend.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -Wl,--gc-sections -lm -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | grep -F 'ELF 32-bit LSB executable, ARM'
          file /tmp/GAMEFRONT.APP | grep -F 'statically linked'
          strings /tmp/GAMEFRONT.APP | grep -F '[GAMEFRONT] launch:'
          strings /tmp/GAMEFRONT.APP | grep -F 'SELF_TEST_OK'

      - name: QEMU self-test frontend routing and metadata scan
        run: |
          set -eux
          mkdir -p /tmp/stage4test/nes /tmp/stage4test/md
          : > '/tmp/stage4test/nes/Demo Game.nes'
          : > '/tmp/stage4test/md/Comix Zone [Rus].bin'
          cat > /tmp/stage4test/nes/gamelist.xml <<'EOF'
          <gameList><game><path>./Demo Game.nes</path><name>Demo NES</name></game></gameList>
          EOF
          cat > /tmp/stage4test/es_systems.cfg <<'EOF'
          <systemList>
            <system>
              <name>nes</name><fullname>Nintendo NES</fullname><path>/tmp/stage4test/nes</path>
              <extension>.nes</extension>
              <command>retroarch -L /cores/fceumm_libretro.so %ROM_RAW%</command>
              <theme>nes</theme>
            </system>
            <system>
              <name>megadrive</name><fullname>Sega Mega Drive</fullname><path>/tmp/stage4test/md</path>
              <extension>.bin .md .gen</extension>
              <command>retroarch -L /cores/picodrive_libretro.so %ROM_RAW%</command>
              <theme>megadrive</theme>
            </system>
          </systemList>
          EOF
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --self-test /tmp/stage4test/es_systems.cfg | tee /tmp/frontend-selftest.txt
          grep -F 'SYSTEM name=nes' /tmp/frontend-selftest.txt
          grep -F 'SYSTEM name=megadrive' /tmp/frontend-selftest.txt
          grep -F 'Demo NES' /tmp/frontend-selftest.txt || true
          grep -F 'fceumm_libretro.so' /tmp/frontend-selftest.txt
          grep -F 'picodrive_libretro.so' /tmp/frontend-selftest.txt
          grep -F 'SELF_TEST_OK systems=2 games=2' /tmp/frontend-selftest.txt

      - name: Install H3531 RetroArch video input and AO adapters
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          cp ports/retroarch/h3531_fb_gfx_fast_aspect.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c
          cp ports/retroarch/h3531_ao_audio_stage3_8.c /tmp/retroarch/audio/drivers/h3531_ao_audio_base.inc
          cp ports/retroarch/h3531_ao_audio_stage3_11.c /tmp/retroarch/audio/drivers/oss.c
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc

      - name: Configure Cortex-A9 softfp dynamic RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export H3531_CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CFLAGS="$H3531_CFLAGS" CXXFLAGS="$H3531_CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'
          ./configure --host=arm-linux-musleabi --enable-dynamic \
            --disable-qt --disable-x11 --disable-wayland \
            --disable-opengl --disable-opengl_core --disable-opengl1 --disable-opengles --disable-vulkan --disable-kms \
            --disable-sdl --disable-sdl2 --disable-udev \
            --disable-alsa --disable-pulse --enable-oss \
            --disable-ffmpeg --disable-freetype --disable-cheevos \
            --disable-networking --disable-netplaydiscovery --disable-online_updater --disable-discord
          grep -Eq '^HAVE_DYNAMIC[[:space:]]*=[[:space:]]*1' config.mk
          grep -Eq '^HAVE_OSS[[:space:]]*=[[:space:]]*1' config.mk

      - name: Cross-build optimized RetroArch runtime
        working-directory: /tmp/retroarch
        shell: bash
        run: |
          set -o pipefail
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 OS='Linux FPGA' HAVE_RGUI=1 HAVE_XMB=0 HAVE_OZONE=0 HAVE_MATERIALUI=0 2>&1 | tee /tmp/retroarch-build.log

      - name: Verify RetroArch runtime markers
        working-directory: /tmp/retroarch
        run: |
          set -eux
          test -s retroarch
          strings retroarch | grep -F '[H3531] RGB565 row-reuse fastpath active:'
          strings retroarch | grep -F '[H3531 AO] Stage3.11 bounded-latency transport active:'

      - name: Package Stage4.0 frontend RetroArch cores and runtime
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          RA=out/H3531/APPS/retroarch
          GF=out/H3531/APPS/gamefront
          mkdir -p "$RA/cores" "$RA/info" "$RA/runtime" "$GF/THIRD_PARTY_LICENSES"

          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o "$RA/RETROARCH.BIN"
          arm-linux-musleabi-strip /tmp/fceumm/fceumm_libretro.so -o "$RA/cores/fceumm_libretro.so"
          arm-linux-musleabi-strip /tmp/picodrive/picodrive_libretro.so -o "$RA/cores/picodrive_libretro.so"
          arm-linux-musleabi-gcc -O2 -fno-pie -march=armv7-a -mfloat-abi=soft -static -no-pie \
            ports/retroarch/h3531-retroarch-dynamic-launcher-autocore.c -o "$RA/RETROARCH.APP"
          arm-linux-musleabi-strip "$RA/RETROARCH.APP"
          cp ports/retroarch/retroarch-h3531-dynamic-multicore-stage3-12.cfg "$RA/retroarch.cfg"
          cp ports/retroarch/fceumm_libretro.info "$RA/info/fceumm_libretro.info"
          cp ports/retroarch/picodrive_libretro.info "$RA/info/picodrive_libretro.info"

          LOADER="$(find "$TOOLCHAIN" -name 'ld-musl-arm.so.1' -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          RUNTIME_ELF=''
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then RUNTIME_ELF="$LOADER"; elif [ -n "$LIBC" ] && [ -e "$LIBC" ] && file -L "$LIBC" | grep -q ELF; then RUNTIME_ELF="$LIBC"; else exit 1; fi
          cp -L "$RUNTIME_ELF" "$RA/runtime/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$RA/runtime/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"; if [ -n "$SRC" ] && [ -e "$SRC" ]; then cp -L "$SRC" "$RA/runtime/$lib"; fi; done

          cp /tmp/GAMEFRONT.APP "$GF/GAMEFRONT.APP"
          cp ports/frontend/es_systems.cfg "$GF/es_systems.cfg"
          cp ports/frontend/README_STAGE4_0.md "$GF/README.md"
          cp /tmp/tinyxml2/LICENSE.txt "$GF/THIRD_PARTY_LICENSES/tinyxml2-LICENSE.txt"
          cp /tmp/stb/LICENSE "$GF/THIRD_PARTY_LICENSES/stb-LICENSE.txt"

      - name: QEMU smoke-test packaged RetroArch cores and frontend
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          RA=out/H3531/APPS/retroarch
          GF=out/H3531/APPS/gamefront
          RUNTIME="$(pwd)/$RA/runtime"
          FRONTEND="$(pwd)/$RA/RETROARCH.BIN"
          env LD_LIBRARY_PATH="$RUNTIME" qemu-arm -cpu cortex-a9 "$RA/runtime/ld-musl-arm.so.1" --library-path "$RUNTIME" "$FRONTEND" --version | tee out/RETROARCH-QEMU-VERSION.txt

          cat > /tmp/dlopen-core.c <<'EOF'
          #include <dlfcn.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          struct retro_system_info { const char *library_name; const char *library_version; const char *valid_extensions; bool need_fullpath; bool block_extract; };
          typedef void (*retro_get_system_info_t)(struct retro_system_info *info);
          int main(int argc, char **argv) { void *h; retro_get_system_info_t f; struct retro_system_info i; if(argc!=2)return 2; h=dlopen(argv[1],RTLD_NOW|RTLD_LOCAL); if(!h){fprintf(stderr,"dlopen failed: %s\n",dlerror());return 3;} f=(retro_get_system_info_t)dlsym(h,"retro_get_system_info"); if(!f)return 4; memset(&i,0,sizeof(i)); f(&i); printf("DYNAMIC_CORE_OK name=%s version=%s extensions=%s\n",i.library_name,i.library_version,i.valid_extensions); dlclose(h); return 0; }
          EOF
          arm-linux-musleabi-gcc -O2 -march=armv7-a -mfloat-abi=soft /tmp/dlopen-core.c -ldl -o /tmp/dlopen-core
          env LD_LIBRARY_PATH="$RUNTIME" qemu-arm -cpu cortex-a9 "$RA/runtime/ld-musl-arm.so.1" --library-path "$RUNTIME" /tmp/dlopen-core "$(pwd)/$RA/cores/fceumm_libretro.so" | tee out/FCEUMM-DYNAMIC-CORE-SMOKE.txt
          env LD_LIBRARY_PATH="$RUNTIME" qemu-arm -cpu cortex-a9 "$RA/runtime/ld-musl-arm.so.1" --library-path "$RUNTIME" /tmp/dlopen-core "$(pwd)/$RA/cores/picodrive_libretro.so" | tee out/PICODRIVE-DYNAMIC-CORE-SMOKE.txt
          grep -F 'DYNAMIC_CORE_OK name=FCEUmm' out/FCEUMM-DYNAMIC-CORE-SMOKE.txt
          grep -F 'DYNAMIC_CORE_OK name=PicoDrive' out/PICODRIVE-DYNAMIC-CORE-SMOKE.txt
          qemu-arm -cpu cortex-a9 "$GF/GAMEFRONT.APP" --self-test /tmp/stage4test/es_systems.cfg | tee out/GAMEFRONT-QEMU-SELFTEST.txt
          grep -F 'SELF_TEST_OK systems=2 games=2' out/GAMEFRONT-QEMU-SELFTEST.txt

      - name: Final Stage4.0 package checks and portable manifest
        run: |
          set -eux
          printf '%s\n' 48cbdb2e78ea6c92ade103941c4958ea312a5995 > out/RETROARCH-UPSTREAM-SHA.txt
          printf '%s\n' 236ccdfc911e84c60fea6b9d0699c2d440a8de14 > out/FCEUMM-UPSTREAM-SHA.txt
          printf '%s\n' ab021146b70eef7ec0ac2afe06a94e9b4c16ef74 > out/PICODRIVE-UPSTREAM-SHA.txt
          printf '%s\n' 8224e427b655b83dae5e2298f1e6919523a78737 > out/TINYXML2-UPSTREAM-SHA.txt
          printf '%s\n' 2c980bb59875b0d32144a71867fbdebb2f77cd20 > out/STB-UPSTREAM-SHA.txt
          cat > out/README.txt <<'EOF'
          H3531 Game Frontend Stage 4.0

          First compiled GameStick/EmulationStation-style frontend for the H3531 project.

          Included:
          - physically proven Stage3.12 RetroArch runtime, FCEUmm and PicoDrive;
          - Stage3.11 bounded-latency H3531 AO transport;
          - GAMEFRONT.APP: direct framebuffer/evdev library browser;
          - EmulationStation-compatible es_systems.cfg routing;
          - gamelist.xml title/image metadata;
          - local PNG/JPEG cover art through pinned stb_image;
          - pinned tinyxml2 parser;
          - automatic system -> libretro core -> ROM launch command.

          Run on hardware:
            cd /mnt/usb/H3531/APPS/gamefront
            ./GAMEFRONT.APP

          Stage4.0 keyboard:
            LEFT/RIGHT games
            UP/DOWN systems
            ENTER play
            F5 rescan
            F1 RetroArch service menu
            ESC exit

          This stage is CI VERIFIED only until tested on real Hi3531 hardware.
          EOF

          file out/H3531/APPS/gamefront/GAMEFRONT.APP | grep -F 'ELF 32-bit LSB executable, ARM'
          grep -F 'picodrive_libretro.so' out/H3531/APPS/gamefront/es_systems.cfg
          grep -F 'fceumm_libretro.so' out/H3531/APPS/gamefront/es_systems.cfg
          test -s out/H3531/APPS/retroarch/RETROARCH.BIN
          test -s out/H3531/APPS/retroarch/cores/fceumm_libretro.so
          test -s out/H3531/APPS/retroarch/cores/picodrive_libretro.so
          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256.txt
            sha256sum -c SHA256.txt
          )

      - name: Upload Stage4.0 build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage4.0-BuildLog
          path: /tmp/retroarch-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload H3531 Game Frontend Stage4.0
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.0-NES-Sega
          path: out/**
          if-no-files-found: error
          retention-days: 14
