name: H3531 RetroArch Stage3.2 Speed AutoCore

on:
  push:
    branches:
      - feature/retroarch-h3531-stage3-2-speed-autocore
    paths:
      - '.github/workflows/h3531-retroarch-stage3-2-speed-autocore.yml'
      - 'ports/retroarch/h3531_fb_gfx.c'
      - 'ports/retroarch/h3531_fb_gfx_fast.c'
      - 'ports/retroarch/h3531_fb_gfx_fast_diag.c'
      - 'ports/retroarch/linuxraw_input_h3531.c'
      - 'ports/retroarch/h3531-retroarch-dynamic-launcher-autocore.c'
      - 'ports/retroarch/retroarch-h3531-dynamic-fceumm.cfg'
      - 'ports/retroarch/fceumm_libretro.info'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch and FCEUmm
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          cd /tmp/retroarch
          git checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git rev-parse HEAD)" = "48cbdb2e78ea6c92ade103941c4958ea312a5995"

          git clone https://github.com/libretro/libretro-fceumm.git /tmp/fceumm
          cd /tmp/fceumm
          git checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          test "$(git rev-parse HEAD)" = "236ccdfc911e84c60fea6b9d0699c2d440a8de14"

      - name: Build Cortex-A9 softfp external FCEUmm core
        working-directory: /tmp/fceumm
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc
          export CXX=arm-linux-musleabi-g++
          export AR=arm-linux-musleabi-ar
          export RANLIB=arm-linux-musleabi-ranlib
          export STRIP=arm-linux-musleabi-strip
          export H3531_CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CFLAGS="$H3531_CFLAGS"
          export CXXFLAGS="$H3531_CFLAGS"

          make -f Makefile.libretro -j2 \
            platform=unix STATIC_LINKING=0 HAVE_HDPACK=0 WANT_32BPP=0

          test -s fceumm_libretro.so
          file fceumm_libretro.so
          arm-linux-musleabi-readelf -A fceumm_libretro.so | tee /tmp/fceumm-attrs.txt
          arm-linux-musleabi-nm -D --defined-only fceumm_libretro.so \
            | grep -E ' retro_(init|run|get_system_info)$'
          ! grep -F 'Tag_ABI_VFP_args: VFP registers' /tmp/fceumm-attrs.txt

      - name: Install H3531 Stage3.2 framebuffer and evdev adapters
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c \
            /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          cp ports/retroarch/h3531_fb_gfx_fast.c \
            /tmp/retroarch/gfx/drivers/h3531_fb_gfx_fast_base.inc
          cp ports/retroarch/h3531_fb_gfx_fast_diag.c \
            /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c \
            /tmp/retroarch/input/drivers/linuxraw_input.c
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' \
            /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          grep -F '[H3531] PERF frames=' /tmp/retroarch/gfx/drivers/fpga_gfx.c
          grep -F '"h3531evdev"' /tmp/retroarch/input/drivers/linuxraw_input.c

      - name: Configure Cortex-A9 softfp dynamic RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc
          export CXX=arm-linux-musleabi-g++
          export AR=arm-linux-musleabi-ar
          export RANLIB=arm-linux-musleabi-ranlib
          export STRIP=arm-linux-musleabi-strip
          export H3531_CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CFLAGS="$H3531_CFLAGS"
          export CXXFLAGS="$H3531_CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'

          ./configure --host=arm-linux-musleabi \
            --enable-dynamic \
            --disable-qt --disable-x11 --disable-wayland \
            --disable-opengl --disable-opengl_core --disable-opengl1 \
            --disable-opengles --disable-vulkan --disable-kms \
            --disable-sdl --disable-sdl2 --disable-udev \
            --disable-alsa --disable-pulse --disable-oss \
            --disable-ffmpeg --disable-freetype --disable-cheevos \
            --disable-networking --disable-netplaydiscovery \
            --disable-online_updater --disable-discord

          grep -Eq '^HAVE_DYNAMIC[[:space:]]*=[[:space:]]*1' config.mk

      - name: Cross-build optimized dynamic RetroArch frontend
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 OS='Linux FPGA' HAVE_RGUI=1 HAVE_XMB=0 HAVE_OZONE=0 HAVE_MATERIALUI=0
          strings retroarch | grep -F '[H3531] RGB565 fastpath active:'
          strings retroarch | grep -F '[H3531] PERF frames='
          arm-linux-musleabi-readelf -A retroarch | tee /tmp/retroarch-attrs.txt
          ! grep -F 'Tag_ABI_VFP_args: VFP registers' /tmp/retroarch-attrs.txt

      - name: Package frontend core auto-core launcher and private musl runtime
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          ROOT=out/H3531/APPS/retroarch
          mkdir -p "$ROOT/cores" "$ROOT/info" "$ROOT/runtime"

          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o "$ROOT/RETROARCH.BIN"
          arm-linux-musleabi-strip /tmp/fceumm/fceumm_libretro.so -o "$ROOT/cores/fceumm_libretro.so"

          # Keep the tiny launcher baseline-soft/static.  It only execs the optimized
          # frontend and therefore does not need VFP instructions itself.
          arm-linux-musleabi-gcc \
            -O2 -fno-pie -march=armv7-a -mfloat-abi=soft \
            -static -no-pie \
            ports/retroarch/h3531-retroarch-dynamic-launcher-autocore.c \
            -o "$ROOT/RETROARCH.APP"
          arm-linux-musleabi-strip "$ROOT/RETROARCH.APP"

          cp ports/retroarch/retroarch-h3531-dynamic-fceumm.cfg "$ROOT/retroarch.cfg"
          cp ports/retroarch/fceumm_libretro.info "$ROOT/info/fceumm_libretro.info"

          LOADER="$(find "$TOOLCHAIN" -name 'ld-musl-arm.so.1' -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          RUNTIME_ELF=''
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then
            RUNTIME_ELF="$LOADER"
          elif [ -n "$LIBC" ] && [ -e "$LIBC" ] && file -L "$LIBC" | grep -q ELF; then
            RUNTIME_ELF="$LIBC"
          else
            echo 'ERROR: no usable ARM musl loader/libc ELF found'
            exit 1
          fi

          cp -L "$RUNTIME_ELF" "$ROOT/runtime/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$ROOT/runtime/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do
            SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"
            if [ -n "$SRC" ] && [ -e "$SRC" ]; then
              cp -L "$SRC" "$ROOT/runtime/$lib"
            fi
          done

          file "$ROOT/RETROARCH.APP" "$ROOT/RETROARCH.BIN" \
               "$ROOT/cores/fceumm_libretro.so" "$ROOT/runtime/ld-musl-arm.so.1"
          strings "$ROOT/RETROARCH.APP" | grep -F '/mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so'
          strings "$ROOT/RETROARCH.APP" | grep -F 'default_core='
          grep -F 'libretro_directory = "/mnt/usb/H3531/APPS/retroarch/cores"' "$ROOT/retroarch.cfg"

      - name: QEMU smoke-test Cortex-A9 frontend
        run: |
          set -eux
          ROOT=out/H3531/APPS/retroarch
          RUNTIME="$(pwd)/$ROOT/runtime"
          FRONTEND="$(pwd)/$ROOT/RETROARCH.BIN"
          env LD_LIBRARY_PATH="$RUNTIME" \
            qemu-arm -cpu cortex-a9 "$ROOT/runtime/ld-musl-arm.so.1" \
            --library-path "$RUNTIME" "$FRONTEND" --version \
            | tee out/RETROARCH-QEMU-VERSION.txt
          test -s out/RETROARCH-QEMU-VERSION.txt

      - name: QEMU dlopen smoke-test optimized external FCEUmm
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          ROOT=out/H3531/APPS/retroarch
          RUNTIME="$(pwd)/$ROOT/runtime"
          CORE="$(pwd)/$ROOT/cores/fceumm_libretro.so"

          cat > /tmp/dlopen-fceumm.c <<'EOF'
          #include <dlfcn.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          struct retro_system_info {
             const char *library_name;
             const char *library_version;
             const char *valid_extensions;
             bool need_fullpath;
             bool block_extract;
          };
          typedef void (*retro_get_system_info_t)(struct retro_system_info *info);
          int main(int argc, char **argv) {
             void *h; retro_get_system_info_t f; struct retro_system_info i;
             if (argc != 2) return 2;
             h = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
             if (!h) { fprintf(stderr, "dlopen failed: %s\n", dlerror()); return 3; }
             f = (retro_get_system_info_t)dlsym(h, "retro_get_system_info");
             if (!f) return 4;
             memset(&i, 0, sizeof(i)); f(&i);
             printf("DYNAMIC_CORE_OK name=%s version=%s extensions=%s\n",
               i.library_name ? i.library_name : "(null)",
               i.library_version ? i.library_version : "(null)",
               i.valid_extensions ? i.valid_extensions : "(null)");
             dlclose(h); return 0;
          }
          EOF
          arm-linux-musleabi-gcc -O2 -march=armv7-a -mfloat-abi=soft \
            /tmp/dlopen-fceumm.c -ldl -o /tmp/dlopen-fceumm
          env LD_LIBRARY_PATH="$RUNTIME" \
            qemu-arm -cpu cortex-a9 "$ROOT/runtime/ld-musl-arm.so.1" \
            --library-path "$RUNTIME" /tmp/dlopen-fceumm "$CORE" \
            | tee out/DYNAMIC-CORE-SMOKE.txt
          grep -F 'DYNAMIC_CORE_OK name=FCEUmm' out/DYNAMIC-CORE-SMOKE.txt
          grep -E 'extensions=.*nes' out/DYNAMIC-CORE-SMOKE.txt

      - name: Final package checks and manifest
        run: |
          set -eux
          ROOT=out/H3531/APPS/retroarch
          strings "$ROOT/RETROARCH.BIN" | grep -F '[H3531] RGB565 fastpath active:' \
            | tee out/FASTVIDEO-MARKER.txt
          strings "$ROOT/RETROARCH.BIN" | grep -F '[H3531] PERF frames=' \
            | tee out/PERF-MARKER.txt
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256.txt
          printf '%s\n' 48cbdb2e78ea6c92ade103941c4958ea312a5995 > out/RETROARCH-UPSTREAM-SHA.txt
          printf '%s\n' 236ccdfc911e84c60fea6b9d0699c2d440a8de14 > out/FCEUMM-UPSTREAM-SHA.txt
          cat > out/README.txt <<'EOF'
          H3531 RetroArch Stage 3.2 Speed + AutoCore

          Changes from physically tested Stage 3.1:
          - external FCEUmm is selected automatically by RETROARCH.APP;
          - RetroArch and FCEUmm use Cortex-A9 VFPv3 hardware internally with
            softfp calling convention, preserving compatibility with the bundled
            arm-linux-musleabi musl runtime;
          - Stage 3.1 RGB565 framebuffer fast path is retained;
          - UART prints [H3531] PERF every 300 game frames with effective FPS and
            average video presentation time.

          Audio remains intentionally disabled.
          Replace only /H3531/APPS/retroarch/ on the USB stick.
          Do not flash SPI NOR and do not use saveenv.
          EOF

      - name: Upload H3531 RetroArch Stage3.2 Speed AutoCore
        uses: actions/upload-artifact@v4
        with:
          name: H3531-RetroArch-Dynamic-FCEUmm-Stage3.2-Speed-AutoCore
          path: out/
          if-no-files-found: error
          retention-days: 14
