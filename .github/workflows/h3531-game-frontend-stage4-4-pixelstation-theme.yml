name: H3531 Game Frontend Stage4.4 PixelStation Theme

on:
  push:
    branches:
      - feature/h3531-game-frontend-stage4-4-pixelstation-theme
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-4-pixelstation-theme.yml'
      - 'ports/frontend/h3531-game-frontend.cpp'
      - 'ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp'
      - 'ports/frontend/patch_stage42_stable_system_order.py'
      - 'ports/frontend/patch_stage43_pixel_system_icons.py'
      - 'ports/frontend/patch_stage44_pixelstation_theme.py'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file python3

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2
          git checkout 8224e427b655b83dae5e2298f1e6919523a78737
          test "$(git rev-parse HEAD)" = "8224e427b655b83dae5e2298f1e6919523a78737"
          git clone https://github.com/nothings/stb.git /tmp/stb
          cd /tmp/stb
          git checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20
          test "$(git rev-parse HEAD)" = "2c980bb59875b0d32144a71867fbdebb2f77cd20"

      - name: Generate Stage4.4 themed source
        run: |
          set -eux
          python3 ports/frontend/patch_stage42_stable_system_order.py \
            ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp \
            /tmp/stage42-stable.cpp
          python3 ports/frontend/patch_stage43_pixel_system_icons.py \
            /tmp/stage42-stable.cpp \
            /tmp/stage43.cpp
          python3 ports/frontend/patch_stage44_pixelstation_theme.py \
            /tmp/stage43.cpp \
            /tmp/stage44.cpp
          grep -F 'Stage4.4 PixelStation night-coverflow theme active' /tmp/stage44.cpp
          grep -F 'stage44_draw_night_background' /tmp/stage44.cpp
          grep -F 'stage44_draw_brand_badge' /tmp/stage44.cpp
          grep -F 'stage44_reflect_rect' /tmp/stage44.cpp
          grep -F 'for (size_t pos = 0; pos < vis.size(); ++pos)' /tmp/stage44.cpp
          ! grep -F 'visible_pos = (visible_pos + 1) % vis.size();' /tmp/stage44.cpp

      - name: Build Stage4.4 frontend natively
        run: |
          set -eux
          g++ -std=c++14 -O2 \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/stage44.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/gamefront-stage44-host
          /tmp/gamefront-stage44-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-host.txt
          grep -F 'SYSTEM_TWO NES-left SEGA-right identities-never-cross' /tmp/layout-host.txt
          grep -F 'PIXEL_ICON_REGISTRY NES=NES_PAD MEGADRIVE=MEGADRIVE_PAD SNES=SNES_PAD MASTER_SYSTEM=MASTER_SYSTEM_PAD GAMEBOY=GAMEBOY GAME_GEAR=GAME_GEAR PLAYSTATION=PLAYSTATION_PAD UNKNOWN=GENERIC_PAD' /tmp/layout-host.txt
          grep -F 'STAGE44_THEME pixelstation-night-coverflow procedural-background' /tmp/layout-host.txt
          grep -F 'STAGE44_COVERS branded-case glow reflection seven-card-layout' /tmp/layout-host.txt
          grep -F 'STAGE44_SYSTEMS custom-brand-badges stable-linear pixel-controllers' /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: Cross-build static H3531 Game Frontend Stage4.4
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O2 -fno-pie -static -no-pie \
            -march=armv7-a -mfloat-abi=soft \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/stage44.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | tee /tmp/gamefront-file.txt
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/gamefront-file.txt
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.4 PixelStation night-coverflow theme active'
          strings /tmp/GAMEFRONT.APP | grep -F '16-BIT LEGENDS'
          strings /tmp/GAMEFRONT.APP | grep -F 'MEGA DRIVE'

      - name: QEMU Stage4.4 layout and routing tests
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 0->1 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 1->2 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 2->3 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 3->4 = 14' /tmp/layout-arm.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-arm.txt
          grep -F 'SYSTEM_TWO NES-left SEGA-right identities-never-cross' /tmp/layout-arm.txt
          grep -F 'STAGE44_THEME pixelstation-night-coverflow procedural-background' /tmp/layout-arm.txt
          grep -F 'STAGE44_COVERS branded-case glow reflection seven-card-layout' /tmp/layout-arm.txt
          grep -F 'BACKBUFFER coherent-full-frame-blit' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

          mkdir -p /tmp/stage44test/nes /tmp/stage44test/md
          : > '/tmp/stage44test/nes/Demo Game.nes'
          : > '/tmp/stage44test/md/Comix Zone [Rus].bin'
          cat > /tmp/stage44test/es_systems.cfg <<'EOF'
          <systemList>
            <system>
              <name>nes</name><fullname>Nintendo Entertainment System</fullname>
              <path>/tmp/stage44test/nes</path><extension>.nes</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so %ROM_RAW%</command>
              <theme>nes</theme>
            </system>
            <system>
              <name>megadrive</name><fullname>Sega Mega Drive</fullname>
              <path>/tmp/stage44test/md</path><extension>.bin .md .gen .smd</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW%</command>
              <theme>megadrive</theme>
            </system>
          </systemList>
          EOF
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --self-test /tmp/stage44test/es_systems.cfg | tee /tmp/route-arm.txt
          grep -F 'ROUTE system=nes' /tmp/route-arm.txt | grep -F 'fceumm_libretro.so'
          grep -F 'ROUTE system=megadrive' /tmp/route-arm.txt | grep -F 'picodrive_libretro.so'
          grep -F 'SELF_TEST_OK systems=2 games=2' /tmp/route-arm.txt

      - name: Package Stage4.4 frontend overlay
        run: |
          set -eux
          ROOT=out/H3531/APPS/gamefront
          mkdir -p "$ROOT/licenses"
          cp /tmp/GAMEFRONT.APP "$ROOT/GAMEFRONT.APP"
          cp ports/frontend/es_systems.cfg "$ROOT/es_systems.cfg"
          cp /tmp/tinyxml2/LICENSE.txt "$ROOT/licenses/tinyxml2-LICENSE.txt"
          cp /tmp/stb/LICENSE "$ROOT/licenses/stb-LICENSE.txt"
          cat > "$ROOT/README_STAGE4_4_PIXELSTATION_THEME.txt" <<'EOF'
          H3531 Game Frontend Stage 4.4 - PixelStation Night Coverflow Theme

          Replace only /H3531/APPS/gamefront/.
          RetroArch, cores, kernel, ramdisk, Monitor and SPI NOR are unchanged.

          Visual changes:
          - procedural dark moonlit pixel-night background;
          - premium neon-blue selected-system frame;
          - improved NES and sculpted Mega Drive 3-button pixel controller silhouettes;
          - stable linear system order retained;
          - dynamic system branding and era labels;
          - seven-card cover-flow geometry with prepared off-screen cards;
          - system-branded case headers/footers;
          - selected cover glow and short dark reflection;
          - project-branded header, clock and console-style footer hints.

          Functional behavior is unchanged:
          - UP/DOWN switches Systems/Games focus;
          - LEFT/RIGHT navigates the focused row;
          - ENTER launches through es_systems.cfg routing;
          - F5 rescans; F1 opens RetroArch service menu; ESC exits.
          EOF
          cp /tmp/layout-arm.txt out/STAGE4_4-LAYOUT.txt
          cp /tmp/route-arm.txt out/STAGE4_4-ROUTING.txt
          cp /tmp/gamefront-file.txt out/STAGE4_4-BINARY-TYPE.txt
          (
            cd out
            find H3531/APPS/gamefront -type f -print0 | sort -z | xargs -0 sha256sum > SHA256.txt
            sha256sum -c SHA256.txt
          )

      - name: Upload H3531 Game Frontend Stage4.4 PixelStation theme
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.4-PixelStationTheme
          path: out/
          if-no-files-found: error
          retention-days: 14
