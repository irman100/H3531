name: H3531 Game Frontend Stage4.2 Focus Backbuffer

on:
  push:
    branches:
      - feature/h3531-game-frontend-stage4-2-focus-backbuffer
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-2-focus-backbuffer.yml'
      - 'ports/frontend/h3531-game-frontend.cpp'
      - 'ports/frontend/h3531-game-frontend-stage4-2.cpp'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2
          git checkout 8224e427b655b83dae5e2298f1e6919523a78737
          test "$(git rev-parse HEAD)" = "8224e427b655b83dae5e2298f1e6919523a78737"
          git clone https://github.com/nothings/stb.git /tmp/stb
          cd /tmp/stb
          git checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20
          test "$(git rev-parse HEAD)" = "2c980bb59875b0d32144a71867fbdebb2f77cd20"

      - name: Verify Stage4.2 source invariants
        run: |
          set -eux
          grep -F 'enum class FocusZone' ports/frontend/h3531-game-frontend-stage4-2.cpp
          grep -F 'Stage4.2 dual-focus backbuffer active' ports/frontend/h3531-game-frontend-stage4-2.cpp
          grep -F 'STAGE42_CARD_GAP = 14' ports/frontend/h3531-game-frontend-stage4-2.cpp
          grep -F 'stage42_present' ports/frontend/h3531-game-frontend-stage4-2.cpp
          grep -F 'stage42_draw_nes_pad' ports/frontend/h3531-game-frontend-stage4-2.cpp
          grep -F 'stage42_draw_sega_pad' ports/frontend/h3531-game-frontend-stage4-2.cpp
          grep -F 'fceumm_libretro.so' ports/frontend/es_systems.cfg
          grep -F 'picodrive_libretro.so' ports/frontend/es_systems.cfg

      - name: Build Stage4.2 frontend natively
        run: |
          set -eux
          g++ -std=c++14 -O2 \
            -I/tmp/tinyxml2 -I/tmp/stb \
            ports/frontend/h3531-game-frontend-stage4-2.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/gamefront-stage42-host
          /tmp/gamefront-stage42-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: Cross-build static H3531 Game Frontend Stage4.2
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O2 -fno-pie -static -no-pie \
            -march=armv7-a -mfloat-abi=soft \
            -I/tmp/tinyxml2 -I/tmp/stb \
            ports/frontend/h3531-game-frontend-stage4-2.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | grep -F 'ELF 32-bit LSB executable, ARM'
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.2 dual-focus backbuffer active'

      - name: QEMU layout focus and automatic routing tests
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 0->1 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 1->2 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 2->3 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 3->4 = 14' /tmp/layout-arm.txt
          grep -F 'FOCUS_FLOW Games --UP--> Systems --DOWN--> Games' /tmp/layout-arm.txt
          grep -F 'BACKBUFFER coherent-full-frame-blit' /tmp/layout-arm.txt
          grep -F 'SYSTEM_ICONS NES SEGA_MD' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

          mkdir -p /tmp/stage42test/nes /tmp/stage42test/md
          : > '/tmp/stage42test/nes/Demo Game.nes'
          : > '/tmp/stage42test/md/Comix Zone [Rus].bin'
          cat > /tmp/stage42test/es_systems.cfg <<'EOF'
          <systemList>
            <system>
              <name>nes</name><fullname>Nintendo Entertainment System</fullname>
              <path>/tmp/stage42test/nes</path><extension>.nes</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so %ROM_RAW%</command>
              <theme>nes</theme>
            </system>
            <system>
              <name>megadrive</name><fullname>Sega Mega Drive / Genesis</fullname>
              <path>/tmp/stage42test/md</path><extension>.bin .md .gen .smd</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW%</command>
              <theme>megadrive</theme>
            </system>
          </systemList>
          EOF
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --self-test /tmp/stage42test/es_systems.cfg | tee /tmp/route-arm.txt
          grep -F 'ROUTE system=nes' /tmp/route-arm.txt | grep -F 'fceumm_libretro.so'
          grep -F 'ROUTE system=megadrive' /tmp/route-arm.txt | grep -F 'picodrive_libretro.so'
          grep -F 'SELF_TEST_OK systems=2 games=2' /tmp/route-arm.txt

      - name: Package Stage4.2 frontend overlay
        run: |
          set -eux
          ROOT=out/H3531/APPS/gamefront
          mkdir -p "$ROOT/licenses"
          cp /tmp/GAMEFRONT.APP "$ROOT/GAMEFRONT.APP"
          cp ports/frontend/es_systems.cfg "$ROOT/es_systems.cfg"
          cp /tmp/tinyxml2/LICENSE.txt "$ROOT/licenses/tinyxml2-LICENSE.txt"
          cp /tmp/stb/LICENSE "$ROOT/licenses/stb-LICENSE.txt"
          cat > "$ROOT/README_STAGE4_2.txt" <<'EOF'
          H3531 Game Frontend Stage 4.2 - Dual Focus + Backbuffer

          Install as an overlay on the proven Stage4.0/Stage4.1 + Stage3.12 runtime.
          Replace only /H3531/APPS/gamefront/.
          Do not replace RetroArch, kernel, ramdisk, Monitor, bootargs or SPI NOR.

          Changes:
          - two focus zones: Systems and Games;
          - UP from Games enters Systems; DOWN returns to Games;
          - LEFT/RIGHT changes systems while Systems has focus;
          - LEFT/RIGHT changes ROMs while Games has focus;
          - custom original NES and Sega Mega Drive controller silhouettes;
          - animated system selection cursor and animated game carousel;
          - coherent RAM backbuffer then one framebuffer blit per frame to remove full-screen flicker;
          - equal 14 px gaps measured between outer card frames;
          - selected-card shadow no longer extends into the card gap;
          - NES -> FCEUmm and Mega Drive -> PicoDrive routing preserved.

          Controls:
          Games row: LEFT/RIGHT game, UP systems, ENTER play.
          Systems row: LEFT/RIGHT system, DOWN games, ENTER games.
          Global: F5 rescan, F1 RetroArch service menu, ESC exit.
          EOF
          cp /tmp/layout-arm.txt out/STAGE4_2-LAYOUT-TEST.txt
          cp /tmp/route-arm.txt out/STAGE4_2-ROUTING-TEST.txt
          printf '%s\n' 8224e427b655b83dae5e2298f1e6919523a78737 > out/TINYXML2-UPSTREAM-SHA.txt
          printf '%s\n' 2c980bb59875b0d32144a71867fbdebb2f77cd20 > out/STB-UPSTREAM-SHA.txt
          (
            cd out
            find H3531/APPS/gamefront -type f -print0 | sort -z | xargs -0 sha256sum > SHA256.txt
            sha256sum -c SHA256.txt
          )

      - name: Upload H3531 Game Frontend Stage4.2
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.2-DualFocus-Backbuffer
          path: out/
          if-no-files-found: error
          retention-days: 14
