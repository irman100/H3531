name: H3531 Game Frontend Stage4.47 Readability

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-47-readability.yml'
      - 'ports/frontend/patch_stage440_shell_controls.py'
      - 'ports/frontend/patch_stage441_favorites_search.py'
      - 'ports/frontend/patch_stage441_favorites_search.py.gz.b64'
      - 'ports/frontend/patch_stage442_axis_probe.py'
      - 'ports/frontend/patch_stage443_favorite_origin_backend.py'
      - 'ports/frontend/patch_stage443_favorite_origin_ui.py'
      - 'ports/frontend/patch_stage444_quiescent_launch.py'
      - 'ports/frontend/patch_stage445_ps1_runtime_policy.py'
      - 'ports/frontend/patch_stage446_persistent_hotkeys.py'
      - 'ports/frontend/patch_stage447_ui_readability.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file python3 binutils

      - name: Decode and validate patch chain
        run: |
          set -eux
          base64 -d ports/frontend/patch_stage430_full_menu_hotkeys.py.gz.b64 | gzip -d > /tmp/patch_stage430_full_menu_hotkeys.py
          python3 ports/frontend/fix_stage430_patch_scoping.py
          python3 -m py_compile /tmp/patch_stage430_full_menu_hotkeys.py
          python3 -m py_compile ports/frontend/patch_stage440_shell_controls.py
          python3 -m py_compile ports/frontend/patch_stage441_favorites_search.py
          python3 -m py_compile ports/frontend/patch_stage442_axis_probe.py
          python3 -m py_compile ports/frontend/patch_stage443_favorite_origin_backend.py
          python3 -m py_compile ports/frontend/patch_stage443_favorite_origin_ui.py
          python3 -m py_compile ports/frontend/patch_stage444_quiescent_launch.py
          python3 -m py_compile ports/frontend/patch_stage445_ps1_runtime_policy.py
          python3 -m py_compile ports/frontend/patch_stage446_persistent_hotkeys.py
          python3 -m py_compile ports/frontend/patch_stage447_ui_readability.py

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          git -C /tmp/tinyxml2 checkout 8224e427b655b83dae5e2298f1e6919523a78737
          git clone https://github.com/nothings/stb.git /tmp/stb
          git -C /tmp/stb checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20

      - name: Generate Stage4.47 source
        run: |
          set -eux

          # Backend input/action transport used by the wrapper source.
          python3 ports/frontend/patch_stage422_library.py ports/frontend/h3531-game-frontend.cpp /tmp/h3531-game-frontend.cpp
          python3 ports/frontend/patch_stage435_event_base.py /tmp/h3531-game-frontend.cpp /tmp/h3531-game-frontend-event.cpp
          mv /tmp/h3531-game-frontend-event.cpp /tmp/h3531-game-frontend.cpp
          python3 ports/frontend/patch_stage440_shell_controls.py /tmp/h3531-game-frontend.cpp /tmp/h3531-game-frontend-440.cpp
          mv /tmp/h3531-game-frontend-440.cpp /tmp/h3531-game-frontend.cpp
          python3 ports/frontend/patch_stage443_favorite_origin_backend.py /tmp/h3531-game-frontend.cpp /tmp/h3531-game-frontend-443.cpp
          mv /tmp/h3531-game-frontend-443.cpp /tmp/h3531-game-frontend.cpp

          # Existing visual/UI patch chain.
          python3 ports/frontend/patch_stage42_stable_system_order.py ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp /tmp/s42.cpp
          python3 ports/frontend/patch_stage43_pixel_system_icons.py /tmp/s42.cpp /tmp/s43.cpp
          python3 ports/frontend/patch_stage44_pixelstation_theme.py /tmp/s43.cpp /tmp/s44-pre.cpp
          python3 ports/frontend/patch_stage44_normalize_dispatcher.py /tmp/s44-pre.cpp /tmp/s44-normalized.cpp
          python3 ports/frontend/patch_stage44_restore_future_icons.py /tmp/s44-normalized.cpp /tmp/s44.cpp
          python3 ports/frontend/patch_stage45_reference_fidelity.py /tmp/s44.cpp /tmp/s45.cpp
          python3 ports/frontend/patch_stage46_sprite_ui.py /tmp/s45.cpp /tmp/s46.cpp
          python3 ports/frontend/patch_stage47_focus_performance.py /tmp/s46.cpp /tmp/s47.cpp
          python3 ports/frontend/patch_stage48_perspective_polish.py /tmp/s47.cpp /tmp/s48.cpp
          python3 ports/frontend/patch_stage413_library_features.py /tmp/s48.cpp /tmp/s413.cpp
          python3 ports/frontend/patch_stage415_cartridge_media_v2.py /tmp/s413.cpp /tmp/s415.cpp
          python3 ports/frontend/patch_stage416_user_media_assets.py /tmp/s415.cpp /tmp/s416.cpp
          python3 ports/frontend/patch_stage417_layout_sony_case.py /tmp/s416.cpp /tmp/s417.cpp
          python3 ports/frontend/patch_stage418_media_floor_glass.py /tmp/s417.cpp /tmp/s418.cpp
          python3 ports/frontend/patch_stage419_focus_aura.py /tmp/s418.cpp /tmp/s419.cpp
          python3 ports/frontend/patch_stage420_silhouette_aura.py /tmp/s419.cpp /tmp/s420.cpp
          python3 ports/frontend/patch_stage421_smooth_cached_aura_final_v2.py /tmp/s420.cpp /tmp/s421.cpp
          python3 ports/frontend/patch_stage422_atari_ps1_shell.py /tmp/s421.cpp /tmp/s422.cpp
          python3 ports/frontend/patch_stage424_v2_snes_gba_art.py /tmp/s422.cpp /tmp/s424.cpp
          python3 ports/frontend/patch_stage425_media_scale_gba.py /tmp/s424.cpp /tmp/s425.cpp
          python3 ports/frontend/patch_stage427_coverflow_aspect_fill.py /tmp/s425.cpp /tmp/s427.cpp
          python3 ports/frontend/patch_stage429_dense_media_centering.py /tmp/s427.cpp /tmp/s429.cpp
          python3 /tmp/patch_stage430_full_menu_hotkeys.py /tmp/s429.cpp /tmp/s430.cpp
          python3 ports/frontend/patch_stage431_steam_flash_lifecycle.py /tmp/s430.cpp /tmp/s431.cpp
          python3 ports/frontend/patch_stage433_standard_retroarch_input_settings.py /tmp/s431.cpp /tmp/s433.cpp
          python3 ports/frontend/patch_stage434_controller_wizard.py /tmp/s433.cpp /tmp/s434.cpp
          python3 ports/frontend/patch_stage435_event_wizard.py /tmp/s434.cpp /tmp/s435.cpp
          python3 ports/frontend/patch_stage436_recalbox_menu.py /tmp/s435.cpp /tmp/s436.cpp
          python3 ports/frontend/patch_stage437_full_controller_hotkeys.py /tmp/s436.cpp /tmp/s437.cpp
          python3 ports/frontend/patch_stage438_recalbox_visual_analog.py /tmp/s437.cpp /tmp/s438.cpp
          python3 ports/frontend/patch_stage439_adaptive_axis_capture.py /tmp/s438.cpp /tmp/s439.cpp
          python3 ports/frontend/patch_stage441_favorites_search.py /tmp/s439.cpp /tmp/s441.cpp
          python3 ports/frontend/patch_stage442_axis_probe.py /tmp/s441.cpp /tmp/s442.cpp
          python3 ports/frontend/patch_stage443_favorite_origin_ui.py /tmp/s442.cpp /tmp/s443.cpp
          python3 ports/frontend/patch_stage444_quiescent_launch.py /tmp/s443.cpp /tmp/s444.cpp
          python3 ports/frontend/patch_stage445_ps1_runtime_policy.py /tmp/s444.cpp /tmp/s445.cpp
          python3 ports/frontend/patch_stage446_persistent_hotkeys.py /tmp/s445.cpp /tmp/s446.cpp
          python3 ports/frontend/patch_stage447_ui_readability.py /tmp/s446.cpp /tmp/s447.cpp

          grep -F 'Stage4.42 Home UX + Cross-node Analog Probe active' /tmp/s444.cpp
          grep -F 'STAGE443_FAVORITES origin-system-media console-correct-labels selected-star44-no-overlap' /tmp/s444.cpp
          grep -F 'STAGE444_QUIESCENT external-launch releases-all-ui-caches-and-backbuffer keeps-features' /tmp/s447.cpp
          grep -F 'STAGE445_PS1_RUNTIME_POLICY rewind-granularity60 versioned-savestate-compatible' /tmp/s447.cpp
          grep -F 'STAGE446_HOTKEY_PERSISTENCE user-store all-systems ps1-exit-compatible' /tmp/s447.cpp
          grep -F 'STAGE447_READABILITY star33 header3 subtitle2 divider2 menu3 clock-right date-centered' /tmp/s447.cpp
          grep -F 'GAMES PAST ALWAYS PLAY\", 2' /tmp/s447.cpp
          grep -F 'const int time_scale = 3' /tmp/s447.cpp
          grep -F 'const int row_scale = informational ? 2 : 3' /tmp/s447.cpp
          grep -F '/mnt/usb/H3531/USER/gamefront/hotkeys.cfg' /tmp/s447.cpp
          grep -F 'persistent RetroArch hotkey saved:' /tmp/s447.cpp
          grep -F 'RUNTIME-POLICY system=%s rewind=%s granularity=%d' /tmp/s447.cpp
          grep -F 'QUIESCE external-launch caches=empty backbuffer=released' /tmp/s447.cpp
          grep -F 'stage47_scaled_assets.clear()' /tmp/s447.cpp
          grep -F 'stage421_aura_cache.clear()' /tmp/s447.cpp
          grep -F 'origin_system' /tmp/h3531-game-frontend.cpp
          grep -F 'STAGE441_HOME favorites-first virtual-star-system controller-first' /tmp/s443.cpp
          grep -F 'STAGE441_NAV left-stick-dpad L1-R1-systems L2-R2-favorite Y-search' /tmp/s443.cpp
          grep -F 'STAGE441_SEARCH gamepad-onscreen-keyboard results-jump-no-autolaunch' /tmp/s443.cpp
          grep -F 'STAGE442_AXIS_PROBE all-gamepad-event-nodes diagnostic-only no-cross-device-autobind' /tmp/s443.cpp
          grep -F 'axis-probe-other path=%s device=%s' /tmp/s443.cpp
          grep -F 'PrevSystemDirect' /tmp/h3531-game-frontend.cpp
          grep -F 'ToggleFavorite' /tmp/h3531-game-frontend.cpp
          grep -F 'h3531_profile_bind(kv, "l_x_minus")' /tmp/h3531-game-frontend.cpp
          grep -F 'h3531_profile_bind(kv, "l2")' /tmp/h3531-game-frontend.cpp

      - name: Native layout test
        run: |
          set -eux
          g++ -std=c++14 -O3 -I/tmp -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend /tmp/s447.cpp /tmp/tinyxml2/tinyxml2.cpp -o /tmp/gamefront-host
          /tmp/gamefront-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'STAGE441_HOME favorites-first virtual-star-system controller-first' /tmp/layout-host.txt
          grep -F 'STAGE441_NAV left-stick-dpad L1-R1-systems L2-R2-favorite Y-search' /tmp/layout-host.txt
          grep -F 'STAGE441_SEARCH gamepad-onscreen-keyboard results-jump-no-autolaunch' /tmp/layout-host.txt
          grep -F 'STAGE442_AXIS_PROBE all-gamepad-event-nodes diagnostic-only no-cross-device-autobind' /tmp/layout-host.txt
          grep -F 'STAGE443_FAVORITES origin-system-media console-correct-labels selected-star44-no-overlap' /tmp/layout-host.txt
          grep -F 'STAGE444_QUIESCENT external-launch releases-all-ui-caches-and-backbuffer keeps-features' /tmp/layout-host.txt
          grep -F 'STAGE445_PS1_RUNTIME_POLICY rewind-granularity60 versioned-savestate-compatible' /tmp/layout-host.txt
          grep -F 'STAGE446_HOTKEY_PERSISTENCE user-store all-systems ps1-exit-compatible' /tmp/layout-host.txt
          grep -F 'STAGE447_READABILITY star33 header3 subtitle2 divider2 menu3 clock-right date-centered' /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: ARM build and QEMU test
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O3 -fno-pie -static -no-pie -march=armv7-a -mfloat-abi=soft -I/tmp -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend /tmp/s447.cpp /tmp/tinyxml2/tinyxml2.cpp -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | tee /tmp/type.txt
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/type.txt
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.42 Home UX + Cross-node Analog Probe active'
          strings /tmp/GAMEFRONT.APP | grep -F 'STAGE441_HOME favorites-first virtual-star-system controller-first'
          strings /tmp/GAMEFRONT.APP | grep -F 'STAGE441_NAV left-stick-dpad L1-R1-systems L2-R2-favorite Y-search'
          strings /tmp/GAMEFRONT.APP | grep -F 'STAGE441_SEARCH gamepad-onscreen-keyboard results-jump-no-autolaunch'
          strings /tmp/GAMEFRONT.APP | grep -F 'axis-probe-other path=%s device=%s'
          strings /tmp/GAMEFRONT.APP | grep -F 'axis-capture path=%s code=%u(%s)'
          strings /tmp/GAMEFRONT.APP | grep -F 'YOUR FAVORITES'
          strings /tmp/GAMEFRONT.APP | grep -F 'SEARCH GAMES'

          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'STAGE441_HOME favorites-first virtual-star-system controller-first' /tmp/layout-arm.txt
          grep -F 'STAGE441_NAV left-stick-dpad L1-R1-systems L2-R2-favorite Y-search' /tmp/layout-arm.txt
          grep -F 'STAGE441_SEARCH gamepad-onscreen-keyboard results-jump-no-autolaunch' /tmp/layout-arm.txt
          grep -F 'STAGE442_AXIS_PROBE all-gamepad-event-nodes diagnostic-only no-cross-device-autobind' /tmp/layout-arm.txt
          grep -F 'STAGE443_FAVORITES origin-system-media console-correct-labels selected-star44-no-overlap' /tmp/layout-arm.txt
          grep -F 'STAGE444_QUIESCENT external-launch releases-all-ui-caches-and-backbuffer keeps-features' /tmp/layout-arm.txt
          grep -F 'STAGE445_PS1_RUNTIME_POLICY rewind-granularity60 versioned-savestate-compatible' /tmp/layout-arm.txt
          grep -F 'STAGE446_HOTKEY_PERSISTENCE user-store all-systems ps1-exit-compatible' /tmp/layout-arm.txt
          grep -F 'STAGE447_READABILITY star33 header3 subtitle2 divider2 menu3 clock-right date-centered' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

      - name: Package frontend overlay
        run: |
          set -eux
          mkdir -p out/H3531/APPS/gamefront out/H3531/SYSTEM/docs
          cp /tmp/GAMEFRONT.APP out/H3531/APPS/gamefront/GAMEFRONT.APP
          cp /tmp/s447.cpp out/STAGE4_47_GENERATED.cpp
          cp /tmp/layout-arm.txt out/H3531/SYSTEM/docs/STAGE4_42_LAYOUT.txt
          cp /tmp/type.txt out/H3531/SYSTEM/docs/STAGE4_42_BINARY_TYPE.txt
          (cd out && sha256sum H3531/APPS/gamefront/GAMEFRONT.APP > H3531/SYSTEM/docs/SHA256-STAGE4_42.txt)
          cat > out/H3531/SYSTEM/docs/README_STAGE4_42_HOME_SEARCH_PROBE.txt <<'EOF'
          Stage4.47 Stayplaytion frontend
          - Favorites is a synthetic first/home system and can aggregate games across consoles.
          - Favorite entries retain origin system metadata, so every ROM keeps its real cartridge/case geometry and system label.
          - Selected favorite star is reduced to 44px-class and moved above the media so it does not cover labels.
          - External emulator launch enters quiescent mode: all reconstructable UI image/cover/aura caches and the 1280x720 backbuffer are released before RetroArch runs.
          - Favorites, Search, library metadata, controller profiles and settings are preserved; caches are rebuilt lazily after emulator exit.
          - Memory telemetry is logged as QUIESCE before-release/after-release/after-child.
          - PS1 rewind remains available but uses granularity 60 instead of serializing a rewind state every frame.
          - Controller hotkeys persist in USER/gamefront/hotkeys.cfg and are appended to every emulator launch, including PS1.
          - Home/header/divider/menu typography enlarged; selected favorite star reduced to 33px; clock is right-aligned with centered date.
          - Left analog stick mirrors D-pad navigation using standard RetroArch l_x/l_y bindings.
          - L1/R1 page previous/next console directly.
          - L2 or R2 toggles favorite for the selected game.
          - Y opens controller-first search; selecting a result navigates to the ROM without launching it.
          - Selected favorites receive a large centered star and larger labels.
          - During analog controller-wizard steps, other gamepad-capable event nodes are logged as axis-probe-other telemetry.
          - Cross-node telemetry is diagnostic only: identical device names are never auto-grouped or auto-bound.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.47-Readability
          path: out/
          if-no-files-found: error
          retention-days: 14
