name: H3531 Stage6.8.0 Stayplaytion Firmware POST Prototype

on:
  push:
    branches:
      - feature/h3531-stage68-firmware-prototype
    paths:
      - '.github/workflows/h3531-stage68-firmware-prototype.yml'
      - 'ports/stage68/**'
      - 'ports/stage66a/h3531-lxde-core.sh'
      - 'tools/boot/make_uboot_script.py'
      - 'tools/boot/STAYPLAYTION-FIRMWARE-BOOT.cmd'
      - 'docs/STAYPLAYTION_FIRMWARE_ARCHITECTURE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip busybox

      - name: Bootstrap Debian Wheezy armel
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage
          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          EOF
          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get -o Acquire::Check-Valid-Until=false update
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get -y --no-install-recommends --allow-unauthenticated install build-essential

      - name: Build firmware POST against target-era EGLIBC
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo cp ports/stage68/h3531-firmware-post.c rootfs/build/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            'gcc -O2 -march=armv7-a -mfloat-abi=soft /build/h3531-firmware-post.c -o /build/h3531-firmware-post'
          sudo cp rootfs/build/h3531-firmware-post .
          sudo chown "$(id -u):$(id -g)" h3531-firmware-post
          file h3531-firmware-post
          readelf -l h3531-firmware-post | grep -F '/lib/ld-linux.so.3'
          readelf -V h3531-firmware-post | tee /tmp/fw-post.versions
          grep -F 'GLIBC_2.4' /tmp/fw-post.versions
          if grep -E 'GLIBC_2\.(1[4-9]|[2-9][0-9])' /tmp/fw-post.versions; then
            echo 'ERROR: firmware POST requires glibc newer than target EGLIBC 2.13'
            exit 1
          fi
          if readelf -A h3531-firmware-post | grep -q 'Tag_ABI_VFP_args'; then
            echo 'ERROR: firmware POST is hard-float'
            exit 1
          fi
          strings h3531-firmware-post | grep -F 'STAYPLAYTION FIRMWARE'
          strings h3531-firmware-post | grep -F 'HI3531 HARDWARE POST'

      - name: Validate firmware scripts and safety invariants
        run: |
          set -eux
          busybox sh -n ports/stage68/STAGE68-FIRMWARE.APP
          busybox sh -n ports/stage68/h3531-os-probe
          ! grep -R -E '(^|[[:space:]])saveenv([[:space:]]|$)|sf[[:space:]]+(erase|write)|flash_erase|mtd_debug[[:space:]]+write' ports/stage68 tools/boot/STAYPLAYTION-FIRMWARE-BOOT.cmd
          grep -F 'sleep 3' ports/stage68/STAGE68-FIRMWARE.APP
          grep -F 'kill -STOP "$MONPID"' ports/stage68/STAGE68-FIRMWARE.APP
          grep -F 'probe-only handoff' ports/stage68/STAGE68-FIRMWARE.APP
          grep -F '/etc/stayplaytion-os-release' ports/stage68/h3531-os-probe

      - name: Build removable firmware boot script
        run: |
          set -eux
          python3 tools/boot/make_uboot_script.py \
            tools/boot/STAYPLAYTION-FIRMWARE-BOOT.cmd STAY68.SCR \
            --name 'Stayplaytion FW 6.8'
          test -s STAY68.SCR

      - name: Assemble Stage6.8.0 patch
        run: |
          set -eux
          ROOT=out/H3531
          X="$ROOT/APPS/x11-debian"
          mkdir -p "$X/bin" "$ROOT/SYSTEM/docs" "$ROOT/SYSTEM/stage68"

          cp h3531-firmware-post "$X/bin/h3531-boot-screen"
          cp ports/stage68/h3531-os-probe "$X/bin/h3531-os-probe"
          cp ports/stage68/STAGE68-FIRMWARE.APP "$ROOT/SYSTEM/STAGE68-FIRMWARE.APP"
          cp ports/stage68/STAGE68-FIRMWARE.APP "$ROOT/SYSTEM/MONITOR.APP"
          cp docs/STAYPLAYTION_FIRMWARE_ARCHITECTURE.md "$ROOT/SYSTEM/docs/"
          cp ports/stage68/stayplaytion-os-release.example "$ROOT/SYSTEM/stage68/"
          cp STAY68.SCR "$ROOT/SYSTEM/stage68/"

          chmod 755 "$X/bin/h3531-boot-screen" "$X/bin/h3531-os-probe" \
            "$ROOT/SYSTEM/STAGE68-FIRMWARE.APP" "$ROOT/SYSTEM/MONITOR.APP"

          cat >"$ROOT/SYSTEM/docs/README_STAGE6_8_0_FIRMWARE_POST.txt" <<'EOF'
          Stayplaytion Stage6.8.0 Firmware POST Prototype
          Base: proven Stage6.7.3 framebuffer ownership handoff.

          This is deliberately non-destructive:
          - no saveenv;
          - no SPI writes;
          - no U-Boot replacement;
          - no external-root switch yet.

          New behavior:
          - BIOS-like Stayplaytion Firmware POST with real RAM/video/input status;
          - read-only external OS probe;
          - existing Desktop remains the normal boot target;
          - F2 rescue remains available.
          EOF

          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
              > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0.txt
          )

      - name: Create ZIP
        run: |
          set -eux
          cd out
          zip -qr ../H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH.zip \
            | tee H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH.zip.sha256
          unzip -t H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH
          path: |
            H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH.zip
            H3531-Stage6.8.0-Stayplaytion-FirmwarePOST-PATCH.zip.sha256
          retention-days: 14
