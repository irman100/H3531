name: H3531 Stage4.22 V3 PS1 Performance

on:
  push:
    branches:
      - feature/h3531-stage4-22-v3-ps1-performance
    paths:
      - '.github/workflows/h3531-stage4-22-v3-ps1-performance.yml'
      - 'ports/retroarch/patch_stage422_v3_ps1_video.py'
      - 'ports/retroarch/h3531_fb_gfx.c'
      - 'ports/retroarch/h3531_fb_gfx_fast_aspect.c'
      - 'ports/retroarch/linuxraw_input_h3531.c'
      - 'ports/retroarch/h3531_ao_audio_stage3_8.c'
      - 'ports/retroarch/h3531_ao_audio_stage3_11.c'
      - 'ports/retroarch/retroarch-h3531-stage422-v3-ps1.cfg'
      - 'ports/retroarch/pcsx_rearmed_libretro.info'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user python3 binutils

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch and PCSX-ReARMed
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          git -C /tmp/retroarch checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git -C /tmp/retroarch rev-parse HEAD)" = 48cbdb2e78ea6c92ade103941c4958ea312a5995

          git clone --recursive https://github.com/libretro/pcsx_rearmed.git /tmp/pcsx_rearmed
          git -C /tmp/pcsx_rearmed checkout 8625c395a24411f8c77e69802b516df9c613a712
          git -C /tmp/pcsx_rearmed submodule update --init --recursive
          test "$(git -C /tmp/pcsx_rearmed rev-parse HEAD)" = 8625c395a24411f8c77e69802b516df9c613a712

      - name: Build PCSX-ReARMed UNAI for Cortex-A9 softfp
        working-directory: /tmp/pcsx_rearmed
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -fomit-frame-pointer -ffast-math -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export ASFLAGS='-mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm'
          make -f Makefile.libretro -j2 platform=unix HAVE_PHYSICAL_CDROM=0 BUILTIN_GPU=unai DYNAREC=ari64 NDRC_THREAD=1 USE_ASYNC_GPU=1 USE_ASYNC_SPU=1 USE_ASYNC_CDROM=1 2>&1 | tee /tmp/pcsx-build.log
          test -s pcsx_rearmed_libretro.so
          grep -F 'BUILTIN_GPU: unai' /tmp/pcsx-build.log
          grep -F 'DYNAREC:     ari64' /tmp/pcsx-build.log
          arm-linux-musleabi-nm -D --defined-only pcsx_rearmed_libretro.so | grep -E ' retro_(init|run|get_system_info)$'
          file pcsx_rearmed_libretro.so | tee /tmp/pcsx-type.txt
          grep -F 'ELF 32-bit LSB shared object, ARM' /tmp/pcsx-type.txt

      - name: Generate Stage4.22 V3 video driver
        run: |
          set -eux
          python3 ports/retroarch/patch_stage422_v3_ps1_video.py \
            ports/retroarch/h3531_fb_gfx_fast_aspect.c /tmp/h3531_fb_gfx_stage422_v3.c
          grep -F 'PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720' /tmp/h3531_fb_gfx_stage422_v3.c
          grep -F 'RGB565 direct1x fastpath active: 640x480 -> 640x480' /tmp/h3531_fb_gfx_stage422_v3.c
          grep -F 'RGB565 horizontal2x fastpath active: 320x480 -> 640x480' /tmp/h3531_fb_gfx_stage422_v3.c
          grep -F 'video_driver_update_viewport' /tmp/h3531_fb_gfx_stage422_v3.c
          grep -F 'PERF frames=' /tmp/h3531_fb_gfx_stage422_v3.c

      - name: Install H3531 video input and proven AO adapters
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          cp /tmp/h3531_fb_gfx_stage422_v3.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c
          cp ports/retroarch/h3531_ao_audio_stage3_8.c /tmp/retroarch/audio/drivers/h3531_ao_audio_base.inc
          cp ports/retroarch/h3531_ao_audio_stage3_11.c /tmp/retroarch/audio/drivers/oss.c
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc

      - name: Configure Cortex-A9 dynamic RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export H3531_CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CFLAGS="$H3531_CFLAGS" CXXFLAGS="$H3531_CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'
          ./configure --host=arm-linux-musleabi --enable-dynamic \
            --disable-qt --disable-x11 --disable-wayland \
            --disable-opengl --disable-opengl_core --disable-opengl1 --disable-opengles --disable-vulkan --disable-kms \
            --disable-sdl --disable-sdl2 --disable-udev \
            --disable-alsa --disable-pulse --enable-oss \
            --disable-ffmpeg --disable-freetype --disable-cheevos \
            --disable-networking --disable-netplaydiscovery --disable-online_updater --disable-discord
          grep -Eq '^HAVE_DYNAMIC[[:space:]]*=[[:space:]]*1' config.mk
          grep -Eq '^HAVE_OSS[[:space:]]*=[[:space:]]*1' config.mk

      - name: Build RetroArch with low-cost audio resamplers
        working-directory: /tmp/retroarch
        shell: bash
        run: |
          set -o pipefail
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 OS='Linux FPGA' HAVE_RGUI=1 HAVE_XMB=0 HAVE_OZONE=0 HAVE_MATERIALUI=0 \
            HAVE_CC_RESAMPLER=1 HAVE_NEAREST_RESAMPLER=1 2>&1 | tee /tmp/retroarch-build.log

      - name: Verify Stage4.22 V3 frontend markers and config
        run: |
          set -eux
          test -s /tmp/retroarch/retroarch
          strings /tmp/retroarch/retroarch | grep -F '[H3531] PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720'
          strings /tmp/retroarch/retroarch | grep -F '[H3531] RGB565 direct1x fastpath active: 640x480 -> 640x480'
          strings /tmp/retroarch/retroarch | grep -F '[H3531] RGB565 horizontal2x fastpath active: 320x480 -> 640x480'
          strings /tmp/retroarch/retroarch | grep -F '[H3531 AO] Stage3.11 bounded-latency transport active:'
          nm /tmp/retroarch/retroarch | grep -F 'CC_resampler'
          nm /tmp/retroarch/retroarch | grep -F 'nearest_resampler'
          grep -F 'video_scale_integer = "true"' ports/retroarch/retroarch-h3531-stage422-v3-ps1.cfg
          grep -F 'video_force_aspect = "true"' ports/retroarch/retroarch-h3531-stage422-v3-ps1.cfg
          grep -F 'audio_resampler = "CC"' ports/retroarch/retroarch-h3531-stage422-v3-ps1.cfg
          grep -F 'retroarch-ps1.cfg' ports/frontend/es_systems.cfg

      - name: Prepare QEMU musl runtime
        run: |
          set -eux
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          RUNTIME=/tmp/h3531-runtime
          mkdir -p "$RUNTIME"
          LOADER="$(find "$TOOLCHAIN" -name ld-musl-arm.so.1 -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then RUNTIME_ELF="$LOADER"; else RUNTIME_ELF="$LIBC"; fi
          test -n "$RUNTIME_ELF"
          cp -L "$RUNTIME_ELF" "$RUNTIME/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$RUNTIME/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"; [ -z "$SRC" ] || cp -L "$SRC" "$RUNTIME/$lib"; done

      - name: QEMU smoke tests
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          R=/tmp/h3531-runtime
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/retroarch/retroarch --version | tee /tmp/retroarch-version.txt

          cat >/tmp/dlopen-core.c <<'EOF'
          #include <dlfcn.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          struct retro_system_info { const char *library_name; const char *library_version; const char *valid_extensions; bool need_fullpath; bool block_extract; };
          typedef void (*getinfo_t)(struct retro_system_info *);
          int main(int argc,char **argv){void*h;getinfo_t f;struct retro_system_info i;if(argc!=2)return 2;h=dlopen(argv[1],RTLD_NOW|RTLD_LOCAL);if(!h){fprintf(stderr,"dlopen failed: %s\n",dlerror());return 3;}f=(getinfo_t)dlsym(h,"retro_get_system_info");if(!f)return 4;memset(&i,0,sizeof(i));f(&i);printf("DYNAMIC_CORE_OK name=%s version=%s extensions=%s need_fullpath=%d\n",i.library_name?i.library_name:"",i.library_version?i.library_version:"",i.valid_extensions?i.valid_extensions:"",i.need_fullpath?1:0);dlclose(h);return 0;}
          EOF
          arm-linux-musleabi-gcc -O2 -march=armv7-a -mfloat-abi=soft /tmp/dlopen-core.c -ldl -o /tmp/dlopen-core
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/dlopen-core /tmp/pcsx_rearmed/pcsx_rearmed_libretro.so | tee /tmp/pcsx-smoke.txt
          grep -F 'DYNAMIC_CORE_OK name=PCSX-ReARMed' /tmp/pcsx-smoke.txt

      - name: Package Stage4.22 V3 PS1 performance overlay
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          ROOT=out/H3531/APPS/retroarch
          GROOT=out/H3531/APPS/gamefront
          mkdir -p "$ROOT/cores" "$ROOT/info" "$GROOT"

          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o "$ROOT/RETROARCH.BIN"
          arm-linux-musleabi-strip /tmp/pcsx_rearmed/pcsx_rearmed_libretro.so -o "$ROOT/cores/pcsx_rearmed_libretro.so"
          cp ports/retroarch/pcsx_rearmed_libretro.info "$ROOT/info/"
          cp ports/retroarch/retroarch-h3531-stage422-v3-ps1.cfg "$ROOT/retroarch-ps1.cfg"
          cp ports/frontend/es_systems.cfg "$GROOT/es_systems.cfg"

          cat > "$ROOT/README_STAGE4_22_V3_PS1_PERFORMANCE.txt" <<'EOF'
          H3531 Stage4.22 V3 - PS1 Performance

          This overlay preserves the Stage4.22 V2 Game Frontend and its visual assets.
          It replaces the RetroArch executable and PCSX-ReARMed PS1 core, adds a PS1-only
          config, and updates es_systems.cfg so only PlayStation uses that PS1 config.

          Video:
          - 320x240 is still displayed at 960x720 (exact 3x). No image-size reduction.
          - Exact integer 3x RGB565 path avoids generic scaler maps for 320x240 gameplay.
          - Direct 1x path handles 640x480.
          - Horizontal 2x path handles 320x480 -> 640x480.
          - All other geometries retain the proven generic row-reuse scaler.

          Audio:
          - Proven H3531 AO5/ch0 Stage3.11 transport is unchanged.
          - PS1-only config selects the lower-cost CC resampler instead of default sinc.
          - Existing 48 kHz output, rate control and 64 ms latency settings are preserved.

          PS1 core:
          - PCSX-ReARMed pinned at 8625c395a24411f8c77e69802b516df9c613a712.
          - Ari64 new dynarec, compiler thread, async GPU/SPU/CD-ROM retained.
          - UNAI software GPU retained from the physically tested performance build.
          - No visual-degrading frameskip/skipline/lighting hacks are enabled.

          Hardware validation target: Silent Hill using the same .img and UART -v test.
          EOF

          cp /tmp/retroarch-version.txt out/RETROARCH-QEMU-VERSION.txt
          cp /tmp/pcsx-smoke.txt out/PCSX-DYNAMIC-CORE-SMOKE.txt
          cp /tmp/pcsx-type.txt out/PCSX-BINARY-TYPE.txt
          printf '%s\n' 48cbdb2e78ea6c92ade103941c4958ea312a5995 > out/RETROARCH-UPSTREAM-SHA.txt
          printf '%s\n' 8625c395a24411f8c77e69802b516df9c613a712 > out/PCSX-UPSTREAM-SHA.txt
          (cd out && find H3531 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256-CI.txt && sha256sum -c SHA256-CI.txt)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage4.22-V3-PS1-Performance
          path: out/
          if-no-files-found: error
          retention-days: 14
