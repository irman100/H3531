name: H3531 FCEUmm Free Shoulder Shortcuts

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-fceumm-free-shoulders.yml'
      - 'ports/retroarch/patch_fceumm_h3531_free_shoulders.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make python3 binutils

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned proven FCEUmm
        run: |
          set -eux
          git clone https://github.com/libretro/libretro-fceumm.git /tmp/fceumm
          git -C /tmp/fceumm checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          test "$(git -C /tmp/fceumm rev-parse HEAD)" = 236ccdfc911e84c60fea6b9d0699c2d440a8de14

      - name: Remove H3531 shoulder shortcuts only
        run: |
          set -eux
          python3 ports/retroarch/patch_fceumm_h3531_free_shoulders.py             /tmp/fceumm/src/drivers/libretro/libretro.c             /tmp/fceumm/src/drivers/libretro/libretro.c.patched
          mv /tmp/fceumm/src/drivers/libretro/libretro.c.patched              /tmp/fceumm/src/drivers/libretro/libretro.c

          grep -F 'palette_switch_enabled = false;' /tmp/fceumm/src/drivers/libretro/libretro.c
          grep -F '"fceumm_palette"' /tmp/fceumm/src/drivers/libretro/libretro.c
          grep -F 'L1 is intentionally left free for frontend/user hotkeys' /tmp/fceumm/src/drivers/libretro/libretro.c

          if grep -F 'Switch Palette (+ Left/Right)' /tmp/fceumm/src/drivers/libretro/libretro.c; then
            echo 'ERROR: physical palette shortcut descriptor survived' >&2
            exit 1
          fi
          if grep -F 'bool curL = input_cb(0, RETRO_DEVICE_JOYPAD, 0, RETRO_DEVICE_ID_JOYPAD_L)' /tmp/fceumm/src/drivers/libretro/libretro.c; then
            echo 'ERROR: FDS L1 hard binding survived' >&2
            exit 1
          fi

      - name: Build patched FCEUmm
        working-directory: /tmp/fceumm
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc
          export CXX=arm-linux-musleabi-g++
          export AR=arm-linux-musleabi-ar
          export RANLIB=arm-linux-musleabi-ranlib
          export STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          make -f Makefile.libretro -j2 platform=unix STATIC_LINKING=0 HAVE_HDPACK=0 WANT_32BPP=0
          test -s fceumm_libretro.so
          arm-linux-musleabi-nm -D --defined-only fceumm_libretro.so | grep -E ' retro_(init|run|get_system_info)$'

      - name: Package minimal NES core overlay
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          ROOT=out/H3531/APPS/retroarch/cores
          mkdir -p "$ROOT" out/H3531/SYSTEM/docs
          arm-linux-musleabi-strip /tmp/fceumm/fceumm_libretro.so -o "$ROOT/fceumm_libretro.so"

          file "$ROOT/fceumm_libretro.so" | grep -F 'ELF 32-bit LSB shared object, ARM'
          strings "$ROOT/fceumm_libretro.so" | grep -F 'FCEUmm'
          strings "$ROOT/fceumm_libretro.so" | grep -F 'fceumm_palette'
          if strings "$ROOT/fceumm_libretro.so" | grep -F 'Switch Palette (+ Left/Right)'; then
            echo 'ERROR: palette shoulder descriptor survived in binary' >&2
            exit 1
          fi

          cat > out/H3531/SYSTEM/docs/README_FCEUMM_FREE_SHOULDERS.txt <<'EOF'
          H3531 FCEUmm pinned 236ccdfc... with controller-shortcut cleanup.

          Preserved:
          - Core Options > Color Palette and every palette value;
          - proven FCEUmm engine and compile flags;
          - normal D-Pad/A/B/Start/Select/turbo behavior.

          Removed from physical controller:
          - L2 + Left/Right palette switching;
          - L1 FDS disk-side shortcut.

          L1/L2 are therefore available to Stayplaytion/RetroArch user hotkeys.
          FDS disk operations remain available through RetroArch/core disk UI;
          R1 legacy insert/eject behavior is unchanged.
          EOF

          (cd out && sha256sum H3531/APPS/retroarch/cores/fceumm_libretro.so > H3531/SYSTEM/docs/SHA256_FCEUMM_FREE_SHOULDERS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-FCEUmm-FreeShoulders
          path: out/
          if-no-files-found: error
          retention-days: 14
