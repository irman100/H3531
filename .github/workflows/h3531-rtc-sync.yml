name: H3531 Time Service RTC SNTP Manual

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-rtc-sync.yml'
      - 'ports/stage66d/h3531-rtc-sync.c'
      - 'ports/stage66d/h3531-time-settings'
      - 'ports/stage66d/builtin-applications/h3531-date-time.desktop'
      - 'ports/stage66a/START-DESKTOP.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file curl qemu-user

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Validate desktop startup shell
        run: |
          set -eux
          sh -n ports/stage66a/START-DESKTOP.sh
          grep -F 'h3531-rtc-sync' ports/stage66a/START-DESKTOP.sh
          grep -F '"$RTCSYNC" load' ports/stage66a/START-DESKTOP.sh
          grep -F '"$RTCSYNC" watch' ports/stage66a/START-DESKTOP.sh
          grep -F '"$RTCSYNC" net' ports/stage66a/START-DESKTOP.sh
          grep -F "TZ_VALUE='CET-1CEST,M3.5.0,M10.5.0/3'" ports/stage66a/START-DESKTOP.sh
          busybox sh -n ports/stage66d/h3531-time-settings
          grep -F 'Name=Date & Time' ports/stage66d/builtin-applications/h3531-date-time.desktop

      - name: Cross-build static RTC helper
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-gcc             -O2 -fno-pie -march=armv7-a -mfloat-abi=soft             -static -no-pie             ports/stage66d/h3531-rtc-sync.c             -o /tmp/h3531-rtc-sync
          arm-linux-musleabi-strip /tmp/h3531-rtc-sync
          file /tmp/h3531-rtc-sync
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] system clock loaded from battery RTC'
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] no /dev/rtc0 or /dev/rtc device; battery clock is not exposed to Linux'
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] system/RTC delta=%llds; persisting corrected system time'
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] NTP trying host=%s'
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] system clock set source=%s'
          strings /tmp/h3531-rtc-sync | grep -F 'manual format must be YYYY-MM-DD HH:MM:SS'

      - name: QEMU startup smoke
        run: |
          set +e
          qemu-arm -cpu cortex-a9 /tmp/h3531-rtc-sync invalid >/tmp/rtc-qemu.txt 2>&1
          rc=$?
          set -e
          cat /tmp/rtc-qemu.txt
          test "$rc" -eq 64
          grep -F 'usage:' /tmp/rtc-qemu.txt
          set +e
          TZ='CET-1CEST,M3.5.0,M10.5.0/3' qemu-arm -cpu cortex-a9 /tmp/h3531-rtc-sync set 2019-01-01 12:00:00 >/tmp/rtc-manual.txt 2>&1
          rc=$?
          set -e
          cat /tmp/rtc-manual.txt
          test "$rc" -eq 65
          grep -F 'manual date/time out of range' /tmp/rtc-manual.txt

      - name: Package RTC overlay
        run: |
          set -eux
          mkdir -p out/H3531/APPS/x11-debian/bin out/H3531/APPS/x11-debian/share/applications out/H3531/APPS/x11-debian out/H3531/SYSTEM/docs
          cp /tmp/h3531-rtc-sync out/H3531/APPS/x11-debian/bin/h3531-rtc-sync
          chmod 755 out/H3531/APPS/x11-debian/bin/h3531-rtc-sync
          cp ports/stage66a/START-DESKTOP.sh out/H3531/APPS/x11-debian/START-DESKTOP.sh
          cp ports/stage66d/h3531-time-settings out/H3531/APPS/x11-debian/bin/h3531-time-settings
          cp ports/stage66d/builtin-applications/h3531-date-time.desktop out/H3531/APPS/x11-debian/share/applications/h3531-date-time.desktop
          chmod 755 out/H3531/APPS/x11-debian/START-DESKTOP.sh out/H3531/APPS/x11-debian/bin/h3531-time-settings
          cat > out/H3531/SYSTEM/docs/README_RTC_SYNC.txt <<'EOF'
          H3531 system time service: RTC + SNTP + manual setup

          Startup:
            h3531-rtc-sync load
          reads /dev/rtc0 or /dev/rtc and sets CLOCK_REALTIME only when the
          hardware date is plausible (2020..2099).

          Network:
            after DHCP, START-DESKTOP launches "h3531-rtc-sync net" asynchronously.
            It uses plain UDP SNTP, so a 1970-era clock does not break TLS first.
            Servers are attempted in order: time.cloudflare.com, pool.ntp.org,
            time.google.com. A valid reply sets CLOCK_REALTIME and is then
            persisted to the battery RTC when available.

          Manual:
            Start menu > System > Date & Time opens h3531-time-settings.
            It can sync from Internet, set YYYY-MM-DD HH:MM:SS manually, or
            show RTC diagnostics. Manual input is interpreted in the configured
            local timezone.

          Timezone:
            default is CET/CEST (Europe/Berlin equivalent):
              CET-1CEST,M3.5.0,M10.5.0/3
            Override without rebuilding by creating:
              H3531/SYSTEM/TIMEZONE.CFG
            containing:
              TZ=<POSIX timezone string>

          Watch:
            h3531-rtc-sync watch
          compares system and RTC every 30 seconds. A correction larger than
          120 seconds is written to the RTC so NTP/manual changes survive power
          loss. Invalid system time is never written over a valid RTC.

          Diagnostic:
            cat /var/h3531-rtc.log

          The log distinguishes:
          - no RTC device/driver;
          - RTC_RD_TIME failure;
          - invalid/uninitialized RTC;
          - successful RTC -> system restore;
          - successful system -> RTC persistence.
          EOF
          (cd out && find H3531 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256_RTC.txt && sha256sum -c SHA256_RTC.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Time-Service-RTC-SNTP-Manual
          path: out/
          if-no-files-found: error
          retention-days: 14
