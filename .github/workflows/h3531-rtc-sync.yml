name: H3531 Battery RTC Sync

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-rtc-sync.yml'
      - 'ports/stage66d/h3531-rtc-sync.c'
      - 'ports/stage66a/START-DESKTOP.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file curl qemu-user

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Validate desktop startup shell
        run: |
          set -eux
          sh -n ports/stage66a/START-DESKTOP.sh
          grep -F 'h3531-rtc-sync' ports/stage66a/START-DESKTOP.sh
          grep -F '"$RTCSYNC" load' ports/stage66a/START-DESKTOP.sh
          grep -F '"$RTCSYNC" watch' ports/stage66a/START-DESKTOP.sh

      - name: Cross-build static RTC helper
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-gcc             -O2 -fno-pie -march=armv7-a -mfloat-abi=soft             -static -no-pie             ports/stage66d/h3531-rtc-sync.c             -o /tmp/h3531-rtc-sync
          arm-linux-musleabi-strip /tmp/h3531-rtc-sync
          file /tmp/h3531-rtc-sync
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] system clock loaded from battery RTC'
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] no /dev/rtc0 or /dev/rtc device; battery clock is not exposed to Linux'
          strings /tmp/h3531-rtc-sync | grep -F '[RTC] system/RTC delta=%llds; persisting corrected system time'

      - name: QEMU startup smoke
        run: |
          set +e
          qemu-arm -cpu cortex-a9 /tmp/h3531-rtc-sync invalid >/tmp/rtc-qemu.txt 2>&1
          rc=$?
          set -e
          cat /tmp/rtc-qemu.txt
          test "$rc" -eq 64
          grep -F 'usage:' /tmp/rtc-qemu.txt

      - name: Package RTC overlay
        run: |
          set -eux
          mkdir -p out/H3531/APPS/x11-debian/bin out/H3531/APPS/x11-debian out/H3531/SYSTEM/docs
          cp /tmp/h3531-rtc-sync out/H3531/APPS/x11-debian/bin/h3531-rtc-sync
          chmod 755 out/H3531/APPS/x11-debian/bin/h3531-rtc-sync
          cp ports/stage66a/START-DESKTOP.sh out/H3531/APPS/x11-debian/START-DESKTOP.sh
          chmod 755 out/H3531/APPS/x11-debian/START-DESKTOP.sh
          cat > out/H3531/SYSTEM/docs/README_RTC_SYNC.txt <<'EOF'
          H3531 battery RTC integration

          Startup:
            h3531-rtc-sync load
          reads /dev/rtc0 or /dev/rtc and sets CLOCK_REALTIME only when the
          hardware date is plausible (2020..2099).

          Watch:
            h3531-rtc-sync watch
          compares system and RTC every 30 seconds. A correction larger than
          120 seconds is written to the RTC so NTP/manual changes survive power
          loss. Invalid system time is never written over a valid RTC.

          Diagnostic:
            cat /var/h3531-rtc.log

          The log distinguishes:
          - no RTC device/driver;
          - RTC_RD_TIME failure;
          - invalid/uninitialized RTC;
          - successful RTC -> system restore;
          - successful system -> RTC persistence.
          EOF
          (cd out && find H3531 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256_RTC.txt && sha256sum -c SHA256_RTC.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Battery-RTC-Sync
          path: out/
          if-no-files-found: error
          retention-days: 14
