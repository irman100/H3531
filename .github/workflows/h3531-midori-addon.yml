name: H3531 Midori Browser Add-on V2

on:
  push:
    branches:
      - feature/h3531-stage64-lxde
    paths:
      - '.github/workflows/h3531-midori-addon.yml'
      - 'ports/x11/README_MIDORI_ADDON.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download Stage6.5B compatibility base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.5B-ShadowFB-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35467032507

      - name: Verify and extract Stage6.5B
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip
          echo "9d24f35dbe0765bfc000e0ee7b3b075cd8622b4444de2c4b7e310b5c5848631a  $BASEZIP" | sha256sum -c -
          mkdir -p base
          unzip -q "$BASEZIP" -d base
          BASE="$PWD/base/H3531/APPS/x11-debian"
          test -x "$BASE/bin/Xfbdev"
          test -x "$BASE/bin/lxpanel"
          test -x "$BASE/bin/pcmanfm"

      - name: Bootstrap Wheezy armel and install Midori
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            midori ca-certificates dbus dbus-x11

          echo "=== MIDORI VERSION ==="
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W \
            -f='${Package} ${Version} installed-size=${Installed-Size}KB\n' midori

          echo "=== MIDORI BINARY ==="
          file rootfs/usr/bin/midori
          readelf -A rootfs/usr/bin/midori || true
          if readelf -A rootfs/usr/bin/midori | grep -q Tag_ABI_VFP_args; then
            echo "ERROR: Midori binary is hard-float"
            exit 1
          fi

          echo "=== MIDORI PACKAGE FILES ==="
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -L midori | head -250

          echo "=== DBUS RUNTIME ==="
          for f in /usr/bin/dbus-daemon /usr/bin/dbus-uuidgen /usr/bin/dbus-launch; do
            test -x "rootfs$f"
            file "rootfs$f"
          done
          test -f rootfs/etc/dbus-1/session.conf

      - name: Build additive USB-only Midori bundle
        run: |
          set -eux
          BASE="$PWD/base/H3531/APPS/x11-debian"
          ADD="$PWD/addon/H3531/APPS/x11-debian"
          mkdir -p "$ADD/bin" "$ADD/lib" "$ADD/lib/arm-linux-gnueabi" \
                   "$ADD/share/applications" "$ADD/share" "$ADD/etc/ssl/certs"

          cp rootfs/usr/bin/midori "$ADD/bin/midori.real"
          cp rootfs/usr/bin/dbus-daemon "$ADD/bin/dbus-daemon.real"
          cp rootfs/usr/bin/dbus-uuidgen "$ADD/bin/dbus-uuidgen.real"
          cp rootfs/usr/bin/dbus-launch "$ADD/bin/dbus-launch.real"

          mkdir -p "$ADD/etc/dbus-1/session.d" "$ADD/share/dbus-1"
          cp rootfs/etc/dbus-1/session.conf "$ADD/etc/dbus-1/session.conf"
          if [ -d rootfs/usr/share/dbus-1 ]; then
            cp -aL rootfs/usr/share/dbus-1/. "$ADD/share/dbus-1/"
          fi

          # The stock session.conf points at /usr/share; our USB runtime exposes
          # application data through /var/share.
          sed -i 's#/usr/share#/var/share#g' "$ADD/etc/dbus-1/session.conf"

          # Copy Midori-owned runtime modules/resources while preserving layout.
          for src in \
            rootfs/usr/lib/midori \
            rootfs/usr/lib/arm-linux-gnueabi/midori \
            rootfs/usr/share/midori \
            rootfs/usr/share/webkitgtk-1.0 \
            rootfs/usr/share/webkit-1.0
          do
            [ -e "$src" ] || continue
            rel="${src#rootfs/usr/}"
            dest="$ADD/$rel"
            mkdir -p "$(dirname "$dest")"
            cp -aL "$src" "$dest"
          done

          # Desktop entry and Midori-specific artwork only.
          for f in \
            rootfs/usr/share/applications/midori.desktop \
            rootfs/usr/share/pixmaps/midori.png \
            rootfs/usr/share/icons/hicolor/16x16/apps/midori.png \
            rootfs/usr/share/icons/hicolor/22x22/apps/midori.png \
            rootfs/usr/share/icons/hicolor/24x24/apps/midori.png \
            rootfs/usr/share/icons/hicolor/32x32/apps/midori.png \
            rootfs/usr/share/icons/hicolor/48x48/apps/midori.png \
            rootfs/usr/share/icons/hicolor/scalable/apps/midori.svg
          do
            [ -f "$f" ] || continue
            rel="${f#rootfs/usr/}"
            mkdir -p "$ADD/$(dirname "$rel")"
            cp -aL "$f" "$ADD/$rel"
          done

          # WebKit/GTK may need GSettings schemas and MIME database data.
          if [ -d rootfs/usr/share/glib-2.0/schemas ]; then
            mkdir -p "$ADD/share/glib-2.0/schemas"
            cp -anL rootfs/usr/share/glib-2.0/schemas/. "$ADD/share/glib-2.0/schemas/" || true
          fi

          # Canonical CA bundle for HTTPS.
          test -f rootfs/etc/ssl/certs/ca-certificates.crt
          cp rootfs/etc/ssl/certs/ca-certificates.crt "$ADD/etc/ssl/certs/ca-certificates.crt"

          # Copy plugin/module directories used by WebKitGTK when present.
          for src in \
            rootfs/usr/lib/webkitgtk-1.0 \
            rootfs/usr/lib/arm-linux-gnueabi/webkitgtk-1.0 \
            rootfs/usr/lib/gio/modules \
            rootfs/usr/lib/arm-linux-gnueabi/gio/modules
          do
            [ -e "$src" ] || continue
            rel="${src#rootfs/usr/}"
            dest="$ADD/$rel"
            mkdir -p "$(dirname "$dest")"
            cp -aL "$src" "$dest"
          done

          # Patch only same-length hard-coded filesystem prefixes in copied ELFs:
          # /usr/share -> /var/share and /usr/lib -> /var/lib.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path("addon/H3531/APPS/x11-debian")
          candidates=[root/"bin/midori.real"]+[p for p in (root/"lib").rglob("*") if p.is_file()]
          for p in candidates:
              try:
                  out=subprocess.check_output(["file",str(p)],text=True)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in out:
                  continue
              data=p.read_bytes()
              old=data
              data=data.replace(b"/usr/share",b"/var/share")
              data=data.replace(b"/usr/lib",b"/var/lib")
              if data != old:
                  p.write_bytes(data)
                  print("relocated",p)
          PY

          # Resolve the complete ELF DT_NEEDED closure relative to Stage6.5B.
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess

          root=Path("rootfs").resolve()
          base=Path("base/H3531/APPS/x11-debian").resolve()
          add=Path("addon/H3531/APPS/x11-debian").resolve()
          outlib=add/"lib"

          existing={p.name for p in (base/"lib").rglob("*") if p.is_file()}
          existing|={p.name for p in (add/"lib").rglob("*") if p.is_file()}

          index={}
          for d in (root/"lib",root/"usr/lib"):
              if not d.exists(): continue
              for p in d.rglob("*"):
                  if p.is_file() or p.is_symlink():
                      index.setdefault(p.name,p)

          def realfile(p):
              seen=set()
              while p.is_symlink():
                  if p in seen: raise RuntimeError(f"symlink loop {p}")
                  seen.add(p)
                  t=os.readlink(p)
                  p=(root/t.lstrip("/")) if t.startswith("/") else (p.parent/t).resolve()
              return p

          def needed(p):
              try:
                  d=subprocess.check_output(["readelf","-d",str(p)],text=True,stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  return []
              out=[]
              for line in d.splitlines():
                  if "(NEEDED)" not in line: continue
                  a=line.find("["); b=line.find("]",a+1)
                  if a>=0 and b>a: out.append(line[a+1:b])
              return out

          queue=[add/"bin/midori.real", add/"bin/dbus-daemon.real", add/"bin/dbus-uuidgen.real", add/"bin/dbus-launch.real"]
          queue += [p for p in (add/"lib").rglob("*") if p.is_file()]
          copied={}
          seen=set()
          while queue:
              obj=queue.pop(0)
              key=str(obj)
              if key in seen: continue
              seen.add(key)
              for soname in needed(obj):
                  if soname in existing or soname in copied:
                      continue
                  src=index.get(soname)
                  if src is None:
                      raise SystemExit(f"missing source library {soname} for {obj}")
                  real=realfile(src)
                  if not real.is_file():
                      raise SystemExit(f"bad source {soname}: {real}")
                  dst=outlib/soname
                  shutil.copy2(real,dst)

                  # Relocate data/lib prefixes in newly copied library too.
                  data=dst.read_bytes()
                  data=data.replace(b"/usr/share",b"/var/share")
                  data=data.replace(b"/usr/lib",b"/var/lib")
                  dst.write_bytes(data)

                  copied[soname]=dst
                  existing.add(soname)
                  queue.append(dst)

          print("Midori add-on dependency libraries:",len(copied))
          for n in sorted(copied): print(n)
          PY

          cat >"$ADD/bin/midori" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LOADER="$BASE/lib/ld-linux.so.3"
          LIBPATH="$BASE/lib:$BASE/lib/arm-linux-gnueabi:$BASE/lib/arm-linux-gnueabi/lxpanel"
          HOME_DIR=/var/h3531-lxde

          mkdir -p "$HOME_DIR" "$HOME_DIR/.cache" "$HOME_DIR/.config" "$HOME_DIR/.local/share" "$HOME_DIR/tmp"
          mkdir -p /tmp 2>/dev/null || true
          chmod 1777 /tmp 2>/dev/null || true

          # Midori 0.4.x uses libunique over a D-Bus session bus. The vendor
          # image has neither a machine-id nor dbus-launch, so create a runtime
          # machine identity and start an isolated session bus from USB.
          mkdir -p /var/h3531-dbus /var/lib/dbus 2>/dev/null || true
          if [ ! -s /var/h3531-dbus/machine-id ]; then
            "$LOADER" --library-path "$LIBPATH" "$BASE/bin/dbus-uuidgen.real" > /var/h3531-dbus/machine-id 2>/var/h3531-dbus-uuidgen.err || true
          fi
          if [ -s /var/h3531-dbus/machine-id ]; then
            if [ ! -e /etc/machine-id ]; then
              ln -s /var/h3531-dbus/machine-id /etc/machine-id 2>/dev/null || cp /var/h3531-dbus/machine-id /etc/machine-id 2>/dev/null || true
            fi
            if [ ! -e /var/lib/dbus/machine-id ]; then
              ln -s /var/h3531-dbus/machine-id /var/lib/dbus/machine-id 2>/dev/null || cp /var/h3531-dbus/machine-id /var/lib/dbus/machine-id 2>/dev/null || true
            fi
          fi

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
            DBUS_OUT=$("$LOADER" --library-path "$LIBPATH" "$BASE/bin/dbus-daemon.real" \
              --config-file="$BASE/etc/dbus-1/session.conf" --fork --print-address=1 --print-pid=1 2>/var/h3531-dbus-daemon.err)
            set -- $DBUS_OUT
            DBUS_SESSION_BUS_ADDRESS="$1"
            DBUS_SESSION_BUS_PID="$2"
            export DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_PID
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >/var/h3531-midori-dbus.env
            echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >>/var/h3531-midori-dbus.env
          fi

          mkdir -p /var/lib 2>/dev/null || true
          [ -e /var/lib/midori ] || ln -s "$BASE/lib/midori" /var/lib/midori 2>/dev/null || true
          [ -e /var/lib/webkitgtk-1.0 ] || ln -s "$BASE/lib/webkitgtk-1.0" /var/lib/webkitgtk-1.0 2>/dev/null || true

          export DISPLAY="${DISPLAY:-127.0.0.1:0}"
          export HOME="$HOME_DIR"
          export TMPDIR="$HOME_DIR/tmp"
          export XDG_CONFIG_HOME="$HOME_DIR/.config"
          export XDG_CACHE_HOME="$HOME_DIR/.cache"
          export XDG_DATA_HOME="$HOME_DIR/.local/share"
          export XDG_DATA_DIRS="$BASE/share:/var/share"
          export PATH="$BASE/bin:/bin:/sbin:/usr/bin:/usr/sbin"
          export FONTCONFIG_FILE=/var/h3531-fonts.conf
          export FONTCONFIG_PATH=/var
          export PANGO_RC_FILE=/var/h3531-pangorc
          export SSL_CERT_FILE="$BASE/etc/ssl/certs/ca-certificates.crt"
          export SSL_CERT_DIR="$BASE/etc/ssl/certs"
          export G_FILENAME_ENCODING=UTF-8
          export LD_LIBRARY_PATH="$LIBPATH"

          exec "$LOADER" --library-path "$LIBPATH" "$BASE/bin/midori.real" "$@"
          EOF
          chmod 755 "$ADD/bin/midori"

          # Optional wrappers for direct diagnostics.
          for tool in dbus-daemon dbus-uuidgen dbus-launch; do
            cat >"$ADD/bin/$tool" <<EOF
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LOADER="\$BASE/lib/ld-linux.so.3"
          LIBPATH="\$BASE/lib:\$BASE/lib/arm-linux-gnueabi:\$BASE/lib/arm-linux-gnueabi/lxpanel"
          export LD_LIBRARY_PATH="\$LIBPATH"
          exec "\$LOADER" --library-path "\$LIBPATH" "\$BASE/bin/$tool.real" "\$@"
          EOF
            chmod 755 "$ADD/bin/$tool"
          done

          cat >"$ADD/share/applications/h3531-midori.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Midori
          Comment=Lightweight WebKit web browser
          Exec=/mnt/usb/H3531/APPS/x11-debian/bin/midori
          Icon=midori
          Categories=Network;WebBrowser;
          Terminal=false
          StartupNotify=false
          EOF

          cat >"$PWD/addon/README-MIDORI.txt" <<'EOF'
          H3531 Midori browser add-on V2
          ==============================

          Additive USB overlay only. It does not replace Xfbdev, Openbox,
          LXPanel, PCManFM, network scripts, or desktop launchers.

          Copy the H3531 directory over the existing USB H3531 directory.

          UART test:
            DISPLAY=127.0.0.1:0 /mnt/usb/H3531/APPS/x11-debian/bin/midori http://example.com

          HTTPS test:
            DISPLAY=127.0.0.1:0 /mnt/usb/H3531/APPS/x11-debian/bin/midori https://example.com

          V2 also bundles a private D-Bus runtime. The launcher creates a runtime
          machine-id and starts a USB-hosted session bus before Midori, avoiding
          the vendor-rootfs errors about /etc/machine-id and dbus-launch.

          This is the Debian Wheezy armel Midori/WebKitGTK generation chosen to
          match the H3531 Linux 3.0.8 / EABI5 userspace.

          No saveenv. No SPI writes.
          EOF

      - name: Dependency and package audit
        run: |
          set -eux
          BASE="$PWD/base/H3531/APPS/x11-debian"
          ADD="$PWD/addon/H3531/APPS/x11-debian"

          test -x "$ADD/bin/midori"
          test -f "$ADD/bin/midori.real"
          test -x "$ADD/bin/dbus-daemon"
          test -f "$ADD/bin/dbus-daemon.real"
          test -x "$ADD/bin/dbus-uuidgen"
          test -f "$ADD/bin/dbus-uuidgen.real"
          test -x "$ADD/bin/dbus-launch"
          test -f "$ADD/bin/dbus-launch.real"
          test -f "$ADD/etc/dbus-1/session.conf"
          test -d "$ADD/etc/dbus-1/session.d"
          sh -n "$ADD/bin/midori"
          sh -n "$ADD/bin/dbus-daemon"
          sh -n "$ADD/bin/dbus-uuidgen"
          sh -n "$ADD/bin/dbus-launch"
          file "$ADD/bin/midori.real"
          if readelf -A "$ADD/bin/midori.real" | grep -q Tag_ABI_VFP_args; then
            echo "ERROR: packaged Midori is hard-float"
            exit 1
          fi

          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base=Path("base/H3531/APPS/x11-debian")
          add=Path("addon/H3531/APPS/x11-debian")
          available={p.name for p in (base/"lib").rglob("*") if p.is_file()}
          available|={p.name for p in (add/"lib").rglob("*") if p.is_file()}
          objs=[add/"bin/midori.real",add/"bin/dbus-daemon.real",add/"bin/dbus-uuidgen.real",add/"bin/dbus-launch.real"]+[p for p in (add/"lib").rglob("*") if p.is_file()]
          checked=0
          for obj in objs:
              try:
                  dyn=subprocess.check_output(["readelf","-d",str(obj)],text=True,stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              need=[]
              for line in dyn.splitlines():
                  if "(NEEDED)" not in line: continue
                  a=line.find("["); b=line.find("]",a+1)
                  if a>=0 and b>a: need.append(line[a+1:b])
              missing=[x for x in need if x not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing {missing}")
              checked += 1
          print("Midori ELF dependency closure OK; objects:",checked)
          PY

          grep -q 'Name=Midori' "$ADD/share/applications/h3531-midori.desktop"
          test -f "$ADD/etc/ssl/certs/ca-certificates.crt"

          find addon/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > addon/SHA256SUMS_MIDORI.txt

      - name: Create add-on ZIP
        run: |
          set -eux
          cd addon
          zip -qr ../H3531-Midori-Browser-Addon-V2.zip H3531 README-MIDORI.txt SHA256SUMS_MIDORI.txt
          cd ..
          sha256sum H3531-Midori-Browser-Addon-V2.zip | tee H3531-Midori-Browser-Addon-V2.zip.sha256
          unzip -t H3531-Midori-Browser-Addon-V2.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Midori-Browser-Addon-V2
          path: |
            H3531-Midori-Browser-Addon-V2.zip
            H3531-Midori-Browser-Addon-V2.zip.sha256
          if-no-files-found: error
