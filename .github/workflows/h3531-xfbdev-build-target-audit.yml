name: H3531 Xfbdev Build Target Audit

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-xfbdev-build-target-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wheezy xorg-server packaging
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          mkdir -p /tmp/xsrc
          cat >/tmp/xsrc/sources.list <<'EOF'
          deb-src [trusted=yes] http://archive.debian.org/debian wheezy main
          EOF
          sudo apt-get -o Dir::Etc::sourcelist=/tmp/xsrc/sources.list -o Dir::Etc::sourceparts=- -o Acquire::Check-Valid-Until=false update
          cd /tmp/xsrc
          apt-get -o Dir::Etc::sourcelist=/tmp/xsrc/sources.list -o Dir::Etc::sourceparts=- -o Acquire::Check-Valid-Until=false source xorg-server=2:1.12.4-6+deb7u6
      - name: Show xfbdev build topology
        run: |
          set -eux
          SRC="$(find /tmp/xsrc -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          grep -n -E 'xfbdev|build_xfbdev|override_dh_auto_(configure|build)|build:' "$SRC/debian/rules" | tee /tmp/targets.txt
          sed -n '1,260p' "$SRC/debian/rules"
