name: H3531 FBZX FILES Association Compatibility

on:
  push:
    branches:
      - fix/fbzx-files-association-compat
    paths:
      - '.github/workflows/h3531-fbzx-association-compat.yml'
      - 'ports/fbzx/**'
      - 'ports/sdl12/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file make git curl autoconf automake libtool patch

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Build static SDL 1.2 with H3531 backend
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          git clone https://github.com/libsdl-org/SDL-1.2.git /tmp/SDL-1.2
          cd /tmp/SDL-1.2
          git checkout 457d4e55ffe1b6ad4c4fa4559dbda8360bf8253d
          cp "$GITHUB_WORKSPACE/ports/sdl12/SDL_nullvideo.h" src/video/dummy/SDL_nullvideo.h
          cp "$GITHUB_WORKSPACE/ports/sdl12/SDL_nullvideo.c" src/video/dummy/SDL_nullvideo.c
          cp "$GITHUB_WORKSPACE/ports/sdl12/SDL_nullevents.c" src/video/dummy/SDL_nullevents.c
          sh autogen.sh
          ./configure \
            --host=arm-linux-gnueabi \
            --prefix=/tmp/sdl-h3531 \
            --disable-shared --enable-static \
            --disable-video-x11 --disable-video-fbcon --enable-video-dummy \
            --disable-video-opengl --disable-video-directfb \
            --disable-alsa --disable-esd --disable-arts --disable-nas --disable-pulseaudio \
            --disable-cdrom \
            CC=arm-linux-musleabi-gcc AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib \
            CFLAGS='-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE'
          make -j2
          make install

      - name: Build current H3531 FBZX
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          chmod +x ports/fbzx/build-h3531.sh
          OUT="$GITHUB_WORKSPACE/out-fbzx" \
          SDL_CONFIG=/tmp/sdl-h3531/bin/sdl-config \
          CC=arm-linux-musleabi-gcc \
          CXX=arm-linux-musleabi-g++ \
          STRIP=arm-linux-musleabi-strip \
          FBZX_REF=981d48272e1cd04ce258e1060fd9574dd6bb4a60 \
          bash ports/fbzx/build-h3531.sh

      - name: Restore legacy FILES association layout
        run: |
          set -eux
          test -x out-fbzx/fbzx-buffered.APP
          mkdir -p out-assoc/H3531/APPS/fbzx
          cp out-fbzx/fbzx-buffered.APP out-assoc/FBZX.APP
          cp out-fbzx/fbzx-buffered.APP out-assoc/H3531/APPS/fbzx/FBZX.APP
          cp out-fbzx/keymap.bmp out-assoc/keymap.bmp
          cp out-fbzx/keymap.bmp out-assoc/H3531/APPS/fbzx/keymap.bmp
          cp out-fbzx/FBZX-COPYING.txt out-assoc/H3531/APPS/fbzx/FBZX-COPYING.txt || true
          chmod +x out-assoc/FBZX.APP out-assoc/H3531/APPS/fbzx/FBZX.APP
          cat > out-assoc/README_SPECTRUM_ASSOCIATION_FIX.txt <<'EOF'
          H3531 Spectrum FILES association compatibility
          ----------------------------------------------
          Copy the CONTENTS of this artifact to the USB root.
          The legacy FILES workflow expects /mnt/usb/FBZX.APP exactly.
          Keep your own Spectrum ROMs in /mnt/usb/spectrum-roms/.
          No Spectrum ROMs or games are included.
          EOF
          file out-assoc/FBZX.APP | tee out-assoc/FBZX-FILE.txt
          cmp out-fbzx/fbzx-buffered.APP out-assoc/FBZX.APP
          sha256sum out-assoc/FBZX.APP out-assoc/H3531/APPS/fbzx/FBZX.APP > out-assoc/SHA256SUMS.txt
          grep -F 'ELF 32-bit LSB executable, ARM' out-assoc/FBZX-FILE.txt

      - name: Upload association-compatible overlay
        uses: actions/upload-artifact@v4
        with:
          name: H3531-FBZX-FILES-Association-Compatibility
          path: out-assoc/
          if-no-files-found: error
          retention-days: 14
