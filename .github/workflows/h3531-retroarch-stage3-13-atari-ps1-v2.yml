name: H3531 RetroArch Stage3.13 Atari2600 + PS1 Cores V2

on:
  push:
    branches:
      - feature/h3531-retroarch-stage3-13-atari-ps1-cores
    paths:
      - '.github/workflows/h3531-retroarch-stage3-13-atari-ps1-v2.yml'
      - 'ports/retroarch/stella2014_libretro.info'
      - 'ports/retroarch/pcsx_rearmed_libretro.info'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make qemu-user python3

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned cores
        run: |
          set -eux
          git clone https://github.com/libretro/stella2014-libretro.git /tmp/stella2014
          git -C /tmp/stella2014 checkout 7d1361e407e63f29e52892655069e5fb4096e691
          test "$(git -C /tmp/stella2014 rev-parse HEAD)" = 7d1361e407e63f29e52892655069e5fb4096e691
          git clone --recursive https://github.com/libretro/pcsx_rearmed.git /tmp/pcsx_rearmed
          git -C /tmp/pcsx_rearmed checkout 8625c395a24411f8c77e69802b516df9c613a712
          git -C /tmp/pcsx_rearmed submodule update --init --recursive
          test "$(git -C /tmp/pcsx_rearmed rev-parse HEAD)" = 8625c395a24411f8c77e69802b516df9c613a712

      - name: Build Stella 2014 for Cortex-A9 softfp
        working-directory: /tmp/stella2014
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -fomit-frame-pointer -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          make -j2 platform=unix
          test -s stella2014_libretro.so
          arm-linux-musleabi-nm -D --defined-only stella2014_libretro.so | grep -E ' retro_(init|run|get_system_info)$'
          file stella2014_libretro.so | tee /tmp/stella-type.txt
          grep -F 'ELF 32-bit LSB shared object, ARM' /tmp/stella-type.txt

      - name: Build PCSX-ReARMed for Cortex-A9 softfp
        working-directory: /tmp/pcsx_rearmed
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -fomit-frame-pointer -ffast-math -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export ASFLAGS='-mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm'
          make -f Makefile.libretro -j2 platform=unix HAVE_PHYSICAL_CDROM=0
          test -s pcsx_rearmed_libretro.so
          arm-linux-musleabi-nm -D --defined-only pcsx_rearmed_libretro.so | grep -E ' retro_(init|run|get_system_info)$'
          file pcsx_rearmed_libretro.so | tee /tmp/pcsx-type.txt
          grep -F 'ELF 32-bit LSB shared object, ARM' /tmp/pcsx-type.txt

      - name: Prepare QEMU musl runtime
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          RUNTIME=/tmp/h3531-runtime
          mkdir -p "$RUNTIME"
          LOADER="$(find "$TOOLCHAIN" -name ld-musl-arm.so.1 -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then RUNTIME_ELF="$LOADER"; else RUNTIME_ELF="$LIBC"; fi
          test -n "$RUNTIME_ELF"
          cp -L "$RUNTIME_ELF" "$RUNTIME/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$RUNTIME/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"; [ -z "$SRC" ] || cp -L "$SRC" "$RUNTIME/$lib"; done

      - name: QEMU dlopen smoke tests
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cat >/tmp/dlopen-core.c <<'EOF'
          #include <dlfcn.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          struct retro_system_info { const char *library_name; const char *library_version; const char *valid_extensions; bool need_fullpath; bool block_extract; };
          typedef void (*getinfo_t)(struct retro_system_info *);
          int main(int argc,char **argv){void*h;getinfo_t f;struct retro_system_info i;if(argc!=2)return 2;h=dlopen(argv[1],RTLD_NOW|RTLD_LOCAL);if(!h){fprintf(stderr,"dlopen failed: %s\n",dlerror());return 3;}f=(getinfo_t)dlsym(h,"retro_get_system_info");if(!f)return 4;memset(&i,0,sizeof(i));f(&i);printf("DYNAMIC_CORE_OK name=%s version=%s extensions=%s need_fullpath=%d\n",i.library_name?i.library_name:"",i.library_version?i.library_version:"",i.valid_extensions?i.valid_extensions:"",i.need_fullpath?1:0);dlclose(h);return 0;}
          EOF
          arm-linux-musleabi-gcc -O2 -march=armv7-a -mfloat-abi=soft /tmp/dlopen-core.c -ldl -o /tmp/dlopen-core
          R=/tmp/h3531-runtime
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/dlopen-core /tmp/stella2014/stella2014_libretro.so | tee /tmp/stella-smoke.txt
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/dlopen-core /tmp/pcsx_rearmed/pcsx_rearmed_libretro.so | tee /tmp/pcsx-smoke.txt
          grep -F 'DYNAMIC_CORE_OK name=Stella 2014' /tmp/stella-smoke.txt
          grep -F 'DYNAMIC_CORE_OK name=PCSX-ReARMed' /tmp/pcsx-smoke.txt

      - name: Verify frontend routing
        run: |
          set -eux
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('ports/frontend/es_systems.cfg').getroot()
          s={x.findtext('name'):x for x in r.findall('system')}
          assert 'atari2600' in s and 'stella2014_libretro.so' in s['atari2600'].findtext('command')
          assert 'psx' in s and 'pcsx_rearmed_libretro.so' in s['psx'].findtext('command')
          assert '.a26' in s['atari2600'].findtext('extension')
          assert '.cue' in s['psx'].findtext('extension') and '.chd' in s['psx'].findtext('extension')
          print('ROUTING_OK Atari2600->Stella2014 PSX->PCSX-ReARMed')
          PY

      - name: Package overlay
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          ROOT=out/H3531/APPS/retroarch
          mkdir -p "$ROOT/cores" "$ROOT/info" out/H3531/APPS/gamefront
          arm-linux-musleabi-strip /tmp/stella2014/stella2014_libretro.so -o "$ROOT/cores/stella2014_libretro.so"
          arm-linux-musleabi-strip /tmp/pcsx_rearmed/pcsx_rearmed_libretro.so -o "$ROOT/cores/pcsx_rearmed_libretro.so"
          cp ports/retroarch/stella2014_libretro.info "$ROOT/info/"
          cp ports/retroarch/pcsx_rearmed_libretro.info "$ROOT/info/"
          cp ports/frontend/es_systems.cfg out/H3531/APPS/gamefront/es_systems.cfg
          cp /tmp/stella-smoke.txt out/STELLA2014-DYNAMIC-CORE-SMOKE.txt
          cp /tmp/pcsx-smoke.txt out/PCSX-REARMED-DYNAMIC-CORE-SMOKE.txt
          cp /tmp/stella-type.txt out/STELLA2014-BINARY-TYPE.txt
          cp /tmp/pcsx-type.txt out/PCSX-REARMED-BINARY-TYPE.txt
          printf '%s\n' 7d1361e407e63f29e52892655069e5fb4096e691 > out/STELLA2014-UPSTREAM-SHA.txt
          printf '%s\n' 8625c395a24411f8c77e69802b516df9c613a712 > out/PCSX-REARMED-UPSTREAM-SHA.txt
          cat >out/README.txt <<'EOF'
          H3531 RetroArch Stage3.13 Atari 2600 + PlayStation 1 core overlay.
          Adds Stella 2014 and PCSX-ReARMed plus es_systems.cfg routing only.
          Existing RetroArch binary, FCEUmm, PicoDrive, H3531 audio/video/input and frontend binary are not replaced.
          Atari ROM directory: /mnt/usb/games/atari2600
          PlayStation ROM directory: /mnt/usb/games/psx
          Optional PS1 BIOS files belong in /mnt/usb/H3531/USER/retroarch/system/ (for example scph5500.bin/scph5501.bin/scph5502.bin). BIOS files are not included.
          EOF
          (cd out && find H3531 -type f -print0 | sort -z | xargs -0 sha256sum >SHA256-CI.txt && sha256sum -c SHA256-CI.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-RetroArch-Stage3.13-Atari2600-PS1-Cores-V2
          path: out/
          if-no-files-found: error
          retention-days: 14
