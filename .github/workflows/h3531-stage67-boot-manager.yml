name: H3531 Stage6.7.2 Stayplaytion Compatibility Boot

on:
  push:
    branches:
      - feature/h3531-stage66d-live-native-lease
    paths:
      - '.github/workflows/h3531-stage67-boot-manager.yml'
      - 'ports/stage67/**'
      - 'ports/stage66a/h3531-lxde-core.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip busybox

      - name: Bootstrap Debian Wheezy armel
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg             wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -o Acquire::Check-Valid-Until=false update
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -y --no-install-recommends --allow-unauthenticated install             build-essential

      - name: Build boot screen against Wheezy EGLIBC
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo cp ports/stage67/h3531-boot-screen.c rootfs/build/

          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c             'gcc -O2 -march=armv7-a -mfloat-abi=soft /build/h3531-boot-screen.c -o /build/h3531-boot-screen'

          sudo cp rootfs/build/h3531-boot-screen .
          sudo chown "$(id -u):$(id -g)" h3531-boot-screen

          file h3531-boot-screen
          readelf -l h3531-boot-screen | grep -F '/lib/ld-linux.so.3'
          readelf -V h3531-boot-screen | tee /tmp/boot-screen.versions

          grep -F 'GLIBC_2.4' /tmp/boot-screen.versions
          if grep -E 'GLIBC_2\.(1[4-9]|[2-9][0-9])' /tmp/boot-screen.versions; then
            echo 'ERROR: boot screen requires glibc newer than target EGLIBC 2.13'
            exit 1
          fi

          if readelf -A h3531-boot-screen | grep -q 'Tag_ABI_VFP_args'; then
            echo 'ERROR: boot screen is hard-float'
            exit 1
          fi

          strings h3531-boot-screen | grep -F 'STAYPLAYTION SYSTEM LOADER'
          strings h3531-boot-screen | grep -F 'HARDWARE COMPATIBILITY PREINIT'
          strings h3531-boot-screen | grep -F 'INITIALIZING VIDEO HARDWARE'
          strings h3531-boot-screen | grep -F 'HARDWARE INITIALIZED'

      - name: Validate boot supervisor and desktop core
        run: |
          set -eux
          busybox sh -n ports/stage67/STAGE67-BOOT.APP
          busybox sh -n ports/stage66a/h3531-lxde-core.sh

          grep -F 'Stage6.7.2 compatibility boot' ports/stage67/STAGE67-BOOT.APP
          grep -F 'menu 7000' ports/stage67/STAGE67-BOOT.APP
          grep -F 'warmup 3500' ports/stage67/STAGE67-BOOT.APP
          grep -F 'kill -STOP "$MONPID"' ports/stage67/STAGE67-BOOT.APP
          grep -F 'BEFORE MONITOR PREINIT' ports/stage67/STAGE67-BOOT.APP
          grep -F 'AFTER MONITOR PREINIT' ports/stage67/STAGE67-BOOT.APP
          grep -F 'Starting desktop after hidden Monitor compatibility pre-init' ports/stage67/STAGE67-BOOT.APP
          grep -F 'XINPUT_RECOVERY_PENDING=0' ports/stage66a/h3531-lxde-core.sh
          ! grep -F 'XINPUT_RECOVERY_COUNT=0' ports/stage66a/h3531-lxde-core.sh

      - name: Assemble Stage6.7.2 patch
        run: |
          set -eux
          ROOT=out/H3531
          X="$ROOT/APPS/x11-debian"
          mkdir -p "$X/bin" "$X/libexec" "$ROOT/SYSTEM/docs"

          cp h3531-boot-screen "$X/bin/h3531-boot-screen"
          cp ports/stage66a/h3531-lxde-core.sh "$X/bin/h3531-lxde-core"
          cp ports/stage66a/h3531-lxde-core.sh "$X/libexec/h3531-lxde-core"
          cp ports/stage67/STAGE67-BOOT.APP "$ROOT/SYSTEM/STAGE67-BOOT.APP"
          cp ports/stage67/STAGE67-BOOT.APP "$ROOT/SYSTEM/MONITOR.APP"

          chmod 755             "$X/bin/h3531-boot-screen"             "$X/bin/h3531-lxde-core"             "$X/libexec/h3531-lxde-core"             "$ROOT/SYSTEM/STAGE67-BOOT.APP"             "$ROOT/SYSTEM/MONITOR.APP"

          cat >"$ROOT/SYSTEM/docs/README_STAGE6_7_2_BOOT_MANAGER.txt" <<'EOF'
          Stayplaytion Stage6.7.2 Compatibility Boot

          User-visible flow:
          - 7 second POST/F2 rescue screen;
          - compatibility pre-init is masked by the Stayplaytion boot screen;
          - original Monitor runs for about 3.5 seconds behind that screen;
          - Monitor is STOPped before X/Desktop receives framebuffer and input;
          - Desktop then starts using the proven HDMI/HIFB/input initialization;
          - stopped Monitor remains only as a rescue layer.

          Diagnostic:
          /var/h3531-boot-manager.log contains HIFB state before and after
          Monitor compatibility pre-init. This will be used to remove the final
          Monitor dependency in a later native initializer.

          Also includes the corrected D5 input recovery latch reset.
          EOF

          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum               > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_7_2.txt
          )

      - name: Create ZIP
        run: |
          set -eux
          cd out
          zip -qr ../H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH.zip             | tee H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH.zip.sha256
          unzip -t H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH
          path: |
            H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH.zip
            H3531-Stage6.7.2-Stayplaytion-CompatibilityBoot-PATCH.zip.sha256
          retention-days: 14
