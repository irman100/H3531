name: H3531 RetroArch Dynamic FCEUmm Stage3 v3

on:
  push:
    branches:
      - feature/retroarch-h3531-dynamic-fceumm
    paths:
      - '.github/workflows/h3531-retroarch-dynamic-fceumm-build-v3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch and FCEUmm
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          cd /tmp/retroarch
          git checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git rev-parse HEAD)" = "48cbdb2e78ea6c92ade103941c4958ea312a5995"

          git clone https://github.com/libretro/libretro-fceumm.git /tmp/fceumm
          cd /tmp/fceumm
          git checkout 236ccdfc911e84c60fea6b9d0699c2d440a8de14
          test "$(git rev-parse HEAD)" = "236ccdfc911e84c60fea6b9d0699c2d440a8de14"

      - name: Build external ARM soft-float FCEUmm shared core
        working-directory: /tmp/fceumm
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc
          export CXX=arm-linux-musleabi-g++
          export AR=arm-linux-musleabi-ar
          export RANLIB=arm-linux-musleabi-ranlib
          export STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O2 -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"

          make -f Makefile.libretro -j2 \
            platform=unix \
            STATIC_LINKING=0 \
            HAVE_HDPACK=0 \
            WANT_32BPP=0

          test -s fceumm_libretro.so
          file fceumm_libretro.so
          arm-linux-musleabi-readelf -h fceumm_libretro.so
          arm-linux-musleabi-readelf -A fceumm_libretro.so || true
          arm-linux-musleabi-readelf -d fceumm_libretro.so || true
          arm-linux-musleabi-nm -D --defined-only fceumm_libretro.so \
            | grep -E ' retro_(init|run|get_system_info)$'

      - name: Install H3531 framebuffer and evdev adapters
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' \
            /tmp/retroarch/gfx/drivers/fpga_gfx.c
          grep -F '"h3531"' /tmp/retroarch/gfx/drivers/fpga_gfx.c
          grep -F '"h3531evdev"' /tmp/retroarch/input/drivers/linuxraw_input.c

      - name: Configure dynamic-core H3531 RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc
          export CXX=arm-linux-musleabi-g++
          export AR=arm-linux-musleabi-ar
          export RANLIB=arm-linux-musleabi-ranlib
          export STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O2 -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'

          ./configure --host=arm-linux-musleabi \
            --enable-dynamic \
            --disable-qt \
            --disable-x11 \
            --disable-wayland \
            --disable-opengl \
            --disable-opengl_core \
            --disable-opengl1 \
            --disable-opengles \
            --disable-vulkan \
            --disable-kms \
            --disable-sdl \
            --disable-sdl2 \
            --disable-udev \
            --disable-alsa \
            --disable-pulse \
            --disable-oss \
            --disable-ffmpeg \
            --disable-freetype \
            --disable-cheevos \
            --disable-networking \
            --disable-netplaydiscovery \
            --disable-online_updater \
            --disable-discord

          grep -Eq '^HAVE_DYNAMIC[[:space:]]*=[[:space:]]*1' config.mk

      - name: Cross-build dynamic RetroArch frontend
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 \
            OS='Linux FPGA' \
            HAVE_RGUI=1 \
            HAVE_XMB=0 \
            HAVE_OZONE=0 \
            HAVE_MATERIALUI=0

      - name: Inspect dynamic ARM frontend
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          file retroarch
          arm-linux-musleabi-readelf -h retroarch
          arm-linux-musleabi-readelf -A retroarch || true
          arm-linux-musleabi-readelf -l retroarch | tee /tmp/retroarch-program-headers.txt
          arm-linux-musleabi-readelf -d retroarch | tee /tmp/retroarch-dynamic.txt
          grep -F '/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1' \
            /tmp/retroarch-program-headers.txt
          grep -q 'NEEDED' /tmp/retroarch-dynamic.txt
          strings retroarch | grep -F '[H3531] framebuffer ready:'
          strings retroarch | grep -F '[H3531] RetroArch evdev input initialized'

      - name: Package frontend core and musl runtime
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          ROOT=out/H3531/APPS/retroarch
          mkdir -p "$ROOT/cores" "$ROOT/info" "$ROOT/runtime"

          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o "$ROOT/RETROARCH.BIN"
          arm-linux-musleabi-strip /tmp/fceumm/fceumm_libretro.so -o "$ROOT/cores/fceumm_libretro.so"

          arm-linux-musleabi-gcc \
            -O2 -fno-pie -march=armv7-a -mfloat-abi=soft \
            -static -no-pie \
            ports/retroarch/h3531-retroarch-dynamic-launcher.c \
            -o "$ROOT/RETROARCH.APP"
          arm-linux-musleabi-strip "$ROOT/RETROARCH.APP"

          cp ports/retroarch/retroarch-h3531-dynamic-fceumm.cfg "$ROOT/retroarch.cfg"
          cp ports/retroarch/fceumm_libretro.info "$ROOT/info/fceumm_libretro.info"

          echo '=== musl runtime candidates ==='
          find "$TOOLCHAIN" \( -name 'ld-musl-arm*.so*' -o -path '*/lib/libc.so' \) -ls || true

          LOADER="$(find "$TOOLCHAIN" -name 'ld-musl-arm.so.1' -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"

          if [ -n "$LOADER" ]; then
            echo "loader candidate: $LOADER"
            ls -l "$LOADER" || true
            readlink "$LOADER" || true
            file -L "$LOADER" || true
          fi
          if [ -n "$LIBC" ]; then
            echo "libc candidate: $LIBC"
            ls -l "$LIBC" || true
            file -L "$LIBC" || true
          fi

          RUNTIME_ELF=''
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then
            RUNTIME_ELF="$LOADER"
          elif [ -n "$LIBC" ] && [ -e "$LIBC" ] && file -L "$LIBC" | grep -q ELF; then
            # musl libc and the dynamic loader are the same ELF image.  Some
            # cross toolchains ship ld-musl-arm.so.1 as an absolute/dangling
            # symlink, so copying the real libc ELF is the robust package form.
            RUNTIME_ELF="$LIBC"
          else
            echo 'ERROR: no usable ARM musl loader/libc ELF found in cross toolchain'
            find "$TOOLCHAIN" -maxdepth 5 -type f -o -type l | sort | grep -E 'musl|libc\.so|ld-' || true
            exit 1
          fi

          echo "using musl runtime ELF: $RUNTIME_ELF"
          cp -L "$RUNTIME_ELF" "$ROOT/runtime/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$ROOT/runtime/libc.so"

          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do
            SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"
            if [ -n "$SRC" ] && [ -e "$SRC" ]; then
              cp -L "$SRC" "$ROOT/runtime/$lib"
            fi
          done

          file "$ROOT/RETROARCH.APP" "$ROOT/RETROARCH.BIN" \
               "$ROOT/cores/fceumm_libretro.so" \
               "$ROOT/runtime/ld-musl-arm.so.1" \
               "$ROOT/runtime/libc.so"
          arm-linux-musleabi-readelf -h "$ROOT/runtime/ld-musl-arm.so.1"
          arm-linux-musleabi-readelf -d "$ROOT/RETROARCH.BIN" | grep NEEDED || true
          arm-linux-musleabi-readelf -d "$ROOT/cores/fceumm_libretro.so" | grep NEEDED || true
          grep -F 'menu_show_load_core = "true"' "$ROOT/retroarch.cfg"
          grep -F 'libretro_directory = "/mnt/usb/H3531/APPS/retroarch/cores"' "$ROOT/retroarch.cfg"
          grep -F 'supported_extensions = "fds|nes|unif|unf"' "$ROOT/info/fceumm_libretro.info"

      - name: QEMU smoke-test bundled musl frontend
        run: |
          set -eux
          ROOT=out/H3531/APPS/retroarch
          RUNTIME="$(pwd)/$ROOT/runtime"
          FRONTEND="$(pwd)/$ROOT/RETROARCH.BIN"

          env LD_LIBRARY_PATH="$RUNTIME" \
            qemu-arm "$ROOT/runtime/ld-musl-arm.so.1" \
            --library-path "$RUNTIME" \
            "$FRONTEND" --version \
            | tee out/RETROARCH-QEMU-VERSION.txt

          test -s out/RETROARCH-QEMU-VERSION.txt

      - name: QEMU dlopen smoke-test external FCEUmm
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          ROOT=out/H3531/APPS/retroarch
          RUNTIME="$(pwd)/$ROOT/runtime"
          CORE="$(pwd)/$ROOT/cores/fceumm_libretro.so"

          cat > /tmp/dlopen-fceumm.c <<'EOF'
          #include <dlfcn.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>

          struct retro_system_info {
             const char *library_name;
             const char *library_version;
             const char *valid_extensions;
             bool need_fullpath;
             bool block_extract;
          };

          typedef void (*retro_get_system_info_t)(struct retro_system_info *info);

          int main(int argc, char **argv)
          {
             void *handle;
             retro_get_system_info_t get_info;
             struct retro_system_info info;

             if (argc != 2) return 2;
             handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
             if (!handle) {
                fprintf(stderr, "dlopen failed: %s\n", dlerror());
                return 3;
             }
             get_info = (retro_get_system_info_t)dlsym(handle, "retro_get_system_info");
             if (!get_info) {
                fprintf(stderr, "dlsym failed: %s\n", dlerror());
                return 4;
             }
             memset(&info, 0, sizeof(info));
             get_info(&info);
             printf("DYNAMIC_CORE_OK name=%s version=%s extensions=%s\n",
                    info.library_name ? info.library_name : "(null)",
                    info.library_version ? info.library_version : "(null)",
                    info.valid_extensions ? info.valid_extensions : "(null)");
             dlclose(handle);
             return 0;
          }
          EOF

          arm-linux-musleabi-gcc \
            -O2 -march=armv7-a -mfloat-abi=soft \
            /tmp/dlopen-fceumm.c -ldl -o /tmp/dlopen-fceumm

          env LD_LIBRARY_PATH="$RUNTIME" \
            qemu-arm "$ROOT/runtime/ld-musl-arm.so.1" \
            --library-path "$RUNTIME" \
            /tmp/dlopen-fceumm "$CORE" \
            | tee out/DYNAMIC-CORE-SMOKE.txt

          grep -F 'DYNAMIC_CORE_OK name=FCEUmm' out/DYNAMIC-CORE-SMOKE.txt
          grep -E 'extensions=.*nes' out/DYNAMIC-CORE-SMOKE.txt

      - name: Final package checks and manifest
        run: |
          set -eux
          ROOT=out/H3531/APPS/retroarch

          file "$ROOT/RETROARCH.APP" | tee out/FILE-LAUNCHER.txt
          file "$ROOT/RETROARCH.BIN" | tee out/FILE-FRONTEND.txt
          file "$ROOT/cores/fceumm_libretro.so" | tee out/FILE-FCEUMM-CORE.txt

          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256.txt
          printf '%s\n' 48cbdb2e78ea6c92ade103941c4958ea312a5995 > out/RETROARCH-UPSTREAM-SHA.txt
          printf '%s\n' 236ccdfc911e84c60fea6b9d0699c2d440a8de14 > out/FCEUMM-UPSTREAM-SHA.txt

          cat > out/README.txt <<'EOF'
          H3531 RetroArch Stage 3 - modular dynamic FCEUmm core proof

          STATUS
          ------
          CI/STATIC VERIFIED only. Real H3531 gameplay remains PHYSICALLY
          UNPROVEN until the board test.

          PACKAGE
          -------
          H3531/APPS/retroarch/RETROARCH.APP
          H3531/APPS/retroarch/RETROARCH.BIN
          H3531/APPS/retroarch/retroarch.cfg
          H3531/APPS/retroarch/runtime/ld-musl-arm.so.1
          H3531/APPS/retroarch/runtime/libc.so
          H3531/APPS/retroarch/cores/fceumm_libretro.so
          H3531/APPS/retroarch/info/fceumm_libretro.info

          INSTALL
          -------
          Replace the previous /H3531/APPS/retroarch/ directory on the FAT32
          USB stick with the directory from this archive. Do not flash SPI NOR
          and do not use saveenv.

          TEST
          ----
          RETROARCH.APP -> Load Core -> FCEUmm -> Load Content -> .nes ROM.
          Audio is intentionally disabled for this modular-core proof.
          EOF

      - name: Upload H3531 RetroArch Dynamic FCEUmm Stage3
        uses: actions/upload-artifact@v4
        with:
          name: H3531-RetroArch-Dynamic-FCEUmm-Stage3-v3
          path: out/
          if-no-files-found: error
          retention-days: 14
