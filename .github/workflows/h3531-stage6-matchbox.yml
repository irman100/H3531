name: H3531 Stage6.1 Matchbox From Proven Xfbdev

on:
  push:
    branches:
      - feature/h3531-stage6-matchbox
    paths:
      - 'ports/x11/START-X11-DEBIAN-STAGE6.sh'
      - 'ports/x11/START-X11-MATCHBOX-STAGE6.sh'
      - 'ports/x11/README_STAGE6_1.md'
      - '.github/workflows/h3531-stage6-matchbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download hardware-proven Stage6.0E artifact
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35367465062

      - name: Extract and verify proven Stage6.0E runtime
        run: |
          set -eux
          ls -la base-artifact
          BASEZIP=base-artifact/H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip
          test -f "$BASEZIP"
          mkdir -p stage61
          unzip -q "$BASEZIP" -d stage61
          test -x stage61/H3531/APPS/x11-debian/bin/Xfbdev
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  stage61/H3531/APPS/x11-debian/bin/Xfbdev" | sha256sum -c -

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy armel Matchbox payload
        run: |
          set -eux
          sudo debootstrap \
            --foreign \
            --arch=armel \
            --variant=minbase \
            --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian

          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            matchbox-window-manager x11-utils

          echo '=== MATCHBOX VERSION ==='
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W \
            -f='matchbox-window-manager ${Version}\n' matchbox-window-manager
          echo '=== MATCHBOX FILES ==='
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg -L matchbox-window-manager

      - name: Add Matchbox without changing proven Xfbdev runtime
        run: |
          set -eux
          OUT="$PWD/stage61/H3531/APPS/x11-debian"
          DOC="$PWD/stage61/H3531/SYSTEM/docs"

          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/themes" "$OUT/share/matchbox" \
                   "$OUT/etc/matchbox" "$DOC"

          # Add only the new Stage6.1 applications.
          cp rootfs/usr/bin/matchbox-window-manager "$OUT/bin/"
          cp rootfs/usr/bin/xmessage "$OUT/bin/"
          [ ! -x rootfs/usr/bin/matchbox-remote ] || cp rootfs/usr/bin/matchbox-remote "$OUT/bin/"

          # Preserve every library already present in the hardware-proven 0E runtime.
          # Add only SONAME/files that are absent and are required by Matchbox/xmessage.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                if [ ! -e "$dst" ]; then
                  cp -L "$f" "$dst"
                fi
              done
          done

          if [ -d rootfs/usr/share/themes ]; then
            cp -aL rootfs/usr/share/themes/. "$OUT/share/themes/"
          fi
          if [ -d rootfs/usr/share/matchbox ]; then
            cp -aL rootfs/usr/share/matchbox/. "$OUT/share/matchbox/"
          fi
          if [ -d rootfs/etc/matchbox ]; then
            cp -aL rootfs/etc/matchbox/. "$OUT/etc/matchbox/"
          fi

          # Matchbox's compile-time DATADIR is /usr/share. The vendor rootfs is
          # read-only, so redirect it length-preservingly to writable /var/share.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stage61/H3531/APPS/x11-debian/bin/matchbox-window-manager")
          data = p.read_bytes()
          old = b"/usr/share"
          new = b"/var/share"
          n = data.count(old)
          print("Matchbox /usr/share occurrences:", n)
          if n < 1:
              raise SystemExit("Expected Matchbox DATADIR /usr/share was not found")
          p.write_bytes(data.replace(old, new))
          PY

          # Replace the older proof launcher contained in the proven artifact
          # with current branch launchers. Xfbdev itself remains byte-identical.
          cp ports/x11/START-X11-DEBIAN-STAGE6.sh "$OUT/"
          cp ports/x11/START-X11-MATCHBOX-STAGE6.sh "$OUT/"
          chmod +x "$OUT/START-X11-DEBIAN-STAGE6.sh" \
                   "$OUT/START-X11-MATCHBOX-STAGE6.sh" \
                   "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage"

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.1
          Base runtime: hardware-proven Stage6.0E artifact from run 35367465062
          Proven Xfbdev SHA256:
            0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482
          Xfbdev: Debian Wheezy armel 1.12.4, KDrive mouse+evdev
          Matchbox Window Manager: Debian Wheezy package
          ABI: armel / EABI soft-float
          Stage6.0E: framebuffer/input/XKB/xev hardware proven on Hi3531
          Stage6.1: Matchbox hardware proof pending
          EOF

          cat > "$DOC/README_STAGE6_1_MATCHBOX.txt" <<'EOF'
          H3531 Stage6.1 - Xfbdev + Matchbox Window Manager
          =================================================
          This package deliberately reuses the exact Xfbdev binary from the
          hardware-proven Stage6.0E artifact (run 35367465062).

          Stage6.0E hardware proof confirmed:
            framebuffer
            Xfbdev
            KDrive evdev
            mouse movement and buttons
            keyboard
            XKB
            xev X11 client

          Stage6.1 adds:
            Matchbox Window Manager
            xmessage as a visible managed X11 client

          Safety:
            no saveenv
            no SPI writes
            STOP resident MONITOR.APP before the test
            CONT resident MONITOR.APP after the test
          EOF

      - name: ABI and recursive runtime audit
        run: |
          set -eux
          OUT=stage61/H3531/APPS/x11-debian

          # The proven server must stay byte-identical.
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          file "$OUT/bin/Xfbdev" "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage"

          for b in "$OUT/bin/Xfbdev" "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage"; do
            readelf -h "$b"
            readelf -A "$b" || true
            if readelf -A "$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          out = Path("stage61/H3531/APPS/x11-debian")
          lib = out / "lib"
          available = {p.name for p in lib.iterdir() if p.is_file()}

          candidates = list((out / "bin").iterdir()) + list(lib.iterdir())
          checked = 0
          for obj in candidates:
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(
                      ["readelf", "-h", str(obj)],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(
                      ["readelf", "-d", str(obj)],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [name for name in needed if name not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("ELF dependency audit objects:", checked)
          PY

          test -f "$OUT/share/themes/Default/matchbox/theme.xml"
          test -f "$OUT/etc/matchbox/kbdconfig"

          echo '=== MATCHBOX RELOCATED DATA PATH ==='
          strings "$OUT/bin/matchbox-window-manager" | grep '/var/share'
          if strings "$OUT/bin/matchbox-window-manager" | grep -q '/usr/share'; then
            echo "ERROR: Matchbox still contains /usr/share"
            exit 1
          fi

          find stage61/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage61/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_1.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage61
          zip -qr ../H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy.zip \
            | tee H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy
          path: |
            H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy.zip
            H3531-Stage6.1-Debian-Xfbdev-Matchbox-ReadyToCopy.zip.sha256
          if-no-files-found: error
