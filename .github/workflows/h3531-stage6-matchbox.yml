name: H3531 Stage6.1G Matchbox Pango From Proven Xfbdev

on:
  push:
    branches:
      - feature/h3531-stage6-matchbox
    paths:
      - 'ports/x11/START-X11-DEBIAN-STAGE6.sh'
      - 'ports/x11/START-X11-MATCHBOX-STAGE6.sh'
      - 'ports/x11/README_STAGE6_1.md'
      - '.github/workflows/h3531-stage6-matchbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download hardware-proven Stage6.0E artifact
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35367465062

      - name: Extract and verify proven Stage6.0E runtime
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip
          test -f "$BASEZIP"
          mkdir -p stage61
          unzip -q "$BASEZIP" -d stage61
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  stage61/H3531/APPS/x11-debian/bin/Xfbdev" | sha256sum -c -

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy Matchbox Pango payload
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF
          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            matchbox-window-manager x11-utils x11-xserver-utils fontconfig ttf-dejavu-core

          echo '=== PANGO MODULE TREE ==='
          find rootfs/usr/lib/arm-linux-gnueabi/pango -maxdepth 4 -type f -print | sort

      - name: Add Matchbox Pango font and contrast runtime
        run: |
          set -eux
          OUT="$PWD/stage61/H3531/APPS/x11-debian"
          DOC="$PWD/stage61/H3531/SYSTEM/docs"
          RUNTIME_BASE=/mnt/usb/H3531/APPS/x11-debian

          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/themes" "$OUT/share/matchbox" \
                   "$OUT/share/fonts/truetype/dejavu" "$OUT/etc/matchbox" "$OUT/etc/pango" "$DOC"

          cp rootfs/usr/bin/matchbox-window-manager "$OUT/bin/"
          cp rootfs/usr/bin/xmessage "$OUT/bin/"
          cp rootfs/usr/bin/fc-match "$OUT/bin/"
          cp rootfs/usr/bin/xsetroot "$OUT/bin/"
          [ ! -x rootfs/usr/bin/matchbox-remote ] || cp rootfs/usr/bin/matchbox-remote "$OUT/bin/"

          # Preserve the proven 0E libraries. Add only files absent from that runtime.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                [ -e "$dst" ] || cp -L "$f" "$dst"
              done
          done

          [ ! -d rootfs/usr/share/themes ] || cp -aL rootfs/usr/share/themes/. "$OUT/share/themes/"
          [ ! -d rootfs/usr/share/matchbox ] || cp -aL rootfs/usr/share/matchbox/. "$OUT/share/matchbox/"
          [ ! -d rootfs/etc/matchbox ] || cp -aL rootfs/etc/matchbox/. "$OUT/etc/matchbox/"

          FONT_SRC="$(find rootfs/usr/share/fonts/truetype -type f -name 'DejaVuSans.ttf' -printf '%h\n' | head -1)"
          test -n "$FONT_SRC"
          cp -L "$FONT_SRC/DejaVuSans.ttf" "$OUT/share/fonts/truetype/dejavu/"
          cp -L "$FONT_SRC/DejaVuSans-Bold.ttf" "$OUT/share/fonts/truetype/dejavu/"

          # Wheezy Pango keeps loadable engines under .../pango/<version>/modules.
          PANGO_ROOT=rootfs/usr/lib/arm-linux-gnueabi/pango
          PANGO_VERSION="$(find "$PANGO_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)"
          test -n "$PANGO_VERSION"
          PANGO_BASIC="$PANGO_ROOT/$PANGO_VERSION/modules/pango-basic-fc.so"
          PANGO_REGISTRY="$PANGO_ROOT/$PANGO_VERSION/module-files.d/libpango1.0-0.modules"
          test -f "$PANGO_BASIC"
          test -f "$PANGO_REGISTRY"

          mkdir -p "$OUT/lib/pango/$PANGO_VERSION/modules"
          cp -L "$PANGO_BASIC" "$OUT/lib/pango/$PANGO_VERSION/modules/"
          printf '%s\n' "$PANGO_VERSION" > "$OUT/etc/pango/module-version"

          sed "s#/usr/lib/arm-linux-gnueabi/pango/$PANGO_VERSION/modules#$RUNTIME_BASE/lib/pango/$PANGO_VERSION/modules#g" \
            "$PANGO_REGISTRY" > "$OUT/etc/pango/pango.modules"

          grep -q "$RUNTIME_BASE/lib/pango/$PANGO_VERSION/modules/pango-basic-fc.so" \
            "$OUT/etc/pango/pango.modules"

          # Matchbox DATADIR /usr/share is read-only on the target; redirect to /var/share.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stage61/H3531/APPS/x11-debian/bin/matchbox-window-manager")
          data = p.read_bytes()
          old, new = b"/usr/share", b"/var/share"
          n = data.count(old)
          print("Matchbox /usr/share occurrences:", n)
          if n < 1:
              raise SystemExit("Expected Matchbox DATADIR /usr/share was not found")
          p.write_bytes(data.replace(old, new))
          PY

          cp ports/x11/START-X11-DEBIAN-STAGE6.sh "$OUT/"
          cp ports/x11/START-X11-MATCHBOX-STAGE6.sh "$OUT/"
          chmod +x "$OUT/START-X11-DEBIAN-STAGE6.sh" "$OUT/START-X11-MATCHBOX-STAGE6.sh" \
                   "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage" "$OUT/bin/fc-match" "$OUT/bin/xsetroot"

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.1G
          Base: hardware-proven Stage6.0E Xfbdev
          Xfbdev SHA256: 0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482
          Matchbox: Debian Wheezy 1.2-osso21-1+b1
          Text: fontconfig + DejaVu Sans + Wheezy pango-basic-fc.so on USB
          Cursor contrast test: xsetroot light neutral gray
          ABI: armel / EABI soft-float
          EOF

          cat > "$DOC/README_STAGE6_1G_PANGO.txt" <<'EOF'
          Stage6.1G fixes the Stage6.1F hardware finding:
            Pango-CRITICAL: No modules found
            PangoFc will not work correctly.

          The package adds Wheezy's official pango-basic-fc.so plus its module
          registry, uses PANGO_RC_FILE in writable /var, and keeps the exact
          hardware-proven Xfbdev. A light gray root background is used only
          for visibility testing of the already-proven black X cursor.

          No saveenv. No SPI writes.
          EOF

      - name: ABI recursive audit and runtime proofs
        run: |
          set -eux
          OUT="$PWD/stage61/H3531/APPS/x11-debian"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          for b in "$OUT/bin/Xfbdev" "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage" "$OUT/bin/fc-match" "$OUT/bin/xsetroot"; do
            file "$b"
            readelf -A "$b" || true
            if readelf -A "$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          out = Path("stage61/H3531/APPS/x11-debian")
          lib = out / "lib"
          available = {p.name for p in lib.iterdir() if p.is_file()}
          checked = 0
          for obj in out.rglob("*"):
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(["readelf", "-h", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(["readelf", "-d", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [n for n in needed if n not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("Recursive ELF dependency audit objects:", checked)
          PY

          PANGO_VERSION="$(cat "$OUT/etc/pango/module-version")"
          test -f "$OUT/lib/pango/$PANGO_VERSION/modules/pango-basic-fc.so"
          grep -q "/mnt/usb/H3531/APPS/x11-debian/lib/pango/$PANGO_VERSION/modules/pango-basic-fc.so" \
            "$OUT/etc/pango/pango.modules"
          grep -q 'PangoRenderFc' "$OUT/etc/pango/pango.modules"

          cat >/tmp/h3531-fonts-ci.conf <<EOF
          <?xml version="1.0"?>
          <fontconfig>
            <dir>$OUT/share/fonts/truetype/dejavu</dir>
            <cachedir>/tmp/h3531-font-cache</cachedir>
            <alias><family>Sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
            <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
          </fontconfig>
          EOF
          mkdir -p /tmp/h3531-font-cache
          FONTCONFIG_FILE=/tmp/h3531-fonts-ci.conf FONTCONFIG_PATH=/tmp \
            qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$OUT/lib" \
            "$OUT/bin/fc-match" "Sans:bold" | tee /tmp/h3531-fc-match.out
          grep -q 'DejaVuSans-Bold.ttf' /tmp/h3531-fc-match.out

          find stage61/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage61/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_1G.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage61
          zip -qr ../H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip \
            | tee H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy
          path: |
            H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip
            H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip.sha256
          if-no-files-found: error
