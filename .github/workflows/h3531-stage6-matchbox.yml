name: H3531 Stage6.1F Matchbox Fontconfig From Proven Xfbdev

on:
  push:
    branches:
      - feature/h3531-stage6-matchbox
    paths:
      - 'ports/x11/START-X11-DEBIAN-STAGE6.sh'
      - 'ports/x11/START-X11-MATCHBOX-STAGE6.sh'
      - 'ports/x11/README_STAGE6_1.md'
      - '.github/workflows/h3531-stage6-matchbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download hardware-proven Stage6.0E artifact
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35367465062

      - name: Extract and verify proven Stage6.0E runtime
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip
          test -f "$BASEZIP"
          mkdir -p stage61
          unzip -q "$BASEZIP" -d stage61
          test -x stage61/H3531/APPS/x11-debian/bin/Xfbdev
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  stage61/H3531/APPS/x11-debian/bin/Xfbdev" | sha256sum -c -

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy armel Matchbox and font payload
        run: |
          set -eux
          sudo debootstrap \
            --foreign \
            --arch=armel \
            --variant=minbase \
            --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian

          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            matchbox-window-manager x11-utils fontconfig ttf-dejavu-core

          echo '=== MATCHBOX VERSION ==='
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W \
            -f='matchbox-window-manager ${Version}\n' matchbox-window-manager
          echo '=== FONTCONFIG VERSION ==='
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W \
            -f='fontconfig ${Version}\n' fontconfig
          echo '=== DEJAVU FONT FILES ==='
          find rootfs/usr/share/fonts/truetype -type f -name 'DejaVuSans*.ttf' -print | sort

      - name: Add Matchbox and self-contained font stack
        run: |
          set -eux
          OUT="$PWD/stage61/H3531/APPS/x11-debian"
          DOC="$PWD/stage61/H3531/SYSTEM/docs"

          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/themes" "$OUT/share/matchbox" \
                   "$OUT/share/fonts/truetype/dejavu" "$OUT/etc/matchbox" "$DOC"

          cp rootfs/usr/bin/matchbox-window-manager "$OUT/bin/"
          cp rootfs/usr/bin/xmessage "$OUT/bin/"
          cp rootfs/usr/bin/fc-match "$OUT/bin/"
          [ ! -x rootfs/usr/bin/matchbox-remote ] || cp rootfs/usr/bin/matchbox-remote "$OUT/bin/"

          # Preserve all proven Stage6.0E runtime files; only add absent libraries.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                if [ ! -e "$dst" ]; then
                  cp -L "$f" "$dst"
                fi
              done
          done

          if [ -d rootfs/usr/share/themes ]; then
            cp -aL rootfs/usr/share/themes/. "$OUT/share/themes/"
          fi
          if [ -d rootfs/usr/share/matchbox ]; then
            cp -aL rootfs/usr/share/matchbox/. "$OUT/share/matchbox/"
          fi
          if [ -d rootfs/etc/matchbox ]; then
            cp -aL rootfs/etc/matchbox/. "$OUT/etc/matchbox/"
          fi
          FONT_SRC="$(find rootfs/usr/share/fonts/truetype -type f -name 'DejaVuSans.ttf' -printf '%h\n' | head -1)"
          test -n "$FONT_SRC"
          cp -L "$FONT_SRC/DejaVuSans.ttf" "$OUT/share/fonts/truetype/dejavu/"
          cp -L "$FONT_SRC/DejaVuSans-Bold.ttf" "$OUT/share/fonts/truetype/dejavu/"

          # Matchbox compile-time DATADIR /usr/share is unusable on read-only rootfs.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stage61/H3531/APPS/x11-debian/bin/matchbox-window-manager")
          data = p.read_bytes()
          old = b"/usr/share"
          new = b"/var/share"
          n = data.count(old)
          print("Matchbox /usr/share occurrences:", n)
          if n < 1:
              raise SystemExit("Expected Matchbox DATADIR /usr/share was not found")
          p.write_bytes(data.replace(old, new))
          PY

          cp ports/x11/START-X11-DEBIAN-STAGE6.sh "$OUT/"
          cp ports/x11/START-X11-MATCHBOX-STAGE6.sh "$OUT/"
          chmod +x "$OUT/START-X11-DEBIAN-STAGE6.sh" \
                   "$OUT/START-X11-MATCHBOX-STAGE6.sh" \
                   "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage" "$OUT/bin/fc-match"

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.1F
          Base runtime: hardware-proven Stage6.0E artifact from run 35367465062
          Proven Xfbdev SHA256:
            0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482
          Xfbdev: Debian Wheezy armel 1.12.4, KDrive mouse+evdev
          Matchbox Window Manager: Debian Wheezy 1.2-osso21-1+b1
          Font stack: Wheezy fontconfig + DejaVu Sans on USB
          ABI: armel / EABI soft-float
          Stage6.0E: framebuffer/input/XKB/xev hardware proven on Hi3531
          Stage6.1F: Matchbox/fontconfig hardware proof pending
          EOF

          cat > "$DOC/README_STAGE6_1F_MATCHBOX_FONTCONFIG.txt" <<'EOF'
          H3531 Stage6.1F - Xfbdev + Matchbox + self-contained fontconfig
          =================================================================
          Hardware test of Stage6.1 showed Matchbox reached theme parsing but
          fontconfig had no default configuration on the vendor rootfs:
            Fontconfig error: Cannot load default config file
            Incorrect Params in <font id='titlefont' def='Sans bold 16px'/>

          Stage6.1F keeps the exact hardware-proven Xfbdev and adds:
            Matchbox Window Manager
            xmessage
            fc-match
            DejaVu Sans / DejaVu Sans Bold
            launcher-generated /var fontconfig configuration

          No saveenv. No SPI writes.
          EOF

      - name: ABI recursive audit and fontconfig emulation proof
        run: |
          set -eux
          OUT="$PWD/stage61/H3531/APPS/x11-debian"

          # Proven Xfbdev must remain byte-identical.
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          file "$OUT/bin/Xfbdev" "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage" "$OUT/bin/fc-match"

          for b in "$OUT/bin/Xfbdev" "$OUT/bin/matchbox-window-manager" "$OUT/bin/xmessage" "$OUT/bin/fc-match"; do
            readelf -h "$b"
            readelf -A "$b" || true
            if readelf -A "$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          out = Path("stage61/H3531/APPS/x11-debian")
          lib = out / "lib"
          available = {p.name for p in lib.iterdir() if p.is_file()}

          candidates = list((out / "bin").iterdir()) + list(lib.iterdir())
          checked = 0
          for obj in candidates:
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(["readelf", "-h", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(["readelf", "-d", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [name for name in needed if name not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("ELF dependency audit objects:", checked)
          PY

          test -f "$OUT/share/themes/Default/matchbox/theme.xml"
          test -f "$OUT/etc/matchbox/kbdconfig"
          test -f "$OUT/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          test -f "$OUT/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          echo '=== MATCHBOX RELOCATED DATA PATH ==='
          strings "$OUT/bin/matchbox-window-manager" | grep '/var/share'
          if strings "$OUT/bin/matchbox-window-manager" | grep -q '/usr/share'; then
            echo "ERROR: Matchbox still contains /usr/share"
            exit 1
          fi

          # Prove old Wheezy fontconfig can resolve Sans:bold using only packaged fonts.
          cat >/tmp/h3531-fonts-ci.conf <<EOF
          <?xml version="1.0"?>
          <fontconfig>
            <dir>$OUT/share/fonts/truetype/dejavu</dir>
            <cache>/tmp/h3531-fonts.cache-2</cache>
            <alias>
              <family>Sans</family>
              <prefer><family>DejaVu Sans</family></prefer>
            </alias>
            <alias>
              <family>sans-serif</family>
              <prefer><family>DejaVu Sans</family></prefer>
            </alias>
          </fontconfig>
          EOF

          FONTCONFIG_FILE=/tmp/h3531-fonts-ci.conf FONTCONFIG_PATH=/tmp \
            qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$OUT/lib" \
            "$OUT/bin/fc-match" "Sans:bold" | tee /tmp/h3531-fc-match.out

          grep -q 'DejaVuSans-Bold.ttf' /tmp/h3531-fc-match.out

          find stage61/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage61/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_1F.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage61
          zip -qr ../H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy.zip \
            | tee H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy
          path: |
            H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy.zip
            H3531-Stage6.1F-Debian-Xfbdev-Matchbox-Fontconfig-ReadyToCopy.zip.sha256
          if-no-files-found: error
