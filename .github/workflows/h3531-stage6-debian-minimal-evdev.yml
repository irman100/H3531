name: H3531 Stage6 Debian Minimal Xfbdev Evdev

on:
  push:
    branches:
      - feature/h3531-stage6-xfbdev-proof
    paths:
      - '.github/workflows/h3531-stage6-debian-minimal-evdev.yml'
      - 'ports/x11/START-X11-DEBIAN-STAGE6.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip xfonts-utils

      - name: Bootstrap Wheezy armel
        run: |
          set -eux
          sudo debootstrap \
            --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb-src [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          deb-src [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF
          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get -o Acquire::Check-Valid-Until=false update
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            build-essential pkg-config autoconf automake libtool \
            x11-utils x11-xkb-utils xfonts-base xkb-data
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --allow-unauthenticated build-dep xorg-server

      - name: Fetch source
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            'cd /build && apt-get -y --allow-unauthenticated source xorg-server=2:1.12.4-6+deb7u8'
          SRC="$(find rootfs/build -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          test -n "$SRC"
          echo "$SRC" > source-dir.txt

      - name: Configure minimal KDrive Xfbdev
        run: |
          set -eux
          SRC_REL="/build/$(basename "$(cat source-dir.txt)")"
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c "
            set -e
            cd '$SRC_REL'
            rm -rf build-h3531
            mkdir build-h3531
            cd build-h3531
            ../configure \
              --build=arm-linux-gnueabi \
              --disable-silent-rules \
              --disable-static \
              --without-dtrace \
              --disable-strict-compilation \
              --disable-debug \
              --disable-unit-tests \
              --disable-builddocs \
              --disable-install-libxf86config \
              --disable-install-setuid \
              --disable-xorg \
              --disable-xquartz \
              --disable-xwin \
              --disable-xfake \
              --disable-xephyr \
              --disable-xnest \
              --disable-xvfb \
              --disable-dmx \
              --disable-glx \
              --disable-dri \
              --disable-dri2 \
              --disable-aiglx \
              --disable-xv \
              --disable-xvmc \
              --disable-config-dbus \
              --disable-config-hal \
              --disable-config-udev \
              --disable-tslib \
              --enable-kdrive \
              --enable-xfbdev \
              --enable-kdrive-mouse \
              --enable-kdrive-evdev \
              --disable-kdrive-kbd \
              --with-sha1=libgcrypt \
              --with-xkb-path=/mnt/usb/H3531/APPS/x11-debian/share/X11/xkb \
              --with-xkb-bin-directory=/var \
              --with-xkb-output=/var/lib/xkb \
              --with-default-font-path=/mnt/usb/H3531/APPS/x11-debian/share/fonts/X11/misc
          "

          CFG="$(cat source-dir.txt)/build-h3531/include/kdrive-config.h"
          cat "$CFG"
          grep -Eq '^#define KDRIVE_EVDEV[[:space:]]+1' "$CFG"
          grep -Eq '^#define KDRIVE_MOUSE[[:space:]]+1' "$CFG"

      - name: Build minimal Xfbdev
        run: |
          set -eux
          SRC_REL="/build/$(basename "$(cat source-dir.txt)")"
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c "
            set -e
            cd '$SRC_REL/build-h3531'
            make -j2
          "
          X="$(cat source-dir.txt)/build-h3531/hw/kdrive/fbdev/Xfbdev"
          test -x "$X"
          file "$X"
          strings "$X" | grep -E '^evdev$|Couldn't find pointer driver|Couldn't find keyboard driver' | head -30 || true

      - name: Assemble isolated runtime
        run: |
          set -eux
          SRC="$(cat source-dir.txt)"
          OUT="$PWD/stage6m/H3531/APPS/x11-debian"
          DOC="$PWD/stage6m/H3531/SYSTEM/docs"
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/fonts/X11" "$OUT/share/X11" "$DOC"

          cp "$SRC/build-h3531/hw/kdrive/fbdev/Xfbdev" "$OUT/bin/"
          cp rootfs/usr/bin/xev "$OUT/bin/"
          cp rootfs/usr/bin/xkbcomp "$OUT/bin/"
          cp -L rootfs/lib/ld-linux.so.3 "$OUT/lib/ld-linux.so.3"

          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                if [ -e "$f" ]; then
                  cp -L "$f" "$OUT/lib/$(basename "$f")"
                fi
              done
          done

          cp -aL rootfs/usr/share/fonts/X11/misc "$OUT/share/fonts/X11/"
          mkfontdir "$OUT/share/fonts/X11/misc"
          cp -aL rootfs/usr/share/X11/xkb "$OUT/share/X11/"

          cp ports/x11/START-X11-DEBIAN-STAGE6.sh "$OUT/"
          chmod +x "$OUT/START-X11-DEBIAN-STAGE6.sh" "$OUT/bin/"* "$OUT/lib/ld-linux.so.3"

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.0M
          Debian Wheezy X.Org 1.12.4 minimal KDrive/Xfbdev build
          KDRIVE_MOUSE=1
          KDRIVE_EVDEV=1
          XKB paths compiled for H3531 USB runtime
          ABI: Debian armel EABI soft-float
          EOF

          cat > "$DOC/README_STAGE6_0M.txt" <<'EOF'
          Stage6.0M: minimal Debian Wheezy Xfbdev build for Hi3531.
          It intentionally omits the full Xorg DDX and desktop stack.
          Goal: hardware proof of KDrive fbdev + evdev before Matchbox.
          No SPI writes. No saveenv.
          EOF

      - name: ABI and runtime audit
        run: |
          set -eux
          X=stage6m/H3531/APPS/x11-debian/bin/Xfbdev
          E=stage6m/H3531/APPS/x11-debian/bin/xev
          K=stage6m/H3531/APPS/x11-debian/bin/xkbcomp
          LIB=stage6m/H3531/APPS/x11-debian/lib

          file "$X" "$E" "$K"
          readelf -h "$X"
          readelf -A "$X" || true

          for b in "$X" "$E" "$K"; do
            if readelf -A "$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR hard-float: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          lib = Path("stage6m/H3531/APPS/x11-debian/lib")
          for binary in map(Path, [
              "stage6m/H3531/APPS/x11-debian/bin/Xfbdev",
              "stage6m/H3531/APPS/x11-debian/bin/xev",
              "stage6m/H3531/APPS/x11-debian/bin/xkbcomp",
          ]):
              out=subprocess.check_output(["readelf","-d",str(binary)],text=True)
              need=re.findall(r"Shared library: \[([^\]]+)\]",out)
              missing=[n for n in need if not (lib/n).exists()]
              print(binary, need)
              if missing:
                  raise SystemExit(f"Missing direct libs: {missing}")
          PY

          find stage6m/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage6m/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_0M.txt

      - name: Create ReadyToCopy ZIP
        run: |
          cd stage6m
          zip -qr ../H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy.zip \
            | tee H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy
          path: |
            H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy.zip
            H3531-Stage6.0M-Debian-Minimal-Xfbdev-Evdev-ReadyToCopy.zip.sha256
          if-no-files-found: error
