name: H3531 Game Frontend Stage4.2 Stable System Order

on:
  push:
    branches:
      - feature/h3531-game-frontend-stage4-2-stable-order
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-2-stable-order.yml'
      - 'ports/frontend/h3531-game-frontend.cpp'
      - 'ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp'
      - 'ports/frontend/patch_stage42_stable_system_order.py'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file python3

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2
          git checkout 8224e427b655b83dae5e2298f1e6919523a78737
          test "$(git rev-parse HEAD)" = "8224e427b655b83dae5e2298f1e6919523a78737"
          git clone https://github.com/nothings/stb.git /tmp/stb
          cd /tmp/stb
          git checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20
          test "$(git rev-parse HEAD)" = "2c980bb59875b0d32144a71867fbdebb2f77cd20"

      - name: Generate stable-order Stage4.2 source
        run: |
          set -eux
          python3 ports/frontend/patch_stage42_stable_system_order.py \
            ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp \
            /tmp/h3531-game-frontend-stage4-2-stable.cpp
          grep -F 'Stage4.2 stable-order centered carousel active' /tmp/h3531-game-frontend-stage4-2-stable.cpp
          grep -F 'for (size_t pos = 0; pos < vis.size(); ++pos)' /tmp/h3531-game-frontend-stage4-2-stable.cpp
          grep -F 'visible_pos + 1 < vis.size()' /tmp/h3531-game-frontend-stage4-2-stable.cpp
          ! grep -F 'visible_pos = (visible_pos + 1) % vis.size();' /tmp/h3531-game-frontend-stage4-2-stable.cpp

      - name: Build stable-order frontend natively
        run: |
          set -eux
          g++ -std=c++14 -O2 \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/h3531-game-frontend-stage4-2-stable.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/gamefront-stage42-stable-host
          /tmp/gamefront-stage42-stable-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-host.txt
          grep -F 'SYSTEM_TWO NES-left SEGA-right identities-never-cross' /tmp/layout-host.txt
          grep -F 'SYSTEM_CLASSIFY NES=NES MEGADRIVE=SEGA_MD' /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: Cross-build static H3531 Game Frontend stable-order
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O2 -fno-pie -static -no-pie \
            -march=armv7-a -mfloat-abi=soft \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/h3531-game-frontend-stage4-2-stable.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | grep -F 'ELF 32-bit LSB executable, ARM'
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.2 stable-order centered carousel active'

      - name: QEMU stable-order layout and routing tests
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 0->1 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 1->2 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 2->3 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 3->4 = 14' /tmp/layout-arm.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-arm.txt
          grep -F 'SYSTEM_TWO NES-left SEGA-right identities-never-cross' /tmp/layout-arm.txt
          grep -F 'CAROUSEL selected-centered overflow-items=1-per-side' /tmp/layout-arm.txt
          grep -F 'BACKBUFFER coherent-full-frame-blit' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

          mkdir -p /tmp/stabletest/nes /tmp/stabletest/md
          : > '/tmp/stabletest/nes/Demo Game.nes'
          : > '/tmp/stabletest/md/Comix Zone [Rus].bin'
          cat > /tmp/stabletest/es_systems.cfg <<'EOF'
          <systemList>
            <system>
              <name>nes</name><fullname>Nintendo Entertainment System</fullname>
              <path>/tmp/stabletest/nes</path><extension>.nes</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so %ROM_RAW%</command>
              <theme>nes</theme>
            </system>
            <system>
              <name>megadrive</name><fullname>Sega Mega Drive</fullname>
              <path>/tmp/stabletest/md</path><extension>.bin .md .gen .smd</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW%</command>
              <theme>megadrive</theme>
            </system>
          </systemList>
          EOF
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --self-test /tmp/stabletest/es_systems.cfg | tee /tmp/route-arm.txt
          grep -F 'ROUTE system=nes' /tmp/route-arm.txt | grep -F 'fceumm_libretro.so'
          grep -F 'ROUTE system=megadrive' /tmp/route-arm.txt | grep -F 'picodrive_libretro.so'
          grep -F 'SELF_TEST_OK systems=2 games=2' /tmp/route-arm.txt

      - name: Package Stage4.2 stable-order frontend overlay
        run: |
          set -eux
          ROOT=out/H3531/APPS/gamefront
          mkdir -p "$ROOT/licenses"
          cp /tmp/GAMEFRONT.APP "$ROOT/GAMEFRONT.APP"
          cp ports/frontend/es_systems.cfg "$ROOT/es_systems.cfg"
          cp /tmp/tinyxml2/LICENSE.txt "$ROOT/licenses/tinyxml2-LICENSE.txt"
          cp /tmp/stb/LICENSE "$ROOT/licenses/stb-LICENSE.txt"
          cat > "$ROOT/README_STAGE4_2_STABLE_ORDER.txt" <<'EOF'
          H3531 Game Frontend Stage 4.2 - Stable System Order

          Replace only /H3531/APPS/gamefront/.
          RetroArch, cores, kernel, ramdisk, Monitor and SPI NOR are unchanged.

          System carousel behavior:
          - source order is stable and linear, never circular;
          - selected system is centered and enlarged;
          - systems before selected stay to the left;
          - systems after selected stay to the right;
          - system identities never wrap through the opposite edge or cross each other;
          - at the first/last system LEFT/RIGHT stops instead of wrapping;
          - overflow systems remain off-screen until they slide into view;
          - ROM carousel remains circular with one prepared item beyond each edge.

          Focus behavior remains:
          UP: games -> systems
          DOWN: systems -> games
          LEFT/RIGHT: move inside the focused row
          ENTER: play or return focus to games
          EOF
          cp /tmp/layout-arm.txt out/STAGE4_2-STABLE-ORDER-LAYOUT.txt
          cp /tmp/route-arm.txt out/STAGE4_2-STABLE-ORDER-ROUTING.txt
          (
            cd out
            find H3531/APPS/gamefront -type f -print0 | sort -z | xargs -0 sha256sum > SHA256.txt
            sha256sum -c SHA256.txt
          )

      - name: Upload H3531 Game Frontend Stage4.2 stable order
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.2-StableSystemOrder
          path: out/
          if-no-files-found: error
          retention-days: 14
