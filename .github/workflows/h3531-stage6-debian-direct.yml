name: H3531 Stage6 Debian Direct Xfbdev Proof

on:
  push:
    branches:
      - feature/h3531-stage6-xfbdev-proof
    paths:
      - 'ports/x11/fetch_wheezy_armel_runtime.py'
      - 'ports/x11/START-X11-DEBIAN-STAGE6.sh'
      - '.github/workflows/h3531-stage6-debian-direct.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev file binutils zip xfonts-utils

      - name: Fetch Wheezy armel package indexes
        run: |
          set -eux
          wget -qO wheezy-main-armel-Packages.gz \
            https://archive.debian.org/debian/dists/wheezy/main/binary-armel/Packages.gz
          wget -qO wheezy-security-armel-Packages.gz \
            https://archive.debian.org/debian-security/dists/wheezy/updates/main/binary-armel/Packages.gz

      - name: Resolve and download Xfbdev runtime packages
        run: |
          python3 ports/x11/fetch_wheezy_armel_runtime.py \
            --main-index wheezy-main-armel-Packages.gz \
            --security-index wheezy-security-armel-Packages.gz \
            --out debs \
            xserver-xfbdev x11-utils x11-xkb-utils xfonts-base xkb-data

          cat debs/PACKAGES.tsv

      - name: Extract armel packages without executing target code
        run: |
          set -eux
          mkdir -p rootfs
          for deb in debs/*.deb; do
            dpkg-deb -x "$deb" rootfs
          done

          test -x rootfs/usr/bin/Xfbdev
          test -x rootfs/usr/bin/xev
          test -x rootfs/usr/bin/xkbcomp
          test -e rootfs/lib/ld-linux.so.3

          echo "Xfbdev package/control:"
          dpkg-deb -f debs/xserver-xfbdev_*.deb Package Version Architecture Depends || true
          file rootfs/usr/bin/Xfbdev rootfs/usr/bin/xev rootfs/lib/ld-linux.so.3

      - name: Verify KDrive evdev support
        run: |
          set -eux
          strings rootfs/usr/bin/Xfbdev | grep -i evdev | head -40
          strings rootfs/usr/bin/Xfbdev | grep -E 'device=|keybd|mouse' | head -40

      - name: Assemble FAT-safe isolated runtime
        run: |
          set -eux
          OUT="$PWD/stage6d/H3531/APPS/x11-debian"
          DOC="$PWD/stage6d/H3531/SYSTEM/docs"
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/fonts/X11" "$OUT/share/X11" "$DOC"

          cp rootfs/usr/bin/Xfbdev "$OUT/bin/"
          cp rootfs/usr/bin/xev "$OUT/bin/"
          cp rootfs/usr/bin/xkbcomp "$OUT/bin/"
          cp -L rootfs/lib/ld-linux.so.3 "$OUT/lib/ld-linux.so.3"

          # Wheezy stores XKB_BIN_DIRECTORY as "/usr/bin" and later appends
          # "/xkbcomp". The vendor rootfs is read-only, so redirect the one
          # compiled XKB bin directory to writable /var. Launcher creates
          # /var/xkbcomp as a wrapper around our bundled Debian xkbcomp.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stage6d/H3531/APPS/x11-debian/bin/Xfbdev")
          data = p.read_bytes()
          old = b"/usr/bin\x00"
          new = b"/var\x00"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one XKB bin directory, found {count}")
          new = new + b"\x00" * (len(old) - len(new))
          p.write_bytes(data.replace(old, new, 1))
          PY

          # Audit the patch itself before packaging.
          test "$(strings "$OUT/bin/Xfbdev" | grep -x '/var' | wc -l)" -ge 1
          ! strings "$OUT/bin/Xfbdev" | grep -qx '/usr/bin'

          # Flatten every runtime library into one directory as regular files.
          # This avoids symlink loss when the ZIP is extracted/copied through FAT.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                cp -L "$f" "$OUT/lib/$(basename "$f")"
              done
          done

          if [ -d rootfs/usr/share/fonts/X11/misc ]; then
            cp -aL rootfs/usr/share/fonts/X11/misc "$OUT/share/fonts/X11/"
            mkfontdir "$OUT/share/fonts/X11/misc"
          fi
          if [ -d rootfs/usr/share/X11/xkb ]; then
            cp -aL rootfs/usr/share/X11/xkb "$OUT/share/X11/"
          fi

          cp ports/x11/START-X11-DEBIAN-STAGE6.sh "$OUT/"
          chmod +x "$OUT/START-X11-DEBIAN-STAGE6.sh" "$OUT/bin/"* "$OUT/lib/ld-linux.so.3"
          cp debs/PACKAGES.tsv "$DOC/DEBIAN_STAGE6_PACKAGE_CLOSURE.tsv"

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.0D-direct
          Official Debian Wheezy armel Xfbdev hardware proof
          Runtime extracted directly from archived Debian .deb packages.
          No target code executed during packaging.
          ABI target: armel / EABI soft-float
          EOF

          cat > "$DOC/README_STAGE6_0D_DIRECT.txt" <<'EOF'
          H3531 Stage6.0D-direct
          ======================
          Goal: prove official Debian Wheezy armel Xfbdev directly on the
          Hi3531 HIFB framebuffer and real evdev keyboard/mouse.

          This is NOT installed as the default desktop yet.
          It does not replace Monitor and does not modify boot/SPI/U-Boot env.

          Known hardware:
            event0 = SIGMACHIP Usb Mouse
            event1 = CASUE USB KB primary
            event2 = CASUE USB KB secondary HID

          First test:
            ps
            kill -STOP <MONITOR_PID>
            cd /mnt/usb/H3531/APPS/x11-debian
            ./START-X11-DEBIAN-STAGE6.sh
            kill -CONT <MONITOR_PID>

          Logs:
            /var/h3531-stage6-debian-xfbdev.log
            /var/h3531-stage6-debian-xev.log
          EOF

      - name: ARM ABI and dependency audit
        run: |
          set -eux
          X=stage6d/H3531/APPS/x11-debian/bin/Xfbdev
          E=stage6d/H3531/APPS/x11-debian/bin/xev
          K=stage6d/H3531/APPS/x11-debian/bin/xkbcomp
          L=stage6d/H3531/APPS/x11-debian/lib/ld-linux.so.3

          file "$X" "$E" "$L"
          readelf -h "$X"
          readelf -A "$X" || true
          readelf -d "$X" || true
          readelf -h "$E"
          readelf -A "$E" || true
          readelf -d "$E" || true
          readelf -h "$K"
          readelf -A "$K" || true
          readelf -d "$K" || true

          if readelf -A "$X" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: Xfbdev is hard-float, expected Debian armel soft-float"
            exit 1
          fi
          if readelf -A "$E" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: xev is hard-float, expected Debian armel soft-float"
            exit 1
          fi
          if readelf -A "$K" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: xkbcomp is hard-float, expected Debian armel soft-float"
            exit 1
          fi

          # Verify every DT_NEEDED name for Xfbdev and xev exists in bundled lib/.
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          lib = Path("stage6d/H3531/APPS/x11-debian/lib")
          for binary in [
              Path("stage6d/H3531/APPS/x11-debian/bin/Xfbdev"),
              Path("stage6d/H3531/APPS/x11-debian/bin/xev"),
              Path("stage6d/H3531/APPS/x11-debian/bin/xkbcomp"),
          ]:
              out = subprocess.check_output(["readelf","-d",str(binary)], text=True)
              needed = re.findall(r"Shared library: \[([^\]]+)\]", out)
              missing = [x for x in needed if not (lib/x).exists()]
              print(binary, "needs", needed)
              if missing:
                  raise SystemExit(f"Missing direct runtime libs for {binary}: {missing}")
          PY

          find stage6d/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage6d/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_0D_DIRECT.txt

      - name: Create ReadyToCopy ZIP
        run: |
          cd stage6d
          zip -qr ../H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy.zip \
            | tee H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy
          path: |
            H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy.zip
            H3531-Stage6.0D-Debian-Wheezy-Xfbdev-Direct-ReadyToCopy.zip.sha256
          if-no-files-found: error
