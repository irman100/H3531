name: H3531 graphical BASIC cross-build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user file make git curl xz-utils autoconf automake libtool

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream sources
        run: |
          set -eux
          git clone https://github.com/stardot/MatrixBrandy.git /tmp/MatrixBrandy
          cd /tmp/MatrixBrandy
          git checkout 737d89583e2faf77bccbf1038ccf12f454518a48

          git clone https://github.com/libsdl-org/SDL-1.2.git /tmp/SDL-1.2
          cd /tmp/SDL-1.2
          git checkout 457d4e55ffe1b6ad4c4fa4559dbda8360bf8253d

          git clone https://github.com/John-Titor/bwbasic.git /tmp/bwbasic
          cd /tmp/bwbasic
          git checkout 2bdac647bba245225617a578d22360503599b11a

      - name: Patch SDL 1.2 with H3531 fbdev and evdev backend
        run: |
          set -eux
          cp ports/sdl12/SDL_nullvideo.h /tmp/SDL-1.2/src/video/dummy/SDL_nullvideo.h
          cp ports/sdl12/SDL_nullvideo.c /tmp/SDL-1.2/src/video/dummy/SDL_nullvideo.c
          cp ports/sdl12/SDL_nullevents.c /tmp/SDL-1.2/src/video/dummy/SDL_nullevents.c

      - name: Patch Matrix Brandy for headless H3531 SDL
        run: |
          set -eux
          cd /tmp/MatrixBrandy
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/target.h')
          s=p.read_text()
          old='#if defined(TARGET_UNIX) && !defined(TARGET_MIDIPIX) && !defined(TARGET_MACOSX)\n#define USE_X11'
          new='#if defined(TARGET_UNIX) && !defined(TARGET_MIDIPIX) && !defined(TARGET_MACOSX) && !defined(TARGET_H3531)\n#define USE_X11'
          if old not in s:
              raise SystemExit('target.h X11 guard not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/mos_sys.c')
          s=p.read_text()
          old='''#if defined(TARGET_MACOSX)\n      outregs[7]=0;\n#elif defined(TARGET_UNIX) && defined(USE_X11)\n      outregs[7]=(size_t)wmInfo.info.x11.window;\n#else\n      outregs[7]=(size_t)wmInfo.window;\n#endif /* TARGET_UNIX */'''
          new='''#if defined(TARGET_MACOSX) || defined(TARGET_H3531)\n      outregs[7]=0;\n#elif defined(TARGET_UNIX) && defined(USE_X11)\n      outregs[7]=(size_t)wmInfo.info.x11.window;\n#else\n      outregs[7]=(size_t)wmInfo.window;\n#endif /* TARGET_UNIX */'''
          if old not in s:
              raise SystemExit('mos_sys.c WM block not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build static SDL 1.2 for H3531
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cd /tmp/SDL-1.2
          sh autogen.sh
          ./configure \
            --host=arm-linux-gnueabi \
            --prefix=/tmp/sdl-h3531 \
            --disable-shared --enable-static \
            --disable-video-x11 --disable-video-fbcon --enable-video-dummy \
            --disable-video-opengl --disable-video-directfb \
            --disable-alsa --disable-esd --disable-arts --disable-nas --disable-pulseaudio \
            --disable-cdrom --disable-joystick \
            CC=arm-linux-musleabi-gcc AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib \
            CFLAGS='-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE'
          make -j2
          make install

      - name: Build graphical Matrix Brandy
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cd /tmp/MatrixBrandy
          SDL_CONFIG=/tmp/sdl-h3531/bin/sdl-config
          SRC='src/evaluate.c src/graphsdl.c src/assign.c src/mainstate.c src/tokens.c src/mos.c src/commands.c src/functions.c src/iostate.c src/variables.c src/fileio.c src/soundsdl.c src/keyboard.c src/miscprocs.c src/editor.c src/stack.c src/mos_sys.c src/strings.c src/lvalue.c src/errors.c src/convert.c src/brandy.c src/statement.c src/net.c src/heap.c'
          mkdir -p "$GITHUB_WORKSPACE/out"
          arm-linux-musleabi-gcc \
            -O2 -static -fno-pie -no-pie -march=armv7-a -mfloat-abi=soft \
            -D_GNU_SOURCE -DBRANDY_NOVERCHECK -DUSE_SDL -DDEFAULT_IGNORE -DNONET -DTARGET_H3531 \
            $($SDL_CONFIG --cflags) $SRC \
            -o "$GITHUB_WORKSPACE/out/brandy-basicvi-gfx.APP" \
            -lm $($SDL_CONFIG --static-libs) -pthread -lrt
          arm-linux-musleabi-strip "$GITHUB_WORKSPACE/out/brandy-basicvi-gfx.APP"

      - name: Build text fallbacks
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cd /tmp/MatrixBrandy
          sed -i '1i#include <sys/select.h>\n#include <sys/time.h>' src/keyboard.c
          make -f makefile.text clean || true
          make -f makefile.text srecompile \
            CC=arm-linux-musleabi-gcc \
            BRANDY_BUILD_FLAGS='-static -fno-pie -no-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE -DBRANDY_NOVERCHECK'
          arm-linux-musleabi-strip sbrandy
          cp sbrandy "$GITHUB_WORKSPACE/out/brandy-basicvi-text"

          cd /tmp/bwbasic
          arm-linux-musleabi-gcc -static -fno-pie -no-pie -O2 -std=gnu89 \
            -march=armv7-a -mfloat-abi=soft \
            -DHAVE_UNIX -D_DEFAULT_SOURCE -D_GNU_SOURCE \
            -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types \
            bwbasic.c bwb_cmd.c bwb_cnd.c bwb_dio.c bwb_exp.c bwb_fnc.c \
            bwb_inp.c bwb_int.c bwb_prn.c bwb_stc.c bwb_str.c bwb_tbl.c \
            bwb_var.c bwd_cmd.c bwd_fun.c bwx_tty.c \
            -lm -o "$GITHUB_WORKSPACE/out/bwbasic"
          arm-linux-musleabi-strip "$GITHUB_WORKSPACE/out/bwbasic"

      - name: Add hardware test BASIC
        run: |
          cat > out/H3531-GFX-DEMO.BAS <<'EOF'
          10 MODE 27
          20 CLS
          30 GCOL 0,1
          40 MOVE 100,100
          50 DRAW 1100,100
          60 DRAW 1100,700
          70 DRAW 100,700
          80 DRAW 100,100
          90 GCOL 0,2
          100 FOR X%=100 TO 1100 STEP 40
          110 MOVE 100,100
          120 DRAW X%,700
          130 NEXT
          140 GCOL 0,3
          150 FOR Y%=120 TO 680 STEP 40
          160 MOVE 100,Y%
          170 DRAW 1100,Y%
          180 NEXT
          190 GCOL 0,7
          200 PRINT "H3531 MATRIX BRANDY GRAPHICS"
          210 T%=TIME
          220 REPEAT UNTIL TIME-T%>500
          EOF

      - name: Inspect output
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          file out/brandy-basicvi-gfx.APP out/brandy-basicvi-text out/bwbasic | tee out/FILE.txt
          arm-linux-musleabi-readelf -h out/brandy-basicvi-gfx.APP > out/READELF-GFX.txt
          arm-linux-musleabi-readelf -A out/brandy-basicvi-gfx.APP >> out/READELF-GFX.txt || true
          sha256sum out/* | tee out/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GRAPHICAL-BASIC
          path: out/
          if-no-files-found: error
          retention-days: 14
