name: H3531 Stage6.2D Robust Matchbox Panel Shell

on:
  push:
    branches:
      - feature/h3531-stage6-desktop
    paths:
      - 'ports/x11/START-X11-DESKTOP-STAGE6.sh'
      - 'ports/x11/README_STAGE6_2.md'
      - '.github/workflows/h3531-stage6-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download hardware-proven Stage6.1G base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35386700757

      - name: Extract and verify proven base
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip
          mkdir -p stage62
          unzip -q "$BASEZIP" -d stage62
          OUT="$PWD/stage62/H3531/APPS/x11-debian"
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -
          test -x "$OUT/bin/xsetroot"
          PANGO_VERSION="$(cat "$OUT/etc/pango/module-version")"
          test -f "$OUT/lib/pango/$PANGO_VERSION/modules/pango-basic-fc.so"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy panel shell payload
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg             wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF
          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -y --no-install-recommends --allow-unauthenticated install             matchbox-panel xterm

          for pkg in matchbox-panel xterm; do
            sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W               -f='${Package} ${Version}\n' "$pkg"
          done

      - name: Assemble Stage6.2D panel shell runtime
        run: |
          set -eux
          OUT="$PWD/stage62/H3531/APPS/x11-debian"
          DOC="$PWD/stage62/H3531/SYSTEM/docs"

          mkdir -p "$OUT/bin" "$OUT/share/pixmaps" "$DOC"

          cp rootfs/usr/bin/matchbox-panel "$OUT/bin/"
          cp rootfs/usr/bin/mb-applet-clock "$OUT/bin/mb-applet-clock.real"
          cp rootfs/usr/bin/mb-applet-launcher "$OUT/bin/mb-applet-launcher.real"
          cp rootfs/usr/bin/xterm "$OUT/bin/"
          cp rootfs/usr/share/pixmaps/xterm_48x48.xpm "$OUT/share/pixmaps/"

          # Add libraries missing from the proven Stage6.1G base.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                [ -e "$dst" ] || cp -L "$f" "$dst"
              done
          done

          # Redirect /usr/share in the real applets to writable /var/share.
          python3 - <<'PY'
          from pathlib import Path
          base = Path("stage62/H3531/APPS/x11-debian/bin")
          old, new = b"/usr/share", b"/var/share"
          for name in ["matchbox-panel", "mb-applet-clock.real", "mb-applet-launcher.real"]:
              p = base / name
              data = p.read_bytes()
              count = data.count(old)
              print(name, "/usr/share occurrences:", count)
              if count:
                  p.write_bytes(data.replace(old, new))
          PY

          cat >"$OUT/bin/mb-applet-clock" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib"             "$BASE/bin/mb-applet-clock.real" "$@"
          EOF

          cat >"$OUT/bin/h3531-terminal-applet" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib"             "$BASE/bin/mb-applet-launcher.real" "$@"             --title Terminal --no-animation             "$BASE/share/pixmaps/xterm_48x48.xpm"             "$BASE/bin/h3531-terminal"
          EOF

          cat >"$OUT/bin/h3531-terminal" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          export DISPLAY=${DISPLAY:-127.0.0.1:0}
          export HOME=/var/h3531-x11
          export SHELL=/bin/sh
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib"             "$BASE/bin/xterm" -display "$DISPLAY" -fn 9x15             -bg white -fg black -geometry 100x32+80+90 -title "H3531 Terminal"
          EOF

          chmod 755 "$OUT/bin/mb-applet-clock" "$OUT/bin/h3531-terminal-applet"                     "$OUT/bin/h3531-terminal" "$OUT/bin/matchbox-panel"                     "$OUT/bin/mb-applet-clock.real" "$OUT/bin/mb-applet-launcher.real" "$OUT/bin/xterm"

          cp ports/x11/START-X11-DESKTOP-STAGE6.sh "$OUT/"
          chmod 755 "$OUT/START-X11-DESKTOP-STAGE6.sh"

          cat >"$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.2D
          Base: hardware-proven Stage6.1G
          Xfbdev SHA256: 0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482
          Shell:
            Matchbox WM
            Matchbox Panel
            XPM Terminal launcher applet
            Clock applet
            xterm autostart
          Deliberately removed from the critical path:
            matchbox-desktop
            GTK/GdkPixbuf
            PNG icons
          EOF

          cat >"$DOC/README_STAGE6_2D_PANEL_SHELL.txt" <<'EOF'
          Stage6.2D bypasses the GdkPixbuf/PNG failure observed on real Hi3531.

          Instead of blocking progress on Matchbox Desktop's GTK icon stack, this
          stage provides a robust embedded shell:
            proven Xfbdev + Matchbox WM
            gray root background
            top Matchbox Panel
            Terminal launcher using XPM
            clock applet
            xterm automatically opened as a guaranteed first useful application

          Future apps can be added as additional panel launcher applets while the
          separate GTK/GdkPixbuf issue is investigated off the critical path.

          No saveenv. No SPI writes.
          EOF

      - name: Recursive ABI and dependency audit
        run: |
          set -eux
          OUT="$PWD/stage62/H3531/APPS/x11-debian"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          for b in matchbox-panel mb-applet-clock.real mb-applet-launcher.real xterm; do
            file "$OUT/bin/$b"
            readelf -A "$OUT/bin/$b" || true
            if readelf -A "$OUT/bin/$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          out = Path("stage62/H3531/APPS/x11-debian")
          lib = out / "lib"
          available = {p.name for p in lib.iterdir() if p.is_file()}
          checked = 0
          for obj in out.rglob("*"):
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(["readelf", "-h", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(["readelf", "-d", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [n for n in needed if n not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("Recursive ELF dependency audit objects:", checked)
          PY

          test -x "$OUT/bin/h3531-terminal"
          test -x "$OUT/bin/h3531-terminal-applet"
          test -x "$OUT/bin/mb-applet-clock"
          test -f "$OUT/share/pixmaps/xterm_48x48.xpm"

          # Ensure Stage6.2D launcher has no GdkPixbuf/PNG dependency.
          ! grep -q 'GDK_PIXBUF' "$OUT/START-X11-DESKTOP-STAGE6.sh"
          ! grep -q 'mbmenu.png' "$OUT/START-X11-DESKTOP-STAGE6.sh"

          find stage62/H3531 -type f -print0 | sort -z | xargs -0 sha256sum             > stage62/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_2D.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage62
          zip -qr ../H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy.zip             | tee H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy
          path: |
            H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy.zip
            H3531-Stage6.2D-Matchbox-Panel-Terminal-ReadyToCopy.zip.sha256
          if-no-files-found: error
