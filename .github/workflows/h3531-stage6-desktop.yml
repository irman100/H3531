name: H3531 Stage6.2C Target GdkPixbuf Desktop

on:
  push:
    branches:
      - feature/h3531-stage6-desktop
    paths:
      - 'ports/x11/START-X11-DESKTOP-STAGE6.sh'
      - 'ports/x11/README_STAGE6_2.md'
      - '.github/workflows/h3531-stage6-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download hardware-proven Stage6.1G base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35386700757

      - name: Extract and verify proven base
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip
          test -f "$BASEZIP"
          mkdir -p stage62
          unzip -q "$BASEZIP" -d stage62
          OUT="$PWD/stage62/H3531/APPS/x11-debian"
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -
          PANGO_VERSION="$(cat "$OUT/etc/pango/module-version")"
          test -f "$OUT/lib/pango/$PANGO_VERSION/modules/pango-basic-fc.so"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy desktop payload
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF
          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            matchbox-desktop matchbox-panel xterm libgdk-pixbuf2.0-dev

          for pkg in matchbox-desktop matchbox-panel xterm libgdk-pixbuf2.0-dev; do
            sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W \
              -f='${Package} ${Version}\n' "$pkg"
          done

      - name: Assemble Stage6.2C desktop runtime
        run: |
          set -eux
          OUT="$PWD/stage62/H3531/APPS/x11-debian"
          DOC="$PWD/stage62/H3531/SYSTEM/docs"
          RUNTIME_BASE=/mnt/usb/H3531/APPS/x11-debian

          rm -rf "$OUT/share/applications"
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/applications" "$OUT/share/pixmaps" \
                   "$OUT/share/matchbox" "$OUT/share/icons" "$OUT/etc/gtk" "$DOC"

          cp rootfs/usr/bin/matchbox-desktop "$OUT/bin/"
          cp rootfs/usr/bin/matchbox-panel "$OUT/bin/"
          cp rootfs/usr/bin/xterm "$OUT/bin/"
          cp rootfs/usr/bin/gdk-pixbuf-csource "$OUT/bin/"
          GDK_QUERY="$(find rootfs/usr/lib/arm-linux-gnueabi/gdk-pixbuf-2.0 -maxdepth 1 -type f -name gdk-pixbuf-query-loaders | head -1)"
          test -x "$GDK_QUERY"
          cp "$GDK_QUERY" "$OUT/bin/gdk-pixbuf-query-loaders"

          # Panel applets cannot be execve'd directly on the vendor rootfs because
          # their ELF interpreter is /lib/ld-linux.so.3. Keep the real ARM ELF
          # binaries and expose shell wrappers under the names Panel expects.
          cp rootfs/usr/bin/mb-applet-menu-launcher "$OUT/bin/mb-applet-menu-launcher.real"
          cp rootfs/usr/bin/mb-applet-clock "$OUT/bin/mb-applet-clock.real"

          cat >"$OUT/bin/mb-applet-menu-launcher" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib" \
            "$BASE/bin/mb-applet-menu-launcher.real" "$@"
          EOF

          cat >"$OUT/bin/mb-applet-clock" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib" \
            "$BASE/bin/mb-applet-clock.real" "$@"
          EOF
          chmod 755 "$OUT/bin/mb-applet-menu-launcher" "$OUT/bin/mb-applet-clock"

          # Add libraries missing from the hardware-proven base.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                [ -e "$dst" ] || cp -L "$f" "$dst"
              done
          done

          [ ! -d rootfs/usr/share/matchbox ] || cp -aL rootfs/usr/share/matchbox/. "$OUT/share/matchbox/"
          [ ! -d rootfs/usr/share/pixmaps ] || cp -aL rootfs/usr/share/pixmaps/. "$OUT/share/pixmaps/"
          [ ! -d rootfs/usr/share/icons ] || cp -aL rootfs/usr/share/icons/. "$OUT/share/icons/"

          # Keep the first desktop intentionally small: one Applications folder
          # containing only our Terminal launcher.
          mkdir -p "$OUT/share/matchbox/vfolders"
          cat >"$OUT/share/matchbox/vfolders/Root.directory" <<'EOF'
          [Desktop Entry]
          Name=Programs
          Comment=H3531 applications
          Icon=/mnt/usb/H3531/APPS/x11-debian/share/pixmaps/mbfolder.png
          Type=Directory
          EOF
          printf '%s\n' 'Applications' >"$OUT/share/matchbox/vfolders/Root.order"
          cat >"$OUT/share/matchbox/vfolders/Applications.directory" <<'EOF'
          [Desktop Entry]
          Name=Applications
          Comment=Installed applications
          Icon=/mnt/usb/H3531/APPS/x11-debian/share/pixmaps/mbfolder.png
          Type=Directory
          Match=fallback
          EOF
          find "$OUT/share/matchbox/vfolders" -type f \
            ! -name Root.directory ! -name Root.order ! -name Applications.directory -delete

          # GdkPixbuf loaders used by Matchbox Desktop.
          GDK_ROOT="$(find rootfs/usr/lib/arm-linux-gnueabi/gdk-pixbuf-2.0 \
            -mindepth 2 -maxdepth 2 -type d -name loaders -printf '%h\n' | head -1)"
          test -n "$GDK_ROOT"
          GDK_REL="${GDK_ROOT#rootfs/usr/lib/arm-linux-gnueabi/}"
          GDK_MODULE_DIR="$OUT/lib/$GDK_REL/loaders"
          mkdir -p "$GDK_MODULE_DIR"
          cp -aL "$GDK_ROOT/loaders/." "$GDK_MODULE_DIR/"

          # Do not ship a pre-generated loaders.cache. Stage6.2C creates it on
          # the actual Hi3531 at startup with packaged gdk-pixbuf-query-loaders.
          printf '%s\n' "$RUNTIME_BASE/lib/$GDK_REL/loaders" >"$OUT/etc/gtk/gdk-pixbuf-module-dir"

          # Optional GTK input modules.
          GTK_IM_ROOT="$(find rootfs/usr/lib/arm-linux-gnueabi/gtk-2.0 -type d -name immodules | head -1 || true)"
          if [ -n "$GTK_IM_ROOT" ]; then
            GTK_IM_REL="${GTK_IM_ROOT#rootfs/usr/lib/arm-linux-gnueabi/}"
            mkdir -p "$OUT/lib/$GTK_IM_REL"
            cp -aL "$GTK_IM_ROOT/." "$OUT/lib/$GTK_IM_REL/"
          fi

          # Redirect compile-time /usr/share paths to writable /var/share.
          python3 - <<'PY'
          from pathlib import Path
          names = [
              "matchbox-desktop",
              "matchbox-panel",
              "mb-applet-menu-launcher.real",
              "mb-applet-clock.real",
          ]
          base = Path("stage62/H3531/APPS/x11-debian/bin")
          old, new = b"/usr/share", b"/var/share"
          for name in names:
              p = base / name
              data = p.read_bytes()
              count = data.count(old)
              print(name, "/usr/share occurrences:", count)
              if count:
                  p.write_bytes(data.replace(old, new))
          PY

          cat >"$OUT/bin/h3531-terminal" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          export DISPLAY=${DISPLAY:-127.0.0.1:0}
          export HOME=/var/h3531-x11
          export SHELL=/bin/sh
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib" \
            "$BASE/bin/xterm" -display "$DISPLAY" -fn 9x15 \
            -bg white -fg black -geometry 100x32+80+90 -title "H3531 Terminal"
          EOF
          chmod 755 "$OUT/bin/h3531-terminal"

          cat >"$OUT/share/applications/h3531-terminal.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Terminal
          Comment=H3531 command line
          Exec=/mnt/usb/H3531/APPS/x11-debian/bin/h3531-terminal
          Icon=/mnt/usb/H3531/APPS/x11-debian/share/pixmaps/xterm_48x48.xpm
          Terminal=false
          StartupNotify=false
          EOF

          cp ports/x11/START-X11-DESKTOP-STAGE6.sh "$OUT/"
          chmod 755 "$OUT/START-X11-DESKTOP-STAGE6.sh" \
                    "$OUT/bin/matchbox-desktop" "$OUT/bin/matchbox-panel" \
                    "$OUT/bin/mb-applet-menu-launcher.real" "$OUT/bin/mb-applet-clock.real" \
                    "$OUT/bin/xterm" "$OUT/bin/gdk-pixbuf-csource" \
                    "$OUT/bin/gdk-pixbuf-query-loaders"

          cat >"$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.2C
          Base: hardware-proven Stage6.1G runtime
          Xfbdev SHA256: 0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482
          Added/fixed:
            Matchbox Desktop in plain desktop mode
            Matchbox Panel
            USB-loader wrappers for menu/clock applets
            isolated Terminal application menu
            target-generated GdkPixbuf loader cache
            PNG/XPM runtime self-test
            xterm Terminal
          EOF

          cat >"$DOC/README_STAGE6_2C_DESKTOP.txt" <<'EOF'
          Stage6.2C incorporates the first hardware Stage6.2 findings:
            Desktop was incorrectly decorated as a normal window.
            Panel applets could not exec their /lib/ld-linux.so.3 interpreter.
            Desktop icon decoding/fallback required a stricter GdkPixbuf setup.

          Stage6.2C uses plain desktop mode, USB loader wrappers for Panel applets,
          a minimal application menu, and validates PNG/XPM loaders before X starts.

          No saveenv. No SPI writes.
          EOF

      - name: ABI dependency and image-loader audit
        run: |
          set -eux
          OUT="$PWD/stage62/H3531/APPS/x11-debian"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          for b in matchbox-desktop matchbox-panel mb-applet-menu-launcher.real mb-applet-clock.real xterm gdk-pixbuf-csource gdk-pixbuf-query-loaders; do
            file "$OUT/bin/$b"
            readelf -A "$OUT/bin/$b" || true
            if readelf -A "$OUT/bin/$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          out = Path("stage62/H3531/APPS/x11-debian")
          lib = out / "lib"
          available = {p.name for p in lib.iterdir() if p.is_file()}
          checked = 0
          for obj in out.rglob("*"):
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(["readelf", "-h", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(["readelf", "-d", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [n for n in needed if n not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("Recursive ELF dependency audit objects:", checked)
          PY

          test -x "$OUT/bin/mb-applet-menu-launcher"
          test -x "$OUT/bin/mb-applet-clock"
          test -f "$OUT/share/applications/h3531-terminal.desktop"
          test "$(find "$OUT/share/applications" -maxdepth 1 -type f | wc -l)" -eq 1
          test -x "$OUT/bin/gdk-pixbuf-query-loaders"
          test -f "$OUT/etc/gtk/gdk-pixbuf-module-dir"
          test -f "$OUT/share/pixmaps/mbmenu.png"
          test -f "$OUT/share/pixmaps/xterm_48x48.xpm"

          # Emulate the exact target flow: create loader cache from the packaged
          # USB modules at runtime, then decode PNG/XPM through that new cache.
          sudo mkdir -p /mnt/usb/H3531/APPS
          sudo rm -rf /mnt/usb/H3531/APPS/x11-debian
          sudo ln -s "$OUT" /mnt/usb/H3531/APPS/x11-debian
          GDK_DIR="$(cat "$OUT/etc/gtk/gdk-pixbuf-module-dir")"
          GDK_FILE=/tmp/h3531-gdk-pixbuf.loaders

          GDK_PIXBUF_MODULEDIR="$GDK_DIR" \
            qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$OUT/lib" \
            "$OUT/bin/gdk-pixbuf-query-loaders" "$GDK_DIR"/*.so >"$GDK_FILE"
          test -s "$GDK_FILE"

          for img in "$OUT/share/pixmaps/mbmenu.png" "$OUT/share/pixmaps/xterm_48x48.xpm"; do
            GDK_PIXBUF_MODULE_FILE="$GDK_FILE" GDK_PIXBUF_MODULEDIR="$GDK_DIR" \
              qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$OUT/lib" \
              "$OUT/bin/gdk-pixbuf-csource" "$img" >/dev/null
          done

          find stage62/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage62/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_2C.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage62
          zip -qr ../H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy.zip \
            | tee H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy
          path: |
            H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy.zip
            H3531-Stage6.2C-Matchbox-Desktop-Panel-Terminal-ReadyToCopy.zip.sha256
          if-no-files-found: error
