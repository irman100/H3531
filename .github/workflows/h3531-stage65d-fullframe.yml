name: H3531 Stage6.5D FullFrame Shadow Repaint

on:
  push:
    branches:
      - feature/h3531-stage64-lxde
    paths:
      - '.github/workflows/h3531-stage65d-fullframe.yml'
      - 'ports/x11/README_STAGE6_5D_FULLFRAME.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download Stage6.5C base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.5C-Network-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35470048349

      - name: Verify and extract Stage6.5C
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.5C-Network-ReadyToCopy.zip
          test -f "$BASEZIP"
          echo "ad54bc0eb0499d3b866066e4be73ce55e5769ffcc503751e6ef501962753ad0d  $BASEZIP" | sha256sum -c -
          mkdir -p stage65d
          unzip -q "$BASEZIP" -d stage65d
          OUT="$PWD/stage65d/H3531/APPS/x11-debian"
          test -x "$OUT/bin/Xfbdev"
          test -x "$OUT/bin/Xfbdev-shadow"
          test "$(sha256sum "$OUT/bin/Xfbdev" | awk '{print $1}')" = "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip xfonts-utils

      - name: Bootstrap Wheezy armel X server build root
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb-src [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          deb-src [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            build-essential devscripts fakeroot dpkg-dev \
            x11-utils x11-xkb-utils xfonts-base xkb-data
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --allow-unauthenticated build-dep xorg-server

      - name: Fetch Xfbdev source and force full-frame shadow flush
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            'cd /build && apt-get -y --allow-unauthenticated source xorg-server=2:1.12.4-6+deb7u8'

          SRC="$(find rootfs/build -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          test -n "$SRC"
          echo "$SRC" > source-dir.txt

          sudo python3 - "$SRC/debian/rules" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          line="\tbuild_xfbdev += --enable-kdrive-mouse --enable-kdrive-evdev\n"
          if "--enable-kdrive-evdev" not in s:
              anchor="\tbuild_xfbdev = --enable-xfbdev\n"
              if anchor not in s:
                  raise SystemExit("Debian xfbdev rules anchor not found")
              s=s.replace(anchor,anchor+line,1)
              p.write_text(s)
          PY

          # First retain Stage6.5B's shadow framebuffer selection.
          sudo python3 - "$SRC/hw/kdrive/fbdev/fbdev.c" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          pats=[
              r'if\s*\(scrpriv->randr\s*!=\s*RR_Rotate_0\s*\|\|\s*priv->fix\.type\s*!=\s*FB_TYPE_PACKED_PIXELS\s*\)\s*scrpriv->shadow\s*=\s*TRUE;\s*else\s*scrpriv->shadow\s*=\s*FALSE;',
              r'if\s*\(scrpriv->randr\s*!=\s*RR_Rotate_0\s*\)\s*scrpriv->shadow\s*=\s*TRUE;\s*else\s*scrpriv->shadow\s*=\s*FALSE;',
          ]
          done=0
          for pat in pats:
              s2,n=re.subn(pat,
                  '/* H3531 Stage6.5D: force software shadow framebuffer. */\n    scrpriv->shadow = TRUE;',
                  s,count=1,flags=re.S)
              if n:
                  s=s2; done=1; break
          if not done:
              raise SystemExit("fbdev shadow selection not found")
          p.write_text(s)
          PY

          # Critical experiment: do not send only damaged rectangles to /dev/fb0.
          # Minimize/restore repairs the screen on hardware, which means a complete
          # repaint is correct while incremental updates are corrupt. Force each
          # shadow redisplay to copy the entire root pixmap.
          sudo python3 - "$SRC/miext/shadow/shpacked.c" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          old='''    RegionPtr damage = DamageRegion(pBuf->pDamage);
              PixmapPtr pShadow = pBuf->pPixmap;
              int nbox = RegionNumRects(damage);
              BoxPtr pbox = RegionRects(damage);'''
          if old not in s:
              # Wheezy source can use tabs/spaces differently; patch linewise.
              lines=s.splitlines()
              start=None
              for i,l in enumerate(lines):
                  if "RegionPtr" in l and "damage" in l and "DamageRegion" in l:
                      start=i; break
              if start is None:
                  raise SystemExit("shadowUpdatePacked damage block not found")
              end=None
              for i in range(start,min(start+8,len(lines))):
                  if "BoxPtr" in lines[i] and "pbox" in lines[i]:
                      end=i; break
              if end is None:
                  raise SystemExit("shadowUpdatePacked pbox line not found")
              indent=lines[start][:len(lines[start])-len(lines[start].lstrip())]
              repl=[
                  indent+"PixmapPtr pShadow = pBuf->pPixmap;",
                  indent+"BoxRec h3531FullBox;",
                  indent+"int nbox = 1;",
                  indent+"BoxPtr pbox = &h3531FullBox;",
              ]
              lines[start:end+1]=repl
              s="\n".join(lines)+"\n"
          else:
              s=s.replace(old,'''    PixmapPtr pShadow = pBuf->pPixmap;
              BoxRec h3531FullBox;
              int nbox = 1;
              BoxPtr pbox = &h3531FullBox;''',1)

          marker='''    fbGetDrawable(&pShadow->drawable, shaBase, shaStride, shaBpp, shaXoff, shaYoff);'''
          if marker not in s:
              marker='''    fbGetDrawable (&pShadow->drawable, shaBase, shaStride, shaBpp, shaXoff, shaYoff);'''
          if marker not in s:
              raise SystemExit("fbGetDrawable marker not found")
          inject='''    /* H3531 Stage6.5D: full-frame flush on every shadow redisplay. */
              h3531FullBox.x1 = 0;
              h3531FullBox.y1 = 0;
              h3531FullBox.x2 = pShadow->drawable.width;
              h3531FullBox.y2 = pShadow->drawable.height;

          '''
          s=s.replace(marker,inject+marker,1)
          p.write_text(s)
          PY

          grep -n -A8 -B8 'H3531 Stage6.5D' "$SRC/hw/kdrive/fbdev/fbdev.c"
          grep -n -A12 -B12 'full-frame flush' "$SRC/miext/shadow/shpacked.c"

      - name: Build FullFrame Xfbdev
        run: |
          set -eux
          SRC_REL="/build/$(basename "$(cat source-dir.txt)")"
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            "cd '$SRC_REL' && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -uc -us -j2"

          DEB="$(find rootfs/build -maxdepth 1 -name 'xserver-xfbdev_*_armel.deb' | head -1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" rebuilt
          file rebuilt/usr/bin/Xfbdev

      - name: Integrate FullFrame test server
        run: |
          set -eux
          OUT="$PWD/stage65d/H3531/APPS/x11-debian"
          DOC="$PWD/stage65d/H3531/SYSTEM/docs"

          cp rebuilt/usr/bin/Xfbdev "$OUT/bin/Xfbdev-shadow-full"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage65d/H3531/APPS/x11-debian/bin/Xfbdev-shadow-full")
          data=p.read_bytes()
          old=b"/usr/bin\x00"
          new=b"/var\x00"
          count=data.count(old)
          if count != 1:
              raise SystemExit(f"Expected one XKB path, got {count}")
          new += b"\x00"*(len(old)-len(new))
          p.write_bytes(data.replace(old,new,1))
          PY
          chmod 755 "$OUT/bin/Xfbdev-shadow-full"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage65d/H3531/APPS/x11-debian/START-LXDE-STAGE6.sh")
          s=p.read_text()
          old='''XFBDEV_DIRECT="$BASE/bin/Xfbdev"
          XFBDEV_SHADOW="$BASE/bin/Xfbdev-shadow"
          if [ "${H3531_X11_SHADOW_FB:-0}" = "1" ]; then
              XFBDEV="$XFBDEV_SHADOW"
              XFBDEV_MODE=shadow
          else
              XFBDEV="$XFBDEV_DIRECT"
              XFBDEV_MODE=direct
          fi'''
          new='''XFBDEV_DIRECT="$BASE/bin/Xfbdev"
          XFBDEV_SHADOW="$BASE/bin/Xfbdev-shadow"
          XFBDEV_SHADOW_FULL="$BASE/bin/Xfbdev-shadow-full"
          if [ "${H3531_X11_FULLFRAME_FB:-0}" = "1" ]; then
              XFBDEV="$XFBDEV_SHADOW_FULL"
              XFBDEV_MODE=shadow-fullframe
          elif [ "${H3531_X11_SHADOW_FB:-0}" = "1" ]; then
              XFBDEV="$XFBDEV_SHADOW"
              XFBDEV_MODE=shadow
          else
              XFBDEV="$XFBDEV_DIRECT"
              XFBDEV_MODE=direct
          fi'''
          if old not in s:
              raise SystemExit("Stage6.5B XFBDEV selector not found")
          s=s.replace(old,new,1)
          s=s.replace("Stage6.5B","Stage6.5D")
          p.write_text(s)
          PY

          cat >"$OUT/START-LXDE-STAGE6-FULLFRAME.sh" <<'EOF'
          #!/bin/sh
          export H3531_X11_FULLFRAME_FB=1
          exec /mnt/usb/H3531/APPS/x11-debian/START-LXDE-STAGE6.sh "$@"
          EOF
          chmod 755 "$OUT/START-LXDE-STAGE6-FULLFRAME.sh"

          cat >"$DOC/README_STAGE6_5D_FULLFRAME.txt" <<'EOF'
          H3531 Stage6.5D FullFrame Shadow
          =================================

          Hardware evidence:
            - direct framebuffer mode leaves vertical trails during window drag;
            - software ShadowFB mode still leaves the same trails;
            - scrolling text also corrupts;
            - minimize/restore repairs the image immediately.

          This means the stored window contents are correct and a complete repaint
          works. Stage6.5D therefore forces the shadow X server to copy the entire
          1280x720 root pixmap on each redisplay instead of only damage rectangles.

          Test:
            H3531_LXDE_SECONDS=0 ./START-LXDE-STAGE6-FULLFRAME.sh

          Fallbacks:
            ./START-LXDE-STAGE6-SHADOW.sh
            ./START-LXDE-STAGE6.sh

          No saveenv. No SPI writes. No kernel replacement.
          EOF

          cat >"$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.5D
          Base: Stage6.5C network + Stage6.5B ShadowFB
          Added:
            Xfbdev-shadow-full
            full-screen shadow copy on every repaint
          No saveenv. No SPI writes.
          EOF

      - name: ABI and integrity audit
        run: |
          set -eux
          OUT="$PWD/stage65d/H3531/APPS/x11-debian"
          D="$OUT/bin/Xfbdev"
          S="$OUT/bin/Xfbdev-shadow"
          F="$OUT/bin/Xfbdev-shadow-full"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $D" | sha256sum -c -
          test -x "$S"
          test -x "$F"
          file "$D" "$S" "$F"
          if readelf -A "$F" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: full-frame server is hard-float"
            exit 1
          fi
          strings "$F" | grep -q '^evdev$'
          strings "$F" | grep -q 'shadowUpdatePacked'
          grep -q 'shadow-fullframe' "$OUT/START-LXDE-STAGE6.sh"
          test -x "$OUT/START-LXDE-STAGE6-FULLFRAME.sh"

          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          out=Path("stage65d/H3531/APPS/x11-debian")
          available={p.name for p in (out/"lib").rglob("*") if p.is_file()}
          for binary in (out/"bin/Xfbdev",out/"bin/Xfbdev-shadow",out/"bin/Xfbdev-shadow-full"):
              dyn=subprocess.check_output(["readelf","-d",str(binary)],text=True)
              needed=[]
              for line in dyn.splitlines():
                  if "(NEEDED)" not in line: continue
                  a=line.find("["); b=line.find("]",a+1)
                  if a>=0 and b>a: needed.append(line[a+1:b])
              missing=[n for n in needed if n not in available]
              print(binary.name,"needs",needed)
              if missing:
                  raise SystemExit(f"{binary}: missing {missing}")
          PY

          find stage65d/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage65d/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_5D.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage65d
          zip -qr ../H3531-Stage6.5D-FullFrame-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.5D-FullFrame-ReadyToCopy.zip \
            | tee H3531-Stage6.5D-FullFrame-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.5D-FullFrame-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.5D-FullFrame-ReadyToCopy
          path: |
            H3531-Stage6.5D-FullFrame-ReadyToCopy.zip
            H3531-Stage6.5D-FullFrame-ReadyToCopy.zip.sha256
          if-no-files-found: error
