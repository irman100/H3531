name: H3531 RetroArch Stage3.17 HIFB VBlank Present

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-retroarch-stage3-17-hifb-vblank-present.yml'
      - 'ports/retroarch/patch_stage317_hifb_vblank_present.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user python3 binutils

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          git -C /tmp/retroarch checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git -C /tmp/retroarch rev-parse HEAD)" = 48cbdb2e78ea6c92ade103941c4958ea312a5995

      - name: Generate current PS1 fastpaths and Stage3.17 vblank presenter
        run: |
          set -eux
          python3 ports/retroarch/patch_stage422_v3_ps1_video.py             ports/retroarch/h3531_fb_gfx_fast_aspect.c             /tmp/h3531_fb_gfx_ps1.c
          python3 ports/retroarch/patch_stage317_hifb_vblank_present.py             /tmp/h3531_fb_gfx_ps1.c             /tmp/h3531_fb_gfx_stage317.c
          python3 ports/retroarch/patch_stage422_v4_emu_speed.py             /tmp/retroarch/runloop.c /tmp/runloop_stage317.c
          cp /tmp/runloop_stage317.c /tmp/retroarch/runloop.c

          grep -F 'H3531_FBIOGET_VBLANK_HIFB 0x00004664UL' /tmp/h3531_fb_gfx_stage317.c
          grep -F 'HIFB native vblank 0x4664 active; viewport-shadow presentation enabled' /tmp/h3531_fb_gfx_stage317.c
          grep -F 'VBLANK-PRESENT frames=%llu wait_avg=%.3fms copy_avg=%.3fms state=%s' /tmp/h3531_fb_gfx_stage317.c
          grep -F 'PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720' /tmp/h3531_fb_gfx_stage317.c
          grep -F 'RGB565 direct1x fastpath active: 640x480 -> 640x480' /tmp/h3531_fb_gfx_stage317.c
          grep -F 'RGB565 horizontal2x fastpath active: 320x480 -> 640x480' /tmp/h3531_fb_gfx_stage317.c
          grep -F '[H3531] EMU runs=' /tmp/retroarch/runloop.c

      - name: Install current H3531 drivers
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          cp /tmp/h3531_fb_gfx_stage317.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c
          cp ports/retroarch/linuxraw_joypad_h3531_event_fallback.c /tmp/retroarch/input/drivers_joypad/linuxraw_joypad.c
          cp ports/retroarch/h3531_ao_audio_stage3_8.c /tmp/retroarch/audio/drivers/h3531_ao_audio_base.inc
          cp ports/retroarch/h3531_ao_audio_stage3_11.c /tmp/retroarch/audio/drivers/oss.c
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc

      - name: Configure RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'
          ./configure --host=arm-linux-musleabi --enable-dynamic             --disable-qt --disable-x11 --disable-wayland             --disable-opengl --disable-opengl_core --disable-opengl1             --disable-opengles --disable-vulkan --disable-kms             --disable-sdl --disable-sdl2 --disable-udev             --disable-alsa --disable-pulse --enable-oss             --disable-ffmpeg --disable-freetype --disable-cheevos             --disable-networking --disable-netplaydiscovery             --disable-online_updater --disable-discord

      - name: Build RetroArch
        working-directory: /tmp/retroarch
        shell: bash
        run: |
          set -o pipefail
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 OS='Linux FPGA' HAVE_RGUI=1 HAVE_XMB=0 HAVE_OZONE=0 HAVE_MATERIALUI=0 HAVE_CC_RESAMPLER=1 HAVE_NEAREST_RESAMPLER=1 2>&1 | tee /tmp/retroarch-build.log

      - name: Validate Stage3.17 binary
        run: |
          set -eux
          R=/tmp/retroarch/retroarch
          test -s "$R"
          strings "$R" | grep -F '[H3531] HIFB native vblank 0x4664 active; viewport-shadow presentation enabled'
          strings "$R" | grep -F '[H3531] VBLANK-PRESENT frames=%llu wait_avg=%.3fms copy_avg=%.3fms state=%s'
          strings "$R" | grep -F '[H3531] PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720'
          strings "$R" | grep -F '[H3531] RGB565 row-reuse fastpath active:'
          strings "$R" | grep -F '[H3531] EMU runs='
          strings "$R" | grep -F '[H3531 AO] Stage3.11 bounded-latency transport active:'
          strings "$R" | grep -F '[H3531] keyboard input initialized; joypad ownership stays with RetroArch'
          strings "$R" | grep -F '[LinuxRaw/H3531] /dev/input/js* absent; enabling event fallback.'
          if strings "$R" | grep -F '[H3531] keyboard + standard linuxraw joypad input initialized'; then
            echo 'ERROR: old nested joypad ownership survived' >&2
            exit 1
          fi

      - name: Prepare runtime and QEMU smoke
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          RUNTIME=/tmp/h3531-runtime
          mkdir -p "$RUNTIME"
          LOADER="$(find "$TOOLCHAIN" -name ld-musl-arm.so.1 -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then RUNTIME_ELF="$LOADER"; else RUNTIME_ELF="$LIBC"; fi
          test -n "$RUNTIME_ELF"
          cp -L "$RUNTIME_ELF" "$RUNTIME/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$RUNTIME/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"; [ -z "$SRC" ] || cp -L "$SRC" "$RUNTIME/$lib"; done
          env LD_LIBRARY_PATH="$RUNTIME" qemu-arm -cpu cortex-a9 "$RUNTIME/ld-musl-arm.so.1"             --library-path "$RUNTIME" /tmp/retroarch/retroarch --version | tee /tmp/retroarch-version.txt

      - name: Package minimal frontend overlay
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          mkdir -p out/H3531/APPS/retroarch out/H3531/SYSTEM/docs
          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o out/H3531/APPS/retroarch/RETROARCH.BIN
          chmod 755 out/H3531/APPS/retroarch/RETROARCH.BIN
          cp /tmp/retroarch-version.txt out/H3531/SYSTEM/docs/STAGE3_17_RETROARCH_VERSION.txt
          cp /tmp/retroarch-build.log out/H3531/SYSTEM/docs/STAGE3_17_BUILD_LOG.txt
          cat > out/H3531/SYSTEM/docs/README_STAGE3_17_HIFB_VBLANK.txt <<'EOF'
          H3531 RetroArch Stage3.17 HIFB VBlank Presentation

          Purpose: remove framebuffer tearing / split-frame presentation without
          changing emulation timing, audio timing, cores, configs or controls.

          Preserved:
          - RetroArch exact-content runloop timer remains the emulation clock.
          - Stage3.11 bounded-latency AO remains unchanged.
          - current single-owner linuxraw event fallback remains unchanged.
          - PS1 V3 fastpaths and V4 EMU telemetry remain unchanged.

          Presentation change:
          - game viewport is assembled in normal RAM;
          - vendor HIFB ioctl 0x4664 is used only as a presentation-sync hint;
          - after that boundary, the prepared viewport is copied to visible VRAM;
          - 0x4664 is NOT used as a frame/master clock.
          - if vendor vblank is unavailable, a logged shadow-copy fallback remains.

          Hardware telemetry:
            [H3531] HIFB native vblank 0x4664 active; viewport-shadow presentation enabled
            [H3531] VBLANK-PRESENT frames=300 wait_avg=... copy_avg=... state=native
          EOF
          (cd out && sha256sum H3531/APPS/retroarch/RETROARCH.BIN > H3531/SYSTEM/docs/SHA256_STAGE3_17.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-RetroArch-Stage3.17-HIFBVBlankPresent
          path: out/
          if-no-files-found: error
          retention-days: 14
