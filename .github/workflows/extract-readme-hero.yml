name: Extract README hero photo

on:
  push:
    paths:
      - '.github/workflows/extract-readme-hero.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract real Bywater BASIC photo from technical documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          doc = Path('docs/AHB70XXT16-3531_Hi3531_Technical_Documentation_RU_v3.docx')
          out = Path('docs/images/monitor-bwbasic.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(doc) as z:
              data = z.read('word/media/image2.jpg')
          out.write_bytes(data)
          print(out, len(data))
          PY
      - name: Commit extracted photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/monitor-bwbasic.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'docs: restore Bywater BASIC hero photo'
          git push
