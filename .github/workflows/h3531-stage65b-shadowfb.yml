name: H3531 Stage6.5B ShadowFB Repaint Test

on:
  push:
    branches:
      - feature/h3531-stage64-lxde
    paths:
      - '.github/workflows/h3531-stage65b-shadowfb.yml'
      - 'ports/x11/README_STAGE6_5B_SHADOWFB.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download Stage6.5A DHCP-fixed base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.5A-Apps-Network-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35466395428

      - name: Verify and extract hardware-proven base
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.5A-Apps-Network-ReadyToCopy.zip
          test -f "$BASEZIP"
          echo "d0e1d57101b36485a89aa6c0358a0b34123ceec9f7a83dd8e6812d6fa8255d6d  $BASEZIP" | sha256sum -c -
          mkdir -p stage65b
          unzip -q "$BASEZIP" -d stage65b
          OUT="$PWD/stage65b/H3531/APPS/x11-debian"
          test "$(sha256sum "$OUT/bin/Xfbdev" | awk '{print $1}')" = "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip xfonts-utils

      - name: Bootstrap Wheezy armel X server build root
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb-src [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          deb-src [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            build-essential devscripts fakeroot dpkg-dev \
            x11-utils x11-xkb-utils xfonts-base xkb-data

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --allow-unauthenticated build-dep xorg-server

      - name: Fetch Wheezy Xfbdev source and force shadow framebuffer
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            'cd /build && apt-get -y --allow-unauthenticated source xorg-server=2:1.12.4-6+deb7u8'

          SRC="$(find rootfs/build -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          test -n "$SRC"
          echo "$SRC" > source-dir.txt

          # Keep the hardware-proven evdev build switches.
          sudo python3 - "$SRC/debian/rules" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          line="\tbuild_xfbdev += --enable-kdrive-mouse --enable-kdrive-evdev\n"
          if "--enable-kdrive-evdev" not in s:
              anchor="\tbuild_xfbdev = --enable-xfbdev\n"
              if anchor not in s:
                  raise SystemExit("Debian xfbdev rules anchor not found")
              s=s.replace(anchor,anchor+line,1)
              p.write_text(s)
          PY

          # H3531 experiment: normal KDrive fbdev maps packed-pixel fb0 directly.
          # Force KDrive's existing shadow layer even at RR_Rotate_0, so XCopyArea
          # and scrolling happen in RAM and only damaged rectangles are flushed
          # to the HiSilicon framebuffer.
          sudo python3 - "$SRC/hw/kdrive/fbdev/fbdev.c" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          patterns=[
              r'if\s*\(scrpriv->randr\s*!=\s*RR_Rotate_0\s*\|\|\s*priv->fix\.type\s*!=\s*FB_TYPE_PACKED_PIXELS\s*\)\s*scrpriv->shadow\s*=\s*TRUE;\s*else\s*scrpriv->shadow\s*=\s*FALSE;',
              r'if\s*\(scrpriv->randr\s*!=\s*RR_Rotate_0\s*\)\s*scrpriv->shadow\s*=\s*TRUE;\s*else\s*scrpriv->shadow\s*=\s*FALSE;',
          ]
          count=0
          for pat in patterns:
              s2,n=re.subn(pat,
                  '/* H3531 Stage6.5B: force software shadow framebuffer. */\n    scrpriv->shadow = TRUE;',
                  s,count=1,flags=re.S)
              if n:
                  s=s2
                  count=n
                  break
          if count != 1:
              raise SystemExit("Could not find unique fbdev shadow-selection block")
          p.write_text(s)
          PY

          grep -n -A6 -B6 'H3531 Stage6.5B' "$SRC/hw/kdrive/fbdev/fbdev.c"
          grep -n 'build_xfbdev' "$SRC/debian/rules"

      - name: Build ShadowFB Xfbdev
        run: |
          set -eux
          SRC_REL="/build/$(basename "$(cat source-dir.txt)")"
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            "cd '$SRC_REL' && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -uc -us -j2"

          DEB="$(find rootfs/build -maxdepth 1 -name 'xserver-xfbdev_*_armel.deb' | head -1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" rebuilt
          file rebuilt/usr/bin/Xfbdev
          strings rebuilt/usr/bin/Xfbdev | grep -E '^evdev$|Couldn.t find pointer driver|Couldn.t find keyboard driver' | head -30

      - name: Integrate ShadowFB server without replacing proven Xfbdev
        run: |
          set -eux
          OUT="$PWD/stage65b/H3531/APPS/x11-debian"
          DOC="$PWD/stage65b/H3531/SYSTEM/docs"

          # Preserve direct server exactly; add the experimental variant beside it.
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -
          cp rebuilt/usr/bin/Xfbdev "$OUT/bin/Xfbdev-shadow"

          # Match the proven runtime relocation used by the direct server.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage65b/H3531/APPS/x11-debian/bin/Xfbdev-shadow")
          data=p.read_bytes()
          old=b"/usr/bin\x00"
          new=b"/var\x00"
          count=data.count(old)
          if count != 1:
              raise SystemExit(f"Expected one XKB bin-directory string, got {count}")
          new += b"\x00" * (len(old)-len(new))
          p.write_bytes(data.replace(old,new,1))
          PY
          chmod 755 "$OUT/bin/Xfbdev-shadow"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage65b/H3531/APPS/x11-debian/START-LXDE-STAGE6.sh")
          s=p.read_text()
          old='XFBDEV="$BASE/bin/Xfbdev"'
          new='''XFBDEV_DIRECT="$BASE/bin/Xfbdev"
          XFBDEV_SHADOW="$BASE/bin/Xfbdev-shadow"
          if [ "${H3531_X11_SHADOW_FB:-0}" = "1" ]; then
              XFBDEV="$XFBDEV_SHADOW"
              XFBDEV_MODE=shadow
          else
              XFBDEV="$XFBDEV_DIRECT"
              XFBDEV_MODE=direct
          fi'''
          if old not in s:
              raise SystemExit("XFBDEV launcher anchor missing")
          s=s.replace(old,new,1)
          marker='echo "keyboard=$KEYBD mouse=$MOUSE duration=${DURATION}s autostart-terminal=$AUTOTERM"'
          if marker not in s:
              raise SystemExit("launcher status marker missing")
          s=s.replace(marker,marker+'\necho "xfbdev-mode=$XFBDEV_MODE server=$XFBDEV"',1)
          s=s.replace("Stage6.5A","Stage6.5B")
          p.write_text(s)
          PY

          cat >"$OUT/START-LXDE-STAGE6-SHADOW.sh" <<'EOF'
          #!/bin/sh
          export H3531_X11_SHADOW_FB=1
          exec /mnt/usb/H3531/APPS/x11-debian/START-LXDE-STAGE6.sh "$@"
          EOF
          chmod 755 "$OUT/START-LXDE-STAGE6-SHADOW.sh"

          cat >"$DOC/README_STAGE6_5B_SHADOWFB.txt" <<'EOF'
          H3531 Stage6.5B ShadowFB repaint experiment
          ===========================================

          Hardware symptom:
            desktop is stable at rest;
            vertical trails/echo appear during window dragging and page scrolling.

          Both operations heavily exercise X CopyArea-style movement. The proven
          direct Xfbdev is preserved as bin/Xfbdev. This package adds a second,
          source-rebuilt bin/Xfbdev-shadow which forces KDrive's software shadow
          framebuffer in normal orientation.

          Test shadow mode:
            H3531_LXDE_SECONDS=0 ./START-LXDE-STAGE6-SHADOW.sh

          Direct fallback remains:
            H3531_LXDE_SECONDS=0 ./START-LXDE-STAGE6.sh

          No saveenv. No SPI writes. No kernel replacement.
          EOF

          cat >"$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.5B
          Base: Stage6.5A Apps + Network + DHCP fix
          Experimental addition:
            Xfbdev-shadow = Debian Wheezy armel Xfbdev 1.12.4
            KDrive evdev enabled
            KDrive software shadow framebuffer forced at RR_Rotate_0
          Proven Xfbdev-direct preserved byte-for-byte.
          No saveenv. No SPI writes.
          EOF

      - name: ABI and dependency audit
        run: |
          set -eux
          OUT="$PWD/stage65b/H3531/APPS/x11-debian"
          D="$OUT/bin/Xfbdev"
          S="$OUT/bin/Xfbdev-shadow"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $D" | sha256sum -c -
          test "$(sha256sum "$D" | awk '{print $1}')" != "$(sha256sum "$S" | awk '{print $1}')"

          file "$D" "$S"
          readelf -h "$S"
          readelf -A "$S" || true
          if readelf -A "$S" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: ShadowFB server is hard-float"
            exit 1
          fi
          strings "$S" | grep -q '^evdev$'
          strings "$S" | grep -q 'shadowUpdatePacked'

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          out=Path("stage65b/H3531/APPS/x11-debian")
          available={p.name for p in (out/"lib").rglob("*") if p.is_file()}
          for binary in (out/"bin/Xfbdev",out/"bin/Xfbdev-shadow"):
              dyn=subprocess.check_output(["readelf","-d",str(binary)],text=True)
              needed=[]
              for line in dyn.splitlines():
                  if "(NEEDED)" not in line:
                      continue
                  a=line.find("["); b=line.find("]",a+1)
                  if a>=0 and b>a:
                      needed.append(line[a+1:b])
              missing=[n for n in needed if n not in available]
              print(binary.name,"needs",needed)
              if missing:
                  raise SystemExit(f"{binary}: missing libraries {missing}")
          PY

          grep -q 'H3531_X11_SHADOW_FB' "$OUT/START-LXDE-STAGE6.sh"
          grep -q 'XFBDEV_MODE=shadow' "$OUT/START-LXDE-STAGE6.sh"
          test -x "$OUT/START-LXDE-STAGE6-SHADOW.sh"

          find stage65b/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage65b/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_5B.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage65b
          zip -qr ../H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip \
            | tee H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.5B-ShadowFB-ReadyToCopy
          path: |
            H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip
            H3531-Stage6.5B-ShadowFB-ReadyToCopy.zip.sha256
          if-no-files-found: error
