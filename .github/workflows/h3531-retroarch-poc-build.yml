name: H3531 RetroArch framebuffer menu PoC

on:
  push:
    branches:
      - feature/retroarch-h3531-poc
    paths:
      - '.github/workflows/h3531-retroarch-poc-build.yml'
      - 'ports/retroarch/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          cd /tmp/retroarch
          git checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git rev-parse HEAD)" = "48cbdb2e78ea6c92ade103941c4958ea312a5995"

      - name: Install H3531 framebuffer and evdev adapters
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c

          # Current RetroArch video_driver_t uses a writable input_driver_t **
          # callback parameter. Keep the PoC source compatible with that exact
          # pinned API without altering the proven framebuffer logic.
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' \
            /tmp/retroarch/gfx/drivers/fpga_gfx.c

          grep -F 'RetroArch H3531 framebuffer PoC' /tmp/retroarch/gfx/drivers/fpga_gfx.c
          grep -F 'input_driver_t **input' /tmp/retroarch/gfx/drivers/fpga_gfx.c
          grep -F '"h3531"' /tmp/retroarch/gfx/drivers/fpga_gfx.c
          grep -F 'RetroArch H3531 evdev input PoC' /tmp/retroarch/input/drivers/linuxraw_input.c
          grep -F '"h3531evdev"' /tmp/retroarch/input/drivers/linuxraw_input.c

      - name: Configure minimal static ARM RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc
          export CXX=arm-linux-musleabi-g++
          export AR=arm-linux-musleabi-ar
          export RANLIB=arm-linux-musleabi-ranlib
          export STRIP=arm-linux-musleabi-strip
          export CFLAGS="-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-static -no-pie"

          ./configure --host=arm-linux-musleabi \
            --disable-qt \
            --disable-x11 \
            --disable-wayland \
            --disable-opengl \
            --disable-opengl_core \
            --disable-opengl1 \
            --disable-opengles \
            --disable-vulkan \
            --disable-kms \
            --disable-sdl \
            --disable-sdl2 \
            --disable-udev \
            --disable-alsa \
            --disable-pulse \
            --disable-oss \
            --disable-ffmpeg \
            --disable-freetype \
            --disable-cheevos \
            --disable-networking \
            --disable-netplaydiscovery \
            --disable-online_updater \
            --disable-discord

          echo '--- selected config ---'
          grep -E '^(OS|HAVE_(MENU|RGUI|XMB|OZONE|MATERIALUI|DYNAMIC|ALSA|UDEV|OPENGL|OPENGLES|VULKAN|KMS|SDL|SDL2|GFX_WIDGETS))' config.mk || true

      - name: Cross-build H3531 RetroArch menu PoC
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 \
            OS='Linux FPGA' \
            HAVE_RGUI=1 \
            HAVE_XMB=0 \
            HAVE_OZONE=0 \
            HAVE_MATERIALUI=0

      - name: Inspect ARM frontend
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          file retroarch
          arm-linux-musleabi-readelf -h retroarch
          arm-linux-musleabi-readelf -A retroarch || true
          if arm-linux-musleabi-readelf -d retroarch 2>&1 | grep -q 'Dynamic section'; then
            echo 'RetroArch unexpectedly has a dynamic section' >&2
            arm-linux-musleabi-readelf -d retroarch >&2
            exit 1
          fi
          strings retroarch | grep -F '[H3531] framebuffer ready:'
          strings retroarch | grep -F '[H3531] RetroArch evdev input initialized'
          strings retroarch | grep -F 'h3531evdev'

      - name: Package file-manager-safe PoC
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          mkdir -p out/H3531/APPS/retroarch

          # Real RetroArch frontend.
          arm-linux-musleabi-strip /tmp/retroarch/retroarch \
            -o out/H3531/APPS/retroarch/RETROARCH.BIN

          # Small static .APP entry point. It always supplies the H3531 config,
          # so opening RETROARCH.APP from FILES follows the proven session
          # lifecycle and does not require a second framebuffer-owning shell.
          arm-linux-musleabi-gcc \
            -O2 -fno-pie -march=armv7-a -mfloat-abi=soft \
            -static -no-pie \
            ports/retroarch/h3531-retroarch-launcher.c \
            -o out/H3531/APPS/retroarch/RETROARCH.APP
          arm-linux-musleabi-strip out/H3531/APPS/retroarch/RETROARCH.APP

          cp ports/retroarch/retroarch-h3531-poc.cfg \
            out/H3531/APPS/retroarch/retroarch.cfg

          file out/H3531/APPS/retroarch/RETROARCH.APP | tee out/FILE-LAUNCHER.txt
          file out/H3531/APPS/retroarch/RETROARCH.BIN | tee out/FILE-FRONTEND.txt
          sha256sum out/H3531/APPS/retroarch/RETROARCH.APP \
            out/H3531/APPS/retroarch/RETROARCH.BIN | tee out/SHA256.txt

          if arm-linux-musleabi-readelf -d out/H3531/APPS/retroarch/RETROARCH.APP 2>&1 | grep -q 'Dynamic section'; then
            echo 'launcher unexpectedly has a dynamic section' >&2
            exit 1
          fi
          if arm-linux-musleabi-readelf -d out/H3531/APPS/retroarch/RETROARCH.BIN 2>&1 | grep -q 'Dynamic section'; then
            echo 'frontend unexpectedly has a dynamic section' >&2
            exit 1
          fi
          arm-linux-musleabi-readelf -h out/H3531/APPS/retroarch/RETROARCH.APP | grep -F 'soft-float ABI'
          arm-linux-musleabi-readelf -h out/H3531/APPS/retroarch/RETROARCH.BIN | grep -F 'soft-float ABI'

          cat > out/README.txt <<'EOF'
          H3531 RetroArch Stage-1 PoC - file-manager launcher build

          PURPOSE
          -------
          Prove the real RetroArch RGUI on Hi3531 using:
            - direct /dev/fb0 HIFB A1R5G5B5 video
            - direct /dev/input/event* USB keyboard input
            - clean H3531 application/session lifecycle

          This package intentionally contains NO emulator core and NO H3531 AO
          audio yet. Nofrendo v11.1 is not modified or replaced.

          INSTALL
          -------
          Copy the H3531 directory from this archive onto the FAT32 USB root,
          merging directories. It only creates/updates:

            /H3531/APPS/retroarch/RETROARCH.APP
            /H3531/APPS/retroarch/RETROARCH.BIN
            /H3531/APPS/retroarch/retroarch.cfg

          FIRST PHYSICAL TEST
          -------------------
          In H3531 FILES browse to:

            /H3531/APPS/retroarch/RETROARCH.APP

          and press Enter.

          RETROARCH.APP is only a tiny launcher. It execs:

            /mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN
              --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -v

          This avoids launching RetroArch from a second shell while Monitor owns
          the framebuffer.

          EXPECTED UART MARKERS
          ---------------------
            H3531 RetroArch launcher: ...
            [H3531] framebuffer ready: /dev/fb0 ...
            [H3531] RetroArch evdev input initialized
            [H3531] evdev keyboard: /dev/input/eventX (...)

          KEYBOARD
          --------
            Arrows     navigate
            Enter      OK
            Backspace  Back
            F12        clean RetroArch exit -> Monitor

          STATUS
          ------
          CI/STATIC VERIFIED only. Physical Hi3531 verification is pending.
          EOF

          printf '%s\n' 48cbdb2e78ea6c92ade103941c4958ea312a5995 \
            > out/RETROARCH-UPSTREAM-SHA.txt

      - name: Upload H3531 RetroArch PoC
        uses: actions/upload-artifact@v4
        with:
          name: H3531-RetroArch-Stage1-PoC
          path: out/
          if-no-files-found: error
          retention-days: 14
