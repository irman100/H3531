name: H3531 Stage6.3 Openbox Light Desktop

on:
  push:
    branches:
      - feature/h3531-stage6-openbox
    paths:
      - 'ports/x11/START-X11-OPENBOX-STAGE6.sh'
      - 'ports/x11/README_STAGE6_3.md'
      - '.github/workflows/h3531-stage6-openbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download hardware-proven Stage6.1G base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35386700757

      - name: Extract and verify proven base
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.1G-Debian-Xfbdev-Matchbox-Pango-ReadyToCopy.zip
          mkdir -p stage63
          unzip -q "$BASEZIP" -d stage63
          OUT="$PWD/stage63/H3531/APPS/x11-debian"
          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -
          test -x "$OUT/bin/xsetroot"
          PANGO_VERSION="$(cat "$OUT/etc/pango/module-version")"
          test -f "$OUT/lib/pango/$PANGO_VERSION/modules/pango-basic-fc.so"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy Openbox payload
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg             wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF
          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -y --no-install-recommends --allow-unauthenticated install             openbox xterm

          for pkg in openbox xterm; do
            sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W               -f='${Package} ${Version}\n' "$pkg"
          done

      - name: Assemble Stage6.3 Openbox runtime
        run: |
          set -eux
          OUT="$PWD/stage63/H3531/APPS/x11-debian"
          DOC="$PWD/stage63/H3531/SYSTEM/docs"
          RUNTIME_BASE=/mnt/usb/H3531/APPS/x11-debian

          mkdir -p "$OUT/bin" "$OUT/etc/openbox" "$OUT/share/themes" "$DOC"

          cp rootfs/usr/bin/openbox "$OUT/bin/"
          cp rootfs/usr/bin/xterm "$OUT/bin/"

          # Add libraries not already in the proven Stage6.1G base.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                [ -e "$dst" ] || cp -L "$f" "$dst"
              done
          done

          cp -aL rootfs/usr/share/themes/. "$OUT/share/themes/"
          cp rootfs/etc/xdg/openbox/rc.xml "$OUT/etc/openbox/rc.xml"

          # Configure a deliberately light, conventional one-desktop setup.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("stage63/H3531/APPS/x11-debian/etc/openbox/rc.xml")
          s = p.read_text()
          s, n1 = re.subn(r'(<theme>.*?<name>).*?(</name>)',
                          r'\1Clearlooks\2', s, count=1, flags=re.S)
          s, n2 = re.subn(r'(<desktops>.*?<number>).*?(</number>)',
                          r'\g<1>1\2', s, count=1, flags=re.S)
          s = s.replace('<file>/var/lib/openbox/debian-menu.xml</file>', '')
          s = s.replace('<file>menu.xml</file>',
                        '<file>/mnt/usb/H3531/APPS/x11-debian/etc/openbox/menu.xml</file>')
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Openbox rc patch failed: theme={n1}, desktops={n2}")
          p.write_text(s)
          PY

          cat >"$OUT/etc/openbox/menu.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_menu xmlns="http://openbox.org/3.4/menu">
            <menu id="root-menu" label="H3531">
              <item label="Terminal">
                <action name="Execute">
                  <execute>/mnt/usb/H3531/APPS/x11-debian/bin/h3531-openbox-terminal</execute>
                </action>
              </item>
              <separator />
              <item label="Exit Openbox">
                <action name="Exit"><prompt>no</prompt></action>
              </item>
            </menu>
          </openbox_menu>
          EOF

          cat >"$OUT/bin/h3531-openbox-terminal" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          export DISPLAY=${DISPLAY:-127.0.0.1:0}
          export HOME=/var/h3531-x11
          export SHELL=/bin/sh
          export LC_ALL=C
          exec "$BASE/lib/ld-linux.so.3" --library-path "$BASE/lib"             "$BASE/bin/xterm" -display "$DISPLAY" -fn 9x15             -bg white -fg black -geometry 92x30+150+100 -title "H3531 Terminal"
          EOF
          chmod 755 "$OUT/bin/h3531-openbox-terminal"

          cp ports/x11/START-X11-OPENBOX-STAGE6.sh "$OUT/"
          chmod 755 "$OUT/START-X11-OPENBOX-STAGE6.sh" "$OUT/bin/openbox" "$OUT/bin/xterm"

          cat >"$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.3
          Base: hardware-proven Stage6.1G X11 runtime
          Xfbdev SHA256: 0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482
          Window manager: Debian Wheezy Openbox 3.5.0
          Desktop: pure white X root
          Theme: Clearlooks
          Application: movable/resizable xterm
          No Matchbox Desktop/Panel and no GdkPixbuf/PNG critical path.
          EOF

          cat >"$DOC/README_STAGE6_3_OPENBOX.txt" <<'EOF'
          Stage6.3 changes only the window manager.

          The hardware-proven Xfbdev/KDrive/XKB/font stack is preserved.
          Matchbox is replaced by Debian Wheezy Openbox because the target user
          experience is a conventional mouse-driven desktop with movable and
          resizable windows.

          Expected hardware result:
            pure white desktop
            large light decorated Terminal
            drag by titlebar
            resize by edges/corners
            close/minimize/maximize buttons
            right-click desktop menu

          No saveenv. No SPI writes.
          EOF

      - name: ABI dependency and Openbox audit
        run: |
          set -eux
          OUT="$PWD/stage63/H3531/APPS/x11-debian"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          for b in openbox xterm; do
            file "$OUT/bin/$b"
            readelf -A "$OUT/bin/$b" || true
            if readelf -A "$OUT/bin/$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          out = Path("stage63/H3531/APPS/x11-debian")
          lib = out / "lib"
          available = {p.name for p in lib.iterdir() if p.is_file()}
          checked = 0
          for obj in out.rglob("*"):
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(["readelf", "-h", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(["readelf", "-d", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [n for n in needed if n not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("Recursive ELF dependency audit objects:", checked)
          PY

          test -f "$OUT/share/themes/Clearlooks/openbox-3/themerc"
          grep -q '<name>Clearlooks</name>' "$OUT/etc/openbox/rc.xml"
          grep -q 'h3531-openbox-terminal' "$OUT/etc/openbox/menu.xml"

          LC_ALL=C LANG=C LANGUAGE=C             qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$OUT/lib"             "$OUT/bin/openbox" --version

          find stage63/H3531 -type f -print0 | sort -z | xargs -0 sha256sum             > stage63/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_3.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage63
          zip -qr ../H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy.zip             | tee H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy
          path: |
            H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy.zip
            H3531-Stage6.3-Openbox-Light-Desktop-ReadyToCopy.zip.sha256
          if-no-files-found: error
