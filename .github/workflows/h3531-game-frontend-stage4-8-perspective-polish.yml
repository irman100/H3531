name: H3531 Game Frontend Stage4.8 Perspective Polish

on:
  push:
    branches:
      - feature/h3531-game-frontend-stage4-8-perspective-polish
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-8-perspective-polish.yml'
      - 'ports/frontend/patch_stage48_perspective_polish.py'
      - 'ports/frontend/patch_stage47_focus_performance.py'
      - 'ports/frontend/patch_stage46_sprite_ui.py'
      - 'ports/frontend/patch_stage45_reference_fidelity.py'
      - 'ports/frontend/patch_stage44_pixelstation_theme.py'
      - 'ports/frontend/patch_stage44_normalize_dispatcher.py'
      - 'ports/frontend/patch_stage44_restore_future_icons.py'
      - 'ports/frontend/patch_stage43_pixel_system_icons.py'
      - 'ports/frontend/patch_stage42_stable_system_order.py'
      - 'ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file python3

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2
          git checkout 8224e427b655b83dae5e2298f1e6919523a78737
          git clone https://github.com/nothings/stb.git /tmp/stb
          cd /tmp/stb
          git checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20

      - name: Generate Stage4.8 source
        run: |
          set -eux
          python3 ports/frontend/patch_stage42_stable_system_order.py ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp /tmp/s42.cpp
          python3 ports/frontend/patch_stage43_pixel_system_icons.py /tmp/s42.cpp /tmp/s43.cpp
          python3 ports/frontend/patch_stage44_pixelstation_theme.py /tmp/s43.cpp /tmp/s44-pre.cpp
          python3 ports/frontend/patch_stage44_normalize_dispatcher.py /tmp/s44-pre.cpp /tmp/s44-normalized.cpp
          python3 ports/frontend/patch_stage44_restore_future_icons.py /tmp/s44-normalized.cpp /tmp/s44.cpp
          python3 ports/frontend/patch_stage45_reference_fidelity.py /tmp/s44.cpp /tmp/s45.cpp
          python3 ports/frontend/patch_stage46_sprite_ui.py /tmp/s45.cpp /tmp/s46.cpp
          python3 ports/frontend/patch_stage47_focus_performance.py /tmp/s46.cpp /tmp/s47.cpp
          python3 ports/frontend/patch_stage48_perspective_polish.py /tmp/s47.cpp /tmp/s48.cpp
          grep -F 'Stage4.8 PixelStation perspective-polish UI active' /tmp/s48.cpp
          grep -F 'stage48_draw_exact_asset' /tmp/s48.cpp
          grep -F 'stage48_reflect_card' /tmp/s48.cpp
          grep -F 'stage48_draw_cover_shear' /tmp/s48.cpp

      - name: Native build and layout test
        run: |
          set -eux
          g++ -std=c++14 -O3 -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend /tmp/s48.cpp /tmp/tinyxml2/tinyxml2.cpp -o /tmp/gamefront-host
          /tmp/gamefront-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'STAGE48_FRAME exact-stretch idle-focus-identical-geometry panel-margin-rom12-system14' /tmp/layout-host.txt
          grep -F 'STAGE48_SMOOTH cadence=16ms anim=128ms focus-steps=8 cache-cover=56' /tmp/layout-host.txt
          grep -F 'STAGE48_PERSPECTIVE outer-cards-shear=14 width=92pct reflection=scanline-fade' /tmp/layout-host.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: ARM build
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O3 -fno-pie -static -no-pie -march=armv7-a -mfloat-abi=soft \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/s48.cpp /tmp/tinyxml2/tinyxml2.cpp -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | tee /tmp/type.txt
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/type.txt
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.8 PixelStation perspective-polish UI active'
          strings /tmp/GAMEFRONT.APP | grep -F 'ui/rom_frame_focus.png'
          strings /tmp/GAMEFRONT.APP | grep -F 'ui/system_frame_focus.png'

      - name: QEMU layout and routing
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'STAGE48_FRAME exact-stretch idle-focus-identical-geometry panel-margin-rom12-system14' /tmp/layout-arm.txt
          grep -F 'STAGE48_SMOOTH cadence=16ms anim=128ms focus-steps=8 cache-cover=56' /tmp/layout-arm.txt
          grep -F 'STAGE48_PERSPECTIVE outer-cards-shear=14 width=92pct reflection=scanline-fade' /tmp/layout-arm.txt
          grep -F 'BACKBUFFER coherent-full-frame-blit' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

          mkdir -p /tmp/t/nes /tmp/t/md
          : > '/tmp/t/nes/Demo Game.nes'
          : > '/tmp/t/md/Comix Zone [Rus].bin'
          cat > /tmp/t/es_systems.cfg <<'EOF'
          <systemList>
            <system><name>nes</name><fullname>Nintendo Entertainment System</fullname><path>/tmp/t/nes</path><extension>.nes</extension><command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so %ROM_RAW%</command><theme>nes</theme></system>
            <system><name>megadrive</name><fullname>Sega Mega Drive</fullname><path>/tmp/t/md</path><extension>.bin .md .gen .smd</extension><command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW%</command><theme>megadrive</theme></system>
          </systemList>
          EOF
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --self-test /tmp/t/es_systems.cfg | tee /tmp/route.txt
          grep -F 'ROUTE system=nes' /tmp/route.txt | grep -F 'fceumm_libretro.so'
          grep -F 'ROUTE system=megadrive' /tmp/route.txt | grep -F 'picodrive_libretro.so'
          grep -F 'SELF_TEST_OK systems=2 games=2' /tmp/route.txt

      - name: Package binary overlay
        run: |
          set -eux
          ROOT=out/H3531/APPS/gamefront
          mkdir -p "$ROOT/licenses"
          cp /tmp/GAMEFRONT.APP "$ROOT/GAMEFRONT.APP"
          cp ports/frontend/es_systems.cfg "$ROOT/es_systems.cfg"
          cp /tmp/tinyxml2/LICENSE.txt "$ROOT/licenses/tinyxml2-LICENSE.txt"
          cp /tmp/stb/LICENSE "$ROOT/licenses/stb-LICENSE.txt"
          cat > "$ROOT/README_STAGE4_8.txt" <<'EOF'
          H3531 Game Frontend Stage4.8 - Perspective Polish
          Replace only /H3531/APPS/gamefront/.
          Final archive must include Stage4.8 runtime assets under assets/ and assets/ui/.
          RetroArch and cores are unchanged.
          EOF
          cp /tmp/layout-arm.txt out/STAGE4_8-LAYOUT.txt
          cp /tmp/route.txt out/STAGE4_8-ROUTING.txt
          cp /tmp/type.txt out/STAGE4_8-BINARY-TYPE.txt
          (cd out && find H3531/APPS/gamefront -type f -print0 | sort -z | xargs -0 sha256sum > SHA256-CI.txt && sha256sum -c SHA256-CI.txt)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.8-PerspectivePolish-Binary
          path: out/
          if-no-files-found: error
          retention-days: 14
