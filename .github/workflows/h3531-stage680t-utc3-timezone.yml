name: H3531 Stage6.8.0T UTC+3 Timezone

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-stage680t-utc3-timezone.yml'
      - 'ports/stage66a/START-DESKTOP.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate timezone startup
        run: |
          set -eux
          sh -n ports/stage66a/START-DESKTOP.sh
          grep -F "TZ_VALUE='MSK-3'" ports/stage66a/START-DESKTOP.sh
          grep -F 'export TZ="$TZ_VALUE"' ports/stage66a/START-DESKTOP.sh
          grep -F 'TIMEZONE.CFG' ports/stage66a/START-DESKTOP.sh

      - name: Assemble minimal Stage6.8.0T patch
        run: |
          set -eux
          mkdir -p out/H3531/APPS/x11-debian out/H3531/SYSTEM/docs
          cp ports/stage66a/START-DESKTOP.sh out/H3531/APPS/x11-debian/START-DESKTOP.sh
          chmod 755 out/H3531/APPS/x11-debian/START-DESKTOP.sh

          cat > out/H3531/SYSTEM/docs/README_STAGE6_8_0T_UTC3.txt <<'EOF'
          Stage6.8.0T — default timezone correction

          Default timezone changed from CET/CEST (UTC+1/+2)
          to fixed UTC+3:
            TZ=MSK-3

          POSIX TZ uses reversed signs, so "MSK-3" means UTC+3.

          RTC and CLOCK_REALTIME remain stored in UTC.
          Only local presentation is shifted to UTC+3.

          Optional override remains available through:
            /mnt/usb/H3531/SYSTEM/TIMEZONE.CFG

          Example:
            TZ=MSK-3

          This patch replaces only START-DESKTOP.sh.
          EOF

          test -x out/H3531/APPS/x11-debian/START-DESKTOP.sh

      - name: Create verified ZIP
        run: |
          set -eux
          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum               > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0T.txt
            sed -i '/SHA256SUMS_STAGE6_8_0T.txt/d' H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0T.txt
            sha256sum -c H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0T.txt
          )
          cd out
          zip -qr ../H3531-Stage6.8.0T-UTC3-Timezone-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.8.0T-UTC3-Timezone-PATCH.zip             | tee H3531-Stage6.8.0T-UTC3-Timezone-PATCH.zip.sha256
          unzip -t H3531-Stage6.8.0T-UTC3-Timezone-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.8.0T-UTC3-Timezone-PATCH
          path: |
            H3531-Stage6.8.0T-UTC3-Timezone-PATCH.zip
            H3531-Stage6.8.0T-UTC3-Timezone-PATCH.zip.sha256
          retention-days: 14
