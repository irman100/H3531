name: H3531 Stage6.8.0H Adaptive Analog Bundle

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-stage680h-adaptive-analog-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y unzip zip file binutils busybox

      - name: Download proven Stage6.8.0G base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.8.0G-RecalboxVisualAnalog-PATCH
          path: stage680g
          github-token: ${{ github.token }}
          run-id: 36048708865

      - name: Download proven Stage4.39 Adaptive Analog frontend
        uses: actions/download-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.39-AdaptiveAxis
          path: frontend439
          github-token: ${{ github.token }}
          run-id: 36050644790

      - name: Assemble Stage6.8.0H overlay
        run: |
          set -eux

          BASEZIP=stage680g/H3531-Stage6.8.0G-RecalboxVisualAnalog-PATCH.zip
          test -f "$BASEZIP"
          unzip -q "$BASEZIP" -d out

          test -f out/H3531/APPS/retroarch/RETROARCH.BIN
          test -f out/H3531/APPS/retroarch/RETROARCH.APP
          test -f out/H3531/APPS/retroarch/retroarch.cfg
          test -f out/H3531/APPS/gamefront/GAMEFRONT.APP
          test -f out/H3531/APPS/x11-debian/bin/Xfbdev-shadow-live

          test -f frontend439/H3531/APPS/gamefront/GAMEFRONT.APP
          cp -a frontend439/H3531/. out/H3531/

          chmod 755 out/H3531/APPS/gamefront/GAMEFRONT.APP
          chmod 755 out/H3531/APPS/retroarch/RETROARCH.BIN
          chmod 755 out/H3531/APPS/retroarch/RETROARCH.APP

          mkdir -p out/H3531/SYSTEM/docs

          cat >out/H3531/APPS/x11-debian/SYSTEM.VERSION <<'EOF'
          Stayplaytion Stage6.8.0H Adaptive Analog
          Base: proven Stage6.8.0G Recalbox Visual Analog
          Desktop: detached keyboard/mouse boot + live KDrive hotplug
          Controller transport: /dev/input/event* fallback shared by Stayplaytion and RetroArch
          First-run UX: WELCOME -> visual full controller wizard with adaptive analog capture
          Main menu: Recalbox-style compact menu + Controllers -> Hotkey Actions
          B behavior: Back; shell exit only through Quit -> Return to Desktop
          Input profile: standard RetroArch linuxraw autoconfig + adaptive right-stick capture + Hotkey actions
          Safety: no SPI writes, no saveenv, no U-Boot changes
          EOF

          cat >out/H3531/SYSTEM/docs/README_STAGE6_8_0H_ADAPTIVE_ANALOG.txt <<'EOF'
          Stayplaytion Stage6.8.0H Adaptive Analog

          Base:
          - proven Stage6.8.0G boot/desktop/event-controller/Recalbox visual wizard;
          - only GAMEFRONT.APP is upgraded to Stage4.39.

          Why:
          - some inexpensive GameStick pads expose the right stick with a much
            smaller effective travel than their advertised ABS min/max range;
          - Stage4.38 required a normalized delta >16000, which can miss such axes
            even though R3 (stick click) works.

          Stage4.39 behavior:
          - analog capture is adaptive;
          - immediate acceptance threshold: 9000 normalized delta;
          - confirmed repeated-event threshold: 5500 normalized delta;
          - right-stick candidates such as ABS_RX/ABS_RY/ABS_Z/ABS_RZ are handled
            exactly like every other mapped EV_ABS axis;
          - every analog event seen by the wizard is logged with:
              event path
              raw ABS code/name
              mapped axis number
              normalized value
              baseline
              delta
          - accepted axes produce a dedicated ACCEPT log line with peak/sign.

          All Stage6.8.0G behavior remains:
          - Recalbox-style visual controller wizard;
          - left/right analog sticks and L3/R3;
          - L1/R1/L2/R2;
          - Hotkey modifier + Hotkey Actions;
          - standard RetroArch autoconfig;
          - /dev/input/event* fallback;
          - no dependency on /dev/input/js*;
          - inotify/epoll hotplug;
          - B = Back; Start/Menu = Main Menu.

          If the right stick is still invisible, the new log proves whether its
          axes live on another event node or use an unusual ABS code, allowing the
          next fix to be hardware-specific instead of guessing.

          No SPI NOR, U-Boot, saveenv or external-root changes are included.
          EOF

      - name: Validate Stage6.8.0H components
        run: |
          set -eux
          X=out/H3531/APPS/x11-debian
          G=out/H3531/APPS/gamefront/GAMEFRONT.APP
          R=out/H3531/APPS/retroarch/RETROARCH.BIN
          C=out/H3531/APPS/retroarch/retroarch.cfg

          file "$X/bin/Xfbdev-shadow-live" | tee /tmp/xfbdev.file
          grep -F 'ELF 32-bit LSB' /tmp/xfbdev.file
          grep -F 'ARM, EABI5' /tmp/xfbdev.file
          strings "$X/bin/Xfbdev-shadow-live" | grep -F 'Stage6.8.0A evdev keyboard detached at X start'

          file "$G" | tee /tmp/gamefront.file
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/gamefront.file
          strings "$G" | grep -F 'Stage4.39 Adaptive analog axis capture active'
          strings "$G" | grep -F 'PRESS ANY BUTTON TO CONFIGURE'
          strings "$G" | grep -F 'LEFT STICK UP'
          strings "$G" | grep -F '[GAMEFRONT] axis-capture path=%s code=%u(%s) mapped=%u value=%d baseline=%d delta=%d'
          strings "$G" | grep -F '[GAMEFRONT] axis-capture ACCEPT mapped=%u peak=%d sign=%d step=%s'
          strings "$G" | grep -F 'LEFT STICK LEFT'
          strings "$G" | grep -F 'RIGHT STICK UP'
          strings "$G" | grep -F 'RIGHT STICK LEFT'
          strings "$G" | grep -F 'L3  LEFT STICK CLICK'
          strings "$G" | grep -F 'R3  RIGHT STICK CLICK'
          strings "$G" | grep -F 'OPTIONAL: HOLD ANY BUTTON 1 SEC TO SKIP'
          strings "$G" | grep -F 'L STICK'
          strings "$G" | grep -F 'R STICK'
          strings "$G" | grep -F 'L1  SHOULDER'
          strings "$G" | grep -F 'R1  SHOULDER'
          strings "$G" | grep -F 'L2  TRIGGER'
          strings "$G" | grep -F 'R2  TRIGGER'
          strings "$G" | grep -F 'HOTKEY ACTIONS'
          strings "$G" | grep -F 'HOTKEY MODIFIER'
          strings "$G" | grep -F 'FAST FORWARD (HOLD)'
          strings "$G" | grep -F '[STAYPLAYTION] RetroArch hotkey binding saved: %s'
          strings "$G" | grep -F 'REWIND REQUIRES GAME SETTINGS > REWIND = ON'
          strings "$G" | grep -F 'MAIN MENU'
          strings "$G" | grep -F 'GAME SETTINGS'
          strings "$G" | grep -F 'CONTROLLERS SETTINGS'
          strings "$G" | grep -F 'RETROARCH INPUT / HOTKEYS'
          strings "$G" | grep -F 'SYSTEM SETTINGS'
          strings "$G" | grep -F 'RETURN TO DESKTOP'
          strings "$G" | grep -F 'standard RetroArch controller profile saved'
          strings "$G" | grep -F 'linuxraw event-fallback gamepad%d ready'
          strings "$G" | grep -F 'gamepad event node absent; inotify hotplug active'
          ! strings "$G" | grep -F 'NO /DEV/INPUT/JS CONTROLLER FOUND'
          ! strings "$G" | grep -F 'ASSIGN HOTKEY'

          file "$R" | tee /tmp/retroarch.file
          grep -F 'ELF 32-bit LSB' /tmp/retroarch.file
          strings "$R" | grep -F '[H3531] standard RetroArch joypad driver: %s'
          strings "$R" | grep -F '[LinuxRaw/H3531] /dev/input/js* absent; enabling event fallback.'
          strings "$R" | grep -F '[LinuxRaw/H3531] Event fallback device name is "%s" path=%s.'
          strings "$R" | grep -F '[LinuxRaw/H3531] evdev maps: %u buttons, %u axes.'

          grep -F 'input_joypad_driver = "linuxraw"' "$C"
          grep -F 'input_autodetect_enable = "true"' "$C"
          grep -F 'joypad_autoconfig_dir = "/mnt/usb/H3531/USER/retroarch/autoconfig"' "$C"
          grep -F 'config_save_on_exit = "true"' "$C"

          busybox sh -n "$X/bin/h3531-input-discover"
          busybox sh -n "$X/bin/h3531-lxde-core"
          busybox sh -n out/H3531/APPS/h3531-native-run
          busybox sh -n out/H3531/SYSTEM/MONITOR.APP

      - name: Create verified Stage6.8.0H ZIP
        run: |
          set -eux
          rm -f out/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0H.txt
          (
            cd out
            find H3531 -type f \
              ! -path 'H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0H.txt' \
              -print0 | sort -z | xargs -0 sha256sum \
              > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0H.txt
            sha256sum -c H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0H.txt
          )

          cd out
          zip -qr ../H3531-Stage6.8.0H-AdaptiveAnalog-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.8.0H-AdaptiveAnalog-PATCH.zip \
            | tee H3531-Stage6.8.0H-AdaptiveAnalog-PATCH.zip.sha256
          unzip -t H3531-Stage6.8.0H-AdaptiveAnalog-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.8.0H-AdaptiveAnalog-PATCH
          path: |
            H3531-Stage6.8.0H-AdaptiveAnalog-PATCH.zip
            H3531-Stage6.8.0H-AdaptiveAnalog-PATCH.zip.sha256
          retention-days: 14
