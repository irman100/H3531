name: H3531 RetroArch Stage3.16 V4 Input Hotfix

on:
  push:
    branches:
      - fix/h3531-evdev-keyboard-gamepad-filter
    paths:
      - '.github/workflows/h3531-retroarch-stage3-16-input-hotfix.yml'
      - 'ports/retroarch/linuxraw_joypad_h3531_event_fallback.c'
      - 'ports/retroarch/linuxraw_input_h3531.c'
      - 'ports/retroarch/h3531_fb_gfx.c'
      - 'ports/retroarch/h3531_fb_gfx_fast_aspect.c'
      - 'ports/retroarch/h3531_ao_audio_stage3_8.c'
      - 'ports/retroarch/h3531_ao_audio_stage3_11.c'
      - 'ports/retroarch/patch_stage422_v3_ps1_video.py'
      - 'ports/retroarch/patch_stage422_v4_emu_speed.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user python3 binutils

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          git -C /tmp/retroarch checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git -C /tmp/retroarch rev-parse HEAD)" = 48cbdb2e78ea6c92ade103941c4958ea312a5995

      - name: Generate Stage3.16 V4 PS1 path
        run: |
          set -eux
          python3 ports/retroarch/patch_stage422_v3_ps1_video.py ports/retroarch/h3531_fb_gfx_fast_aspect.c /tmp/h3531_fb_gfx_stage443.c
          python3 ports/retroarch/patch_stage422_v4_emu_speed.py /tmp/retroarch/runloop.c /tmp/runloop_stage443.c
          cp /tmp/runloop_stage443.c /tmp/retroarch/runloop.c
          grep -F 'PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720' /tmp/h3531_fb_gfx_stage443.c
          grep -F '[H3531] EMU runs=' /tmp/retroarch/runloop.c

      - name: Install H3531 video input joypad and AO transports
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          cp /tmp/h3531_fb_gfx_stage443.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c
          cp ports/retroarch/linuxraw_joypad_h3531_event_fallback.c /tmp/retroarch/input/drivers_joypad/linuxraw_joypad.c
          cp ports/retroarch/h3531_ao_audio_stage3_8.c /tmp/retroarch/audio/drivers/h3531_ao_audio_base.inc
          cp ports/retroarch/h3531_ao_audio_stage3_11.c /tmp/retroarch/audio/drivers/oss.c
          sed -i 's/const input_driver_t **input/input_driver_t **input/' /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          grep -F 'Ignoring non-gamepad evdev device' /tmp/retroarch/input/drivers_joypad/linuxraw_joypad.c
          grep -F 'h3531_evdev_gamepad_capable(int fd, const char *name)' /tmp/retroarch/input/drivers_joypad/linuxraw_joypad.c
          ! grep -F 'if (H3531_TEST_BIT(KEY_UP, keybits)) ++game_keys;' /tmp/retroarch/input/drivers_joypad/linuxraw_joypad.c

      - name: Configure Cortex-A9 dynamic RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export CFLAGS='-O3 -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'
          ./configure --host=arm-linux-musleabi --enable-dynamic \
            --disable-qt --disable-x11 --disable-wayland \
            --disable-opengl --disable-opengl_core --disable-opengl1 --disable-opengles --disable-vulkan --disable-kms \
            --disable-sdl --disable-sdl2 --disable-udev \
            --disable-alsa --disable-pulse --enable-oss \
            --disable-ffmpeg --disable-freetype --disable-cheevos \
            --disable-networking --disable-netplaydiscovery --disable-online_updater --disable-discord

      - name: Build Stage3.16 RetroArch frontend
        working-directory: /tmp/retroarch
        shell: bash
        run: |
          set -o pipefail
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 OS='Linux FPGA' HAVE_RGUI=1 HAVE_XMB=0 HAVE_OZONE=0 HAVE_MATERIALUI=0 HAVE_CC_RESAMPLER=1 HAVE_NEAREST_RESAMPLER=1 2>&1 | tee /tmp/retroarch-build.log
          test -s retroarch

      - name: Verify binary and Stage3.16 invariants
        working-directory: /tmp/retroarch
        run: |
          set -eux
          R=retroarch
          file "$R" | tee /tmp/retroarch-binary.txt
          grep -F 'ELF 32-bit LSB' /tmp/retroarch-binary.txt
          strings "$R" | grep -F '[H3531] PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720'
          strings "$R" | grep -F '[H3531] EMU runs='
          strings "$R" | grep -F '[H3531 AO] Stage3.11 bounded-latency transport active:'
          strings "$R" | grep -F '[LinuxRaw/H3531] Ignoring non-gamepad evdev device'
          strings "$R" | grep -F '[LinuxRaw/H3531] /dev/input/js* absent; enabling event fallback.'
          strings "$R" | grep -F '[LinuxRaw/H3531] Event fallback device name is "%s" path=%s.'
          strings "$R" | grep -F '[LinuxRaw/H3531] evdev maps: %u buttons, %u axes.'
          nm "$R" | grep -F 'CC_resampler'

      - name: QEMU version smoke and package
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          RUNTIME=/tmp/h3531-runtime
          mkdir -p "$RUNTIME" out/H3531/APPS/retroarch
          LOADER="$(find "$TOOLCHAIN" -name ld-musl-arm.so.1 -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then RUNTIME_ELF="$LOADER"; else RUNTIME_ELF="$LIBC"; fi
          test -n "$RUNTIME_ELF"
          cp -L "$RUNTIME_ELF" "$RUNTIME/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$RUNTIME/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"; [ -z "$SRC" ] || cp -L "$SRC" "$RUNTIME/$lib"; done
          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o out/H3531/APPS/retroarch/RETROARCH.BIN
          chmod 755 out/H3531/APPS/retroarch/RETROARCH.BIN
          env LD_LIBRARY_PATH="$RUNTIME" qemu-arm -cpu cortex-a9 "$RUNTIME/ld-musl-arm.so.1" --library-path "$RUNTIME" out/H3531/APPS/retroarch/RETROARCH.BIN --version | tee out/RETROARCH-QEMU-VERSION.txt
          cp /tmp/retroarch-binary.txt out/RETROARCH-BINARY.txt
          sha256sum out/H3531/APPS/retroarch/RETROARCH.BIN | tee out/RETROARCH-BIN-SHA256.txt
          (cd out && sha256sum H3531/APPS/retroarch/RETROARCH.BIN RETROARCH-QEMU-VERSION.txt RETROARCH-BINARY.txt > SHA256-HOTFIX.txt && sha256sum -c SHA256-HOTFIX.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-RetroArch-Stage3.16-V4-InputHotfix
          path: out/
          if-no-files-found: error
          retention-days: 14
