name: H3531 Stage4.26 SNES + GBA Engine Tuning

on:
  push:
    branches:
      - feature/h3531-stage4-26-snes-gba-engine-tuning-clean
    paths:
      - '.github/workflows/h3531-stage4-26-snes-gba-engine-tuning.yml'
      - 'ports/retroarch/patch_stage426_snes_gba_video.py'
      - 'ports/retroarch/retroarch-h3531-stage426-gba.cfg'
      - 'ports/retroarch/retroarch-h3531-stage426-snes.cfg'
      - 'ports/retroarch/retroarch-core-options-gba-stage426.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file git curl make pkg-config qemu-user python3 binutils

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned RetroArch and cores
        run: |
          set -eux
          git clone https://github.com/libretro/RetroArch.git /tmp/retroarch
          git -C /tmp/retroarch checkout 48cbdb2e78ea6c92ade103941c4958ea312a5995
          test "$(git -C /tmp/retroarch rev-parse HEAD)" = 48cbdb2e78ea6c92ade103941c4958ea312a5995

          git clone https://github.com/libretro/snes9x2005.git /tmp/snes9x2005
          git -C /tmp/snes9x2005 checkout deb49d80d1836e3e737480a326e31a54c46c04ae
          test "$(git -C /tmp/snes9x2005 rev-parse HEAD)" = deb49d80d1836e3e737480a326e31a54c46c04ae

          git clone https://github.com/libretro/gpsp.git /tmp/gpsp
          git -C /tmp/gpsp checkout 8d268a6bb2cd799f8f2791ebb544a7ef550cfc6f
          test "$(git -C /tmp/gpsp rev-parse HEAD)" = 8d268a6bb2cd799f8f2791ebb544a7ef550cfc6f

      - name: Build tuned Snes9x 2005 for Cortex-A9 softfp
        working-directory: /tmp/snes9x2005
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CFLAGS='-O3 -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -fomit-frame-pointer -ffast-math -fno-math-errno -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          make clean || true
          make -j2 platform=armv7-softfloat \
            CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar \
            USE_BLARGG_APU=0
          test -s snes9x2005_libretro.so
          file snes9x2005_libretro.so | tee /tmp/snes-type.txt
          arm-linux-musleabi-readelf -A snes9x2005_libretro.so | tee /tmp/snes-attrs.txt
          ! grep -qi neon /tmp/snes-attrs.txt
          arm-linux-musleabi-nm -D --defined-only snes9x2005_libretro.so | grep -E ' retro_(init|run|get_system_info)$'

      - name: Build tuned gpSP ARM dynarec for Cortex-A9 softfp
        working-directory: /tmp/gpsp
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CFLAGS='-O3 -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -marm -fomit-frame-pointer -ffast-math -fno-math-errno -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -D_GNU_SOURCE'
          export CXXFLAGS="$CFLAGS"
          export ASFLAGS='-mcpu=cortex-a9 -mfloat-abi=softfp -marm'
          make clean || true
          make -j2 platform=armv7-cortexa9-softfloat \
            CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar
          test -s gpsp_libretro.so
          file gpsp_libretro.so | tee /tmp/gpsp-type.txt
          arm-linux-musleabi-readelf -A gpsp_libretro.so | tee /tmp/gpsp-attrs.txt
          ! grep -qi neon /tmp/gpsp-attrs.txt
          arm-linux-musleabi-nm -D --defined-only gpsp_libretro.so | grep -E ' retro_(init|run|get_system_info)$'
          strings gpsp_libretro.so | grep -F 'gpsp_drc'
          strings gpsp_libretro.so | grep -F 'Dynamic Recompiler'

      - name: Generate Stage4.26 H3531 framebuffer driver
        run: |
          set -eux
          python3 ports/retroarch/patch_stage422_v3_ps1_video.py \
            ports/retroarch/h3531_fb_gfx_fast_aspect.c /tmp/h3531_fb_gfx_v3.c
          python3 ports/retroarch/patch_stage426_snes_gba_video.py \
            /tmp/h3531_fb_gfx_v3.c /tmp/h3531_fb_gfx_stage426.c
          grep -F 'Stage4.26 GBA RGB565 integer4x fastpath active: 240x160 -> 960x640' /tmp/h3531_fb_gfx_stage426.c
          grep -F 'Stage4.26 SNES RGB565 4:3 fastpath active: 256x224 -> 896x672' /tmp/h3531_fb_gfx_stage426.c
          grep -F 'PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720' /tmp/h3531_fb_gfx_stage426.c

      - name: Preserve V4 real emulation-speed telemetry
        run: |
          set -eux
          python3 ports/retroarch/patch_stage422_v4_emu_speed.py \
            /tmp/retroarch/runloop.c /tmp/runloop_stage426.c
          cp /tmp/runloop_stage426.c /tmp/retroarch/runloop.c
          grep -F '[H3531] EMU runs=' /tmp/retroarch/runloop.c
          grep -F 'core_avg=' /tmp/retroarch/runloop.c

      - name: Install H3531 video input and AO adapters
        run: |
          set -eux
          cp ports/retroarch/h3531_fb_gfx.c /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc
          cp /tmp/h3531_fb_gfx_stage426.c /tmp/retroarch/gfx/drivers/fpga_gfx.c
          cp ports/retroarch/linuxraw_input_h3531.c /tmp/retroarch/input/drivers/linuxraw_input.c
          cp ports/retroarch/h3531_ao_audio_stage3_8.c /tmp/retroarch/audio/drivers/h3531_ao_audio_base.inc
          cp ports/retroarch/h3531_ao_audio_stage3_11.c /tmp/retroarch/audio/drivers/oss.c
          sed -i 's/const input_driver_t \*\*input/input_driver_t **input/' /tmp/retroarch/gfx/drivers/h3531_fb_gfx_base.inc

      - name: Configure Cortex-A9 dynamic RetroArch
        working-directory: /tmp/retroarch
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          export CC=arm-linux-musleabi-gcc CXX=arm-linux-musleabi-g++ AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib STRIP=arm-linux-musleabi-strip
          export H3531_CFLAGS='-O3 -mcpu=cortex-a9 -mtune=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -D_GNU_SOURCE'
          export CFLAGS="$H3531_CFLAGS" CXXFLAGS="$H3531_CFLAGS"
          export LDFLAGS='-Wl,--dynamic-linker=/mnt/usb/H3531/APPS/retroarch/runtime/ld-musl-arm.so.1'
          ./configure --host=arm-linux-musleabi --enable-dynamic \
            --disable-qt --disable-x11 --disable-wayland \
            --disable-opengl --disable-opengl_core --disable-opengl1 --disable-opengles --disable-vulkan --disable-kms \
            --disable-sdl --disable-sdl2 --disable-udev \
            --disable-alsa --disable-pulse --enable-oss \
            --disable-ffmpeg --disable-freetype --disable-cheevos \
            --disable-networking --disable-netplaydiscovery --disable-online_updater --disable-discord
          grep -Eq '^HAVE_DYNAMIC[[:space:]]*=[[:space:]]*1' config.mk
          grep -Eq '^HAVE_OSS[[:space:]]*=[[:space:]]*1' config.mk

      - name: Build RetroArch with H3531 integer audio/video paths
        working-directory: /tmp/retroarch
        shell: bash
        run: |
          set -o pipefail
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          make -j2 OS='Linux FPGA' HAVE_RGUI=1 HAVE_XMB=0 HAVE_OZONE=0 HAVE_MATERIALUI=0 \
            HAVE_CC_RESAMPLER=1 HAVE_NEAREST_RESAMPLER=1 2>&1 | tee /tmp/retroarch-build.log

      - name: Verify Stage4.26 binaries and configuration
        run: |
          set -eux
          test -s /tmp/retroarch/retroarch
          strings /tmp/retroarch/retroarch | grep -F '[H3531] Stage4.26 GBA RGB565 integer4x fastpath active: 240x160 -> 960x640'
          strings /tmp/retroarch/retroarch | grep -F '[H3531] Stage4.26 SNES RGB565 4:3 fastpath active: 256x224 -> 896x672'
          strings /tmp/retroarch/retroarch | grep -F '[H3531] PS1 RGB565 integer3x fastpath active: 320x240 -> 960x720'
          strings /tmp/retroarch/retroarch | grep -F '[H3531] EMU runs='
          strings /tmp/retroarch/retroarch | grep -F '[H3531 AO] Stage3.11 bounded-latency transport active:'
          nm /tmp/retroarch/retroarch | grep -F 'CC_resampler'
          grep -F 'audio_fastpath_s16 = "true"' ports/retroarch/retroarch-h3531-stage426-gba.cfg
          grep -F 'audio_fastpath_s16 = "true"' ports/retroarch/retroarch-h3531-stage426-snes.cfg
          grep -F 'gpsp_drc = "enabled"' ports/retroarch/retroarch-core-options-gba-stage426.cfg
          grep -F 'gpsp_sound_rate = "32768"' ports/retroarch/retroarch-core-options-gba-stage426.cfg
          grep -F 'gpsp_frameskip = "disabled"' ports/retroarch/retroarch-core-options-gba-stage426.cfg

      - name: Prepare QEMU musl runtime
        run: |
          set -eux
          TOOLCHAIN=/tmp/arm-linux-musleabi-cross
          RUNTIME=/tmp/h3531-runtime
          mkdir -p "$RUNTIME"
          LOADER="$(find "$TOOLCHAIN" -name ld-musl-arm.so.1 -print -quit || true)"
          LIBC="$(find "$TOOLCHAIN" -path '*/lib/libc.so' -print -quit || true)"
          if [ -n "$LOADER" ] && [ -e "$LOADER" ] && file -L "$LOADER" | grep -q ELF; then RUNTIME_ELF="$LOADER"; else RUNTIME_ELF="$LIBC"; fi
          test -n "$RUNTIME_ELF"
          cp -L "$RUNTIME_ELF" "$RUNTIME/ld-musl-arm.so.1"
          cp -L "$RUNTIME_ELF" "$RUNTIME/libc.so"
          for lib in libgcc_s.so.1 libstdc++.so.6 libatomic.so.1; do SRC="$(find "$TOOLCHAIN" -name "$lib" -print -quit || true)"; [ -z "$SRC" ] || cp -L "$SRC" "$RUNTIME/$lib"; done

      - name: QEMU smoke tests
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          R=/tmp/h3531-runtime
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/retroarch/retroarch --version | tee /tmp/retroarch-version.txt

          cat >/tmp/dlopen-core.c <<'EOF'
          #include <dlfcn.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          struct retro_system_info { const char *library_name; const char *library_version; const char *valid_extensions; bool need_fullpath; bool block_extract; };
          typedef void (*getinfo_t)(struct retro_system_info *);
          int main(int argc,char **argv){void*h;getinfo_t f;struct retro_system_info i;if(argc!=2)return 2;h=dlopen(argv[1],RTLD_NOW|RTLD_LOCAL);if(!h){fprintf(stderr,"dlopen failed: %s\n",dlerror());return 3;}f=(getinfo_t)dlsym(h,"retro_get_system_info");if(!f)return 4;memset(&i,0,sizeof(i));f(&i);printf("DYNAMIC_CORE_OK name=%s version=%s extensions=%s need_fullpath=%d\n",i.library_name?i.library_name:"",i.library_version?i.library_version:"",i.valid_extensions?i.valid_extensions:"",i.need_fullpath?1:0);dlclose(h);return 0;}
          EOF
          arm-linux-musleabi-gcc -O2 -march=armv7-a -mfloat-abi=soft /tmp/dlopen-core.c -ldl -o /tmp/dlopen-core
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/dlopen-core /tmp/snes9x2005/snes9x2005_libretro.so | tee /tmp/snes-smoke.txt
          env LD_LIBRARY_PATH="$R" qemu-arm -cpu cortex-a9 "$R/ld-musl-arm.so.1" --library-path "$R" /tmp/dlopen-core /tmp/gpsp/gpsp_libretro.so | tee /tmp/gpsp-smoke.txt
          grep -F 'DYNAMIC_CORE_OK' /tmp/snes-smoke.txt
          grep -F 'DYNAMIC_CORE_OK' /tmp/gpsp-smoke.txt

      - name: Package Stage4.26 overlay
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          ROOT=out/H3531/APPS/retroarch
          UROOT=out/H3531/USER/retroarch/config
          mkdir -p "$ROOT/cores" "$ROOT/info" "$ROOT/runtime" "$UROOT"

          arm-linux-musleabi-strip /tmp/retroarch/retroarch -o "$ROOT/RETROARCH.BIN"
          arm-linux-musleabi-strip /tmp/snes9x2005/snes9x2005_libretro.so -o "$ROOT/cores/snes9x2005_libretro.so"
          arm-linux-musleabi-strip /tmp/gpsp/gpsp_libretro.so -o "$ROOT/cores/gpsp_libretro.so"
          cp ports/retroarch/snes9x2005_libretro.info "$ROOT/info/"
          cp ports/retroarch/gpsp_libretro.info "$ROOT/info/"
          cp ports/retroarch/retroarch-h3531-stage426-snes.cfg "$ROOT/retroarch-snes.cfg"
          cp ports/retroarch/retroarch-h3531-stage426-gba.cfg "$ROOT/retroarch-gba.cfg"
          cp ports/retroarch/retroarch-core-options-gba-stage426.cfg "$UROOT/retroarch-core-options-gba.cfg"
          cp -a /tmp/h3531-runtime/. "$ROOT/runtime/"

          cat > "$ROOT/README_STAGE4_26_SNES_GBA_ENGINE_TUNING.txt" <<'EOF'
          H3531 Stage4.26 - SNES/GBA Engine Tuning

          GBA / gpSP:
          - ARM dynarec compiled and pinned enabled.
          - 32768 Hz internal mixer mode.
          - frameskip disabled.
          - colour correction and frame mixing disabled.
          - 240x160 -> 960x640 exact RGB565 integer4x framebuffer fastpath.

          SNES / Snes9x 2005:
          - Cortex-A9/VFPv3-D16 softfp build, no NEON.
          - lightweight APU build (USE_BLARGG_APU=0).
          - 256x224 -> 896x672 aspect-correct fixed-ratio fastpath when used by the viewport.
          - 256x224 -> 768x672 exact integer3x fastpath retained as alternate viewport path.

          Shared:
          - Stage4.22 V4 real EMU speed telemetry retained.
          - H3531 AO bounded-latency transport and CC S16 audio fastpath retained.
          - PS1 Stage4.22 V3/V4 video/timing fastpaths retained.
          - no image-size reduction and no forced frameskip.
          EOF

          cp /tmp/retroarch-version.txt out/RETROARCH-QEMU-VERSION.txt
          cp /tmp/snes-smoke.txt out/SNES-QEMU-SMOKE.txt
          cp /tmp/gpsp-smoke.txt out/GBA-QEMU-SMOKE.txt
          cp /tmp/snes-type.txt out/SNES-BINARY-TYPE.txt
          cp /tmp/gpsp-type.txt out/GBA-BINARY-TYPE.txt
          cp /tmp/snes-attrs.txt out/SNES-ELF-ATTRS.txt
          cp /tmp/gpsp-attrs.txt out/GBA-ELF-ATTRS.txt
          printf '%s\n' 48cbdb2e78ea6c92ade103941c4958ea312a5995 > out/RETROARCH-UPSTREAM-SHA.txt
          printf '%s\n' deb49d80d1836e3e737480a326e31a54c46c04ae > out/SNES-UPSTREAM-SHA.txt
          printf '%s\n' 8d268a6bb2cd799f8f2791ebb544a7ef550cfc6f > out/GPSP-UPSTREAM-SHA.txt
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage4.26-SNES-GBA-EngineTuning
          path: out/
          if-no-files-found: error
          retention-days: 14
