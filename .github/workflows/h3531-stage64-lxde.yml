name: H3531 Stage6.4 LXDE Core Integration

on:
  push:
    branches:
      - feature/h3531-stage64-lxde
    paths:
      - 'ports/x11/START-LXDE-STAGE6.sh'
      - 'ports/x11/README_STAGE6_4.md'
      - '.github/workflows/h3531-stage64-lxde.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Download Stage6.3A Openbox HIFB base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.3A-Openbox-HIFB-Alpha-ReadyToCopy
          path: base-artifact
          github-token: ${{ github.token }}
          run-id: 35398996624

      - name: Extract and verify proven foundation
        run: |
          set -eux
          BASEZIP=base-artifact/H3531-Stage6.3A-Openbox-HIFB-Alpha-ReadyToCopy.zip
          test -f "$BASEZIP"
          mkdir -p stage64
          unzip -q "$BASEZIP" -d stage64
          OUT="$PWD/stage64/H3531/APPS/x11-debian"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -
          test "$(sha256sum "$OUT/bin/Xfbdev" | awk '{print $1}')" = "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482"
          test -x "$OUT/bin/openbox"
          test -x "$OUT/bin/h3531-hifb-alpha"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip

      - name: Bootstrap Wheezy LXDE core
        run: |
          set -eux

          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg             wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -y --no-install-recommends --allow-unauthenticated install             lxde-core lxterminal lxde-common lxde-icon-theme             hicolor-icon-theme shared-mime-info desktop-file-utils             libgdk-pixbuf2.0-dev

          echo '=== LXDE VERSIONS ==='
          for pkg in lxde-core lxde-common lxpanel pcmanfm lxterminal lxsession                      lxde-icon-theme libgdk-pixbuf2.0-0; do
            sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/dpkg-query -W               -f='${Package} ${Version}\n' "$pkg"
          done

          echo '=== LXDE BINARIES ==='
          for b in pcmanfm lxpanel lxpanelctl lxterminal lxsession; do
            find rootfs/usr/bin -maxdepth 1 -type f -name "$b" -print
          done

          echo '=== STOCK PCMANFM CONFIG ==='
          cat rootfs/etc/xdg/pcmanfm/LXDE/pcmanfm.conf || true
          echo '=== STOCK LXPANEL CONFIG ==='
          cat rootfs/etc/xdg/lxpanel/LXDE/panels/panel || true

      - name: Assemble LXDE USB runtime
        run: |
          set -eux
          OUT="$PWD/stage64/H3531/APPS/x11-debian"
          DOC="$PWD/stage64/H3531/SYSTEM/docs"
          RUNTIME=/mnt/usb/H3531/APPS/x11-debian

          mkdir -p "$OUT/bin" "$OUT/lib/arm-linux-gnueabi"                    "$OUT/etc/xdg" "$OUT/etc/gtk"                    "$OUT/share/applications" "$OUT/share/desktop-directories"                    "$OUT/share/icons" "$OUT/share/pixmaps" "$OUT/share/lxde"                    "$OUT/share/lxpanel" "$OUT/share/pcmanfm" "$OUT/share/lxsession"                    "$OUT/share/mime" "$DOC"

          # Preserve the Wheezy multiarch tree for GTK/libfm/lxpanel runtime modules.
          # Copy real files and resolve symlinks against the chroot root. This avoids
          # host-side failures from absolute Debian dev symlinks such as /lib/*.so.
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil

          root = Path("rootfs").resolve()
          out = Path("stage64/H3531/APPS/x11-debian/lib/arm-linux-gnueabi").resolve()
          out.mkdir(parents=True, exist_ok=True)

          def resolve_link(p: Path):
              target = os.readlink(p)
              if target.startswith("/"):
                  return root / target.lstrip("/")
              return (p.parent / target).resolve()

          for src_rel in ("lib/arm-linux-gnueabi", "usr/lib/arm-linux-gnueabi"):
              src = root / src_rel
              if not src.is_dir():
                  continue
              for p in src.rglob("*"):
                  rel = p.relative_to(src)
                  dst = out / rel
                  if p.is_dir() and not p.is_symlink():
                      dst.mkdir(parents=True, exist_ok=True)
                      continue
                  if p.is_symlink():
                      target = resolve_link(p)
                      if not target.is_file():
                          continue
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(target, dst)
                      continue
                  if p.is_file():
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(p, dst)

          print("multiarch runtime files:", sum(1 for p in out.rglob("*") if p.is_file()))
          PY

          # Also add top-level DT_NEEDED libraries to the proven flat lib directory
          # only when a library is absent there.
          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                [ -e "$f" ] || continue
                dst="$OUT/lib/$(basename "$f")"
                [ -e "$dst" ] || cp -L "$f" "$dst"
              done
          done

          # Real LXDE ELF binaries are kept as .real. Shell wrappers with the
          # normal command names make XDG Exec= entries work on the vendor rootfs.
          for b in pcmanfm lxpanel lxterminal; do
            test -x "rootfs/usr/bin/$b"
            cp "rootfs/usr/bin/$b" "$OUT/bin/$b.real"
          done

          if [ -x rootfs/usr/bin/lxpanelctl ]; then
            cp rootfs/usr/bin/lxpanelctl "$OUT/bin/lxpanelctl.real"
          fi
          if [ -x rootfs/usr/bin/lxsession ]; then
            cp rootfs/usr/bin/lxsession "$OUT/bin/lxsession.real"
          fi

          cat >"$OUT/bin/pcmanfm" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LIBPATH="$BASE/lib:$BASE/lib/arm-linux-gnueabi:$BASE/lib/arm-linux-gnueabi/lxpanel"
          export LD_LIBRARY_PATH="$LIBPATH"
          exec "$BASE/lib/ld-linux.so.3" --library-path "$LIBPATH" "$BASE/bin/pcmanfm.real" "$@"
          EOF

          cat >"$OUT/bin/lxpanel" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LIBPATH="$BASE/lib:$BASE/lib/arm-linux-gnueabi:$BASE/lib/arm-linux-gnueabi/lxpanel"
          export LD_LIBRARY_PATH="$LIBPATH"
          exec "$BASE/lib/ld-linux.so.3" --library-path "$LIBPATH" "$BASE/bin/lxpanel.real" "$@"
          EOF

          cat >"$OUT/bin/lxterminal" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LIBPATH="$BASE/lib:$BASE/lib/arm-linux-gnueabi:$BASE/lib/arm-linux-gnueabi/lxpanel"
          export LD_LIBRARY_PATH="$LIBPATH"
          exec "$BASE/lib/ld-linux.so.3" --library-path "$LIBPATH" "$BASE/bin/lxterminal.real" "$@"
          EOF

          if [ -f "$OUT/bin/lxpanelctl.real" ]; then
            cat >"$OUT/bin/lxpanelctl" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LIBPATH="$BASE/lib:$BASE/lib/arm-linux-gnueabi:$BASE/lib/arm-linux-gnueabi/lxpanel"
          export LD_LIBRARY_PATH="$LIBPATH"
          exec "$BASE/lib/ld-linux.so.3" --library-path "$LIBPATH" "$BASE/bin/lxpanelctl.real" "$@"
          EOF
          fi

          if [ -f "$OUT/bin/lxsession.real" ]; then
            cat >"$OUT/bin/lxsession" <<'EOF'
          #!/bin/sh
          BASE=/mnt/usb/H3531/APPS/x11-debian
          LIBPATH="$BASE/lib:$BASE/lib/arm-linux-gnueabi:$BASE/lib/arm-linux-gnueabi/lxpanel"
          export LD_LIBRARY_PATH="$LIBPATH"
          exec "$BASE/lib/ld-linux.so.3" --library-path "$LIBPATH" "$BASE/bin/lxsession.real" "$@"
          EOF
          fi

          chmod 755 "$OUT/bin/pcmanfm" "$OUT/bin/lxpanel" "$OUT/bin/lxterminal"
          [ ! -f "$OUT/bin/lxpanelctl" ] || chmod 755 "$OUT/bin/lxpanelctl"
          [ ! -f "$OUT/bin/lxsession" ] || chmod 755 "$OUT/bin/lxsession"

          # Package LXDE/XDG configuration.
          cp -a rootfs/etc/xdg/. "$OUT/etc/xdg/"

          # Use our own deterministic LXDE profile. Wheezy's packaging does not
          # expose a stock panel file in a stable path after this minimal install.
          mkdir -p "$OUT/etc/xdg/lxpanel/profile/LXDE/panels"
          cat >"$OUT/etc/xdg/lxpanel/profile/LXDE/config" <<'EOF'
          [Command]
          FileManager=pcmanfm
          Terminal=lxterminal
          Logout=
          EOF

          cat >"$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel" <<'EOF'
          # H3531 LXPanel 0.5.x profile
          Global {
            edge=bottom
            allign=left
            margin=0
            widthtype=percent
            width=100
            height=36
            transparent=0
            tintcolor=#F2F2F2
            alpha=255
            autohide=0
            heightwhenhidden=2
            setdocktype=1
            setpartialstrut=1
            usefontcolor=1
            fontcolor=#101010
            usefontsize=1
            fontsize=11
            background=0
            iconsize=28
          }
          Plugin {
            type=menu
            Config {
              system {
              }
              separator {
              }
              item {
                command=run
              }
            }
          }
          Plugin {
            type=launchbar
            Config {
              Button {
                id=h3531-file-manager.desktop
              }
              Button {
                id=h3531-terminal.desktop
              }
            }
          }
          Plugin {
            type=taskbar
            expand=1
            Config {
              tooltips=1
              IconsOnly=0
              ShowAllDesks=0
              UseMouseWheel=1
              UseUrgencyHint=1
              FlatButton=0
              MaxTaskWidth=200
              spacing=1
            }
          }
          Plugin {
            type=tray
            Config {
            }
          }
          Plugin {
            type=dclock
            Config {
              ClockFmt=%H:%M
              TooltipFmt=%A %x
              BoldFont=0
            }
          }
          EOF

          # Compatibility mirror for builds that use the alternate historical path.
          mkdir -p "$OUT/etc/xdg/lxpanel/LXDE/panels"
          cp "$OUT/etc/xdg/lxpanel/profile/LXDE/config"             "$OUT/etc/xdg/lxpanel/LXDE/config"
          cp "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"             "$OUT/etc/xdg/lxpanel/LXDE/panels/panel"

          # Force a simple light-color PCManFM desktop instead of a JPEG wallpaper.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("stage64/H3531/APPS/x11-debian/etc/xdg/pcmanfm/LXDE/pcmanfm.conf")
          s = p.read_text()
          def set_key(text, key, value):
              pat = rf'(?m)^{re.escape(key)}=.*$'
              if re.search(pat, text):
                  return re.sub(pat, f'{key}={value}', text)
              # Old PCManFM has a [desktop] section; append there if key is absent.
              marker = '[desktop]'
              if marker in text:
                  i = text.index(marker) + len(marker)
                  return text[:i] + f'\n{key}={value}' + text[i:]
              return text + f'\n[desktop]\n{key}={value}\n'
          for k, v in [
              ('wallpaper_mode', '0'),
              ('wallpaper', ''),
              ('desktop_bg', '#F2F2F2'),
              ('desktop_fg', '#101010'),
              ('desktop_shadow', '#FFFFFF'),
              ('show_wm_menu', '1'),
          ]:
              s = set_key(s, k, v)
          p.write_text(s)
          print(s)
          PY

          # Application/menu/theme/data files.
          for d in applications desktop-directories icons pixmaps lxde lxpanel pcmanfm lxsession libfm mime themes menu; do
            if [ -d "rootfs/usr/share/$d" ]; then
              mkdir -p "$OUT/share/$d"
              cp -aL "rootfs/usr/share/$d/." "$OUT/share/$d/"
            fi
          done

          # Make our own known-good menu entries use USB wrappers.
          cat >"$OUT/share/applications/h3531-file-manager.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=File Manager
          Comment=Browse H3531 files
          Exec=/mnt/usb/H3531/APPS/x11-debian/bin/pcmanfm
          Icon=system-file-manager
          Categories=System;FileManager;
          Terminal=false
          StartupNotify=false
          EOF

          cat >"$OUT/share/applications/h3531-terminal.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Terminal
          Comment=LXTerminal
          Exec=/mnt/usb/H3531/APPS/x11-debian/bin/lxterminal
          Icon=utilities-terminal
          Categories=System;TerminalEmulator;
          Terminal=false
          StartupNotify=false
          EOF

          # A guaranteed XPM for the target-side loader smoke check.
          cat >"$OUT/share/pixmaps/h3531-lxde-test.xpm" <<'EOF'
          /* XPM */
          static char * h3531_lxde_test_xpm[] = {
          "8 8 2 1",
          "  c #F2F2F2",
          ". c #202020",
          "........",
          ".      .",
          ". .... .",
          ". .  . .",
          ". .  . .",
          ". .... .",
          ".      .",
          "........"};
          EOF

          # GdkPixbuf query/csource and module directory for runtime-generated cache.
          GDK_QUERY="$(find rootfs/usr/lib/arm-linux-gnueabi/gdk-pixbuf-2.0 -maxdepth 1 -type f -name gdk-pixbuf-query-loaders | head -1)"
          test -x "$GDK_QUERY"
          cp "$GDK_QUERY" "$OUT/bin/gdk-pixbuf-query-loaders"
          cp rootfs/usr/bin/gdk-pixbuf-csource "$OUT/bin/"
          chmod 755 "$OUT/bin/gdk-pixbuf-query-loaders" "$OUT/bin/gdk-pixbuf-csource"

          GDK_ROOT="$(find rootfs/usr/lib/arm-linux-gnueabi/gdk-pixbuf-2.0             -mindepth 2 -maxdepth 2 -type d -name loaders -printf '%h\n' | head -1)"
          test -n "$GDK_ROOT"
          GDK_REL="${GDK_ROOT#rootfs/usr/lib/arm-linux-gnueabi/}"
          printf '%s\n' "$RUNTIME/lib/arm-linux-gnueabi/$GDK_REL/loaders"             >"$OUT/etc/gtk/gdk-pixbuf-module-dir"

          # Relocate only LXDE-owned compile-time paths. Never modify the
          # hardware-proven Xfbdev/Openbox/runtime foundation or libc.
          python3 - <<'PY'
          from pathlib import Path

          base = Path("stage64/H3531/APPS/x11-debian")
          candidates = [
              base / "bin/pcmanfm.real",
              base / "bin/lxpanel.real",
              base / "bin/lxterminal.real",
              base / "bin/lxpanelctl.real",
              base / "bin/lxsession.real",
              base / "bin/gdk-pixbuf-query-loaders",
          ]

          libroot = base / "lib/arm-linux-gnueabi"
          for pattern in (
              "lxpanel/**/*",
              "libfm*.so*",
              "libmenu-cache*.so*",
              "libmenu-cache1/**/*",
          ):
              candidates.extend(libroot.glob(pattern))

          replacements = [
              (b"/usr/lib/arm-linux-gnueabi", b"/var/lib/arm-linux-gnueabi"),
              (b"/usr/share", b"/var/share"),
          ]

          changed = {}
          seen = set()
          for p in candidates:
              if p in seen or not p.is_file():
                  continue
              seen.add(p)
              data = p.read_bytes()
              original = data
              counts = []
              for old, new in replacements:
                  n = data.count(old)
                  if n:
                      data = data.replace(old, new)
                  counts.append(n)
              if data != original:
                  p.write_bytes(data)
                  changed[str(p)] = counts

          print("LXDE-only relocated files:", len(changed))
          for path, counts in sorted(changed.items()):
              print(path, counts)
          PY

          test -d "$OUT/lib/arm-linux-gnueabi/lxpanel"
          test -d "$OUT/lib/arm-linux-gnueabi/lxpanel/plugins"


          cp ports/x11/START-LXDE-STAGE6.sh "$OUT/"
          chmod 755 "$OUT/START-LXDE-STAGE6.sh"

          cat >"$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.4
          Foundation:
            hardware-proven Xfbdev/KDrive/XKB
            HIFB ARGB1555 opaque alpha runtime fix
            Openbox conventional WM
          Integrated LXDE core:
            PCManFM desktop + file manager
            LXPanel application menu/taskbar
            LXTerminal
            XDG menu/data
            LXDE/hicolor icon themes
            shared MIME database
          Mutable HOME/XDG state: /var/h3531-lxde
          Browser intentionally deferred to Stage6.5.
          EOF

          cat >"$DOC/README_STAGE6_4_LXDE.txt" <<'EOF'
          Stage6.4 is the first integrated desktop bundle.

          Launch:
            H3531_LXDE_SECONDS=180 ./START-LXDE-STAGE6.sh

          For an indefinite session:
            H3531_LXDE_SECONDS=0 ./START-LXDE-STAGE6.sh

          Expected:
            light PCManFM desktop
            LXPanel
            Applications menu
            taskbar/clock according to stock LXDE profile
            File Manager menu item
            Terminal menu item
            LXTerminal optionally opened automatically

          The session applies the proven Hi3531 HIFB alpha fix temporarily and
          restores the original HIFB alpha state on exit.

          No saveenv. No SPI writes.
          EOF

      - name: ABI dependency and LXDE audit
        run: |
          set -eux
          OUT="$PWD/stage64/H3531/APPS/x11-debian"
          LIBPATH="$OUT/lib:$OUT/lib/arm-linux-gnueabi:$OUT/lib/arm-linux-gnueabi/lxpanel"

          echo "0a6023e938fcee54dd5b6b0961847b3075ee1f92988186e3e66b24f98825c482  $OUT/bin/Xfbdev" | sha256sum -c -

          for b in pcmanfm.real lxpanel.real lxterminal.real openbox h3531-hifb-alpha                    gdk-pixbuf-query-loaders gdk-pixbuf-csource; do
            file "$OUT/bin/$b"
            readelf -A "$OUT/bin/$b" || true
            if readelf -A "$OUT/bin/$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          out = Path("stage64/H3531/APPS/x11-debian")
          available = {p.name for p in (out / "lib").rglob("*") if p.is_file()}
          checked = 0
          for obj in out.rglob("*"):
              if not obj.is_file():
                  continue
              try:
                  hdr = subprocess.check_output(["readelf", "-h", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if "ELF" not in hdr:
                  continue
              try:
                  dyn = subprocess.check_output(["readelf", "-d", str(obj)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              needed = re.findall(r"Shared library: \[([^\]]+)\]", dyn)
              missing = [n for n in needed if n not in available]
              if missing:
                  raise SystemExit(f"{obj}: missing runtime libraries: {missing}")
              checked += 1
          print("Recursive ELF dependency audit objects:", checked)
          PY

          test -x "$OUT/bin/pcmanfm"
          test -x "$OUT/bin/lxpanel"
          test -x "$OUT/bin/lxterminal"
          test -f "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"
          test -f "$OUT/etc/xdg/lxpanel/profile/LXDE/config"
          grep -q 'id=h3531-file-manager.desktop' "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"
          grep -q 'id=h3531-terminal.desktop' "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"
          ! grep -q 'lxde-x-www-browser.desktop' "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"
          ! grep -q '/usr/share/' "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"
          cmp "$OUT/etc/xdg/lxpanel/profile/LXDE/panels/panel"               "$OUT/etc/xdg/lxpanel/LXDE/panels/panel"
          test -f "$OUT/etc/xdg/pcmanfm/LXDE/pcmanfm.conf"
          grep -q 'desktop_bg=#F2F2F2' "$OUT/etc/xdg/pcmanfm/LXDE/pcmanfm.conf"
          test -f "$OUT/share/applications/h3531-file-manager.desktop"
          test -f "$OUT/share/applications/h3531-terminal.desktop"
          ! grep -a -q '/usr/lib/arm-linux-gnueabi/lxpanel/plugins' "$OUT/bin/lxpanel.real"

          # GUI binaries are not executed under headless QEMU: their complete
          # DT_NEEDED closure has already been audited above. Runtime GUI behavior
          # is a hardware test. Keep a non-GUI GdkPixbuf ARM smoke test below.
          export LD_LIBRARY_PATH="$LIBPATH"
          export LC_ALL=C LANG=C LANGUAGE=C

          qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$LIBPATH" \
            "$OUT/bin/h3531-hifb-alpha" abi | tee /tmp/stage64-hifb-abi.txt
          grep -q 'sizeof(hi_bool)=4 sizeof(hi_fb_alpha)=12' /tmp/stage64-hifb-abi.txt

          sudo mkdir -p /mnt/usb/H3531/APPS
          sudo rm -rf /mnt/usb/H3531/APPS/x11-debian
          sudo ln -s "$OUT" /mnt/usb/H3531/APPS/x11-debian

          GDK_DIR="$(cat "$OUT/etc/gtk/gdk-pixbuf-module-dir")"
          GDK_FILE=/tmp/h3531-stage64-gdk.loaders
          GDK_PIXBUF_MODULEDIR="$GDK_DIR"             qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$LIBPATH"             "$OUT/bin/gdk-pixbuf-query-loaders" "$GDK_DIR"/*.so >"$GDK_FILE"
          test -s "$GDK_FILE"

          GDK_PIXBUF_MODULE_FILE="$GDK_FILE" GDK_PIXBUF_MODULEDIR="$GDK_DIR"             qemu-arm-static "$OUT/lib/ld-linux.so.3" --library-path "$LIBPATH"             "$OUT/bin/gdk-pixbuf-csource" "$OUT/share/pixmaps/h3531-lxde-test.xpm" >/dev/null

          find stage64/H3531 -type f -print0 | sort -z | xargs -0 sha256sum             > stage64/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_4.txt

      - name: Create ReadyToCopy ZIP
        run: |
          set -eux
          cd stage64
          zip -qr ../H3531-Stage6.4-LXDE-Core-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.4-LXDE-Core-ReadyToCopy.zip             | tee H3531-Stage6.4-LXDE-Core-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.4-LXDE-Core-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
