name: H3531 Stage6.6D5 KDrive Evdev Hotplug

on:
  push:
    branches:
      - feature/h3531-stage66d-live-native-lease
    paths:
      - '.github/workflows/h3531-stage66d5-kdrive-hotplug.yml'
      - 'ports/stage66d/patch-kdrive-evdev-hotplug.py'
      - 'ports/stage66a/h3531-lxde-core.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static file binutils zip curl python3

      - name: Bootstrap Wheezy armel X server build root
        run: |
          set -eux
          sudo debootstrap --foreign --arch=armel --variant=minbase --no-check-gpg             wheezy rootfs http://archive.debian.org/debian
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb-src [trusted=yes] http://archive.debian.org/debian wheezy main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -o Acquire::Check-Valid-Until=false update
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -y --no-install-recommends --allow-unauthenticated install             build-essential devscripts fakeroot dpkg-dev             x11-utils x11-xkb-utils x11-xserver-utils xinput xfonts-base xkb-data
          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get             -y --allow-unauthenticated build-dep xorg-server

      - name: Fetch and patch xorg-server
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c             'cd /build && apt-get -y --allow-unauthenticated source xorg-server=2:1.12.4-6+deb7u6'
          SRC="$(find rootfs/build -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          test -n "$SRC"

          sudo python3 - "$SRC/debian/rules" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          line="\tbuild_xfbdev += --enable-kdrive-mouse --enable-kdrive-evdev\n"
          if "--enable-kdrive-evdev" not in s:
              anchor="\tbuild_xfbdev = --enable-xfbdev\n"
              if anchor not in s: raise SystemExit("Debian xfbdev rules anchor not found")
              s=s.replace(anchor,anchor+line,1)
              p.write_text(s)
          PY

          sudo python3 - "$SRC/hw/kdrive/fbdev/fbdev.c" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          pats=[
              r'if\s*\(scrpriv->randr\s*!=\s*RR_Rotate_0\s*\|\|\s*priv->fix\.type\s*!=\s*FB_TYPE_PACKED_PIXELS\s*\)\s*scrpriv->shadow\s*=\s*TRUE;\s*else\s*scrpriv->shadow\s*=\s*FALSE;',
              r'if\s*\(scrpriv->randr\s*!=\s*RR_Rotate_0\s*\)\s*scrpriv->shadow\s*=\s*TRUE;\s*else\s*scrpriv->shadow\s*=\s*FALSE;',
          ]
          for pat in pats:
              s2,n=re.subn(pat,'/* H3531: force software shadow framebuffer. */\n    scrpriv->shadow = TRUE;',s,count=1,flags=re.S)
              if n: p.write_text(s2); break
          else: raise SystemExit("fbdev shadow selection not found")
          PY

          sudo python3 - "$SRC/miext/shadow/shpacked.c" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          if "#include <unistd.h>" not in s:
              s=s.replace("#include <stdlib.h>\n","#include <stdlib.h>\n#include <unistd.h>\n",1)
          pixpat=r'(?m)^(\s*)PixmapPtr\s+pShadow\s*=\s*pBuf->pPixmap\s*;\s*$'
          m=re.search(pixpat,s)
          if not m: raise SystemExit("pShadow declaration not found")
          indent=m.group(1)
          replacement=(m.group(0)+"\n"+indent+"BoxRec h3531FullBox;\n"+
              indent+"if (access(\"/var/h3531-xfbdev-native-lease\", F_OK) == 0)\n"+
              indent+"    return;")
          s=s[:m.start()]+replacement+s[m.end():]
          s,n=re.subn(r'(?m)^\s*int\s+nbox\s*=\s*[^;]+;\s*$',indent+"int nbox = 1;",s,count=1)
          if n!=1: raise SystemExit("nbox declaration not found")
          s,n=re.subn(r'(?m)^\s*BoxPtr\s+pbox\s*=\s*[^;]+;\s*$',indent+"BoxPtr pbox = &h3531FullBox;",s,count=1)
          if n!=1: raise SystemExit("pbox declaration not found")
          marker=re.search(r'(?m)^\s*fbGetDrawable\s*\(',s)
          if not marker: raise SystemExit("fbGetDrawable call not found")
          insert=(indent+"h3531FullBox.x1 = 0;\n"+indent+"h3531FullBox.y1 = 0;\n"+
                  indent+"h3531FullBox.x2 = pShadow->drawable.width;\n"+
                  indent+"h3531FullBox.y2 = pShadow->drawable.height;\n")
          s=s[:marker.start()]+insert+s[marker.start():]
          p.write_text(s)
          PY

          sudo python3 ports/stage66d/patch-kdrive-evdev-hotplug.py "$SRC/hw/kdrive/linux/evdev.c"

          grep -F 'Stage6.6D5 evdev mouse reconnected' "$SRC/hw/kdrive/linux/evdev.c"
          grep -F 'Stage6.6D5 evdev keyboard reconnected' "$SRC/hw/kdrive/linux/evdev.c"
          ! grep -F 'DeleteInputDeviceRequest(pi->dixdev)' "$SRC/hw/kdrive/linux/evdev.c"
          ! grep -F 'DeleteInputDeviceRequest(ki->dixdev)' "$SRC/hw/kdrive/linux/evdev.c"

      - name: Build D5 Xfbdev
        run: |
          set -eux
          SRC="$(find rootfs/build -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          SRC_REL="/build/$(basename "$SRC")"
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c             "cd '$SRC_REL' && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -uc -us -j2"
          DEB="$(find rootfs/build -maxdepth 1 -name 'xserver-xfbdev_*_armel.deb' | head -1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" rebuilt
          file rebuilt/usr/bin/Xfbdev | tee /tmp/xfbdev.file
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/xfbdev.file

          strings rebuilt/usr/bin/Xfbdev | grep -F 'Stage6.6D5 evdev mouse reconnected'
          strings rebuilt/usr/bin/Xfbdev | grep -F 'Stage6.6D5 evdev keyboard reconnected'
          strings rebuilt/usr/bin/Xfbdev | grep -F 'waiting for replug'

          if readelf -A rebuilt/usr/bin/Xfbdev | grep -q 'Tag_ABI_VFP_args'; then
            echo 'ERROR: D5 Xfbdev is hard-float'
            exit 1
          fi

      - name: Assemble D5 differential patch
        run: |
          set -eux
          ROOT=out/H3531
          X="$ROOT/APPS/x11-debian"
          mkdir -p "$X/bin" "$X/libexec" "$ROOT/SYSTEM/docs"

          cp rebuilt/usr/bin/Xfbdev "$X/bin/Xfbdev-shadow-live"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("out/H3531/APPS/x11-debian/bin/Xfbdev-shadow-live")
          data=p.read_bytes()
          old=b"/usr/bin\x00"
          new=b"/var\x00"
          count=data.count(old)
          if count != 1:
              raise SystemExit(f"Expected one XKB /usr/bin path, got {count}")
          new += b"\x00"*(len(old)-len(new))
          p.write_bytes(data.replace(old,new,1))
          PY

          cp ports/stage66a/h3531-lxde-core.sh "$X/bin/h3531-lxde-core"
          cp ports/stage66a/h3531-lxde-core.sh "$X/libexec/h3531-lxde-core"
          chmod 755 "$X/bin/Xfbdev-shadow-live" "$X/bin/h3531-lxde-core" "$X/libexec/h3531-lxde-core"

          cat >"$ROOT/SYSTEM/docs/README_STAGE6_6D5_EVDEV_HOTPLUG.txt" <<'EOF'
          H3531 Stage6.6D5 KDrive Evdev Hotplug

          Root cause fixed inside Wheezy Xfbdev/KDrive:
          stock evdev.c called DeleteInputDeviceRequest() on ENODEV, permanently
          removing Evdev keyboard/mouse from the live XInput hierarchy.

          D5 behavior:
          - unplug keeps the XInput device object and desktop alive;
          - dead fd is unregistered/closed;
          - an X-server timer scans /dev/input/event0..31 every 500 ms;
          - keyboard is matched by ordinary typing keys, avoiding composite-media nodes;
          - mouse is matched by REL_X + REL_Y;
          - new eventN is grabbed and registered into the same live X server;
          - no X/LXDE restart is required for normal unplug/replug.
          EOF

          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum               > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_6D5_EVDEV_HOTPLUG.txt
          )

      - name: Create ZIP
        run: |
          set -eux
          cd out
          zip -qr ../H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH.zip             | tee H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH.zip.sha256
          unzip -t H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH
          path: |
            H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH.zip
            H3531-Stage6.6D5-KDrive-Evdev-Hotplug-PATCH.zip.sha256
          retention-days: 14
