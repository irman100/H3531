                  ((110.0,90.0,-210.0),(110.0,-90.0,-210.0),4),
              ]
              fp.write(struct.pack(
                  "<4sI4I10f",b"VCL1",1,
                  len(col_spheres),1,12,len(sus_lines),
                  0.0,150.0,0.0,300.0,
                  -150.0,0.0,-280.0,
                  150.0,300.0,280.0
              ))
              for center,r,surface,piece in col_spheres:
                  fp.write(struct.pack(
                      "<4fBBH",center[0],center[1],center[2],r,surface,piece,0
                  ))
              for p0,p1,part in sus_lines:
