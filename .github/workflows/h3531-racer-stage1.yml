      - name: Package USB overlay
        run: |
          set -eux
          ROOT=out/H3531
          APP="$ROOT/APPS/racer"
          DOC="$ROOT/SYSTEM/docs"
          VCTOOL="$ROOT/SYSTEM/tools/vc-import"
          mkdir -p "$APP" "$DOC/licenses" "$VCTOOL"

          cp RACER.BIN "$APP/RACER.BIN"
          cp ports/racer/RACER.APP "$APP/RACER.APP"
          cp ports/racer/APPINFO.CFG "$APP/APPINFO.CFG"
          cp ports/racer/RACER-MEDIA-PROBE.APP "$APP/RACER-MEDIA-PROBE.APP"
          chmod 755 "$APP/RACER.BIN" "$APP/RACER.APP" "$APP/RACER-MEDIA-PROBE.APP"

          cp ports/racer/vc_local_import.py "$VCTOOL/vc_local_import.py"
          cp ports/racer/vc_vehicle_import.py "$VCTOOL/vc_vehicle_import.py"
          cp ports/racer/VC_LOCAL_IMPORT.ps1 "$VCTOOL/VC_LOCAL_IMPORT.ps1"
          cat > "$VCTOOL/README.txt" <<'EOF'
          LOCAL VICE CITY MAP + PLAYER VEHICLE TEST
          =========================================

          These tools do not contain or download GTA assets.
          They read the user's own classic PC Vice City installation locally.

          The wrapper builds:
          - VCMAP.BIN: VCM3 textured local city district;
          - VCCOL.BIN: VCC2 native Vice City COL mesh/box/sphere collision with original surface IDs;
          - VCVEH.BIN: selected player car DFF/TXD + handling.cfg + native vehicles.col CColModel spheres.

          Default player vehicle is sentinel. Example:

          powershell -ExecutionPolicy Bypass -File .\VC_LOCAL_IMPORT.ps1 -GameRoot "C:\Path\To\Grand Theft Auto Vice City" -Radius 150 -MaxInstances 150 -VehicleModel "sentinel"

          To copy both runtime sidecars directly to a mounted USB racer folder:

          powershell -ExecutionPolicy Bypass -File .\VC_LOCAL_IMPORT.ps1 -GameRoot "C:\Path\To\Grand Theft Auto Vice City" -CenterX 456.91 -CenterY -119.02 -Radius 220 -MaxInstances 220 -VehicleModel "sentinel" -UsbRacerDir "I:\H3531\APPS\racer"

          Confirm runtime log contains:
          [racer] VCMAP3 loaded path=...
          [racer] VCCOL2 loaded path=...
          [racer] VCVEH loaded path=...

          VCVEH.BIN, VCCOL.BIN and VCMAP.BIN are generated from the user's local game.
          Do not upload them or extracted GTA assets to the public repository.
          EOF

          cp build/assets/OPENMRAC_DATA_LICENSE_CC0.txt \
            "$DOC/licenses/OPENMRAC_DATA_CC0.txt"
          cp build/assets/OPENMRAC_ASSET_SHA256.txt \
            "$DOC/RACER_OPENMRAC_ASSET_SHA256.txt"
          cp build/assets/POLYHAVEN_SKY_CC0.txt \
            "$DOC/licenses/POLYHAVEN_SKY_CC0.txt"
          cp build/assets/POLYHAVEN_SKY_SHA256.txt \
            "$DOC/POLYHAVEN_SKY_SHA256.txt"
          cp build/vehicle/KENNEY_STARTER_KIT_README.md \
            "$DOC/KENNEY_STARTER_KIT_RACING_README.md"
          cp build/vehicle/KENNEY_VEHICLE_SHA256.txt \
            "$DOC/KENNEY_VEHICLE_SHA256.txt"
          cp build/vehicle/KENNEY_CONVERT_LOG.txt \
            "$DOC/KENNEY_VEHICLE_CONVERT_LOG.txt"
          cp build/environment/KENNEY_ENVIRONMENT_CC0.txt \
            "$DOC/licenses/KENNEY_ENVIRONMENT_CC0.txt"
          cp build/environment/KENNEY_ENVIRONMENT_SHA256.txt \
            "$DOC/KENNEY_ENVIRONMENT_SHA256.txt"
          cp build/environment/*_CONVERT_LOG.txt "$DOC/"
          cp build/osm-city/OSM_ATTRIBUTION.txt "$DOC/licenses/"
          cp build/osm-city/OSM_CITY_PACK.log "$DOC/"
          cp build/osm-city/OSM_TERRAIN_MAP_SHA256.txt "$DOC/"

          cat > "$DOC/README_RACER_STAGE8_6.txt" <<'EOF'
          Stayplaytion Racer Stage8.6 Sentinel Suspension + Dense Car LOD
          ===============================================================

          Stage8.6 extends the native Sentinel CColModel path with four suspension
          lines reconstructed from the actual wheel dummies and handling.cfg
          upper/lower suspension limits, following the geometry used by reVC
          SetupSuspensionLines. Wheel/world contact therefore comes from the
          selected vehicle itself instead of wheelbase/track percentages.
          The dense imported car renderer also rejects off-screen and sub-pixel
          faces before texture setup/rasterization; this is a screen-space LOD
          that preserves the original mesh while attacking the measured 243 ms
          player-car render cost on the real Hi3531.
          - imported VCVEH supports up to 65535 vertices and 131072 triangles with bounded dynamic scratch;
          - the built-in sports car is only a fallback if VCVEH is absent or invalid;
          - VCC2 retains original GTA surface IDs and world sphere primitives;
          - VCVEH VCL1 retains the selected vehicle's original GTA collision spheres;
          - VCVEH VCL1 also carries four suspension lines built from real wheel dummies;
          - suspension line endpoints use handling.cfg upper/lower limits and tyre radius;
          - original sphere surface/piece IDs are preserved for future damage/contact use;
          - dense player-car faces below one projected pixel are rejected before rasterization;
          - oversized cars prefer the DFF's native _vlo tier, matching reVC's really-low-detail path;
          - separate high-detail wheel injection is suppressed when native _vlo is selected;
          - VCC2 does not derive road/wall flags from triangle slope;
          - four wheel contacts report their GTA surface IDs in PERF;
          - body collision uses three raised vehicle spheres against GTA triangle/sphere geometry;
          - models/coll/*.col is indexed locally, preparing native vehicle collision import;
          - PERF logs gas, brake, collision-block count, collision version, wheel surfaces and active vehicle source;
          - TDE is accessed directly through /dev/hi_tde using the verified Hi3531 ioctl ABI;
          - no vendor libtde/libmpi binary is embedded or linked;
          - HIFB's unused physical tail is used as the first TDE source surface;
          - RACER_TDE=0 (or off/cpu) forces the legacy CPU presenter for A/B testing;
          - profiling reports present, TDE staging-copy, hardware-job time and failures;
          - VCM3 widens map material ids to uint16 and uses a 2048x2048 A1R5G5B5 atlas;
          - map textures are capped at 56x56 to fit many more materials at the 640x360 target;
          - VCCOL.BIN VCC2 contains spatially bucketed GTA mesh/box triangles plus spheres;
          - suspension/ground contact queries native GTA collision first, preserving bridge deck continuity;
          - body contact tests actual collision geometry instead of classifying faces by slope;
          - VCVEH.BIN is generated locally from the user's own vehicle DFF/TXD and handling.cfg;
          - damaged/low-detail/random extra vehicle atomics are filtered from the normal car mesh;
          - default local model is sentinel, selectable with -VehicleModel;
          - persistent longitudinal/lateral velocity and yaw-rate replace the old direct yaw model;
          - steering input is smoothed then non-linearly shaped;
          - opposite pedal input brakes before reverse engages;
          - finite lateral adhesion permits real slip instead of forcing the car onto its heading;
          - handling mass/traction/top speed/engine/brake/steering lock come from handling.cfg;
          - built-in sports vehicle remains a fallback when VCVEH.BIN is absent;
          - T/Y texture diagnostic modes from Stage7.18 remain available;
          - DFF UV coordinates are preserved;
          - TXD dictionaries are decoded locally by rwfury;
          - textures are downsampled and packed into a 1024x1024 A1R5G5B5 atlas;
          - alpha-tested texels restore trees, fences, signs and transparent cutouts;
          - perspective-correct UV rendering shares the city 16-bit depth buffer;
          - collision surface identity comes from the original GTA COL surface byte;
          - no GTA assets are stored in GitHub or downloaded by CI;
          - if VCMAP.BIN is absent or is an old VCM1 file, OSM/SRTM fallback remains available.

          Geometry
          --------
          - real closed OSM building footprints are extruded directly;
          - OSM height/building:levels are used when available;
          - wall faces use directional light/dark materials for readable solid volume;
          - roofs are triangulated with an ear-clipping polygon triangulator;
          - drivable OSM highway ways become mitered road strips;
          - road widths use OSM width/lanes where present and class defaults otherwise;
          - a ~24m SRTM terrain grid is baked to the same sector renderer;
          - a matching runtime height grid keeps the car and chase camera on terrain.

          Runtime
          -------
          - native /dev/fb0 A1R5G5B5
          - 640x360 internal target, exact 2x to 1280x720
          - CPU0 game/render, CPU1 framebuffer presenter
          - fixed 60 Hz vehicle simulation
          - 48m sector visibility
          - no XML, HGT or GLB parser on Hi3531
          - Vice City mode uses VCC2 triangle/sphere body contact; OSM fallback keeps its existing AABB path

          Map
          ---
          OpenStreetMap bbox:
            south 37.9790
            west  23.7310
            north 37.9832
            east  23.7355

          Controls
          --------
          Left/right: steer
          Up/W or primary gamepad south-style button: throttle
          Down/S or east-style button: brake; hold after stop for reverse
          Esc/F12: exit
          Select+Start: exit

          Attribution
          -----------
          Map data: OpenStreetMap contributors, ODbL 1.0.
          Elevation: AWS Open Data Terrain Tiles / Skadi SRTM.
          Player car fallback: packaged project vehicle; optional VCVEH.BIN is local user-supplied game data and is never distributed by CI.
          Sky: Poly Haven Kloppenheim 06 Pure Sky, CC0.
          EOF

          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
              > H3531/SYSTEM/docs/SHA256SUMS_RACER_STAGE8_6.txt
          )

          cd out
          zip -qr ../H3531-Racer-Stage8.6-SENTINEL-SUSPENSION-CARLOD-PATCH.zip H3531
          cd ..
          unzip -t H3531-Racer-Stage8.6-SENTINEL-SUSPENSION-CARLOD-PATCH.zip
          sha256sum H3531-Racer-Stage8.6-SENTINEL-SUSPENSION-CARLOD-PATCH.zip \
            | tee H3531-Racer-Stage8.6-SENTINEL-SUSPENSION-CARLOD-PATCH.zip.sha256

