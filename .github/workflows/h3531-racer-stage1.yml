          PY
          qemu-arm -cpu cortex-a9 ./RACER.BIN --selftest 2>&1 | tee selftest.txt
          grep -F 'VCMAP3 loaded path=VCMAP.BIN' selftest.txt
          grep -F 'VCCOL2 loaded path=VCCOL.BIN' selftest.txt
          grep -F 'VCVEH loaded path=VCVEH.BIN' selftest.txt
          grep -F 'nativecol=VCL1 colSpheres=2 colBoxes=1 colTris=12 susLines=4' selftest.txt
          grep -F 'atlas=8x8' selftest.txt
          grep -F 'RACER_SELFTEST_OK' selftest.txt
          rm -f VCMAP.BIN VCCOL.BIN VCVEH.BIN

