name: H3531 Stayplaytion Racer Stage7.4 OSM2WorldPlayableCity

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-racer-stage1.yml'
      - 'ports/racer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file curl qemu-user zip unzip python3 python3-pil binutils imagemagick

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch and pack CC0 Poly Haven sky + OpenMRac billboard
        run: |
          set -eux
          mkdir -p build/assets build/generated

          OPENMRAC_BASE='https://raw.githubusercontent.com/Franticware/OpenMRac-data/e68c2bb7636d08668ed11c5862c923d3db41c0c2'
          curl -fL --retry 4 "$OPENMRAC_BASE/th-speedway.jpg" -o build/assets/th-speedway.jpg
          curl -fL --retry 4 "$OPENMRAC_BASE/LICENSE" -o build/assets/OPENMRAC_DATA_LICENSE_CC0.txt

          POLY_REPO_COMMIT='1dd8e932402deb82422920df2e7fd079391e55d3'
          POLY_BASE="https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/$POLY_REPO_COMMIT"
          curl -fL --retry 4 \
            "$POLY_BASE/environment/skyboxes/polyhaven-hdri/kloppenheim_06_puresky_2k.hdr" \
            -o build/assets/kloppenheim_06_puresky_2k.hdr
          curl -fL --retry 4 "$POLY_BASE/README.md" -o build/assets/FPS_ENV_KIT_README.md

          cat > build/assets/POLYHAVEN_SKY_CC0.txt <<'EOF'
          Poly Haven: Kloppenheim 06 (Pure Sky)
          Original author: Greg Zaal; Pure Sky edit: Jarod Guest
          License: CC0 1.0 / Public Domain
          Original asset: https://polyhaven.com/a/kloppenheim_06_puresky
          Poly Haven license: https://polyhaven.com/license
          Reproducible source mirror:
          petroulacl/fps-buildings-env-kit
          commit 1dd8e932402deb82422920df2e7fd079391e55d3
          environment/skyboxes/polyhaven-hdri/kloppenheim_06_puresky_2k.hdr
          EOF

          # Equirectangular HDR -> upper-hemisphere LDR sky. Runtime receives
          # only a tiny RGB1555 panorama; no HDR decoder ships on Hi3531.
          convert build/assets/kloppenheim_06_puresky_2k.hdr \
            -gravity North -crop '100%x58%+0+0' +repage \
            -resize '640x256!' -colorspace sRGB -auto-level -gamma 1.10 \
            -modulate 112,92,100 PNG24:build/assets/polyhaven-day-sky.png
          identify build/assets/polyhaven-day-sky.png

          sha256sum \
            build/assets/kloppenheim_06_puresky_2k.hdr \
            build/assets/polyhaven-day-sky.png \
            > build/assets/POLYHAVEN_SKY_SHA256.txt
          sha256sum build/assets/th-speedway.jpg > build/assets/OPENMRAC_ASSET_SHA256.txt

          python3 ports/racer/asset_pack.py \
            build/assets/polyhaven-day-sky.png \
            build/assets/th-speedway.jpg \
            build/generated/racer_assets.h
          grep -F 'RACER_SKY_W 320' build/generated/racer_assets.h
          grep -F 'RACER_SKY_H 128' build/generated/racer_assets.h
          grep -F 'RACER_BILLBOARD_W' build/generated/racer_assets.h


      - name: Fetch and convert CC0 Kenney vehicle
        run: |
          set -eux
          mkdir -p build/vehicle build/generated
          KENNEY_COMMIT='2f2e5f2646dda89cb21d4e8539bab60c6e955dc8'
          KENNEY_BASE="https://raw.githubusercontent.com/KenneyNL/Starter-Kit-Racing/$KENNEY_COMMIT"
          curl -fL --retry 4 \
            "$KENNEY_BASE/models/vehicle-truck-yellow.glb" \
            -o build/vehicle/vehicle-truck-yellow.glb
          curl -fL --retry 4 \
            "$KENNEY_BASE/models/Textures/colormap.png" \
            -o build/vehicle/colormap.png
          curl -fL --retry 4 \
            "$KENNEY_BASE/README.md" \
            -o build/vehicle/KENNEY_STARTER_KIT_README.md
          sha256sum build/vehicle/vehicle-truck-yellow.glb build/vehicle/colormap.png \
            > build/vehicle/KENNEY_VEHICLE_SHA256.txt
          python3 ports/racer/glb_vehicle_pack.py \
            build/vehicle/vehicle-truck-yellow.glb \
            build/generated/kenney_vehicle.h \
            --target-size 900 \
            --texture build/vehicle/colormap.png \
            --texture-size 512 | tee build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'KENNEY_BODY_VERTEX_COUNT' build/generated/kenney_vehicle.h
          grep -F 'KENNEY_WHEEL_FL_VERTEX_COUNT' build/generated/kenney_vehicle.h
          grep -F 'KENNEY_VEHICLE_WHEELBASE' build/generated/kenney_vehicle.h
          grep -F 'GLB_PACK_OK' build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'GLB_ORIENTATION front_z' build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'GLB_TEXTURE' build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'KENNEY_COLORMAP_W 512' build/generated/kenney_vehicle.h
          grep -F 'kenney_body_uv' build/generated/kenney_vehicle.h


      - name: Fetch and convert higher-detail sports car
        run: |
          set -eux
          mkdir -p build/sports build/generated
          RALLY_COMMIT='be281680c44f14332142c195f62b63766e58c504'
          RALLY_BASE="https://raw.githubusercontent.com/mandaw2014/Rally/$RALLY_COMMIT"
          curl -fL --retry 4 \
            "$RALLY_BASE/assets/cars/sports-car.obj" \
            -o build/sports/sports-car.obj
          curl -fL --retry 4 \
            "$RALLY_BASE/assets/cars/garage/sports-car/sports-blue.png" \
            -o build/sports/sports-blue.png
          curl -fL --retry 4 \
            "$RALLY_BASE/README.md" \
            -o build/sports/RALLY_README.md
          sha256sum build/sports/sports-car.obj build/sports/sports-blue.png \
            > build/sports/SPORTS_CAR_SHA256.txt
          python3 ports/racer/obj_vehicle_pack.py \
            build/sports/sports-car.obj \
            build/sports/sports-blue.png \
            build/generated/sports_vehicle.h \
            --target-size 1050 \
            --texture-size 512 | tee build/sports/SPORTS_CAR_CONVERT_LOG.txt
          grep -F 'OBJ_PACK_OK' build/sports/SPORTS_CAR_CONVERT_LOG.txt
          grep -F 'OBJ_DIMENSIONS' build/sports/SPORTS_CAR_CONVERT_LOG.txt
          grep -F 'SPORTS_BODY_VERTEX_COUNT' build/generated/sports_vehicle.h
          grep -F 'SPORTS_WHEEL_FL_VERTEX_COUNT' build/generated/sports_vehicle.h
          grep -F 'SPORTS_VEHICLE_WHEELBASE' build/generated/sports_vehicle.h
          grep -F 'SPORTS_COLORMAP_W 512' build/generated/sports_vehicle.h


      - name: Fetch and convert CC0 environment concept
        run: |
          set -eux
          mkdir -p build/environment build/generated
          ENV_COMMIT='ec2281c5239b9e78e4ff06cdd6618a3dfbcb3b73'
          ENV_BASE="https://raw.githubusercontent.com/Hidencod/tge-assets/$ENV_COMMIT"

          curl -fL --retry 4 "$ENV_BASE/packs/nature-kit/tree-default.glb"             -o build/environment/tree-default.glb
          curl -fL --retry 4 "$ENV_BASE/packs/nature-kit/tree-pinedefaulta.glb"             -o build/environment/tree-pinedefaulta.glb
          curl -fL --retry 4 "$ENV_BASE/packs/city-kit-suburban/building-type-a.glb"             -o build/environment/building-type-a.glb
          curl -fL --retry 4 "$ENV_BASE/packs/city-kit-commercial/low-detail-building-a.glb"             -o build/environment/low-detail-building-a.glb
          curl -fL --retry 4 "$ENV_BASE/packs/city-kit-roads/light-square.glb"             -o build/environment/light-square.glb
          curl -fL --retry 4 "$ENV_BASE/packs/city-kit-roads/road-sign-warning.glb"             -o build/environment/road-sign-warning.glb
          curl -fL --retry 4 "$ENV_BASE/LICENSE"             -o build/environment/KENNEY_ENVIRONMENT_CC0.txt

          sha256sum             build/environment/tree-default.glb             build/environment/tree-pinedefaulta.glb             build/environment/building-type-a.glb             build/environment/low-detail-building-a.glb             build/environment/light-square.glb             build/environment/road-sign-warning.glb             > build/environment/KENNEY_ENVIRONMENT_SHA256.txt

          python3 ports/racer/glb_static_pack.py             build/environment/tree-default.glb build/generated/env_tree_default.h             --symbol env_tree_default --target-height 980             | tee build/environment/TREE_DEFAULT_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/tree-pinedefaulta.glb build/generated/env_tree_pine.h             --symbol env_tree_pine --target-height 1180             | tee build/environment/TREE_PINE_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/building-type-a.glb build/generated/env_house_suburban.h             --symbol env_house_suburban --target-height 1550             | tee build/environment/HOUSE_SUBURBAN_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/building-type-a.glb build/generated/env_house_mid.h             --symbol env_house_mid --target-height 1550 --cluster-step 72 --max-materials 32             | tee build/environment/HOUSE_MID_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/building-type-a.glb build/generated/env_house_far.h             --symbol env_house_far --target-height 1550 --cluster-step 190 --max-materials 16             | tee build/environment/HOUSE_FAR_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/low-detail-building-a.glb build/generated/env_building_commercial.h             --symbol env_building_commercial --target-height 1900             | tee build/environment/BUILDING_COMMERCIAL_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/low-detail-building-a.glb build/generated/env_building_commercial_mid.h             --symbol env_building_commercial_mid --target-height 1900 --cluster-step 90 --max-materials 16             | tee build/environment/BUILDING_COMMERCIAL_MID_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/low-detail-building-a.glb build/generated/env_building_commercial_far.h             --symbol env_building_commercial_far --target-height 1900 --cluster-step 210 --max-materials 8             | tee build/environment/BUILDING_COMMERCIAL_FAR_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/light-square.glb build/generated/env_street_light.h             --symbol env_street_light --target-height 920             | tee build/environment/STREET_LIGHT_CONVERT_LOG.txt
          python3 ports/racer/glb_static_pack.py             build/environment/road-sign-warning.glb build/generated/env_warning_sign.h             --symbol env_warning_sign --target-height 480             | tee build/environment/WARNING_SIGN_CONVERT_LOG.txt

          grep -F 'STATIC_GLTF_PACK_OK' build/environment/TREE_DEFAULT_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/TREE_PINE_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/HOUSE_SUBURBAN_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/HOUSE_MID_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/HOUSE_FAR_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/BUILDING_COMMERCIAL_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/BUILDING_COMMERCIAL_MID_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/BUILDING_COMMERCIAL_FAR_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/STREET_LIGHT_CONVERT_LOG.txt
          grep -F 'STATIC_GLTF_PACK_OK' build/environment/WARNING_SIGN_CONVERT_LOG.txt
          grep -F 'ENV_TREE_DEFAULT_TRIANGLE_COUNT' build/generated/env_tree_default.h
          grep -F 'ENV_TREE_PINE_TRIANGLE_COUNT' build/generated/env_tree_pine.h
          grep -F 'ENV_HOUSE_SUBURBAN_TRIANGLE_COUNT' build/generated/env_house_suburban.h
          grep -F 'ENV_HOUSE_MID_TRIANGLE_COUNT' build/generated/env_house_mid.h
          grep -F 'ENV_HOUSE_FAR_TRIANGLE_COUNT' build/generated/env_house_far.h
          grep -F 'ENV_BUILDING_COMMERCIAL_TRIANGLE_COUNT' build/generated/env_building_commercial.h
          grep -F 'ENV_BUILDING_COMMERCIAL_MID_TRIANGLE_COUNT' build/generated/env_building_commercial_mid.h
          grep -F 'ENV_BUILDING_COMMERCIAL_FAR_TRIANGLE_COUNT' build/generated/env_building_commercial_far.h
          grep -F 'ENV_STREET_LIGHT_TRIANGLE_COUNT' build/generated/env_street_light.h
          grep -F 'ENV_WARNING_SIGN_TRIANGLE_COUNT' build/generated/env_warning_sign.h


      - name: Build playable OSM2World city sectors
        run: |
          set -eux
          mkdir -p build/osm-city build/osm2world-bin build/generated

          MAP_NAME='athens-library-demo'
          SOUTH='37.9790'
          WEST='23.7310'
          NORTH='37.9832'
          EAST='23.7355'
          UA='Stayplaytion-H3531-Stage7.4/1.0'

          curl --fail --location --retry 5 --retry-delay 3 \
            --user-agent "$UA" \
            "https://api.openstreetmap.org/api/0.6/map?bbox=$WEST,$SOUTH,$EAST,$NORTH" \
            -o build/osm-city/map.osm
          test -s build/osm-city/map.osm
          grep -q '<way' build/osm-city/map.osm

          O2W_URL='https://osm2world.org/download/files/latest/OSM2World-latest-bin.zip'
          O2W_SHA='185d3ec08b703b04ae84f583955e6638bd2d76382425f4d2afe74d09c0a1fc0c'
          curl --fail --location --retry 5 --retry-delay 3 \
            "$O2W_URL" -o build/osm2world-bin/OSM2World-latest-bin.zip
          printf '%s  %s\n' "$O2W_SHA" build/osm2world-bin/OSM2World-latest-bin.zip \
            | sha256sum -c -

          unzip -q build/osm2world-bin/OSM2World-latest-bin.zip \
            -d build/osm2world-bin/unpacked
          O2W_JAR="$(find build/osm2world-bin/unpacked -type f -name 'OSM2World.jar' | head -n1)"
          test -n "$O2W_JAR"
          java -jar "$O2W_JAR" --version | tee build/osm-city/OSM2WORLD_VERSION.txt

          java -Xmx4g -jar "$O2W_JAR" convert \
            -i build/osm-city/map.osm \
            --lod 1 \
            -o "build/osm-city/$MAP_NAME.glb"

          test -s "build/osm-city/$MAP_NAME.glb"
          python3 ports/racer/osm2world_glb_report.py \
            "build/osm-city/$MAP_NAME.glb" \
            build/osm-city/OSM2WORLD_GLB_REPORT.json \
            --map-name "$MAP_NAME" \
            | tee build/osm-city/OSM2WORLD_GLB_REPORT.log
          grep -F 'OSM2WORLD_GLB_REPORT_OK' build/osm-city/OSM2WORLD_GLB_REPORT.log

          python3 ports/racer/osm2world_sector_pack.py \
            "build/osm-city/$MAP_NAME.glb" \
            build/generated/osm_city_map.h \
            --scale 240 --sector-m 48 --clip-m 270 \
            --spawn-x -19.535 --spawn-z 42.699 --spawn-yaw 2.369313148 \
            | tee build/osm-city/OSM2WORLD_SECTOR_PACK.log

          grep -F 'OSM2WORLD_SECTOR_PACK_OK' build/osm-city/OSM2WORLD_SECTOR_PACK.log
          grep -F 'OSM_CITY_VERTEX_COUNT' build/generated/osm_city_map.h
          grep -F 'OSM_CITY_TRIANGLE_COUNT' build/generated/osm_city_map.h
          grep -F 'OSM_CITY_SECTOR_COUNT' build/generated/osm_city_map.h
          grep -F 'OSM_CITY_BUILDING_COUNT' build/generated/osm_city_map.h

          sha256sum \
            build/osm-city/map.osm \
            "build/osm-city/$MAP_NAME.glb" \
            build/generated/osm_city_map.h \
            > build/osm-city/OSM2WORLD_MAP_SHA256.txt

          cat > build/osm-city/OSM_ATTRIBUTION.txt <<'EOF'
          Map data: OpenStreetMap contributors
          Data license: Open Database License (ODbL) 1.0
          https://www.openstreetmap.org/copyright

          3D conversion: OSM2World
          https://osm2world.org/
          OSM2World code license: MIT

          Stayplaytion build target:
          Real road geometry is retained from the OSM2World GLB.
          Expensive building meshes are replaced offline by lightweight volumes
          using their real OSM2World bounds/heights, then bucketed into 48m sectors.
          Runtime performs no OSM/GLB parsing.
          EOF

      - name: Fetch and pack CC0 asphalt texture
        run: |
          set -eux
          mkdir -p build/track build/generated
          curl -fL --retry 4 \
            'https://opengameart.org/sites/default/files/asphalt_road_0.png' \
            -o build/track/asphalt_road.png
          cat > build/track/ASPHALT_SOURCE_CC0.txt <<'EOF'
          Asphalt Road Texture Free
          Author: ForKotLow
          License: CC0 / Public Domain
          Source page: https://opengameart.org/content/asphalt-road-texture-free
          Source image: https://opengameart.org/sites/default/files/asphalt_road_0.png
          EOF
          sha256sum build/track/asphalt_road.png > build/track/ASPHALT_SHA256.txt
          python3 ports/racer/track_texture_pack.py \
            build/track/asphalt_road.png \
            build/generated/track_texture.h | tee build/track/TRACK_TEXTURE_CONVERT_LOG.txt
          grep -F 'TRACK_TEXTURE_OK' build/track/TRACK_TEXTURE_CONVERT_LOG.txt
          grep -F 'TRACK_ASPHALT_W 128' build/generated/track_texture.h

      - name: Build static Racer
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-gcc \
            -std=gnu99 -O3 -static \
            -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -Wl,--gc-sections \
            -Wall -Wextra -pthread \
            -Ibuild/generated \
            ports/racer/stayplaytion-racer.c \
            -lm \
            -o RACER.BIN
          arm-linux-musleabi-strip RACER.BIN
          file RACER.BIN
          readelf -h RACER.BIN | grep -F 'Machine:                           ARM'
          ! readelf -A RACER.BIN | grep -F 'Tag_ABI_VFP_args'

      - name: QEMU game-render selftest
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 ./RACER.BIN --selftest | tee selftest.txt
          grep -F 'RACER_SELFTEST_OK' selftest.txt

      - name: Static architecture audit
        run: |
          set -eux
          strings RACER.BIN | grep -F '[racer] HIFB ready 1280x720 <- 640x360 exact2x Stage7.4 osm2world-playable-city sector-stream world-xy building-collision fixed60'
          strings RACER.BIN | grep -F 'camdist=%.0f targetdist=%.0f'
          strings RACER.BIN | grep -F '[racer] dual-core render/present pipeline active'
          strings RACER.BIN | grep -F '[racer] PERF stage7.4 render_fps='
          strings RACER.BIN | grep -F '[racer] PROFILE avg_ms'
          strings RACER.BIN | grep -F 'sim_hz='
          strings RACER.BIN | grep -F 'presented_fps='
          strings RACER.BIN | grep -F 'osm2world-city free-drive reverse sports-texture=%dx%d'
          strings RACER.BIN | grep -F '[racer] primary steering node='
          strings RACER.BIN | grep -F 'HIFB vblank 0x4664 active'
          strings RACER.BIN | grep -F 'RACER_SELFTEST_OK'
          grep -F 'BACKEND=native-fb' ports/racer/APPINFO.CFG
          grep -F 'EXEC_NATIVE=/mnt/usb/H3531/APPS/racer/RACER.BIN' ports/racer/APPINFO.CFG
          ! grep -E 'saveenv|sf[[:space:]]+(erase|write)|flash_erase|mtd_debug[[:space:]]+write' \
            ports/racer/stayplaytion-racer.c ports/racer/RACER.APP

      - name: Package USB overlay
        run: |
          set -eux
          ROOT=out/H3531
          APP="$ROOT/APPS/racer"
          DOC="$ROOT/SYSTEM/docs"
          mkdir -p "$APP" "$DOC/licenses"

          cp RACER.BIN "$APP/RACER.BIN"
          cp ports/racer/RACER.APP "$APP/RACER.APP"
          cp ports/racer/APPINFO.CFG "$APP/APPINFO.CFG"
          cp ports/racer/RACER-MEDIA-PROBE.APP "$APP/RACER-MEDIA-PROBE.APP"
          chmod 755 "$APP/RACER.BIN" "$APP/RACER.APP" "$APP/RACER-MEDIA-PROBE.APP"

          cp build/assets/OPENMRAC_DATA_LICENSE_CC0.txt \
            "$DOC/licenses/OPENMRAC_DATA_CC0.txt"
          cp build/assets/OPENMRAC_ASSET_SHA256.txt \
            "$DOC/RACER_OPENMRAC_ASSET_SHA256.txt"
          cp build/assets/POLYHAVEN_SKY_CC0.txt \
            "$DOC/licenses/POLYHAVEN_SKY_CC0.txt"
          cp build/assets/POLYHAVEN_SKY_SHA256.txt \
            "$DOC/POLYHAVEN_SKY_SHA256.txt"
          cp build/vehicle/KENNEY_STARTER_KIT_README.md \
            "$DOC/KENNEY_STARTER_KIT_RACING_README.md"
          cp build/vehicle/KENNEY_VEHICLE_SHA256.txt \
            "$DOC/KENNEY_VEHICLE_SHA256.txt"
          cp build/vehicle/KENNEY_CONVERT_LOG.txt \
            "$DOC/KENNEY_VEHICLE_CONVERT_LOG.txt"
          cp build/environment/KENNEY_ENVIRONMENT_CC0.txt \
            "$DOC/licenses/KENNEY_ENVIRONMENT_CC0.txt"
          cp build/environment/KENNEY_ENVIRONMENT_SHA256.txt \
            "$DOC/KENNEY_ENVIRONMENT_SHA256.txt"
          cp build/environment/*_CONVERT_LOG.txt "$DOC/"
          cp build/osm-city/OSM_ATTRIBUTION.txt "$DOC/licenses/"
          cp build/osm-city/OSM2WORLD_VERSION.txt "$DOC/"
          cp build/osm-city/OSM2WORLD_GLB_REPORT.json "$DOC/"
          cp build/osm-city/OSM2WORLD_GLB_REPORT.log "$DOC/"
          cp build/osm-city/OSM2WORLD_SECTOR_PACK.log "$DOC/"
          cp build/osm-city/OSM2WORLD_MAP_SHA256.txt "$DOC/"

          cat > "$DOC/README_RACER_STAGE7_4.txt" <<'EOF'
          Stayplaytion Racer Stage7.4 OSM2World Playable City
          ===================================================

          This is the first playable real-map prototype.

          Runtime architecture
          --------------------
          - native /dev/fb0 A1R5G5B5, 640x360 -> exact 2x 1280x720
          - CPU0 simulation/render, CPU1 framebuffer presenter
          - fixed 60 Hz vehicle simulation
          - player vehicle now owns real world_x/world_z coordinates
          - old spline track remains in source as fallback but does not own Stage7.4 pose
          - spring chase camera follows the free world-space vehicle
          - OSM2World/GLB is build-time only; the Hi3531 has no GLB parser

          Map pipeline
          ------------
          OpenStreetMap bbox:
            south 37.9790
            west  23.7310
            north 37.9832
            east  23.7355

          OSM2World LOD 1 converts this real Athens street area to GLB.
          The Stayplaytion sector packer then:
          - keeps real OSM2World road triangles;
          - replaces very expensive building meshes with lightweight volumes
            using each building's real bounds and height;
          - divides geometry into 48m sectors;
          - scales one metre to 240 game-world units;
          - emits static C arrays into RACER.BIN;
          - emits building AABBs for simple collision.

          Initial spawn
          -------------
          The car starts on the OSM street Ρήγα Φεραίου near:
            local OSM2World x = -19.535m
            local OSM2World z =  42.699m
            heading            = 135.75 degrees

          Gameplay
          --------
          Left/right: steer
          Up/W or primary gamepad south-style button: throttle
          Down/S or east-style button: brake; hold after stop for reverse
          Esc/F12: exit
          Select+Start: exit

          Prototype limitations
          ---------------------
          - building collision is simple axis-aligned collision, not polygon collision;
          - traffic is disabled in OSM city mode;
          - road-vs-grass grip classification is not implemented yet;
          - road markings/textures are represented through compact flat materials;
          - map boundary is clamped to the imported prototype district;
          - this build is intended to validate free city driving and sector cost first.

