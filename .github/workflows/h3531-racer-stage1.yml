          grep -F 'VFW collision window merged' selftest.txt
          grep -F 'VFW1 runtime active center=0,0' selftest.txt
          grep -F 'VCVEH loaded path=VCVEH.BIN' selftest.txt
          grep -F 'nativecol=VCL2 colSpheres=2 colBoxes=1 colTris=12 susLines=4 ride=210.0' selftest.txt
          grep -F 'RACER_SELFTEST_SUSPENSION_OK contacts=4 mask=0xf surface=1/1/1/1' selftest.txt
          grep -F 'RACER_SELFTEST_BRIDGE_OK y=480.0 surface=7' selftest.txt
