      - name: Build static Racer
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-gcc \
            -std=gnu99 -O3 -static \
            -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp \
            -fno-math-errno -fno-trapping-math \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -Wl,--gc-sections \
            -Wall -Wextra -Werror=incompatible-pointer-types -pthread \
            -Ibuild/generated \
            ports/racer/stayplaytion-racer.c \
            -lm \
            -o RACER.BIN
          arm-linux-musleabi-strip RACER.BIN
          file RACER.BIN
          readelf -h RACER.BIN | grep -F 'Machine:                           ARM'
          ! readelf -A RACER.BIN | grep -F 'Tag_ABI_VFP_args'
          ! readelf -A RACER.BIN | grep -E 'Tag_Advanced_SIMD_arch|NEON'

      - name: QEMU game-render selftest
        run: |
          set -eux
          python3 - <<'PY'
          import struct
          atlas_w=8
          atlas_h=8
          atlas=[]
          for y in range(atlas_h):
              for x in range(atlas_w):
                  # checker with transparent corners exercises alpha test.
                  if (x<2 and y<2) or (x>5 and y>5):
                      atlas.append(0)
                  else:
                      r=31 if ((x^y)&1)==0 else 10
                      g=18
                      b=5
                      atlas.append(0x8000|(r<<10)|(g<<5)|b)

          # material 0 = textured full atlas; material 1 = solid fallback
          materials=[
              (0,0,8,8,0xFFFF,3,0),
              (0,0,0,0,0xC210,0,0),
          ]
          verts=[
              (-20.0,0.0,-20.0,0.0,0.0),
              ( 20.0,0.0,-20.0,1.0,0.0),
              ( 20.0,0.0, 20.0,1.0,1.0),
              (-20.0,0.0, 20.0,0.0,1.0),
              (-10.0,0.0, 10.0,0.0,1.0),
              ( 10.0,0.0, 10.0,1.0,1.0),
              ( 10.0,10.0,10.0,1.0,0.0),
              (-10.0,10.0,10.0,0.0,0.0),
          ]
          tris=[
              (0,1,2,0,1),(0,2,3,0,1),
              (4,5,6,0,0),(4,6,7,0,0),
          ]
          with open("VCMAP.BIN","wb") as fp:
              fp.write(struct.pack(
                  "<4sI10f6I",b"VCM3",3,
                  240.0,64.0,
                  0.0,0.12,0.0,0.0,
                  -32.0,32.0,-32.0,32.0,
                  len(verts),len(tris),1,len(materials),atlas_w,atlas_h
              ))
              for m in materials: fp.write(struct.pack("<HHHHHBB",*m))
              for v in verts: fp.write(struct.pack("<5f",*v))
              for a,b,c,m,flags in tris:
                  fp.write(struct.pack("<HHHHBB",a,b,c,m,flags,0))
              fp.write(struct.pack("<hhIIII",0,0,0,len(verts),0,len(tris)))
              for px in atlas: fp.write(struct.pack("<H",px))
          PY
          python3 - <<'PY'
          import struct
          # Native GTA-style surfaces: tarmac deck, pavement wall,
          # plus one lamp-post-like collision sphere.
          coltris=[
              # Ground road.
              ((-20.0,0.0,-20.0),(20.0,0.0,-20.0),(20.0,0.0,20.0),1,0),
              ((-20.0,0.0,-20.0),(20.0,0.0,20.0),(-20.0,0.0,20.0),1,0),
              # Bridge deck directly above the same XZ area.
              ((-20.0,2.0,-20.0),(20.0,2.0,-20.0),(20.0,2.0,20.0),7,0),
              ((-20.0,2.0,-20.0),(20.0,2.0,20.0),(-20.0,2.0,20.0),7,0),
              # Vertical building/wall face.
              ((8.0,0.0,-8.0),(8.0,4.0,-8.0),(8.0,4.0,8.0),5,0),
          ]
          colspheres=[
              ((5.0,1.0,0.0),0.40,13,0),
          ]
          with open("VCCOL.BIN","wb") as fp:
              fp.write(struct.pack(
                  "<4sIffIII",b"VCC2",2,240.0,64.0,
                  len(coltris),len(colspheres),1
              ))
              for a,b,c,surface,piece in coltris:
                  fp.write(struct.pack(
                      "<9fBBH",
                      a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2],
                      surface,piece,0
                  ))
              for center,r,surface,piece in colspheres:
                  fp.write(struct.pack(
                      "<4fBBH",center[0],center[1],center[2],r,surface,piece,0
                  ))
              fp.write(struct.pack(
                  "<hhIIII",0,0,0,len(coltris),0,len(colspheres)
              ))
          PY
          python3 - <<'PY'
          import struct
          materials=[(0,0,8,8,0xBDEF,1,0)]
          verts=[
              (-140.0,20.0,-260.0,0.0,0.0),
              ( 140.0,20.0,-260.0,1.0,0.0),
              ( 140.0,20.0, 260.0,1.0,1.0),
              (-140.0,20.0, 260.0,0.0,1.0),
              (   0.0,180.0,   0.0,0.5,0.5),
          ]
          tris=[
              (0,1,4,0,0),(1,2,4,0,0),(2,3,4,0,0),(3,0,4,0,0),
              (0,3,2,0,0),(0,2,1,0,0),
          ]
          atlas=[0xBDEF]*(8*8)
          hf=[
              240.0,1400.0,1.0,0.82,0.52,
              165.0,24.0,8.0,0.52,35.0,
              0.0,0.0,-0.25,1.8,4.5,1.4,
          ]
          with open("VCVEH.BIN","wb") as fp:
              fp.write(struct.pack(
                  "<4sI5I16f",b"VCV1",1,
                  len(verts),len(tris),len(materials),8,8,*hf
              ))
              for m in materials: fp.write(struct.pack("<HHHHHBB",*m))
              for v in verts: fp.write(struct.pack("<5f",*v))
              for t in tris: fp.write(struct.pack("<HHHBB",*t))
              for px in atlas: fp.write(struct.pack("<H",px))
              # VCL2 trailer adds the normal reVC-style body ride height.
              col_spheres=[
                  ((0.0,150.0,0.0),110.0,6,1),
                  ((0.0,150.0,150.0),95.0,6,2),
              ]
              sus_lines=[
                  ((-110.0,90.0,210.0),(-110.0,-90.0,210.0),1),
                  ((110.0,90.0,210.0),(110.0,-90.0,210.0),2),
                  ((-110.0,90.0,-210.0),(-110.0,-90.0,-210.0),3),
                  ((110.0,90.0,-210.0),(110.0,-90.0,-210.0),4),
              ]
              fp.write(struct.pack(
                  "<4sI4I11f",b"VCL2",2,
                  len(col_spheres),1,12,len(sus_lines),
                  0.0,150.0,0.0,300.0,
                  -150.0,0.0,-280.0,
                  150.0,300.0,280.0,
                  210.0
              ))
              for center,r,surface,piece in col_spheres:
                  fp.write(struct.pack(
                      "<4fBBH",center[0],center[1],center[2],r,surface,piece,0
                  ))
              for p0,p1,part in sus_lines:
                  fp.write(struct.pack(
                      "<6fBBH",*p0,*p1,part,0,0
                  ))
          PY
          mkdir -p pages/P_0_0
          cp VCMAP.BIN pages/P_0_0/VCMAP.BIN
          cp VCMAP.BIN pages/P_0_0/VCBASE.BIN
          cp VCCOL.BIN pages/P_0_0/VCCOL.BIN
          python3 - <<'PY'
          import os,struct
          # Synthetic VCO2 object sidecar: retain object-level atomic LOD metadata.
          with open("pages/P_0_0/VCOBJ.BIN","wb") as fp:
              fp.write(struct.pack("<4sIIIfI",b"VCO2",2,2,4,240.0,0))
              fp.write(struct.pack(
                  "<8fII",0.0,0.0,15.0,8.0,112.0,56.0,112.0,0.0,0,100
              ))
              fp.write(struct.pack(
                  "<8fII",20.0,0.0,20.0,8.0,112.0,112.0,0.0,0.0,0,101
              ))
              fp.write(struct.pack("<4H",0,0,1,1))
              fp.write(struct.pack("<4B",0,1,0,0))
          mb=os.path.getsize("pages/P_0_0/VCMAP.BIN")
          cb=os.path.getsize("pages/P_0_0/VCCOL.BIN")
          with open("VCWORLD.BIN","wb") as fp:
