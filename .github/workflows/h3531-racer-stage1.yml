          LOCAL VICE CITY MAP + PLAYER VEHICLE TEST
          =========================================

          These tools do not contain or download GTA assets.
          They read the user's own classic PC Vice City installation locally.

          The wrapper builds:
          - VCMAP.BIN: VCM3 textured local city district;
          - VCCOL.BIN: VCC2 native Vice City COL mesh/box/sphere collision with original surface IDs;
          - VCVEH.BIN: selected player car DFF/TXD + native vehicles.col CColModel spheres.
          - VCHAND.BIN: exact handling.cfg row including drive type/flags.
          - VCSURF.BIN: original surface.dat rubber-vs-road/loose/sand/wet adhesion matrix.

          Default player vehicle is AUTO: the importer chooses a real four-wheel
          Vice City car that fits the Hi3531 detail budget, and refuses to emit a
          wheel-less VCVEH.BIN.

          For the current development PC/USB layout, run:
          REBUILD_VC_LATEST.cmd

          The default rebuild is the large Starfish-centred development region.
          To print the original Vice City IPL world bounds without packing:
          MEASURE_VC_WORLD.cmd

          To audit the COMPLETE Vice City world for the future paged/streamed
          full-city format without copying GTA assets, run:
          AUDIT_VC_FULL_WORLD.cmd

          After changing collision discovery, a fast COL-only validation can be
          run without repeating the expensive DFF/TXD geometry scan:
          AUDIT_VC_COLLISION_FAST.cmd

          Once the full audit and collision coverage are clean, build the local
          paged VFW1 city pack with:
          BUILD_VC_FULL_WORLD.cmd

          This creates GTA-style split page files under build\vc-full-pack:
          - VCBASE.BIN: persistent road/base geometry;
          - VCMAP.BIN: streamed building/detail geometry;
          - VCOBJ.BIN: GTA-instance identity + triangle-to-object mapping for object-level alpha streaming;
          - VCCOL.BIN: complete collision independent of visual streaming;
          - VCWORLD.BIN: VFW1 index for the local-page streaming grid.
          The runtime keeps a bounded 5x5 window of small pages, streams nearest
          detail first, and frees pages that leave the local window. There is no
          stippled page fade. These GTA-derived files stay local.

          To inspect missing texture names in an ALREADY BUILT pack without a
          rebuild, run:
          AUDIT_VC_FULL_PACK_LOCAL.cmd

          If that audit reports missing textures, repair only affected pages with:
          REPAIR_VC_FULL_WORLD_TEXTURES.cmd

          If Windows reports filesystem corruption for one generated page, repair
          the drive first and rebuild just that page without touching VCWORLD.BIN:
          REBUILD_VC_FULL_WORLD_PAGE.cmd -13,15

          DEPLOY_VC_FULL_WORLD.cmd now stages the complete VFW pack to USB, reads
          every staged binary back, and only then activates it. A failed copy can
          no longer leave a half-old/half-new working city.

          The importer searches both extracted gta3 assets and loose TXDs under
          the original Vice City models directory; clean pages are reused.

          To copy VCWORLD.BIN + pages to I:\H3531\APPS\racer, run:
          DEPLOY_VC_FULL_WORLD.cmd

          Full-world deploy defaults to the ORIGINAL GTA Vice City Oceanic:
          the yellow/white car parked outside Ocean View Hotel. Every default
          deploy rebuilds the vehicle body/vehicle TXD strictly from
          E:\Games\GTA Vice City\models\gta3.img. Extracted models\gta3 and
          loose replacement vehicle files are forbidden for this stock-car path.
          Native vehicles.col comes from the clean installation, VCHAND.BIN
          comes from the OCEANIC row in data\handling.cfg, and VCSURF.BIN comes
          from data\surface.dat. Racer applies steering/thrust/brake through four
          ProcessWheel-style contact forces instead of a kinematic bicycle yaw:
          DEPLOY_VC_FULL_WORLD.cmd

          The strict vehicle-only builder is also available directly:
          BUILD_VC_OCEANIC_ONLY.cmd "E:\Games\GTA Vice City"
          It writes provenance (source path, byte size and SHA-256) to
          build\vc-local\vc_vehicle_report.json and does not rebuild the city.

          The downloaded Rally sports car remains development fallback only:
          DEPLOY_VC_FULL_WORLD.cmd "" "" sports CHEETAH

          Racer will prefer VCWORLD.BIN when present and keep a bounded 5x5
          local VFW1 window around the car. Current packs use 96m pages, so the
          streaming unit is four times smaller by area than the old 192m grid.
          VCC2 from resident pages is merged into the native collision solver;
          VCM3 page atlases remain independent and far pages are actually freed.

          Default local paths:
          E:\Games\GTA Vice City
          E:\Games\GTA Vice City\models\gta3

          The extracted gta3 directory is preferred. gta3.img is only a fallback.
          The auditor writes metadata-only reports under build\vc-full-audit.

          Generic example:

