name: H3531 Stayplaytion Racer Stage4.5 PlantedTires

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-racer-stage1.yml'
      - 'ports/racer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y file curl qemu-user zip python3 python3-pil binutils

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned CC0 OpenMRac assets
        run: |
          set -eux
          mkdir -p build/assets build/generated
          BASE='https://raw.githubusercontent.com/Franticware/OpenMRac-data/e68c2bb7636d08668ed11c5862c923d3db41c0c2'
          curl -fL --retry 4 "$BASE/sky0s.jpg" -o build/assets/sky0s.jpg
          curl -fL --retry 4 "$BASE/th-speedway.jpg" -o build/assets/th-speedway.jpg
          curl -fL --retry 4 "$BASE/LICENSE" -o build/assets/OPENMRAC_DATA_LICENSE_CC0.txt
          sha256sum build/assets/sky0s.jpg build/assets/th-speedway.jpg \
            > build/assets/OPENMRAC_ASSET_SHA256.txt
          python3 ports/racer/asset_pack.py \
            build/assets/sky0s.jpg \
            build/assets/th-speedway.jpg \
            build/generated/racer_assets.h
          grep -F 'RACER_SKY_W' build/generated/racer_assets.h
          grep -F 'RACER_BILLBOARD_W' build/generated/racer_assets.h


      - name: Fetch and convert CC0 Kenney vehicle
        run: |
          set -eux
          mkdir -p build/vehicle build/generated
          KENNEY_COMMIT='2f2e5f2646dda89cb21d4e8539bab60c6e955dc8'
          KENNEY_BASE="https://raw.githubusercontent.com/KenneyNL/Starter-Kit-Racing/$KENNEY_COMMIT"
          curl -fL --retry 4 \
            "$KENNEY_BASE/models/vehicle-truck-yellow.glb" \
            -o build/vehicle/vehicle-truck-yellow.glb
          curl -fL --retry 4 \
            "$KENNEY_BASE/models/Textures/colormap.png" \
            -o build/vehicle/colormap.png
          curl -fL --retry 4 \
            "$KENNEY_BASE/README.md" \
            -o build/vehicle/KENNEY_STARTER_KIT_README.md
          sha256sum build/vehicle/vehicle-truck-yellow.glb build/vehicle/colormap.png \
            > build/vehicle/KENNEY_VEHICLE_SHA256.txt
          python3 ports/racer/glb_vehicle_pack.py \
            build/vehicle/vehicle-truck-yellow.glb \
            build/generated/kenney_vehicle.h \
            --target-size 900 \
            --texture build/vehicle/colormap.png \
            --texture-size 512 | tee build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'KENNEY_BODY_VERTEX_COUNT' build/generated/kenney_vehicle.h
          grep -F 'KENNEY_WHEEL_FL_VERTEX_COUNT' build/generated/kenney_vehicle.h
          grep -F 'KENNEY_VEHICLE_WHEELBASE' build/generated/kenney_vehicle.h
          grep -F 'GLB_PACK_OK' build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'GLB_ORIENTATION front_z' build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'GLB_TEXTURE' build/vehicle/KENNEY_CONVERT_LOG.txt
          grep -F 'KENNEY_COLORMAP_W 512' build/generated/kenney_vehicle.h
          grep -F 'kenney_body_uv' build/generated/kenney_vehicle.h

      - name: Build static Racer
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-gcc \
            -std=gnu99 -O3 -static \
            -mcpu=cortex-a9 -mfpu=vfpv3-d16 -mfloat-abi=softfp \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -Wl,--gc-sections \
            -Wall -Wextra -pthread \
            -Ibuild/generated \
            ports/racer/stayplaytion-racer.c \
            -lm \
            -o RACER.BIN
          arm-linux-musleabi-strip RACER.BIN
          file RACER.BIN
          readelf -h RACER.BIN | grep -F 'Machine:                           ARM'
          ! readelf -A RACER.BIN | grep -F 'Tag_ABI_VFP_args'

      - name: QEMU game-render selftest
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 ./RACER.BIN --selftest | tee selftest.txt
          grep -F 'RACER_SELFTEST_OK' selftest.txt

      - name: Static architecture audit
        run: |
          set -eux
          strings RACER.BIN | grep -F '[racer] HIFB ready 1280x720 <- 640x360 exact2x textured-vehicle unified-depth planted-tires fixed60'
          strings RACER.BIN | grep -F '[racer] dual-core render/present pipeline active'
          strings RACER.BIN | grep -F '[racer] PERF planted fps='
          strings RACER.BIN | grep -F 'vehicle-orientation=+Z-front texture=%dx%d'
          strings RACER.BIN | grep -F '[racer] primary steering node='
          strings RACER.BIN | grep -F 'HIFB vblank 0x4664 active'
          strings RACER.BIN | grep -F 'RACER_SELFTEST_OK'
          grep -F 'BACKEND=native-fb' ports/racer/APPINFO.CFG
          grep -F 'EXEC_NATIVE=/mnt/usb/H3531/APPS/racer/RACER.BIN' ports/racer/APPINFO.CFG
          ! grep -E 'saveenv|sf[[:space:]]+(erase|write)|flash_erase|mtd_debug[[:space:]]+write' \
            ports/racer/stayplaytion-racer.c ports/racer/RACER.APP

      - name: Package USB overlay
        run: |
          set -eux
          ROOT=out/H3531
          APP="$ROOT/APPS/racer"
          DOC="$ROOT/SYSTEM/docs"
          mkdir -p "$APP" "$DOC/licenses"

          cp RACER.BIN "$APP/RACER.BIN"
          cp ports/racer/RACER.APP "$APP/RACER.APP"
          cp ports/racer/APPINFO.CFG "$APP/APPINFO.CFG"
          cp ports/racer/RACER-MEDIA-PROBE.APP "$APP/RACER-MEDIA-PROBE.APP"
          chmod 755 "$APP/RACER.BIN" "$APP/RACER.APP" "$APP/RACER-MEDIA-PROBE.APP"

          cp build/assets/OPENMRAC_DATA_LICENSE_CC0.txt \
            "$DOC/licenses/OPENMRAC_DATA_CC0.txt"
          cp build/assets/OPENMRAC_ASSET_SHA256.txt \
            "$DOC/RACER_OPENMRAC_ASSET_SHA256.txt"
          cp build/vehicle/KENNEY_STARTER_KIT_README.md \
            "$DOC/KENNEY_STARTER_KIT_RACING_README.md"
          cp build/vehicle/KENNEY_VEHICLE_SHA256.txt \
            "$DOC/KENNEY_VEHICLE_SHA256.txt"
          cp build/vehicle/KENNEY_CONVERT_LOG.txt \
            "$DOC/KENNEY_VEHICLE_CONVERT_LOG.txt"

          cat > "$DOC/README_RACER_STAGE1.txt" <<'EOF'
          Stayplaytion Racer Stage4.5 PlantedTires
          Level: Boulevard Sprint

          Architecture
          ------------
          - native /dev/fb0, A1R5G5B5
          - 640x360 internal target, exact 2x to 1280x720
          - CPU0 game/render, CPU1 framebuffer present
          - HIFB vendor vblank ioctl 0x4664
          - pseudo-3D projected road segments: curves + hills + clipping
          - official Kenney CC0 vehicle GLB converted to C arrays at build time
          - five independent meshes: body + FL/FR/RL/RR wheels
          - source-model orientation is verified from named wheel pivots (+Z front / -Z rear)
          - original Kenney colormap.png + TEXCOORD_0 UVs are baked into RACER.BIN
          - original 512x512 RGBA source texture is preserved as a 512x512 RGB1555 runtime atlas
          - affine UV rasterization with per-face lighting textures player and near AI cars
          - body and all four wheels share one far-to-near triangle queue
          - wheel triangles can no longer blindly overwrite the body just because wheels render later
          - front wheels use Ackermann steering geometry and matching visual turn direction
          - planted track-relative tyre model tuned for the pseudo-3D road coordinate system
          - no independent lateral slip velocity and no endless accumulated bicycle yaw
          - centered steering converges heading to the road frame so lateral drift becomes zero
          - wheel rotation and vehicle displacement use the exact same travelled distance
          - max world speed reduced from 155 to 90 units/tick to remove excessive tyre RPM
          - high-speed front-wheel lock remains visibly non-zero (~6 degrees)
          - rendered body yaw equals the bounded physical heading exactly
          - body pitch under acceleration/braking and roll under corner load
          - closest AI cars use articulated Kenney meshes; distant AI keeps cheap LOD
          - true low-poly multi-volume 3D buildings/grandstands with flat face lighting
          - corrected continuous-position AI traffic (no frame*segment teleport bug)
          - AI speeds are closer to player pace so overtakes remain readable
          - fixed 60 Hz simulation and present pacing; gameplay no longer depends on raw FPS
          - moving sky panorama placeholder; hardware video sky is the next media step
          - calibrated primary evdev gamepad interface
          - keyboard arrows/W/S remain available

          Level
          -----
          Start straight, grandstands, fast right/left complex, hill,
          urban chicane, sweeping middle sector, descent and final straight.
          Six large trackside billboard locations are already part of the level.
          Stage2 billboards still show animated CC0 imagery; they are the surfaces
          intended for a later hardware H.264 VDEC/TDE experiment. A separate
          RACER-MEDIA-PROBE.APP searches this exact firmware for matching vendor
          userspace libraries/binaries before any ABI-sensitive media code is used.

          CC0 visual material
          -------------------
          OpenMRac-data, commit e68c2bb7636d08668ed11c5862c923d3db41c0c2
          sky0s.jpg
          th-speedway.jpg
          License: CC0-1.0
          https://github.com/Franticware/OpenMRac-data

          Kenney vehicle
          --------------
          KenneyNL/Starter-Kit-Racing
          commit 2f2e5f2646dda89cb21d4e8539bab60c6e955dc8
          models/vehicle-truck-yellow.glb
          The upstream README states included 3D models/assets are CC0.
          Build conversion extracts body, all four independently animated wheels,
          TEXCOORD_0 UVs and models/Textures/colormap.png. Runtime has no PNG loader;
          the texture is baked as RGB1555 into the static ARM binary.

          The road renderer and vehicle physics are purpose-built for
          Stayplaytion/Hi3531. Runtime requires no SDL, OpenGL, Godot,
          Bullet or GLTF loader.

          Controls
          --------
          Left/right: steer
          Up/W or primary gamepad south-style button: throttle
          Down/S or east-style button: brake
          Esc/F12: exit
          Select+Start: exit

          Next
          ----
          Verify real-device performance and handling, then:
          1. verify there is no continuous side drift with centered steering;
          2. verify wheel RPM now matches the apparent road speed;
          3. verify front-wheel steering remains visible at maximum speed;
          4. verify the car no longer looks like it is sliding sideways on a fast turn;
          5. measure the fixed 60 Hz budget and then tune road/camera feel separately if needed;
          3. benchmark HiSilicon TDE for scaling/blits;
          4. use /proc/umap fingerprints to identify matching legacy MPP ABI;
          5. connect H.264 VDEC/VO first to sky, then to in-world billboards.
          EOF

          (
            cd out
            find H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
              > H3531/SYSTEM/docs/SHA256SUMS_RACER_STAGE1.txt
          )

          cd out
          zip -qr ../H3531-Racer-Stage4.5-PlantedTires-PATCH.zip H3531
          cd ..
          unzip -t H3531-Racer-Stage4.5-PlantedTires-PATCH.zip
          sha256sum H3531-Racer-Stage4.5-PlantedTires-PATCH.zip \
            | tee H3531-Racer-Stage4.5-PlantedTires-PATCH.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Racer-Stage4.5-PlantedTires-PATCH
          path: |
            H3531-Racer-Stage4.5-PlantedTires-PATCH.zip
            H3531-Racer-Stage4.5-PlantedTires-PATCH.zip.sha256
          retention-days: 14
