          Controls
          --------
          Left/right: steer
          Up/W or primary gamepad south-style button: throttle
          Down/S or east-style button: brake; hold after stop for reverse
          Esc/F12: exit
          Select+Start: exit

          Stage7.2 visibility / LOD
          -------------------------
          The renderer now follows an asymmetric sector model inspired by
          constrained PS1-era engines:
          - FAR city silhouettes: 148 segments ahead, only 18 behind;
          - MID authored Kenney house: 58 segments ahead, 14 behind;
          - NEAR full Suburban house: 30 segments ahead, 8 behind;
          - trees and street furniture use the same ahead-heavy policy;
          - when the car turns to face backwards, the window flips with heading.
          All assets remain prefaulted in RAM; this is render residency/LOD,
          not USB streaming.

