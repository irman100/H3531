              ))
              fp.write(struct.pack(
                  "<iiIIIIIIII",0,0,2,mb,cb,8,4,1,8,8
              ))
          PY
          RACER_SELFTEST_VFW=1 qemu-arm -cpu cortex-a9 ./RACER.BIN --selftest 2>&1 | tee selftest.txt
          grep -F 'VCMAP3 loaded path=VCMAP.BIN' selftest.txt
          grep -F 'VCOBJ loaded path=./pages/P_0_0/VCOBJ.BIN objects=2 triangles=4 lod=object-tier-v2 fade=activation-only' selftest.txt
          grep -F 'VCCOL2 loaded path=VCCOL.BIN' selftest.txt
