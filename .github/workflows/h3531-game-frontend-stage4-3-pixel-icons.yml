name: H3531 Game Frontend Stage4.3 Pixel System Icons

on:
  push:
    branches:
      - feature/h3531-game-frontend-stage4-3-pixel-system-icons
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-3-pixel-icons.yml'
      - 'ports/frontend/h3531-game-frontend.cpp'
      - 'ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp'
      - 'ports/frontend/patch_stage42_stable_system_order.py'
      - 'ports/frontend/patch_stage43_pixel_system_icons.py'
      - 'ports/frontend/es_systems.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file python3

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2
          git checkout 8224e427b655b83dae5e2298f1e6919523a78737
          test "$(git rev-parse HEAD)" = "8224e427b655b83dae5e2298f1e6919523a78737"
          git clone https://github.com/nothings/stb.git /tmp/stb
          cd /tmp/stb
          git checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20
          test "$(git rev-parse HEAD)" = "2c980bb59875b0d32144a71867fbdebb2f77cd20"

      - name: Generate Stage4.3 stable-order pixel-icon source
        run: |
          set -eux
          python3 ports/frontend/patch_stage42_stable_system_order.py \
            ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp \
            /tmp/h3531-game-frontend-stage4-2-stable.cpp
          python3 ports/frontend/patch_stage43_pixel_system_icons.py \
            /tmp/h3531-game-frontend-stage4-2-stable.cpp \
            /tmp/h3531-game-frontend-stage4-3.cpp
          grep -F 'Stage4.3 scalable pixel system icons active' /tmp/h3531-game-frontend-stage4-3.cpp
          grep -F 'enum class IconType' /tmp/h3531-game-frontend-stage4-3.cpp
          grep -F 'struct SystemVisualSpec' /tmp/h3531-game-frontend-stage4-3.cpp
          grep -F 'stage43_draw_system_icon' /tmp/h3531-game-frontend-stage4-3.cpp
          grep -F 'for (size_t pos = 0; pos < vis.size(); ++pos)' /tmp/h3531-game-frontend-stage4-3.cpp
          ! grep -F 'visible_pos = (visible_pos + 1) % vis.size();' /tmp/h3531-game-frontend-stage4-3.cpp

      - name: Build Stage4.3 frontend natively
        run: |
          set -eux
          g++ -std=c++14 -O2 \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/h3531-game-frontend-stage4-3.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/gamefront-stage43-host
          /tmp/gamefront-stage43-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-host.txt
          grep -F 'SYSTEM_TWO NES-left SEGA-right identities-never-cross' /tmp/layout-host.txt
          grep -F 'PIXEL_ICON_REGISTRY NES=NES_PAD MEGADRIVE=MEGADRIVE_PAD SNES=SNES_PAD MASTER_SYSTEM=MASTER_SYSTEM_PAD GAMEBOY=GAMEBOY GAME_GEAR=GAME_GEAR PLAYSTATION=PLAYSTATION_PAD UNKNOWN=GENERIC_PAD' /tmp/layout-host.txt
          grep -F 'PIXEL_ICON_STYLE original-programmatic no-external-theme-assets' /tmp/layout-host.txt
          grep -F 'VISUAL_ROUTING_SEPARATION registry=visual-only launcher=es_systems.cfg' /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: Cross-build static H3531 Game Frontend Stage4.3
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O2 -fno-pie -static -no-pie \
            -march=armv7-a -mfloat-abi=soft \
            -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend \
            /tmp/h3531-game-frontend-stage4-3.cpp /tmp/tinyxml2/tinyxml2.cpp \
            -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | tee /tmp/gamefront-file.txt
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/gamefront-file.txt
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.3 scalable pixel system icons active'
          strings /tmp/GAMEFRONT.APP | grep -F 'MEGADRIVE_PAD'
          strings /tmp/GAMEFRONT.APP | grep -F 'PLAYSTATION_PAD'

      - name: QEMU Stage4.3 visual registry and routing tests
        run: |
          set -eux
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 0->1 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 1->2 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 2->3 = 14' /tmp/layout-arm.txt
          grep -F 'OUTER_CARD_GAP 3->4 = 14' /tmp/layout-arm.txt
          grep -F 'SYSTEM_ORDER stable-linear no-wrap' /tmp/layout-arm.txt
          grep -F 'SYSTEM_TWO NES-left SEGA-right identities-never-cross' /tmp/layout-arm.txt
          grep -F 'PIXEL_ICON_REGISTRY NES=NES_PAD MEGADRIVE=MEGADRIVE_PAD SNES=SNES_PAD MASTER_SYSTEM=MASTER_SYSTEM_PAD GAMEBOY=GAMEBOY GAME_GEAR=GAME_GEAR PLAYSTATION=PLAYSTATION_PAD UNKNOWN=GENERIC_PAD' /tmp/layout-arm.txt
          grep -F 'PIXEL_ICON_STYLE original-programmatic no-external-theme-assets' /tmp/layout-arm.txt
          grep -F 'BACKBUFFER coherent-full-frame-blit' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

          mkdir -p /tmp/stage43test/nes /tmp/stage43test/md
          : > '/tmp/stage43test/nes/Demo Game.nes'
          : > '/tmp/stage43test/md/Comix Zone [Rus].bin'
          cat > /tmp/stage43test/es_systems.cfg <<'EOF'
          <systemList>
            <system>
              <name>nes</name><fullname>Nintendo Entertainment System</fullname>
              <path>/tmp/stage43test/nes</path><extension>.nes</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/fceumm_libretro.so %ROM_RAW%</command>
              <theme>nes</theme>
            </system>
            <system>
              <name>megadrive</name><fullname>Sega Mega Drive</fullname>
              <path>/tmp/stage43test/md</path><extension>.bin .md .gen .smd</extension>
              <command>/mnt/usb/H3531/APPS/retroarch/RETROARCH.BIN --config /mnt/usb/H3531/APPS/retroarch/retroarch.cfg -L /mnt/usb/H3531/APPS/retroarch/cores/picodrive_libretro.so %ROM_RAW%</command>
              <theme>megadrive</theme>
            </system>
          </systemList>
          EOF
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --self-test /tmp/stage43test/es_systems.cfg | tee /tmp/route-arm.txt
          grep -F 'ROUTE system=nes' /tmp/route-arm.txt | grep -F 'fceumm_libretro.so'
          grep -F 'ROUTE system=megadrive' /tmp/route-arm.txt | grep -F 'picodrive_libretro.so'
          grep -F 'SELF_TEST_OK systems=2 games=2' /tmp/route-arm.txt

      - name: Package Stage4.3 frontend overlay
        run: |
          set -eux
          ROOT=out/H3531/APPS/gamefront
          mkdir -p "$ROOT/licenses"
          cp /tmp/GAMEFRONT.APP "$ROOT/GAMEFRONT.APP"
          cp ports/frontend/es_systems.cfg "$ROOT/es_systems.cfg"
          cp /tmp/tinyxml2/LICENSE.txt "$ROOT/licenses/tinyxml2-LICENSE.txt"
          cp /tmp/stb/LICENSE "$ROOT/licenses/stb-LICENSE.txt"
          cat > "$ROOT/README_STAGE4_3_PIXEL_ICONS.txt" <<'EOF'
          H3531 Game Frontend Stage 4.3 - Scalable Pixel System Icons

          Replace only /H3531/APPS/gamefront/.
          RetroArch, cores, kernel, ramdisk, Monitor and SPI NOR are unchanged.

          Current visible systems:
          - NES: original programmatic pixel NES-style pad
          - Sega Mega Drive: original programmatic rounded three-button pad

          Built-in visual registry for future systems:
          - NES / Famicom
          - Mega Drive / Genesis
          - Master System
          - Game Gear
          - SNES / Super Famicom
          - Game Boy / GBC / GBA
          - PlayStation
          - generic fallback

          The icon registry is visual metadata only.
          Emulator/core routing remains controlled by es_systems.cfg.
          Therefore adding or changing a core does not require modifying icon code.

          System navigation remains stable-linear and never wraps/crosses identities.
          ROM carousel remains circular with prepared off-screen items.
          RAM backbuffer remains active for coherent frame presentation.
          EOF
          cat > "$ROOT/SYSTEM_VISUAL_REGISTRY.txt" <<'EOF'
          HOW TO ADD A FUTURE SYSTEM

          1. Add the system and its RetroArch -L core command to es_systems.cfg.
          2. If an existing visual family fits, add one SystemVisualSpec row in
             patch_stage43_pixel_system_icons.py / the generated Stage4.3 source.
          3. If a new silhouette is needed, add one IconType and one small renderer,
             then dispatch it from stage43_draw_system_icon().
          4. Unknown systems automatically use GenericPad, so new systems remain usable
             even before custom artwork exists.

          No external Recalbox/GameStick artwork is embedded in Stage4.3.
          All controller/handheld graphics are drawn programmatically from primitives.
          EOF
          cp /tmp/layout-arm.txt out/STAGE4_3-PIXEL-ICONS-LAYOUT.txt
          cp /tmp/route-arm.txt out/STAGE4_3-PIXEL-ICONS-ROUTING.txt
          cp /tmp/gamefront-file.txt out/STAGE4_3-BINARY-TYPE.txt
          (
            cd out
            find H3531/APPS/gamefront -type f -print0 | sort -z | xargs -0 sha256sum > SHA256.txt
            sha256sum -c SHA256.txt
          )

      - name: Upload H3531 Game Frontend Stage4.3 pixel icons
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.3-ScalablePixelIcons
          path: out/
          if-no-files-found: error
          retention-days: 14
