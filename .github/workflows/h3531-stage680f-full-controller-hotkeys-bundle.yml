name: H3531 Stage6.8.0F Full Controller Hotkeys Bundle

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-stage680f-full-controller-hotkeys-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y unzip zip file binutils busybox

      - name: Download proven Stage6.8.0E base
        uses: actions/download-artifact@v4
        with:
          name: H3531-Stage6.8.0F-FullControllerHotkeys-PATCH
          path: stage680e
          github-token: ${{ github.token }}
          run-id: 36044584463

      - name: Download proven Stage4.37 Full Controller Hotkeys frontend
        uses: actions/download-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.37-FullControllerHotkeys
          path: frontend437
          github-token: ${{ github.token }}
          run-id: 36046995714

      - name: Assemble Stage6.8.0F overlay
        run: |
          set -eux

          BASEZIP=stage680e/H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip
          test -f "$BASEZIP"
          unzip -q "$BASEZIP" -d out

          test -f out/H3531/APPS/retroarch/RETROARCH.BIN
          test -f out/H3531/APPS/retroarch/RETROARCH.APP
          test -f out/H3531/APPS/retroarch/retroarch.cfg
          test -f out/H3531/APPS/gamefront/GAMEFRONT.APP
          test -f out/H3531/APPS/x11-debian/bin/Xfbdev-shadow-live

          test -f frontend437/H3531/APPS/gamefront/GAMEFRONT.APP
          cp -a frontend437/H3531/. out/H3531/

          chmod 755 out/H3531/APPS/gamefront/GAMEFRONT.APP
          chmod 755 out/H3531/APPS/retroarch/RETROARCH.BIN
          chmod 755 out/H3531/APPS/retroarch/RETROARCH.APP

          mkdir -p out/H3531/SYSTEM/docs

          cat >out/H3531/APPS/x11-debian/SYSTEM.VERSION <<'EOF'
          Stayplaytion Stage6.8.0F Full Controller Hotkeys
          Base: proven Stage6.8.0E Recalbox UX
          Desktop: detached keyboard/mouse boot + live KDrive hotplug
          Controller transport: /dev/input/event* fallback shared by Stayplaytion and RetroArch
          First-run UX: WELCOME -> full controller wizard -> L1/R1/L2/R2 -> HOTKEY
          Main menu: Recalbox-style compact menu + Controllers -> Hotkey Actions
          B behavior: Back; shell exit only through Quit -> Return to Desktop
          Input profile: standard RetroArch linuxraw autoconfig + global Hotkey modifier/actions
          Safety: no SPI writes, no saveenv, no U-Boot changes
          EOF

          cat >out/H3531/SYSTEM/docs/README_STAGE6_8_0F_FULL_CONTROLLER_HOTKEYS.txt <<'EOF'
          Stayplaytion Stage6.8.0F Full Controller Hotkeys

          This build keeps the proven Stage6.8.0E boot, desktop, RetroArch
          event-fallback backend and Recalbox-style frontend. Only GAMEFRONT.APP
          is upgraded to Stage4.37.

          Full controller wizard:
          - D-pad Up/Down/Left/Right
          - A / B / X / Y
          - Start / Select
          - L1 / R1
          - L2 / R2
          - HOTKEY modifier
          - L2/R2 may be buttons or axes.

          Hotkey architecture:
          - HOTKEY is RetroArch Enable Hotkeys, not a normal one-button action.
          - System actions trigger only while HOTKEY is held.
          - Recalbox-style defaults are installed after a full controller setup:
              HOTKEY + B          RetroArch Menu
              HOTKEY + Start      Exit Game
              HOTKEY + Y          Save State
              HOTKEY + X          Load State
              HOTKEY + D-pad Left Rewind
              HOTKEY + D-pad Right Fast Forward (hold)
          - Controllers Settings -> HOTKEY ACTIONS can reassign:
              Hotkey Modifier
              Rewind
              RetroArch Menu
              Save State
              Load State
              Fast Forward (hold)
              Exit Game
          - Reusing a control for a different hotkey action clears the old action,
            preventing two commands from firing from one combination.
          - The requested HOTKEY + B/Back = Rewind setup can therefore be made
            from HOTKEY ACTIONS. If B was previously RetroArch Menu, that old
            assignment is cleared and Menu can be assigned to another control.
          - Rewind itself must be ON under Game Settings. This remains separate
            because rewind can cost CPU/RAM on weak cores.

          Normal controller controls remain standard RetroArch linuxraw autoconfig
          entries under:
              /mnt/usb/H3531/USER/retroarch/autoconfig

          Hotkey modifier/actions are written to:
              /mnt/usb/H3531/APPS/retroarch/retroarch.cfg

          Stage6.8.0E behavior remains:
          - /dev/input/js* is not required.
          - Gamepads can use /dev/input/event* fallback.
          - Hotplug uses inotify/epoll rather than periodic full event scans.
          - B is Back in Stayplaytion.
          - Start/Menu opens MAIN MENU.
          - Quit -> Return to Desktop is explicit.

          No SPI NOR, U-Boot, saveenv or external-root changes are included.
          EOF

      - name: Validate Stage6.8.0F components
        run: |
          set -eux
          X=out/H3531/APPS/x11-debian
          G=out/H3531/APPS/gamefront/GAMEFRONT.APP
          R=out/H3531/APPS/retroarch/RETROARCH.BIN
          C=out/H3531/APPS/retroarch/retroarch.cfg

          file "$X/bin/Xfbdev-shadow-live" | tee /tmp/xfbdev.file
          grep -F 'ELF 32-bit LSB' /tmp/xfbdev.file
          grep -F 'ARM, EABI5' /tmp/xfbdev.file
          strings "$X/bin/Xfbdev-shadow-live" | grep -F 'Stage6.8.0A evdev keyboard detached at X start'

          file "$G" | tee /tmp/gamefront.file
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/gamefront.file
          strings "$G" | grep -F 'Stage4.37 Full controller and Hotkey Actions active'
          strings "$G" | grep -F 'PRESS ANY BUTTON TO CONFIGURE'
          strings "$G" | grep -F 'L1  SHOULDER'
          strings "$G" | grep -F 'R1  SHOULDER'
          strings "$G" | grep -F 'L2  TRIGGER'
          strings "$G" | grep -F 'R2  TRIGGER'
          strings "$G" | grep -F 'HOTKEY ACTIONS'
          strings "$G" | grep -F 'HOTKEY MODIFIER'
          strings "$G" | grep -F 'FAST FORWARD (HOLD)'
          strings "$G" | grep -F '[STAYPLAYTION] RetroArch hotkey binding saved: %s'
          strings "$G" | grep -F 'REWIND REQUIRES GAME SETTINGS > REWIND = ON'
          strings "$G" | grep -F 'MAIN MENU'
          strings "$G" | grep -F 'GAME SETTINGS'
          strings "$G" | grep -F 'CONTROLLERS SETTINGS'
          strings "$G" | grep -F 'RETROARCH INPUT / HOTKEYS'
          strings "$G" | grep -F 'SYSTEM SETTINGS'
          strings "$G" | grep -F 'RETURN TO DESKTOP'
          strings "$G" | grep -F 'standard RetroArch controller profile saved'
          strings "$G" | grep -F 'linuxraw event-fallback gamepad%d ready'
          strings "$G" | grep -F 'gamepad event node absent; inotify hotplug active'
          ! strings "$G" | grep -F 'NO /DEV/INPUT/JS CONTROLLER FOUND'
          ! strings "$G" | grep -F 'ASSIGN HOTKEY'

          file "$R" | tee /tmp/retroarch.file
          grep -F 'ELF 32-bit LSB' /tmp/retroarch.file
          strings "$R" | grep -F '[H3531] standard RetroArch joypad driver: %s'
          strings "$R" | grep -F '[LinuxRaw/H3531] /dev/input/js* absent; enabling event fallback.'
          strings "$R" | grep -F '[LinuxRaw/H3531] Event fallback device name is "%s" path=%s.'
          strings "$R" | grep -F '[LinuxRaw/H3531] evdev maps: %u buttons, %u axes.'

          grep -F 'input_joypad_driver = "linuxraw"' "$C"
          grep -F 'input_autodetect_enable = "true"' "$C"
          grep -F 'joypad_autoconfig_dir = "/mnt/usb/H3531/USER/retroarch/autoconfig"' "$C"
          grep -F 'config_save_on_exit = "true"' "$C"

          busybox sh -n "$X/bin/h3531-input-discover"
          busybox sh -n "$X/bin/h3531-lxde-core"
          busybox sh -n out/H3531/APPS/h3531-native-run
          busybox sh -n out/H3531/SYSTEM/MONITOR.APP

      - name: Create verified Stage6.8.0F ZIP
        run: |
          set -eux
          rm -f out/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0F.txt
          (
            cd out
            find H3531 -type f \
              ! -path 'H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0F.txt' \
              -print0 | sort -z | xargs -0 sha256sum \
              > H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0F.txt
            sha256sum -c H3531/SYSTEM/docs/SHA256SUMS_STAGE6_8_0F.txt
          )

          cd out
          zip -qr ../H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip H3531
          cd ..
          sha256sum H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip \
            | tee H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip.sha256
          unzip -t H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip

      - uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.8.0E-RecalboxUX-PATCH
          path: |
            H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip
            H3531-Stage6.8.0F-FullControllerHotkeys-PATCH.zip.sha256
          retention-days: 14
