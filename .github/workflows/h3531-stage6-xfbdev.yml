name: H3531 Stage6 Xfbdev Proof

on:
  push:
    branches:
      - feature/h3531-stage6-xfbdev-proof
    paths:
      - 'ports/x11/**'
      - '.github/workflows/h3531-stage6-xfbdev.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl rsync cpio unzip bc file \
            python3 perl patch bzip2 xz-utils autoconf automake libtool \
            pkg-config libncurses5-dev

      - name: Fetch Buildroot 2020.02.12
        run: |
          wget -q https://buildroot.org/downloads/buildroot-2020.02.12.tar.gz
          tar xf buildroot-2020.02.12.tar.gz
          mv buildroot-2020.02.12 buildroot

      - name: Configure H3531 Xfbdev target
        run: |
          cp ports/x11/stage6_xfbdev_defconfig buildroot/.config
          make -C buildroot olddefconfig
          echo "===== FINAL BUILDROOT CONFIG (selected) ====="
          grep -E 'BR2_(arm|cortex_a9|ARM_|TOOLCHAIN_BUILDROOT|STATIC|SHARED|XSERVER_XORG_SERVER|XAPP_XEV|XAPP_XSETROOT|XAPP_XDPYINFO)' buildroot/.config || true

      - name: Build Xfbdev toolchain and userspace
        run: |
          make -C buildroot -j2

      - name: Compile H3531 X11 proof client
        run: |
          TOOLCHAIN="$(pwd)/buildroot/output/host/bin"
          SYSROOT="$(pwd)/buildroot/output/host/arm-buildroot-linux-uclibcgnueabi/sysroot"
          CC="$TOOLCHAIN/arm-buildroot-linux-uclibcgnueabi-gcc"
          "$CC" -O2 -march=armv7-a -mfloat-abi=soft \
            --sysroot="$SYSROOT" \
            ports/x11/h3531-x11-proof.c \
            -o H3531-X11-PROOF.APP -lX11

      - name: Assemble USB runtime
        run: |
          set -eux
          OUT="$PWD/stage6/H3531/APPS/x11"
          T="$PWD/buildroot/output/target"
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share" "$PWD/stage6/H3531/SYSTEM/docs"

          cp "$T/usr/bin/Xfbdev" "$OUT/bin/"
          cp H3531-X11-PROOF.APP "$OUT/bin/"
          [ -x "$T/usr/bin/xev" ] && cp "$T/usr/bin/xev" "$OUT/bin/" || true
          [ -x "$T/usr/bin/xdpyinfo" ] && cp "$T/usr/bin/xdpyinfo" "$OUT/bin/" || true
          [ -x "$T/usr/bin/xsetroot" ] && cp "$T/usr/bin/xsetroot" "$OUT/bin/" || true

          # Copy runtime libraries and loader. Preserve symlinks.
          cp -a "$T/lib/"* "$OUT/lib/" || true
          cp -a "$T/usr/lib/"*.so* "$OUT/lib/" || true

          # Xfbdev needs fonts unless the build has them built in.
          if [ -d "$T/usr/share/fonts" ]; then
            mkdir -p "$OUT/share"
            cp -a "$T/usr/share/fonts" "$OUT/share/"
          fi
          if [ -d "$T/usr/share/X11" ]; then
            mkdir -p "$OUT/share"
            cp -a "$T/usr/share/X11" "$OUT/share/"
          fi

          cp ports/x11/START-X11-STAGE6.sh "$OUT/START-X11-STAGE6.sh"
          chmod +x "$OUT/START-X11-STAGE6.sh" "$OUT/bin/"*

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.0
          Xfbdev hardware proof
          Buildroot: 2020.02.12
          X.Org: 1.14.7 KDrive/Xfbdev
          ABI: ARMv7-A EABI soft-float
          NEON: disabled
          EOF

          cat > "$PWD/stage6/H3531/SYSTEM/docs/README_STAGE6_0_XFBDEV_PROOF.txt" <<'EOF'
          H3531 Stage6.0 - Xfbdev Hardware Proof
          ======================================
          Purpose:
          - prove Xfbdev on the real Hi3531 HIFB framebuffer
          - prove X owns keyboard and mouse through evdev
          - prove stable cursor without the custom Stage5 cursor/repaint stack

          This package DOES NOT replace Monitor automatically.
          It DOES NOT write U-Boot environment.
          It DOES NOT flash SPI.

          First test input mapping confirmed on user's hardware:
            mouse    /dev/input/event0  SIGMACHIP Usb Mouse
            keyboard /dev/input/event1  CASUE USB KB
            secondary keyboard interface: /dev/input/event2

          Run from terminal only after suspending the resident Monitor.
          Runtime logs are written to /var, not USB.
          EOF

      - name: Patch launcher for bundled uClibc loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage6/H3531/APPS/x11/START-X11-STAGE6.sh")
          s=p.read_text()
          s=s.replace(
              'XFBDEV="$BASE/bin/Xfbdev"\nPROOF="$BASE/bin/H3531-X11-PROOF.APP"\nXDPYINFO="$BASE/bin/xdpyinfo"',
              'XFBDEV="$BASE/bin/Xfbdev"\nPROOF="$BASE/bin/H3531-X11-PROOF.APP"\nXDPYINFO="$BASE/bin/xdpyinfo"\nLOADER="$BASE/lib/ld-uClibc.so.0"\nLIBPATH="$BASE/lib"'
          )
          s=s.replace(
              '"$XFBDEV" :0 \\\n',
              '"$LOADER" --library-path "$LIBPATH" "$XFBDEV" :0 \\\n'
          )
          s=s.replace(
              '    "$XDPYINFO" >"$DPYLOG" 2>&1',
              '    "$LOADER" --library-path "$LIBPATH" "$XDPYINFO" >"$DPYLOG" 2>&1'
          )
          s=s.replace(
              '"$PROOF" >"$PROOFLOG" 2>&1',
              '"$LOADER" --library-path "$LIBPATH" "$PROOF" >"$PROOFLOG" 2>&1'
          )
          s=s.replace(
              'if [ ! -x "$XFBDEV" ]; then',
              'if [ ! -x "$LOADER" ]; then\n    echo "ERROR: bundled uClibc loader missing: $LOADER"\n    exit 9\nfi\nif [ ! -x "$XFBDEV" ]; then'
          )
          p.write_text(s)
          PY

      - name: ABI and binary audit
        run: |
          set -eux
          X=stage6/H3531/APPS/x11/bin/Xfbdev
          P=stage6/H3531/APPS/x11/bin/H3531-X11-PROOF.APP
          file "$X" "$P"
          readelf -h "$X"
          readelf -A "$X" || true
          readelf -h "$P"
          readelf -A "$P" || true

          # Hard-float binaries have Tag_ABI_VFP_args. It must be absent.
          if readelf -A "$X" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: Xfbdev is hard-float"
            exit 1
          fi
          if readelf -A "$P" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: proof client is hard-float"
            exit 1
          fi

          # Buildroot config must keep optional Cortex-A9 NEON disabled.
          if grep -q '^BR2_ARM_ENABLE_NEON=y' buildroot/.config; then
            echo "ERROR: NEON was enabled"
            exit 1
          fi

          find stage6 -type f -print0 | sort -z | xargs -0 sha256sum > stage6/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_0.txt

      - name: Build ReadyToCopy archive
        run: |
          cd stage6
          zip -qr ../H3531-Stage6.0-Xfbdev-Hardware-Proof-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.0-Xfbdev-Hardware-Proof-ReadyToCopy.zip
          unzip -t H3531-Stage6.0-Xfbdev-Hardware-Proof-ReadyToCopy.zip

      - name: Upload Stage6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.0-Xfbdev-Hardware-Proof-ReadyToCopy
          path: H3531-Stage6.0-Xfbdev-Hardware-Proof-ReadyToCopy.zip
          if-no-files-found: error
