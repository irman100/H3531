name: H3531 Matrix Brandy session-state build

on:
  push:
    branches:
      - fix/basic-session-state
      - fix/basic-ux-session-v1.3
    paths:
      - '.github/workflows/h3531-basic-session-state-build.yml'
      - 'ports/basic/**'
      - 'ports/sdl12/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file make git curl autoconf automake libtool

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Matrix Brandy and SDL 1.2
        run: |
          set -eux
          git clone https://github.com/stardot/MatrixBrandy.git /tmp/MatrixBrandy
          cd /tmp/MatrixBrandy
          git checkout 737d89583e2faf77bccbf1038ccf12f454518a48
          git clone https://github.com/libsdl-org/SDL-1.2.git /tmp/SDL-1.2
          cd /tmp/SDL-1.2
          git checkout 457d4e55ffe1b6ad4c4fa4559dbda8360bf8253d

      - name: Patch SDL 1.2 with H3531 backend
        run: |
          set -eux
          cp ports/sdl12/SDL_nullvideo.h /tmp/SDL-1.2/src/video/dummy/SDL_nullvideo.h
          cp ports/sdl12/SDL_nullvideo.c /tmp/SDL-1.2/src/video/dummy/SDL_nullvideo.c
          cp ports/sdl12/SDL_nullevents.c /tmp/SDL-1.2/src/video/dummy/SDL_nullevents.c

      - name: Patch Matrix Brandy for H3531 graphics and shared history
        run: |
          set -eux
          cd /tmp/MatrixBrandy
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/target.h')
          s=p.read_text()
          old='#if defined(TARGET_UNIX) && !defined(TARGET_MIDIPIX) && !defined(TARGET_MACOSX)\n#define USE_X11'
          new='#if defined(TARGET_UNIX) && !defined(TARGET_MIDIPIX) && !defined(TARGET_MACOSX) && !defined(TARGET_H3531)\n#define USE_X11'
          if old not in s: raise SystemExit('target.h X11 guard not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/mos_sys.c')
          s=p.read_text()
          old='''#if defined(TARGET_MACOSX)\n      outregs[7]=0;\n#elif defined(TARGET_UNIX) && defined(USE_X11)\n      outregs[7]=(size_t)wmInfo.info.x11.window;\n#else\n      outregs[7]=(size_t)wmInfo.window;\n#endif /* TARGET_UNIX */'''
          new='''#if defined(TARGET_MACOSX) || defined(TARGET_H3531)\n      outregs[7]=0;\n#elif defined(TARGET_UNIX) && defined(USE_X11)\n      outregs[7]=(size_t)wmInfo.info.x11.window;\n#else\n      outregs[7]=(size_t)wmInfo.window;\n#endif /* TARGET_UNIX */'''
          if old not in s: raise SystemExit('mos_sys.c WM block not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 "$GITHUB_WORKSPACE/ports/basic/patch-matrix-h3531-history.py" /tmp/MatrixBrandy
          grep -F 'H3531_HISTORY' src/keyboard.c
          grep -F 'H3531 BASIC: shared history loaded' src/keyboard.c
          grep -F 'H3531 BASIC: ESC while program running -> exit to Monitor' src/keyboard.c

      - name: Build static SDL 1.2 for H3531
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cd /tmp/SDL-1.2
          sh autogen.sh
          ./configure \
            --host=arm-linux-gnueabi \
            --prefix=/tmp/sdl-h3531 \
            --disable-shared --enable-static \
            --disable-video-x11 --disable-video-fbcon --enable-video-dummy \
            --disable-video-opengl --disable-video-directfb \
            --disable-alsa --disable-esd --disable-arts --disable-nas --disable-pulseaudio \
            --disable-cdrom --disable-joystick \
            CC=arm-linux-musleabi-gcc AR=arm-linux-musleabi-ar RANLIB=arm-linux-musleabi-ranlib \
            CFLAGS='-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE'
          make -j2
          make install

      - name: Build graphical Matrix Brandy
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cd /tmp/MatrixBrandy
          SDL_CONFIG=/tmp/sdl-h3531/bin/sdl-config
          SRC='src/evaluate.c src/graphsdl.c src/assign.c src/mainstate.c src/tokens.c src/mos.c src/commands.c src/functions.c src/iostate.c src/variables.c src/fileio.c src/soundsdl.c src/keyboard.c src/miscprocs.c src/editor.c src/stack.c src/mos_sys.c src/strings.c src/lvalue.c src/errors.c src/convert.c src/brandy.c src/statement.c src/net.c src/heap.c'
          mkdir -p "$GITHUB_WORKSPACE/out-basic-session"
          arm-linux-musleabi-gcc \
            -O2 -static -fno-pie -no-pie -march=armv7-a -mfloat-abi=soft \
            -D_GNU_SOURCE -DBRANDY_NOVERCHECK -DUSE_SDL -DDEFAULT_IGNORE -DNONET -DTARGET_H3531 \
            $($SDL_CONFIG --cflags) $SRC \
            -o "$GITHUB_WORKSPACE/out-basic-session/brandy-basicvi-gfx.APP" \
            -lm $($SDL_CONFIG --static-libs) -pthread -lrt
          arm-linux-musleabi-strip "$GITHUB_WORKSPACE/out-basic-session/brandy-basicvi-gfx.APP"

      - name: Inspect application
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          file out-basic-session/brandy-basicvi-gfx.APP | tee out-basic-session/FILE.txt
          arm-linux-musleabi-readelf -h out-basic-session/brandy-basicvi-gfx.APP > out-basic-session/READELF.txt
          arm-linux-musleabi-readelf -A out-basic-session/brandy-basicvi-gfx.APP >> out-basic-session/READELF.txt || true
          sha256sum out-basic-session/brandy-basicvi-gfx.APP | tee out-basic-session/SHA256.txt
          strings out-basic-session/brandy-basicvi-gfx.APP | grep -F '/mnt/usb/H3531/USER/COMMAND.HST'
          strings out-basic-session/brandy-basicvi-gfx.APP | grep -F 'H3531 BASIC: shared history loaded'
          strings out-basic-session/brandy-basicvi-gfx.APP | grep -F 'H3531 BASIC: ESC while program running -> exit to Monitor'
          cat > out-basic-session/UPDATE.txt <<'EOF'
          H3531 Matrix Brandy BASIC UX/session-state update

          Replace:
            H3531/APPS/basicvi/brandy-basicvi-gfx.APP

          Monitor 0.6.4 launches BASIC files with:
            -nocheck -chain <file>

          Shared history:
            /mnt/usb/H3531/USER/COMMAND.HST

          H3531 Escape policy:
            running BASIC program + Escape -> exit process to Monitor
            interactive BASIC prompt -> remain in interpreter until explicit QUIT
          EOF

      - name: Upload Matrix Brandy session-state build
        uses: actions/upload-artifact@v4
        with:
          name: H3531-MatrixBrandy-session-state
          path: out-basic-session/
          if-no-files-found: error
          retention-days: 14
