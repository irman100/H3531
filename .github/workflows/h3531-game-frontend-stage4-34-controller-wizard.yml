name: H3531 Game Frontend Stage4.34 Controller Profile Wizard
# Stage4.34 validates evdev keyboard + Linux joystick API controller profiles shared with RetroArch.

on:
  push:
    branches:
      - feature/h3531-stage68-desktop-input-polish
    paths:
      - '.github/workflows/h3531-game-frontend-stage4-34-controller-wizard.yml'
      - 'ports/frontend/h3531-game-frontend.cpp'
      - 'ports/frontend/patch_stage433_standard_retroarch_input_settings.py'
      - 'ports/frontend/patch_stage434_controller_wizard.py'
      - 'ports/frontend/patch_stage430_full_menu_hotkeys.py.gz.b64'
      - 'ports/frontend/fix_stage430_patch_scoping.py'
      - 'ports/frontend/patch_stage431_steam_flash_lifecycle.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y git curl g++ qemu-user file python3

      - name: Decode Stage4.30 patch
        run: |
          set -eux
          base64 -d ports/frontend/patch_stage430_full_menu_hotkeys.py.gz.b64 | gzip -d > /tmp/patch_stage430_full_menu_hotkeys.py
          python3 ports/frontend/fix_stage430_patch_scoping.py
          python3 -m py_compile /tmp/patch_stage430_full_menu_hotkeys.py
          python3 -m py_compile ports/frontend/patch_stage433_standard_retroarch_input_settings.py
          python3 -m py_compile ports/frontend/patch_stage434_controller_wizard.py
          grep -F 'STAGE430_FULL_MENU_HOTKEYS_PATCH_OK' /tmp/patch_stage430_full_menu_hotkeys.py
          grep -F 'replace_function' /tmp/patch_stage430_full_menu_hotkeys.py

      - name: ARM musl toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Pinned frontend libraries
        run: |
          set -eux
          git clone https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          git -C /tmp/tinyxml2 checkout 8224e427b655b83dae5e2298f1e6919523a78737
          git clone https://github.com/nothings/stb.git /tmp/stb
          git -C /tmp/stb checkout 2c980bb59875b0d32144a71867fbdebb2f77cd20

      - name: Generate Stage4.30 source
        run: |
          set -eux
          python3 ports/frontend/patch_stage422_library.py ports/frontend/h3531-game-frontend.cpp /tmp/h3531-game-frontend.cpp
          python3 ports/frontend/patch_stage42_stable_system_order.py ports/frontend/h3531-game-frontend-stage4-2-carousel.cpp /tmp/s42.cpp
          python3 ports/frontend/patch_stage43_pixel_system_icons.py /tmp/s42.cpp /tmp/s43.cpp
          python3 ports/frontend/patch_stage44_pixelstation_theme.py /tmp/s43.cpp /tmp/s44-pre.cpp
          python3 ports/frontend/patch_stage44_normalize_dispatcher.py /tmp/s44-pre.cpp /tmp/s44-normalized.cpp
          python3 ports/frontend/patch_stage44_restore_future_icons.py /tmp/s44-normalized.cpp /tmp/s44.cpp
          python3 ports/frontend/patch_stage45_reference_fidelity.py /tmp/s44.cpp /tmp/s45.cpp
          python3 ports/frontend/patch_stage46_sprite_ui.py /tmp/s45.cpp /tmp/s46.cpp
          python3 ports/frontend/patch_stage47_focus_performance.py /tmp/s46.cpp /tmp/s47.cpp
          python3 ports/frontend/patch_stage48_perspective_polish.py /tmp/s47.cpp /tmp/s48.cpp
          python3 ports/frontend/patch_stage413_library_features.py /tmp/s48.cpp /tmp/s413.cpp
          python3 ports/frontend/patch_stage415_cartridge_media_v2.py /tmp/s413.cpp /tmp/s415.cpp
          python3 ports/frontend/patch_stage416_user_media_assets.py /tmp/s415.cpp /tmp/s416.cpp
          python3 ports/frontend/patch_stage417_layout_sony_case.py /tmp/s416.cpp /tmp/s417.cpp
          python3 ports/frontend/patch_stage418_media_floor_glass.py /tmp/s417.cpp /tmp/s418.cpp
          python3 ports/frontend/patch_stage419_focus_aura.py /tmp/s418.cpp /tmp/s419.cpp
          python3 ports/frontend/patch_stage420_silhouette_aura.py /tmp/s419.cpp /tmp/s420.cpp
          python3 ports/frontend/patch_stage421_smooth_cached_aura_final_v2.py /tmp/s420.cpp /tmp/s421.cpp
          python3 ports/frontend/patch_stage422_atari_ps1_shell.py /tmp/s421.cpp /tmp/s422.cpp
          python3 ports/frontend/patch_stage424_v2_snes_gba_art.py /tmp/s422.cpp /tmp/s424.cpp
          python3 ports/frontend/patch_stage425_media_scale_gba.py /tmp/s424.cpp /tmp/s425.cpp
          python3 ports/frontend/patch_stage427_coverflow_aspect_fill.py /tmp/s425.cpp /tmp/s427.cpp
          python3 ports/frontend/patch_stage429_dense_media_centering.py /tmp/s427.cpp /tmp/s429.cpp
          python3 /tmp/patch_stage430_full_menu_hotkeys.py /tmp/s429.cpp /tmp/s430.cpp
          python3 ports/frontend/patch_stage431_steam_flash_lifecycle.py /tmp/s430.cpp /tmp/s431.cpp
          python3 ports/frontend/patch_stage433_standard_retroarch_input_settings.py /tmp/s431.cpp /tmp/s433.cpp
          python3 ports/frontend/patch_stage434_controller_wizard.py /tmp/s433.cpp /tmp/s434.cpp
          grep -F 'Stage4.34 RetroArch controller profile wizard active' /tmp/s434.cpp
          grep -F 'standard RetroArch controller profile saved' /tmp/s434.cpp
          grep -F 'D-PAD UP' /tmp/s434.cpp
          grep -F 'A  BOTTOM' /tmp/s434.cpp
          grep -F 'input_driver = ' /tmp/s434.cpp
          grep -F 'linuxraw' /tmp/s434.cpp
          grep -F 'input_device = ' /tmp/s434.cpp
          grep -F '[STAYPLAYTION] shell active; F12 returns from engine, ESC exits shell' /tmp/s433.cpp
          grep -F 'CONTROLLER SETTINGS' /tmp/s433.cpp
          grep -F 'RETROARCH SETTINGS' /tmp/s433.cpp
          grep -F 'INPUT BINDS ARE NEVER WRITTEN BY STAYPLAYTION' /tmp/s433.cpp
          ! grep -F 'out << "input_save_state' /tmp/s433.cpp
          ! grep -F 'out << "input_load_state' /tmp/s433.cpp
          ! grep -F 'out << "input_menu_toggle' /tmp/s433.cpp
          grep -F 'SAVE STATE KEY' /tmp/s430.cpp
          grep -F 'AUTO SAVE ON EXIT' /tmp/s430.cpp
          grep -F 'REWIND KEY' /tmp/s430.cpp
          grep -F 'RESET HOTKEYS TO DEFAULTS' /tmp/s430.cpp
          grep -F 'stage430_capture_key' /tmp/s430.cpp

      - name: Verify gamepad input layer in generated source
        run: |
          set -eux
          grep -F 'H3531_MAX_GAMEPADS = 4' /tmp/h3531-game-frontend.cpp
          grep -F '#include <linux/joystick.h>' /tmp/h3531-game-frontend.cpp
          grep -F '/dev/input/js%d' /tmp/h3531-game-frontend.cpp
          grep -F 'RetroArch linuxraw profile %s' /tmp/h3531-game-frontend.cpp
          grep -F 'input_up_axis' /tmp/h3531-game-frontend.cpp || true
          ! grep -F 'gamepad_capable' /tmp/h3531-game-frontend.cpp
          grep -F 'js_event' /tmp/h3531-game-frontend.cpp
          grep -F 'JS_EVENT_BUTTON' /tmp/h3531-game-frontend.cpp
          grep -F 'JS_EVENT_AXIS' /tmp/h3531-game-frontend.cpp
          grep -F 'h3531_profile_load' /tmp/h3531-game-frontend.cpp
          grep -F 'input_rescan' /tmp/h3531-game-frontend.cpp

      - name: Native layout test
        run: |
          set -eux
          g++ -std=c++14 -O3 -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend /tmp/s434.cpp /tmp/tinyxml2/tinyxml2.cpp -o /tmp/gamefront-host
          /tmp/gamefront-host --layout-test | tee /tmp/layout-host.txt
          grep -F 'STAGE433_INPUT standard-retroarch-settings no-shell-hotkey-overrides' /tmp/layout-host.txt
          grep -F 'STAGE433_CONTROLLER controller-settings retroarch-settings standard-autoconfig' /tmp/layout-host.txt
          grep -F 'STAGE433_RA_OVERRIDE autosave-autoload-slot-rewind-only no-input-binds' /tmp/layout-host.txt
          grep -F 'STAGE429_DENSITY physical-photo-tuned GBA-closer Sega-larger Atari-denser' /tmp/layout-host.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-host.txt

      - name: ARM build and QEMU test
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          arm-linux-musleabi-g++ -std=c++14 -O3 -fno-pie -static -no-pie -march=armv7-a -mfloat-abi=soft -I/tmp/tinyxml2 -I/tmp/stb -Iports/frontend /tmp/s434.cpp /tmp/tinyxml2/tinyxml2.cpp -o /tmp/GAMEFRONT.APP
          arm-linux-musleabi-strip /tmp/GAMEFRONT.APP
          file /tmp/GAMEFRONT.APP | tee /tmp/type.txt
          grep -F 'ELF 32-bit LSB executable, ARM' /tmp/type.txt
          strings /tmp/GAMEFRONT.APP | grep -F 'Stage4.34 RetroArch controller profile wizard active'
          strings /tmp/GAMEFRONT.APP | grep -F 'standard RetroArch controller profile saved'
          strings /tmp/GAMEFRONT.APP | grep -F 'D-PAD UP'
          strings /tmp/GAMEFRONT.APP | grep -F 'A  BOTTOM'
          strings /tmp/GAMEFRONT.APP | grep -F '[STAYPLAYTION] shell active; F12 returns from engine, ESC exits shell'
          strings /tmp/GAMEFRONT.APP | grep -F 'CONTROLLER SETTINGS'
          strings /tmp/GAMEFRONT.APP | grep -F 'RETROARCH SETTINGS'
          strings /tmp/GAMEFRONT.APP | grep -F 'INPUT BINDS ARE NEVER WRITTEN BY STAYPLAYTION'
          strings /tmp/GAMEFRONT.APP | grep -F 'linuxraw-compatible gamepad%d ready'
          strings /tmp/GAMEFRONT.APP | grep -F '/dev/input/js* gamepad absent; hotplug scan active'
          strings /tmp/GAMEFRONT.APP | grep -F 'RetroArch linuxraw profile %s'
          ! strings /tmp/GAMEFRONT.APP | grep -F 'ASSIGN HOTKEY'
          strings /tmp/GAMEFRONT.APP | grep -F 'AUTO LOAD ON START'
          qemu-arm -cpu cortex-a9 /tmp/GAMEFRONT.APP --layout-test | tee /tmp/layout-arm.txt
          grep -F 'STAGE433_INPUT standard-retroarch-settings no-shell-hotkey-overrides' /tmp/layout-arm.txt
          grep -F 'STAGE433_CONTROLLER controller-settings retroarch-settings standard-autoconfig' /tmp/layout-arm.txt
          grep -F 'STAGE433_RA_OVERRIDE autosave-autoload-slot-rewind-only no-input-binds' /tmp/layout-arm.txt
          grep -F 'LAYOUT_TEST_OK' /tmp/layout-arm.txt

      - name: Package binary overlay
        run: |
          set -eux
          mkdir -p out/H3531/APPS/gamefront out/H3531/SYSTEM/docs
          cp /tmp/GAMEFRONT.APP out/H3531/APPS/gamefront/GAMEFRONT.APP
          cp /tmp/layout-arm.txt out/H3531/SYSTEM/docs/STAGE4_34_LAYOUT.txt
          cp /tmp/type.txt out/H3531/SYSTEM/docs/STAGE4_34_BINARY_TYPE.txt
          (cd out && sha256sum H3531/APPS/gamefront/GAMEFRONT.APP > H3531/SYSTEM/docs/SHA256-STAGE4_34.txt)
          printf '%s\n' \
            'Stage4.34 adds a Recalbox-style controller setup wizard using /dev/input/js*.' \
            'The wizard captures D-pad, A/B/X/Y, Start/Select, shoulders and Menu/Pause.' \
            'It writes a standard RetroArch linuxraw autoconfig profile under H3531/USER/retroarch/autoconfig.' \
            'Stayplaytion loads the same profile, so shell, RGUI and cores share one controller mapping.' \
            'Custom Stayplaytion keyboard/hotkey binds are removed; RetroArch owns input and hotkey configuration.' \
            'Per-launch override now contains only autosave/autoload/state-slot/rewind policy, never input_* binds.' \
            > out/H3531/SYSTEM/docs/README_STAGE4_34_CONTROLLER_WIZARD.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: H3531-GameFrontend-Stage4.34-ControllerWizard
          path: out/
          if-no-files-found: error
          retention-days: 14
