name: H3531 Stage6 Debian Xfbdev Rebuild Evdev

on:
  push:
    branches:
      - feature/h3531-stage6-xfbdev-proof
    paths:
      - 'ports/x11/START-X11-DEBIAN-STAGE6.sh'
      - '.github/workflows/h3531-stage6-debian-rebuild-evdev.yml'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout H3531
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap qemu-user-static file binutils zip xfonts-utils

      - name: Bootstrap Debian Wheezy armel build root
        run: |
          set -eux
          sudo debootstrap \
            --foreign \
            --arch=armel \
            --variant=minbase \
            --no-check-gpg \
            wheezy rootfs http://archive.debian.org/debian

          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh /debootstrap/debootstrap --second-stage

          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb-src [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          deb-src [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          EOF

          sudo mkdir -p rootfs/etc/apt/apt.conf.d
          sudo tee rootfs/etc/apt/apt.conf.d/99archive >/dev/null <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -o Acquire::Check-Valid-Until=false update

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --no-install-recommends --allow-unauthenticated install \
            build-essential devscripts fakeroot dpkg-dev \
            x11-utils x11-xkb-utils xfonts-base xkb-data

          sudo chroot rootfs /usr/bin/qemu-arm-static /usr/bin/apt-get \
            -y --allow-unauthenticated build-dep xorg-server

      - name: Fetch Debian security source and enable KDrive evdev
        run: |
          set -eux
          sudo mkdir -p rootfs/build
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            'cd /build && apt-get -y --allow-unauthenticated source xorg-server=2:1.12.4-6+deb7u8'

          SRC="$(find rootfs/build -maxdepth 1 -type d -name 'xorg-server-*' | head -1)"
          test -n "$SRC"
          echo "$SRC" > source-dir.txt

          sudo python3 - "$SRC/debian/rules" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          line = "\tbuild_xfbdev += --enable-kdrive-mouse --enable-kdrive-evdev\n"
          if "--enable-kdrive-evdev" not in s:
              anchor = "\tbuild_xfbdev = --enable-xfbdev\n"
              if anchor not in s:
                  raise SystemExit("Debian xfbdev rules anchor not found")
              s = s.replace(anchor, anchor + line, 1)
              p.write_text(s)
          PY

          grep -n 'build_xfbdev' "$SRC/debian/rules"

      - name: Build patched Debian armel xserver-xfbdev
        run: |
          set -eux
          SRC_REL="/build/$(basename "$(cat source-dir.txt)")"
          sudo chroot rootfs /usr/bin/qemu-arm-static /bin/sh -c \
            "cd '$SRC_REL' && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -uc -us -j2"

      - name: Verify KDrive evdev was compiled in
        run: |
          set -eux
          SRC="$(cat source-dir.txt)"
          CFG="$(find "$SRC" -path '*/include/kdrive-config.h' | head -1)"
          test -n "$CFG"
          echo "KDrive config: $CFG"
          cat "$CFG"
          grep -Eq '^#define KDRIVE_EVDEV[[:space:]]+1' "$CFG"
          grep -Eq '^#define KDRIVE_MOUSE[[:space:]]+1' "$CFG"

          DEB="$(find rootfs/build -maxdepth 1 -name 'xserver-xfbdev_*_armel.deb' | head -1)"
          test -n "$DEB"
          echo "$DEB" > xfbdev-deb.txt
          dpkg-deb -x "$DEB" rebuilt

          file rebuilt/usr/bin/Xfbdev
          strings rebuilt/usr/bin/Xfbdev | grep -E '^evdev$|Couldn't find pointer driver|Couldn't find keyboard driver' | head -30

      - name: Assemble isolated Stage6 runtime
        run: |
          set -eux
          OUT="$PWD/stage6e/H3531/APPS/x11-debian"
          DOC="$PWD/stage6e/H3531/SYSTEM/docs"
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/share/fonts/X11" "$OUT/share/X11" "$DOC"

          # Patched server.
          cp rebuilt/usr/bin/Xfbdev "$OUT/bin/"

          # Debian clients/runtime from the same Wheezy armel root.
          cp rootfs/usr/bin/xev "$OUT/bin/"
          cp rootfs/usr/bin/xkbcomp "$OUT/bin/"
          cp -L rootfs/lib/ld-linux.so.3 "$OUT/lib/ld-linux.so.3"

          for d in rootfs/lib/arm-linux-gnueabi rootfs/usr/lib/arm-linux-gnueabi rootfs/lib rootfs/usr/lib; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0 |
              while IFS= read -r -d '' f; do
                cp -L "$f" "$OUT/lib/$(basename "$f")"
              done
          done

          cp -aL rootfs/usr/share/fonts/X11/misc "$OUT/share/fonts/X11/"
          mkfontdir "$OUT/share/fonts/X11/misc"
          cp -aL rootfs/usr/share/X11/xkb "$OUT/share/X11/"

          # Redirect XKB_BIN_DIRECTORY from read-only /usr/bin to writable /var.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("stage6e/H3531/APPS/x11-debian/bin/Xfbdev")
          data = p.read_bytes()
          old = b"/usr/bin\x00"
          new = b"/var\x00"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one XKB bin directory, found {count}")
          new += b"\x00" * (len(old) - len(new))
          p.write_bytes(data.replace(old, new, 1))
          PY

          cp ports/x11/START-X11-DEBIAN-STAGE6.sh "$OUT/"
          chmod +x "$OUT/START-X11-DEBIAN-STAGE6.sh" "$OUT/bin/"* "$OUT/lib/ld-linux.so.3"

          cat > "$OUT/STAGE6.VERSION" <<'EOF'
          H3531 Stage6.0E
          Debian Wheezy armel Xfbdev 1.12.4 rebuilt with:
            --enable-kdrive-mouse
            --enable-kdrive-evdev
          ABI: armel / EABI soft-float
          Hardware status at packaging time:
            framebuffer path proven on Hi3531
            input backend pending hardware proof
          EOF

          cat > "$DOC/README_STAGE6_0E_EVDEV.txt" <<'EOF'
          H3531 Stage6.0E - Debian Xfbdev rebuilt with KDrive evdev
          =========================================================
          This build exists specifically because the stock Wheezy xserver-xfbdev
          binary reports:
            Couldn't find pointer driver evdev
            Couldn't find keyboard driver evdev

          Debian bug #646686 documents the same KDrive build defect and the fix:
          explicitly enable --enable-kdrive-mouse and --enable-kdrive-evdev.

          Known H3531 input mapping:
            event0 = SIGMACHIP Usb Mouse
            event1 = CASUE USB KB primary keyboard
            event2 = CASUE USB KB secondary HID

          No saveenv. No SPI flashing.
          EOF

      - name: ABI and runtime audit
        run: |
          set -eux
          X=stage6e/H3531/APPS/x11-debian/bin/Xfbdev
          E=stage6e/H3531/APPS/x11-debian/bin/xev
          K=stage6e/H3531/APPS/x11-debian/bin/xkbcomp

          file "$X" "$E" "$K"
          readelf -h "$X"
          readelf -A "$X" || true
          readelf -d "$X" || true

          for b in "$X" "$E" "$K"; do
            if readelf -A "$b" | grep -q 'Tag_ABI_VFP_args'; then
              echo "ERROR: hard-float binary: $b"
              exit 1
            fi
          done

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          lib = Path("stage6e/H3531/APPS/x11-debian/lib")
          for binary in map(Path, [
              "stage6e/H3531/APPS/x11-debian/bin/Xfbdev",
              "stage6e/H3531/APPS/x11-debian/bin/xev",
              "stage6e/H3531/APPS/x11-debian/bin/xkbcomp",
          ]):
              out = subprocess.check_output(["readelf","-d",str(binary)], text=True)
              needed = re.findall(r"Shared library: \[([^\]]+)\]", out)
              missing = [x for x in needed if not (lib/x).exists()]
              print(binary, "needs", needed)
              if missing:
                  raise SystemExit(f"Missing runtime libs: {missing}")
          PY

          find stage6e/H3531 -type f -print0 | sort -z | xargs -0 sha256sum \
            > stage6e/H3531/SYSTEM/docs/SHA256SUMS_STAGE6_0E.txt

      - name: Create ReadyToCopy ZIP
        run: |
          cd stage6e
          zip -qr ../H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip H3531
          cd ..
          sha256sum H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip \
            | tee H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip.sha256
          unzip -t H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy
          path: |
            H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip
            H3531-Stage6.0E-Debian-Xfbdev-KDrive-Evdev-ReadyToCopy.zip.sha256
          if-no-files-found: error
