name: H3531 Nofrendo NES cross-build

on:
  push:
    branches:
      - feature/nofrendo-h3531
      - fix/nofrendo-v5-edge-audio
      - fix/nofrendo-v6-audio-sync
      - fix/nofrendo-v7-vblank-audio-buffer
      - fix/nofrendo-v10-frame-audio-rtclock
    paths:
      - '.github/workflows/h3531-nofrendo-build.yml'
      - 'ports/nofrendo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake file git curl

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Nofrendo Linux port
        run: |
          set -eux
          git clone https://github.com/18650official/nofrendo_nesemu_linux.git /tmp/nofrendo
          cd /tmp/nofrendo
          git checkout b0ce28c2ba1d60eb207d60df9c55ae26864c64f1
          git rev-parse HEAD

      - name: Apply H3531 v10 port
        run: |
          set -eux
          python3 ports/nofrendo/patch-h3531.py /tmp/nofrendo "$GITHUB_WORKSPACE/ports/nofrendo"
          python3 ports/nofrendo/patch-v4-video-lifetime.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v5-edge-audio.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v6-audio-sync.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v7-vblank-audio-buffer.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v10-frame-audio-rtclock.py /tmp/nofrendo
          grep -F 'H3531 NES timer v10: RT no-catch-up' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'H3531 NES audio v10: frame-linked APU' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'H3531 AO v10 state:' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'H3531_IOCTL_QUERY_CHN    0x800C580FUL' /tmp/nofrendo/platform/h3531-ao.c
          grep -F 'h3531_ao_query_state' /tmp/nofrendo/platform/h3531-ao.c
          grep -F 'native HIFB vblank 0x4664 active' /tmp/nofrendo/platform/fb.c
          grep -F 'H3531_NES_CROP_RIGHT 8' /tmp/nofrendo/platform/fb.c
          grep -F 'dropping catch-up and rendering one frame' /tmp/nofrendo/core/nes/nes.c
          grep -F 'osd_frameaudio();' /tmp/nofrendo/core/nes/nes.c
          grep -F 'H3531 Nofrendo v10' /tmp/nofrendo/main.c
          if grep -F 'audio_thread_func' /tmp/nofrendo/platform/osd_linux.c; then
            echo 'independent audio thread unexpectedly remains' >&2
            exit 1
          fi
          if grep -F 'h3531_nes_sleep_until' /tmp/nofrendo/core/nes/nes.c; then
            echo 'v8 nanosleep clock unexpectedly present' >&2
            exit 1
          fi
          if grep -F 'one NES frame per acknowledged native HIFB vblank' /tmp/nofrendo/core/nes/nes.c; then
            echo 'v9 vblank master clock unexpectedly present' >&2
            exit 1
          fi
          if grep -R -F 'DEBUG: my_input' /tmp/nofrendo/platform /tmp/nofrendo/core/nes; then
            echo 'hot-path input debug logging still present' >&2
            exit 1
          fi

      - name: Cross-build static ARM binary
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cat >/tmp/h3531-musl.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-musleabi-gcc)
          set(CMAKE_AR arm-linux-musleabi-ar)
          set(CMAKE_RANLIB arm-linux-musleabi-ranlib)
          set(CMAKE_STRIP arm-linux-musleabi-strip)
          set(CMAKE_C_FLAGS_INIT "-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static -no-pie")
          EOF
          cmake -S /tmp/nofrendo -B /tmp/nofrendo-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/h3531-musl.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nofrendo-build -j2

      - name: Package v10 test application
        run: |
          set -eux
          mkdir -p out-nofrendo
          arm-linux-musleabi-strip /tmp/nofrendo-build/bin/nesemu -o out-nofrendo/nofrendo-h3531-v10.APP
          cp /tmp/nofrendo/LICENSE out-nofrendo/NOFRENDO-LICENSE.txt
          printf '%s\n' b0ce28c2ba1d60eb207d60df9c55ae26864c64f1 > out-nofrendo/NOFRENDO-UPSTREAM-SHA.txt
          cat > out-nofrendo/RUN-H3531.txt <<'EOF'
          UART test:
            cd /mnt/usb
            chmod +x ./nofrendo-h3531-v10.APP
            NOFRENDO_INPUT=/dev/input/event0 ./nofrendo-h3531-v10.APP /mnt/usb/games/fc/SuperMarioBros.nes

          v10 physical targets:
            - return to the physically best v7 video/AO base
            - retain native HIFB 0x4664 presentation sync, snapshots and 8-pixel crop
            - retain proven AO5/ch0 320-byte SendFrame ABI
            - query AO total/free/busy with stock driver ioctl 0x800C580F
            - apply AO queue backpressure before SendFrame when the channel is full
            - generate APU audio once per actually emulated NES frame
            - remove the independent nanosleep-driven audio thread
            - use a dedicated RT-preferred 60-Hz timer with no back-to-back catch-up ticks
            - cap delayed Nofrendo tick observations to one rendered frame
          EOF
          file out-nofrendo/nofrendo-h3531-v10.APP | tee out-nofrendo/FILE.txt
          sha256sum out-nofrendo/nofrendo-h3531-v10.APP | tee out-nofrendo/SHA256.txt
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'H3531 Nofrendo v10'
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'RT no-catch-up'
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'frame-linked APU'
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'AO v10 state:'
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'native HIFB vblank 0x4664 active'
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'proven-frame=320 bytes'
          strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'crop right='
          if strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'main-loop absolute 60 Hz'; then
            echo 'unexpected v8 clock string remains' >&2
            exit 1
          fi
          if strings out-nofrendo/nofrendo-h3531-v10.APP | grep -F 'vblank is master clock'; then
            echo 'unexpected v9 clock string remains' >&2
            exit 1
          fi

      - name: Upload Nofrendo v10
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Nofrendo-v10
          path: out-nofrendo/
          if-no-files-found: error
          retention-days: 14
