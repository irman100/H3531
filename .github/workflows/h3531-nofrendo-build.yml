name: H3531 Nofrendo NES cross-build

on:
  push:
    branches:
      - feature/nofrendo-h3531
      - fix/nofrendo-v5-edge-audio
      - fix/nofrendo-v6-audio-sync
      - fix/nofrendo-v7-vblank-audio-buffer
    paths:
      - '.github/workflows/h3531-nofrendo-build.yml'
      - 'ports/nofrendo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake file git curl

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Nofrendo Linux port
        run: |
          set -eux
          git clone https://github.com/18650official/nofrendo_nesemu_linux.git /tmp/nofrendo
          cd /tmp/nofrendo
          git checkout b0ce28c2ba1d60eb207d60df9c55ae26864c64f1
          git rev-parse HEAD

      - name: Apply H3531 v7 port
        run: |
          set -eux
          python3 ports/nofrendo/patch-h3531.py /tmp/nofrendo "$GITHUB_WORKSPACE/ports/nofrendo"
          python3 ports/nofrendo/patch-v4-video-lifetime.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v5-edge-audio.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v6-audio-sync.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v7-vblank-audio-buffer.py /tmp/nofrendo
          grep -F 'H3531 NES timer: absolute-deadline' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'AO deferred until APU callback' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'AO prebuffer=3x160 samples (10 ms)' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'double source snapshot queue ready' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'H3531 AO v6 ready' /tmp/nofrendo/platform/h3531-ao.c
          grep -F 'frame.data_bytes = (uint32_t)H3531_AO_BYTES' /tmp/nofrendo/platform/h3531-ao.c
          grep -F 'H3531_NES_CROP_RIGHT 8' /tmp/nofrendo/platform/fb.c
          grep -F 'native HIFB vblank 0x4664 active' /tmp/nofrendo/platform/fb.c
          grep -F 'H3531 NES timing v6: tick burst=' /tmp/nofrendo/core/nes/nes.c
          grep -F 'H3531 Nofrendo v7' /tmp/nofrendo/main.c
          if grep -R -F 'DEBUG: my_input' /tmp/nofrendo/platform /tmp/nofrendo/core/nes; then
            echo 'hot-path input debug logging still present' >&2
            exit 1
          fi
          if grep -R -F '========= HANDLER =========' /tmp/nofrendo/core/nes; then
            echo 'nesinput handler debug logging still present' >&2
            exit 1
          fi

      - name: Cross-build static ARM binary
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cat >/tmp/h3531-musl.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-musleabi-gcc)
          set(CMAKE_AR arm-linux-musleabi-ar)
          set(CMAKE_RANLIB arm-linux-musleabi-ranlib)
          set(CMAKE_STRIP arm-linux-musleabi-strip)
          set(CMAKE_C_FLAGS_INIT "-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static -no-pie")
          EOF
          cmake -S /tmp/nofrendo -B /tmp/nofrendo-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/h3531-musl.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nofrendo-build -j2

      - name: Package v7 test application
        run: |
          set -eux
          mkdir -p out-nofrendo
          arm-linux-musleabi-strip /tmp/nofrendo-build/bin/nesemu -o out-nofrendo/nofrendo-h3531-v7.APP
          cp /tmp/nofrendo/LICENSE out-nofrendo/NOFRENDO-LICENSE.txt
          printf '%s\n' b0ce28c2ba1d60eb207d60df9c55ae26864c64f1 > out-nofrendo/NOFRENDO-UPSTREAM-SHA.txt
          cat > out-nofrendo/RUN-H3531.txt <<'EOF'
          UART test:
            cd /mnt/usb
            chmod +x ./nofrendo-h3531-v7.APP
            NOFRENDO_INPUT=/dev/input/event0 ./nofrendo-h3531-v7.APP /mnt/usb/games/fc/SuperMarioBros.nes

          v7 physical targets:
            - retain the confirmed 8-pixel right-edge crop
            - retain the physically proven AO5/ch0 320-byte SendFrame ABI
            - keep a small 3x160-sample (10 ms) AO reserve against scheduler jitter
            - snapshot each complete 256x224 NES source frame into a two-slot queue
              so the video worker never scales a bitmap being modified by the core
            - use native HiSilicon HIFB vblank ioctl 0x4664 before visible VRAM copy
            - remove per-key UART debug logging from the gameplay hot path
            - retain exact monotonic 60-Hz timer and tick-burst diagnostics
          EOF
          file out-nofrendo/nofrendo-h3531-v7.APP | tee out-nofrendo/FILE.txt
          sha256sum out-nofrendo/nofrendo-h3531-v7.APP | tee out-nofrendo/SHA256.txt
          strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'H3531 Nofrendo v7'
          strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'native HIFB vblank 0x4664 active'
          strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'double source snapshot queue ready'
          strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'AO prebuffer=3x160 samples (10 ms)'
          strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'proven-frame=320 bytes'
          strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'crop right='
          if strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'DEBUG: my_input'; then
            echo 'unexpected gameplay debug string remains' >&2
            exit 1
          fi
          if strings out-nofrendo/nofrendo-h3531-v7.APP | grep -F 'ALSA: could not load'; then
            echo 'unexpected ALSA runtime string remains' >&2
            exit 1
          fi

      - name: Upload Nofrendo v7
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Nofrendo-v7
          path: out-nofrendo/
          if-no-files-found: error
          retention-days: 14
