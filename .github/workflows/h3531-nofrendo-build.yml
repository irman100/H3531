name: H3531 Nofrendo NES cross-build

on:
  push:
    branches:
      - feature/nofrendo-h3531
      - fix/nofrendo-v5-edge-audio
      - fix/nofrendo-v6-audio-sync
      - fix/nofrendo-v7-vblank-audio-buffer
      - fix/nofrendo-v9-vblank-master-clock
    paths:
      - '.github/workflows/h3531-nofrendo-build.yml'
      - 'ports/nofrendo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake file git curl

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Nofrendo Linux port
        run: |
          set -eux
          git clone https://github.com/18650official/nofrendo_nesemu_linux.git /tmp/nofrendo
          cd /tmp/nofrendo
          git checkout b0ce28c2ba1d60eb207d60df9c55ae26864c64f1
          git rev-parse HEAD

      - name: Apply H3531 v9 port
        run: |
          set -eux
          python3 ports/nofrendo/patch-h3531.py /tmp/nofrendo "$GITHUB_WORKSPACE/ports/nofrendo"
          python3 ports/nofrendo/patch-v4-video-lifetime.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v5-edge-audio.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v6-audio-sync.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v7-vblank-audio-buffer.py /tmp/nofrendo
          python3 ports/nofrendo/patch-v9-vblank-master-clock.py /tmp/nofrendo
          grep -F 'software timer disabled; native HIFB vblank is master clock' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'synchronous snapshot/presentation queue ready' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'one NES frame per acknowledged native HIFB vblank presentation' /tmp/nofrendo/core/nes/nes.c
          grep -F '600 presented frames elapsed_ms=' /tmp/nofrendo/core/nes/nes.c
          grep -F 'AO prebuffer=3x160 samples (10 ms)' /tmp/nofrendo/platform/osd_linux.c
          grep -F 'native HIFB vblank 0x4664 active' /tmp/nofrendo/platform/fb.c
          grep -F 'H3531 AO v6 ready' /tmp/nofrendo/platform/h3531-ao.c
          grep -F 'H3531_NES_CROP_RIGHT 8' /tmp/nofrendo/platform/fb.c
          grep -F 'H3531 Nofrendo v9' /tmp/nofrendo/main.c
          if grep -F 'tick burst=' /tmp/nofrendo/core/nes/nes.c; then
            echo 'old catch-up tick-burst path still present' >&2
            exit 1
          fi
          if grep -F 'h3531_nes_sleep_until' /tmp/nofrendo/core/nes/nes.c; then
            echo 'v8 nanosleep frame clock unexpectedly present' >&2
            exit 1
          fi
          if grep -R -F 'DEBUG: my_input' /tmp/nofrendo/platform /tmp/nofrendo/core/nes; then
            echo 'hot-path input debug logging still present' >&2
            exit 1
          fi

      - name: Cross-build static ARM binary
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cat >/tmp/h3531-musl.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-musleabi-gcc)
          set(CMAKE_AR arm-linux-musleabi-ar)
          set(CMAKE_RANLIB arm-linux-musleabi-ranlib)
          set(CMAKE_STRIP arm-linux-musleabi-strip)
          set(CMAKE_C_FLAGS_INIT "-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static -no-pie")
          EOF
          cmake -S /tmp/nofrendo -B /tmp/nofrendo-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/h3531-musl.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nofrendo-build -j2

      - name: Package v9 test application
        run: |
          set -eux
          mkdir -p out-nofrendo
          arm-linux-musleabi-strip /tmp/nofrendo-build/bin/nesemu -o out-nofrendo/nofrendo-h3531-v9.APP
          cp /tmp/nofrendo/LICENSE out-nofrendo/NOFRENDO-LICENSE.txt
          printf '%s\n' b0ce28c2ba1d60eb207d60df9c55ae26864c64f1 > out-nofrendo/NOFRENDO-UPSTREAM-SHA.txt
          cat > out-nofrendo/RUN-H3531.txt <<'EOF'
          UART test:
            cd /mnt/usb
            chmod +x ./nofrendo-h3531-v9.APP
            NOFRENDO_INPUT=/dev/input/event0 ./nofrendo-h3531-v9.APP /mnt/usb/games/fc/SuperMarioBros.nes

          v9 physical targets:
            - branch from the proven v7 base, not from the slower v8 experiment
            - retain the confirmed 8-pixel right-edge crop
            - retain AO5/ch0 320-byte SendFrame ABI and 10-ms AO prebuffer
            - retain immutable source snapshots and native HIFB vblank 0x4664
            - disable software 60-Hz timer and all nanosleep frame pacing
            - wait for each submitted snapshot to complete vblank-synchronized presentation
              before starting the next NES frame
            - never generate catch-up frames and never intentionally drop a completed frame
            - report real time / FPS for each 600 hardware-presented frames
          EOF
          file out-nofrendo/nofrendo-h3531-v9.APP | tee out-nofrendo/FILE.txt
          sha256sum out-nofrendo/nofrendo-h3531-v9.APP | tee out-nofrendo/SHA256.txt
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'H3531 Nofrendo v9'
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'software timer disabled; native HIFB vblank is master clock'
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'synchronous snapshot/presentation queue ready'
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'one NES frame per acknowledged native HIFB vblank presentation'
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F '600 presented frames elapsed_ms='
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'native HIFB vblank 0x4664 active'
          strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'AO prebuffer=3x160 samples (10 ms)'
          if strings out-nofrendo/nofrendo-h3531-v9.APP | grep -F 'tick burst='; then
            echo 'unexpected tick-burst string remains' >&2
            exit 1
          fi

      - name: Upload Nofrendo v9
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Nofrendo-v9
          path: out-nofrendo/
          if-no-files-found: error
          retention-days: 14
