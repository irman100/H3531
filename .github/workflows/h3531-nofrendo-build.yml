name: H3531 Nofrendo NES cross-build

on:
  push:
    branches:
      - feature/nofrendo-h3531
    paths:
      - '.github/workflows/h3531-nofrendo-build.yml'
      - 'ports/nofrendo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H3531 repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake file git curl

      - name: Install ARM soft-float musl cross toolchain
        run: |
          set -eux
          cd /tmp
          curl -L --retry 3 -o arm-musl.tgz https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabi-cross.tgz
          tar xzf arm-musl.tgz
          echo "/tmp/arm-linux-musleabi-cross/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Nofrendo Linux port
        run: |
          set -eux
          git clone https://github.com/18650official/nofrendo_nesemu_linux.git /tmp/nofrendo
          cd /tmp/nofrendo
          git checkout b0ce28c2ba1d60eb207d60df9c55ae26864c64f1
          git rev-parse HEAD

      - name: Apply H3531 framebuffer and input port
        run: |
          set -eux
          python3 ports/nofrendo/patch-h3531.py /tmp/nofrendo "$GITHUB_WORKSPACE/ports/nofrendo"

      - name: Cross-build static ARM binary
        run: |
          set -eux
          export PATH="/tmp/arm-linux-musleabi-cross/bin:$PATH"
          cat >/tmp/h3531-musl.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-musleabi-gcc)
          set(CMAKE_AR arm-linux-musleabi-ar)
          set(CMAKE_RANLIB arm-linux-musleabi-ranlib)
          set(CMAKE_STRIP arm-linux-musleabi-strip)
          set(CMAKE_C_FLAGS_INIT "-O2 -fno-pie -march=armv7-a -mfloat-abi=soft -D_GNU_SOURCE")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static -no-pie")
          EOF
          cmake -S /tmp/nofrendo -B /tmp/nofrendo-build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/h3531-musl.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nofrendo-build -j2

      - name: Package test application
        run: |
          set -eux
          mkdir -p out-nofrendo
          arm-linux-musleabi-strip /tmp/nofrendo-build/bin/nesemu -o out-nofrendo/nofrendo-h3531-v1.APP
          cp /tmp/nofrendo/LICENSE out-nofrendo/NOFRENDO-LICENSE.txt
          printf '%s\n' b0ce28c2ba1d60eb207d60df9c55ae26864c64f1 > out-nofrendo/NOFRENDO-UPSTREAM-SHA.txt
          cat > out-nofrendo/RUN-H3531.txt <<'EOF'
          First UART test:
            cd /mnt/usb
            chmod +x ./nofrendo-h3531-v1.APP
            ./nofrendo-h3531-v1.APP /mnt/usb/games/your_game.nes

          If the wrong evdev device is selected:
            NOFRENDO_INPUT=/dev/input/eventX ./nofrendo-h3531-v1.APP /mnt/usb/games/your_game.nes

          This v1 test intentionally uses the upstream silent/ALSA-fallback audio path.
          Hi3531 AO/HDMI audio will be connected only after video/input are physically verified.
          EOF
          file out-nofrendo/nofrendo-h3531-v1.APP | tee out-nofrendo/FILE.txt
          sha256sum out-nofrendo/nofrendo-h3531-v1.APP | tee out-nofrendo/SHA256.txt
          strings out-nofrendo/nofrendo-h3531-v1.APP | grep -F 'H3531 Nofrendo v1'

      - name: Upload Nofrendo test application
        uses: actions/upload-artifact@v4
        with:
          name: H3531-Nofrendo-v1
          path: out-nofrendo/
          if-no-files-found: error
          retention-days: 14
